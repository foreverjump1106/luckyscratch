.field input,

.nav .active{

.grid{

function esc(v=""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[m])
    );

}


function emailFor(v){

function randomPwd(){

  const c=
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

  return Array.from(
    {length:8},
    ()=>
      c[
        Math.floor(
          Math.random()*c.length
        )
      ]
  )
  .join("");

}


function scopeKey(a){

  return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`;

}


function semesterOptions(
  selected=currentSemester
){

  const list=[
    ...new Set(
      [
        ...semesterHistory,
        currentSemester,
        selected
      ]
    )
  ]
  .filter(Boolean)
  .sort()
  .reverse();


  return list.map(
    s=>`
      <option
        value="${esc(s)}"
        ${
          s===selected
            ?"selected"
            :""
        }
      >
        ${esc(s)}
      </option>
    `
  )
  .join("");

}


function computeAccess(
  assignments=[],
  semester=currentSemester
){

  const viewKeys=[];

  const collectionWriteKeys=[];

  const scoreWriteKeys=[];

  const classAccess=[];


  for(
    const a
    of assignments.filter(
      x=>
        x.semester
        ===semester
    )
  ){

    const k=
      scopeKey(a);


    if(
      !viewKeys.includes(k)
    ){
      viewKeys.push(k);
    }


    if(
      a.canCollection
      &&
      !collectionWriteKeys.includes(k)
    ){
      collectionWriteKeys.push(k);
    }


    if(
      a.canScores
      &&
      !scoreWriteKeys.includes(k)
    ){
      scoreWriteKeys.push(k);
    }


    if(
      !classAccess.includes(
        a.classId
      )
    ){
      classAccess.push(
        a.classId
      );
    }

  }


  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  };

}

  async u=>{

      $("#appView")

      return;

    const s=
      await getDoc(
        doc(
          db,

          u.uid

    if(
      !s.exists()
      ||
      s.data().active!==true
      ||
      s.data().type!=="admin"
    ){

      await signOut(auth);


      msg(
        $("#loginMsg"),

        "error"

      return;

    me={

    $("#appView")

async function ensureSystemSettings(){

  const ref=
    doc(
      db,
      "settings",
      "system"
    );


  const s=
    await getDoc(ref);


  if(
    !s.exists()
  ){

    await setDoc(
      ref,
      {

        currentSemester:
          "115-1",

        semesterHistory:[
          "115-1"
        ],

        updatedAt:
          serverTimestamp()

      }
    );


    currentSemester=
      "115-1";


    semesterHistory=[
      "115-1"
    ];

  }else{

    const d=
      s.data();


    currentSemester=
      d.currentSemester
      ||
      "115-1";


    semesterHistory=
      Array.isArray(
        d.semesterHistory
      )
      &&
      d.semesterHistory.length
        ?d.semesterHistory
        :[
            currentSemester
          ];


    if(
      !semesterHistory.includes(
        currentSemester
      )
    ){

      semesterHistory.push(
        currentSemester
      );

    }

  }


  recordSemester=
    currentSemester;


  $("#semesterBadge")
    .textContent=
      `目前學期：${currentSemester}`;

}

async function changeCurrentSemester(){

  const sem=
    $("#newSemester")
      .value
      .trim();


  if(
    !/^\d{2,3}-[12]$/
      .test(
        sem
      )
  ){

    return alert(
      "學期格式建議使用 115-1 或 115-2。"
    );

  }


  if(
    sem===currentSemester
  ){

    return alert(
      "目前已經是這個學期。"
    );

  }


  if(
    !confirm(
      `確定把目前學期從「${currentSemester}」切換為「${sem}」？

舊資料會保留；學生登入後只會看到 ${sem} 的職務與資料。`
    )
  ){

    return;

  }


  const history=[
    ...new Set(
      [
        ...semesterHistory,
        currentSemester,
        sem
      ]
    )
  ];


  await setDoc(
    doc(
      db,
      "settings",
      "system"
    ),
    {

      currentSemester:
        sem,

      semesterHistory:
        history,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  const old=
    currentSemester;


  currentSemester=
    sem;


  semesterHistory=
    history;


  recordSemester=
    sem;


  await recalcAllAccess();


  await audit(
    "change_semester",
    "settings",
    "system",
    `目前學期：${old} → ${sem}`,
    sem
  );


  $("#semesterBadge")
    .textContent=
      `目前學期：${currentSemester}`;


  await refreshAll();


  alert(
    `已切換為 ${sem}。現在可到「職務派發總表」分配本學期幹部與小老師。`
  );

}


async function recalcAllAccess(){

  for(
    const u
    of users.filter(
      x=>
        x.type!=="admin"
    )
  ){

    const access=
      computeAccess(
        u.assignments
        ||
        [],
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        u.uid
      ),
      {

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    Object.assign(
      u,
      access
    );

  }

}

function getRosterForClass(
  classId
){

  const c=
    classes.find(
      x=>
        x.id===classId
    );


  if(
    c
    &&
    Array.isArray(
      c.students
    )
  ){

    return c.students;

  }


  return (
    defaultRosters[
      classId
    ]
    ||
    []
  )
  .map(
    (
      [
        seat,
        name
      ]
    )=>({

      seat,

      name,

      id:
        String(seat)

    })
  );

}


function studentUserFor(
  classId,
  seat
){

  const username=
    `${classId}${String(seat).padStart(2,"0")}`
      .toLowerCase();


  return users.find(
    u=>
      (
        u.username
        ||
        ""
      )
      .toLowerCase()
      ===username
  );

}

async function saveRoleTable(){

  const classId=
    $("#roleClass")
      .value;


  const sem=
    $("#roleSemester")
      .value;


  if(
    !confirm(
      `確定儲存 ${classId} 班 ${sem} 的幹部／小老師職務表？

這會更新此班此學期的標準職務，不會刪除其他學期資料。`
    )
  ){

    return;

  }


  const selections=
    $$(".role-select")
      .map(
        sel=>({

          uid:
            sel.value,

          kind:
            sel.dataset.kind,

          scopeType:
            sel.dataset.type,

          scopeName:
            sel.dataset.name

        })
      );


  const roleKeys=
    new Set(
      standardRoles.map(
        r=>
          `${r.kind}|${r.scopeType}|${r.scopeName}`
      )
    );


  for(
    const u
    of users.filter(
      x=>
        x.type==="student"
    )
  ){

    let arr=
      (
        u.assignments
        ||
        []
      )
      .filter(
        a=>
          !(
            a.semester===sem
            &&
            a.classId===classId
            &&
            roleKeys.has(
              `${a.kind}|${a.scopeType}|${a.scopeName}`
            )
          )
      );


    for(
      const s
      of selections.filter(
        x=>
          x.uid===u.uid
      )
    ){

      const base=
        standardRoles.find(
          r=>
            r.kind===s.kind
            &&
            r.scopeType===s.scopeType
            &&
            r.scopeName===s.scopeName
        );


      arr.push({

        semester:
          sem,

        classId,

        kind:
          s.kind,

        scopeType:
          s.scopeType,

        scopeName:
          s.scopeName,

        canCollection:
          base.canCollection,

        canScores:
          base.canScores

      });

    }


    const access=
      computeAccess(
        arr,
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        u.uid
      ),
      {

        assignments:
          arr,

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    u.assignments=
      arr;


    Object.assign(
      u,
      access
    );

  }


  await audit(
    "save_role_table",
    "roles",
    `${sem}-${classId}`,
    `儲存 ${sem} ${classId} 幹部與小老師職務`,
    sem
  );


  alert(
    "職務派發已儲存。學生下次登入就會依本學期權限顯示功能。"
  );


  renderRoleTable();

}

async function confirmRecord(
  type,
  id
){

  const col=
    type==="collection"
      ?"collectionItems"
      :"assessments";


  const arr=
    type==="collection"
      ?collections
      :assessments;


  const x=
    arr.find(
      y=>y.id===id
    );


  const confirming=
    x.reviewStatus
    !=="confirmed";


  await updateDoc(
    doc(
      db,
      col,
      id
    ),
    {

      reviewStatus:
        confirming
          ?"confirmed"
          :"pending",

      locked:
        confirming,

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    type,
    id,
    `${
      confirming
        ?"確認並鎖定"
        :"取消確認"
    }：${x.itemName||x.name}`,
    x.semester
    ||
    currentSemester
  );


  await refreshAll();

}


async function deleteRecord(
  type,
  id
){

  const col=
    type==="collection"
      ?"collectionItems"
      :"assessments";


  const arr=
    type==="collection"
      ?collections
      :assessments;


  const x=
    arr.find(
      y=>y.id===id
    );


  if(
    !confirm(
      `確定刪除「${x.itemName||x.name}」？`
    )
  ){

    return;

  }


  await deleteDoc(
    doc(
      db,
      col,
      id
    )
  );

async function editRecord(
  type,
  id
){

  const arr=
    type==="collection"
      ?collections
      :assessments;


  const x=
    arr.find(
      y=>y.id===id
    );


  const cl=
    classes.find(
      c=>
        c.id===x.classId
    );


  const students=
    cl?.students
    ||
    [];


  let body=`

    <div class="item-head">

      <div>

        <div class="section-title">
          ${esc(x.itemName||x.name)}
        </div>

        <div class="meta">

          ${esc(x.semester||"")}

          ｜

          ${x.classId}

          ｜

          ${esc(x.scopeName)}

          ｜

          ${esc(x.date||"")}

        </div>

      </div>

      <button class="btn gray close-modal">
        關閉
      </button>

    </div>
  `;


  if(
    type==="collection"
  ){

    const opts=[
      ["submitted","已繳"],
      ["missing","未繳"],
      ["late","補交"],
      ["exempt","免繳"]
    ];


    body+=`

      <div class="student-grid">

        ${
          students.map(
            s=>{

              const sid=
                s.id
                ||
                String(
                  s.seat
                );


              const v=
                (
                  x.records
                  ||
                  {}
                )[sid]
                ||
                "submitted";


              return `

                <div class="student">

                  <b>
                    ${s.seat}.
                    ${esc(s.name)}
                  </b>

                  <select
                    class="m-col"
                    data-id="${sid}"
                  >

                    ${
                      opts.map(
                        (
                          [
                            a,
                            l
                          ]
                        )=>`

                          <option
                            value="${a}"
                            ${
                              a===v
                                ?"selected"
                                :""
                            }
                          >
                            ${l}
                          </option>

                        `
                      )
                      .join("")
                    }

                  </select>

                </div>
              `;

            }
          )
          .join("")
        }

      </div>


      <div class="toolbar">

        <button
          class="btn primary save-modal"
        >
          儲存修改
        </button>

      </div>
    `;

  }else{

    const opts=[
      ["normal","正常"],
      ["absent","缺考"],
      ["makeup","補考"],
      ["exempt","免試"],
      ["not_entered","未登記"]
    ];


    body+=`

      <div class="student-grid">

        ${
          students.map(
            s=>{

              const sid=
                s.id
                ||
                String(
                  s.seat
                );


              const r=
                (
                  x.scores
                  ||
                  {}
                )[sid]
                ||
                {};


              return `

                <div class="student">

                  <b>
                    ${s.seat}.
                    ${esc(s.name)}
                  </b>

                  <input
                    class="m-score"
                    data-id="${sid}"
                    type="number"
                    value="${
                      r.score
                      ??
                      ""
                    }"
                    min="0"
                    max="${x.maxScore}"
                  >

                  <select
                    class="m-status"
                    data-id="${sid}"
                  >

                    ${
                      opts.map(
                        (
                          [
                            a,
                            l
                          ]
                        )=>`

                          <option
                            value="${a}"
                            ${
                              a===
                              (
                                r.status
                                ||
                                "not_entered"
                              )
                                ?"selected"
                                :""
                            }
                          >
                            ${l}
                          </option>

                        `
                      )
                      .join("")
                    }

                  </select>

                </div>
              `;

            }
          )
          .join("")
        }

      </div>


      <div class="toolbar">

        <button
          class="btn primary save-modal"
        >
          儲存修改
        </button>

      </div>
    `;

  }


  showModal(body);


  $(".save-modal")
    .onclick=
    async()=>{

      if(
        type==="collection"
      ){

        const records={};


        $$(".m-col")
          .forEach(
            s=>
              records[
                s.dataset.id
              ]
              =
              s.value
          );


        await updateDoc(
          doc(
            db,
            "collectionItems",
            id
          ),
          {

            records,

            updatedAt:
              serverTimestamp()

          }
        );

      }else{

        const scores={};


        $$(".m-score")
          .forEach(
            inp=>{

              const sid=
                inp.dataset.id;


              const sel=
                document.querySelector(
                  `.m-status[data-id="${CSS.escape(sid)}"]`
                );


              scores[sid]={

                score:
                  inp.value===""
                    ?null
                    :Number(
                        inp.value
                      ),

                status:
                  sel.value

              };

            }
          );


        await updateDoc(
          doc(
            db,
            "assessments",
            id
          ),
          {

            scores,

            updatedAt:
              serverTimestamp()

          }
        );

      }


      await audit(
        "admin_update",
        type,
        id,
        `管理員修改：${x.itemName||x.name}`,
        x.semester
        ||
        currentSemester
      );


      hideModal();


      await refreshAll();

    };

}

async function createAuthAndProfile(
  username,
  displayName,
  type,
  pwd
){

  let secondary;


  try{

    secondary=
      initializeApp(
        firebaseConfig,
        `secondary-${
          Date.now()
        }-${
          Math.random()
            .toString(36)
            .slice(2)
        }`
      );


    const sa=
      getAuth(
        secondary
      );


    const cred=
      await createUserWithEmailAndPassword(
        sa,
        emailFor(username),
        pwd
      );


    await setDoc(
      doc(
        db,
        "users",
        cred.user.uid
      ),
      {

        username,

        displayName,

        type,

        active:
          true,

        assignments:
          [],

        viewKeys:
          [],

        collectionWriteKeys:
          [],

        scoreWriteKeys:
          [],

        classAccess:
          [],

        mustChangePassword:
          true,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    return{

      uid:
        cred.user.uid,

      username,

      displayName,

      password:
        pwd

    };

  }finally{

    if(
      secondary
    ){

      try{

        await deleteApp(
          secondary
        );

      }catch{}

    }

  }

}

  const displayName=
    $("#newName")
      .value
      .trim();


  const type=
    $("#newType")
      .value;


  const pwd=
    $("#newPwd")
      .value;

    !displayName
    ||
    pwd.length<6
  ){

    );

  }


  try{

      await createAuthAndProfile(

        type,
        pwd
      );


    await audit(
      "create_user",
      "user",

async function batchCreateAccounts(){

  const selected=
    $$(".batch-check:checked")
      .map(
        x=>({

          username:
            x.dataset.user,

          displayName:
            x.dataset.name,

          seat:
            Number(
              x.dataset.seat
            )

        })
      );


  if(
    !selected.length
  ){

    return alert(
      "請先勾選要建立帳號的學生。"
    );

  }


  if(
    !confirm(
      `確定一次建立 ${selected.length} 個學生帳號？`
    )
  ){

    return;

  }


  const btn=
    $("#batchCreateBtn");


  btn.disabled=
    true;


  btn.textContent=
    "建立中…";


  const created=[];

  const failed=[];


  for(
    const s
    of selected
  ){

    const pwd=
      randomPwd();


    try{

      const r=
        await createAuthAndProfile(
          s.username,
          s.displayName,
          "student",
          pwd
        );


      created.push({

        ...s,

        password:
          pwd,

        uid:
          r.uid

      });


      await audit(
        "create_user",
        "user",
        r.uid,
        `批次建立帳號：${s.username} ${s.displayName}`
      );

    }catch(e){

      failed.push({

        ...s,

        error:
          e.code
          ||
          e.message

      });

    }

  }


  btn.disabled=
    false;


  btn.textContent=
    "批次建立勾選帳號";


  await refreshAll();


  showBatchResult(
    created,
    failed
  );

}

function downloadCredentialCsv(
  list
){

  const rows=[

    [
      "帳號",
      "姓名",
      "初始密碼"
    ],

    ...list.map(
      x=>[
        x.username,
        x.displayName,
        x.password
      ]
    )

  ];


  const csv=
    "\ufeff"
    +
    rows.map(
      r=>
        r.map(
          v=>
            `"${String(v).replaceAll('"','""')}"`
        )
        .join(",")
    )
    .join("\r\n");


  const blob=
    new Blob(
      [
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const a=
    document.createElement(
      "a"
    );


  a.href=
    URL.createObjectURL(
      blob
    );


  a.download=
    `class-work-帳密-${today()}.csv`;


  a.click();


  URL.revokeObjectURL(
    a.href
  );

}


async function toggleUser(
  uid
){

  const u=
    users.find(
      x=>
        x.uid===uid
    );


  const active=
    !u.active;


  if(
    !confirm(
      `確定${active?"啟用":"停用"} ${u.displayName} 的帳號？`
    )
  ){

    return;

  }


  await updateDoc(
    doc(
      db,
      "users",
      uid
    ),
    {

      active,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    active
      ?"enable_user"
      :"disable_user",
    "user",
    uid,
    `${active?"啟用":"停用"}帳號：${u.username}`
  );


  await refreshAll();

}


async function permanentDeleteUser(
  uid
){

  const u=
    users.find(
      x=>
        x.uid===uid
    );


  if(!u){

    return alert(
      "找不到這個帳號。"
    );

  }


  if(
    u.type==="admin"
  ){

    return alert(
      "管理員帳號不能從這裡永久刪除。"
    );

  }


  if(
    u.active===true
  ){

    return alert(
      "為避免誤刪，請先將帳號「停用」，確認無誤後再永久刪除。"
    );

  }


  const typed=
    prompt(
`⚠️ 永久刪除系統帳號

姓名：${u.displayName||""}
帳號：${u.username||""}

這會刪除 Firestore 帳號資料與全部權限，
歷史收繳、成績與操作紀錄會保留。

請輸入帳號「${u.username}」確認刪除：`
    );


  if(
    typed===null
  ){

    return;

  }


  if(
    typed.trim()
    !==
    String(
      u.username
      ||
      ""
    )
  ){

    return alert(
      "輸入的帳號不一致，已取消刪除。"
    );

  }


  if(
    !confirm(
      `最後確認：永久刪除 ${u.displayName}（${u.username}）的系統帳號？`
    )
  ){

    return;

  }


  await audit(
    "permanent_delete_user",
    "user",
    uid,
    `永久刪除系統帳號：${u.username} ${u.displayName||""}｜Auth UID：${uid}`
  );


  await deleteDoc(
    doc(
      db,
      "users",
      uid
    )
  );


  await refreshAll();


  showDeletedUserNotice(
    u,
    uid
  );

}


function showDeletedUserNotice(
  u,
  uid
){

  showModal(`

    <div class="item-head">

      <div>

        <div class="section-title">
          ✅ 系統帳號已移除
        </div>

        <div class="meta">

          ${esc(u.displayName||"")}

          ｜

          ${esc(u.username||"")}

        </div>

      </div>


      <button class="btn gray close-modal">
        關閉
      </button>

    </div>


    <div class="notice success">

      Firestore 帳號資料與系統權限已刪除；

      過去的收繳、成績與操作紀錄仍保留。

    </div>


    <div class="notice">

      <b>
        若這是測試／建立錯誤帳號：
      </b>

      <br>

      還需要到 Firebase Authentication

      刪除同一 UID，

      之後才能重新建立相同帳號。

    </div>


    <div class="field">

      <label>
        Firebase Authentication UID
      </label>

      <input
        id="deletedUid"
        value="${esc(uid)}"
        readonly
      >

    </div>


    <div class="toolbar">

      <button
        class="btn gray"
        id="copyDeletedUid"
      >
        複製 UID
      </button>


      <button
        class="btn primary"
        id="openFirebaseAuth"
      >
        開啟 Firebase Authentication
      </button>

    </div>
  `);


  $("#copyDeletedUid")
    .onclick=
    async()=>{

      try{

        await navigator.clipboard
          .writeText(
            uid
          );


        alert(
          "UID 已複製。"
        );

      }catch{

        $("#deletedUid")
          .select();


        document.execCommand(
          "copy"
        );


        alert(
          "UID 已複製。"
        );

      }

    };


  $("#openFirebaseAuth")
    .onclick=
      ()=>window.open(
        "https://console.firebase.google.com/project/class-datawork/authentication/users",
        "_blank"
      );

}


function editUserPermissions(
  uid
){

  const u=
    users.find(
      x=>
        x.uid===uid
    );


  const assigns=[
    ...(
      u.assignments
      ||
      []
    )
  ];


  const classOpts=
    (
      classes.length
        ?classes.map(
            c=>c.id
          )
        :Object.keys(
            defaultRosters
          )
    )
    .sort()
    .map(
      c=>`
        <option value="${c}">
          ${c}
        </option>
      `
    )
    .join("");


  showModal(`

    <div class="item-head">

      <div>

        <div class="section-title">

          ${esc(u.displayName)}

          ｜

          ${esc(u.username)}

        </div>

        <div class="meta">

          帳號跟著人保留；

          這裡可做個別補充權限。

          大量換學期職務請優先使用

          「職務派發總表」。

        </div>

      </div>


      <button class="btn gray close-modal">
        關閉
      </button>

    </div>


    <div id="currentAssignments"></div>


    <hr
      style="border:none;border-top:1px solid #e4e7ec;margin:15px 0"
    >


    <b>
      新增一個權限
    </b>


    <div class="two">

      <div class="field">

        <label>
          學期
        </label>

        <select id="aSemester">

          ${semesterOptions(
            currentSemester
          )}

        </select>

      </div>


      <div class="field">

        <label>
          班級
        </label>

        <select id="aClass">
          ${classOpts}
        </select>

      </div>

    </div>


    <div class="field">

      <label>
        身分類型
      </label>

      <select id="aKind">

        <option value="assistant">
          學科小老師
        </option>

        <option value="teacher">
          任課老師
        </option>

        <option value="officer">
          班級幹部
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        科目／職務
      </label>

      <select id="aName">

        ${
          subjects.map(
            s=>`
              <option>
                ${s}
              </option>
            `
          )
          .join("")
        }

      </select>

    </div>


    <div class="toolbar">

      <label>

        <input
          type="checkbox"
          id="aCollection"
          checked
        >

        可登記收繳

      </label>


      <label>

        <input
          type="checkbox"
          id="aScores"
          checked
        >

        可登記成績

      </label>

    </div>


    <button
      class="btn primary"
      id="addAssignment"
    >
      加入權限
    </button>
  `);


  function rerender(){

    const box=
      $("#currentAssignments");


    box.innerHTML=

      assigns
        .sort(
          (
            a,
            b
          )=>
            (
              b.semester
              ||
              ""
            )
            .localeCompare(
              a.semester
              ||
              ""
            )
        )
        .map(
          (
            a,
            i
          )=>`

            <div class="assign">

              <b>
                ${esc(a.semester||"舊")}
              </b>

              ｜

              ${esc(a.classId)}

              ｜

              ${esc(a.scopeName)}

              ｜

              ${
                a.kind==="teacher"
                  ?"任課老師"
                  :a.scopeType==="subject"
                    ?"小老師"
                    :"班級幹部"
              }

              ｜

              ${
                a.canCollection
                  ?"收繳可寫"
                  :"收繳唯讀"
              }

              ｜

              ${
                a.canScores
                  ?"成績可寫"
                  :"成績唯讀"
              }


              <button
                class="btn danger small remove-assignment"
                data-i="${i}"
              >
                移除
              </button>

            </div>
          `
        )
        .join("")
        ||
        `
          <div class="sub">
            目前尚未指派職務。
          </div>
        `;


    $$(".remove-assignment")
      .forEach(
        b=>
          b.onclick=
          async()=>{

            assigns.splice(
              Number(
                b.dataset.i
              ),
              1
            );


            await saveAssignments(
              u,
              assigns
            );


            rerender();

          }
      );

  }


  $("#aKind")
    .onchange=
    ()=>{

      const k=
        $("#aKind")
          .value;


      const n=
        $("#aName");


      n.innerHTML=
        (
          k==="officer"
            ?officerRoles
            :subjects
        )
        .map(
          s=>`
            <option>
              ${s}
            </option>
          `
        )
        .join("");


      $("#aScores")
        .checked=
          k!=="officer";


      if(
        k==="teacher"
      ){

        $("#aScores")
          .checked=
            false;

      }

    };


  $("#addAssignment")
    .onclick=
    async()=>{

      const kind=
        $("#aKind")
          .value;


      const name=
        $("#aName")
          .value;


      const sem=
        $("#aSemester")
          .value;


      const a={

        semester:
          sem,

        kind,

        classId:
          $("#aClass")
            .value,

        scopeType:
          kind==="officer"
            ?"officer"
            :"subject",

        scopeName:
          name,

        canCollection:
          $("#aCollection")
            .checked,

        canScores:
          kind==="officer"
            ?false
            :$("#aScores")
              .checked

      };


      if(
        assigns.some(
          x=>
            x.semester===a.semester
            &&
            x.classId===a.classId
            &&
            x.kind===a.kind
            &&
            x.scopeType===a.scopeType
            &&
            x.scopeName===a.scopeName
        )
      ){

        return alert(
          "這筆權限已經存在。"
        );

      }


      assigns.push(a);


      await saveAssignments(
        u,
        assigns
      );


      rerender();

    };


  rerender();

}


async function saveAssignments(
  u,
  assignments
){

  const access=
    computeAccess(
      assignments,
      currentSemester
    );


  await updateDoc(
    doc(
      db,
      "users",
      u.uid
    ),
    {

      assignments,

      ...access,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    "permissions",
    "user",
    u.uid,
    `更新權限：${u.username}`
  );


  u.assignments=
    assignments;


  Object.assign(
    u,
    access
  );

}

async function seedClasses(){

  for(
    const[
      id,
      arr
    ]
    of Object.entries(
      defaultRosters
    )
  ){

    await setDoc(
      doc(
        db,
        "classes",
        id
      ),
      {

        classId:
          id,

        students:
          arr.map(
            (
              [
                seat,
                name
              ]
            )=>({

              id:
                String(seat),

              seat,

              name

            })
          ),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );

  }


  await audit(
    "seed",
    "classes",
    "default",
    "建立／更新預設班級名單"
  );


  await refreshAll();


  alert(
    "預設班級名單已建立。"
  );

}


function parseRoster(
  text
){

  return text
    .split(
      /\r?\n/
    )
    .map(
      x=>x.trim()
    )
    .filter(Boolean)
    .map(
      line=>{

        const[
          seat,
          ...rest
        ]=
          line.split(
            /[,，\t]/
          );


        return{

          id:
            String(
              Number(
                seat
              )
            ),

          seat:
            Number(
              seat
            ),

          name:
            rest
              .join("")
              .trim()

        };

      }
    )
    .filter(
      x=>
        x.seat
        &&
        x.name
    )
    .sort(
      (
        a,
        b
      )=>
        a.seat-b.seat
    );

}


async function saveClass(
  id,
  text
){

  id=
    id.trim();


  if(
    !id
  ){

    return alert(
      "請輸入班級"
    );

  }


  const students=
    parseRoster(
      text
    );


  if(
    !students.length
  ){

    return alert(
      "請輸入名單"
    );

  }


  await setDoc(
    doc(
      db,
      "classes",
      id
    ),
    {

      classId:
        id,

      students,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  await audit(
    "save_class",
    "class",
    id,
    `更新班級名單 ${id}`
  );


  await refreshAll();


  alert(
    "已儲存"
  );

}

async function renderAudit(){

  let logs=[];


  try{

    const s=
      await getDocs(
        query(
          collection(
            db,
            "auditLogs"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        )
      );


    logs=
      s.docs
        .slice(
          0,
          250
        )
        .map(
          d=>d.data()
        );

  }catch(e){

    const s=
      await getDocs(
        collection(
          db,
          "auditLogs"
        )
      );


    logs=
      s.docs
        .map(
          d=>d.data()
        )
        .slice(
          -250
        )
        .reverse();

  }


  $("#page-audit")
    .innerHTML=`

      <div class="card">

        <div class="section-title">
          最近操作紀錄
        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  時間
                </th>

                <th>
                  學期
                </th>

                <th>
                  操作者
                </th>

                <th>
                  動作
                </th>

                <th>
                  內容
                </th>

              </tr>

            </thead>


            <tbody>

              ${
                logs.map(
                  l=>`

                    <tr>

                      <td>

                        ${
                          l.createdAt
                          ?.toDate
                            ?l.createdAt
                              .toDate()
                              .toLocaleString(
                                "zh-TW"
                              )
                            :""
                        }

                      </td>

                      <td>
                        ${esc(l.semester||"")}
                      </td>

                      <td>
                        ${esc(l.actorName||"")}
                      </td>

                      <td>
                        ${esc(l.action||"")}
                      </td>

                      <td>
                        ${esc(l.detail||"")}
                      </td>

                    </tr>
                  `
                )
                .join("")
              }

            </tbody>

          </table>

        </div>

      </div>
    `;

}


function showModal(h){

  $("#modalBody")
    .innerHTML=
      h;


  $("#modal")
    .classList
    .remove(
      "hidden"
    );


  $(".close-modal")
    ?.addEventListener(
      "click",
      hideModal
    );

}


function hideModal(){

  $("#modal")
    .classList
    .add(
      "hidden"
    );


  $("#modalBody")
    .innerHTML=
      "";

}
