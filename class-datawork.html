function esc(v=''){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function emailFor(v){v=v.trim();return v.includes('@')?v:`${v}@${DOMAIN}`}function msg(el,t,c='notice'){el.innerHTML=t?`<div class="notice ${c}">${t}</div>`:''}function today(){return new Date().toLocaleDateString('sv-SE')}function randomPwd(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function computeAccess(assignments=[]){const viewKeys=[],collectionWriteKeys=[],scoreWriteKeys=[],classAccess=[];for(const a of assignments){const k=`${a.classId}|${a.scopeType}|${a.scopeName}`;if(!viewKeys.includes(k))viewKeys.push(k);if(a.canCollection&&!collectionWriteKeys.includes(k))collectionWriteKeys.push(k);if(a.canScores&&!scoreWriteKeys.includes(k))scoreWriteKeys.push(k);if(!classAccess.includes(a.classId))classAccess.push(a.classId)}return{viewKeys,collectionWriteKeys,scoreWriteKeys,classAccess}}
async function audit(action,targetType,targetId,detail){await addDoc(collection(db,'auditLogs'),{actorUid:auth.currentUser.uid,actorName:me.displayName||me.username,action,targetType,targetId,detail,createdAt:serverTimestamp()})}

onAuthStateChanged(auth,async u=>{if(!u){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()||s.data().active!==true||s.data().type!=='admin'){await signOut(auth);msg($('#loginMsg'),'此帳號沒有管理員權限。','error');return}me={uid:u.uid,...s.data()};$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#who').textContent=`${me.displayName||me.username}｜管理員`;await refreshAll()});

async function refreshAll(){const [us,cs,co,as]=await Promise.all([getDocs(collection(db,'users')),getDocs(collection(db,'classes')),getDocs(collection(db,'collectionItems')),getDocs(collection(db,'assessments'))]);users=us.docs.map(d=>({uid:d.id,...d.data()}));classes=cs.docs.map(d=>({id:d.id,...d.data()}));collections=co.docs.map(d=>({id:d.id,...d.data()}));assessments=as.docs.map(d=>({id:d.id,...d.data()}));renderDashboard()}
function renderPage(p){if(p==='dashboard')renderDashboard();if(p==='records')renderRecords();if(p==='accounts')renderAccounts();if(p==='classes')renderClasses();if(p==='audit')renderAudit()}
function renderDashboard(){const pending=collections.filter(x=>x.reviewStatus!=='confirmed').length+assessments.filter(x=>x.reviewStatus!=='confirmed').length;const activeUsers=users.filter(x=>x.active&&x.type!=='admin').length;$('#page-dashboard').innerHTML=`<div class="grid g4"><div class="card stat"><div class="sub">使用中帳號</div><b>${activeUsers}</b></div><div class="card stat"><div class="sub">收繳項目</div><b>${collections.length}</b></div><div class="card stat"><div class="sub">小考紀錄</div><b>${assessments.length}</b></div><div class="card stat"><div class="sub">待確認</div><b>${pending}</b></div></div><div class="card" style="margin-top:12px"><div class="section-title">待確認資料</div>${[...collections.map(x=>({...x,_type:'collection'})),...assessments.map(x=>({...x,_type:'assessment'}))].filter(x=>x.reviewStatus!=='confirmed').slice(0,12).map(recordCard).join('')||'<div class="sub">目前沒有待確認資料。</div>'}</div>`;bindRecordButtons()}
function recordCard(x){const title=x._type==='collection'?x.itemName:x.name;return `<div class="item"><div class="item-head"><div><b>${esc(title)}</b><div class="meta">${esc(x.classId)}｜${esc(x.scopeName)}｜${esc(x.date||'')}｜建立：${esc(x.createdByName||'')}</div></div><div><span class="pill ${x.reviewStatus==='confirmed'?'good':'warn'}">${x.reviewStatus==='confirmed'?'已確認':'尚未確認'}</span> ${x.locked?'<span class="pill bad">已鎖定</span>':''}</div></div><div class="toolbar"><button class="btn gray small edit-record" data-type="${x._type}" data-id="${x.id}">查看/修改</button><button class="btn good small confirm-record" data-type="${x._type}" data-id="${x.id}">${x.reviewStatus==='confirmed'?'取消確認':'確認並鎖定'}</button><button class="btn danger small delete-record" data-type="${x._type}" data-id="${x.id}">刪除</button></div></div>`}
function renderRecords(){const all=[...collections.map(x=>({...x,_type:'collection'})),...assessments.map(x=>({...x,_type:'assessment'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('#page-records').innerHTML=`<div class="card"><div class="section-title">所有收繳／成績資料</div><div class="toolbar"><input id="recordSearch" placeholder="搜尋班級、科目、項目" style="padding:9px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn gray" id="refreshRecords">重新整理</button></div><div id="recordList">${all.map(recordCard).join('')||'<div class="sub">尚無資料</div>'}</div></div>`;bindRecordButtons();$('#refreshRecords').onclick=async()=>{await refreshAll();renderRecords()};$('#recordSearch').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('#recordList').innerHTML=all.filter(x=>`${x.classId} ${x.scopeName} ${x.itemName||x.name}`.toLowerCase().includes(q)).map(recordCard).join('');bindRecordButtons()}}
function bindRecordButtons(){$$('.confirm-record').forEach(b=>b.onclick=()=>confirmRecord(b.dataset.type,b.dataset.id));$$('.delete-record').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.type,b.dataset.id));$$('.edit-record').forEach(b=>b.onclick=()=>editRecord(b.dataset.type,b.dataset.id))}
async function confirmRecord(type,id){const col=type==='collection'?'collectionItems':'assessments',arr=type==='collection'?collections:assessments,x=arr.find(y=>y.id===id),confirming=x.reviewStatus!=='confirmed';await updateDoc(doc(db,col,id),{reviewStatus:confirming?'confirmed':'pending',locked:confirming,confirmedBy:confirming?auth.currentUser.uid:null,confirmedAt:confirming?serverTimestamp():null,updatedAt:serverTimestamp()});await audit(confirming?'confirm':'unconfirm',type,id,`${confirming?'確認並鎖定':'取消確認'}：${x.itemName||x.name}`);await refreshAll();renderPage($('.nav .active').dataset.page)}
async function deleteRecord(type,id){const col=type==='collection'?'collectionItems':'assessments',arr=type==='collection'?collections:assessments,x=arr.find(y=>y.id===id);if(!confirm(`確定刪除「${x.itemName||x.name}」？`))return;await deleteDoc(doc(db,col,id));await audit('delete',type,id,`管理員刪除：${x.itemName||x.name}`);await refreshAll();renderPage($('.nav .active').dataset.page)}
async function editRecord(type,id){const arr=type==='collection'?collections:assessments,x=arr.find(y=>y.id===id),cl=classes.find(c=>c.id===x.classId),students=cl?.students||[];let body=`<div class="item-head"><div><div class="section-title">${esc(x.itemName||x.name)}</div><div class="meta">${x.classId}｜${esc(x.scopeName)}｜${esc(x.date||'')}</div></div><button class="btn gray close-modal">關閉</button></div>`;if(type==='collection'){const opts=[['submitted','已繳'],['missing','未繳'],['late','補交'],['exempt','免繳']];body+=`<div class="student-grid">${students.map(s=>{const sid=s.id||String(s.seat),v=(x.records||{})[sid]||'submitted';return `<div class="student"><b>${s.seat}. ${esc(s.name)}</b><select class="m-col" data-id="${sid}">${opts.map(([a,l])=>`<option value="${a}" ${a===v?'selected':''}>${l}</option>`).join('')}</select></div>`}).join('')}</div><div class="toolbar"><button class="btn primary save-modal">儲存修改</button></div>`}else{const opts=[['normal','正常'],['absent','缺考'],['makeup','補考'],['exempt','免試'],['not_entered','未登記']];body+=`<div class="student-grid">${students.map(s=>{const sid=s.id||String(s.seat),r=(x.scores||{})[sid]||{};return `<div class="student"><b>${s.seat}. ${esc(s.name)}</b><input class="m-score" data-id="${sid}" type="number" value="${r.score??''}" min="0" max="${x.maxScore}"><select class="m-status" data-id="${sid}">${opts.map(([a,l])=>`<option value="${a}" ${a===(r.status||'not_entered')?'selected':''}>${l}</option>`).join('')}</select></div>`}).join('')}</div><div class="toolbar"><button class="btn primary save-modal">儲存修改</button></div>`}showModal(body);$('.save-modal').onclick=async()=>{if(type==='collection'){const records={};$$('.m-col').forEach(s=>records[s.dataset.id]=s.value);await updateDoc(doc(db,'collectionItems',id),{records,updatedAt:serverTimestamp()})}else{const scores={};$$('.m-score').forEach(inp=>{const id=inp.dataset.id,sel=document.querySelector(`.m-status[data-id="${CSS.escape(id)}"]`);scores[id]={score:inp.value===''?null:Number(inp.value),status:sel.value}});await updateDoc(doc(db,'assessments',id),{scores,updatedAt:serverTimestamp()})}await audit('admin_update',type,id,`管理員修改：${x.itemName||x.name}`);hideModal();await refreshAll();renderPage($('.nav .active').dataset.page)}}
function showModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden');$('.close-modal')?.addEventListener('click',hideModal)}function hideModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML=''}

function renderAccounts(){const rows=users.filter(u=>u.type!=='admin').sort((a,b)=>(a.username||'').localeCompare(b.username||'')).map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.displayName||'')}</td><td>${u.type==='teacher'?'任課老師':'學生'}</td><td>${u.active?'<span class="pill good">啟用</span>':'<span class="pill bad">停用</span>'}</td><td>${(u.assignments||[]).map(a=>`<div class="assign">${esc(a.classId)}｜${esc(a.scopeName)}｜${a.canCollection?'收繳可寫':'收繳唯讀'}｜${a.canScores?'成績可寫':'成績唯讀'}</div>`).join('')||'尚未指派'}</td><td><button class="btn gray small edit-user" data-id="${u.uid}">權限</button> <button class="btn ${u.active?'danger':'good'} small toggle-user" data-id="${u.uid}">${u.active?'停用':'啟用'}</button></td></tr>`).join('');$('#page-accounts').innerHTML=`<div class="two"><div class="card"><div class="section-title">建立新帳號</div><div class="notice">帳號建立後可以一直保留；每學期只要重新指派職務即可。密碼只會在建立成功當下顯示一次。</div><div class="field"><label>帳號</label><input id="newUsername" placeholder="例如 80427 或 teacher-chinese"></div><div class="field"><label>顯示姓名</label><input id="newName" placeholder="學生姓名或老師稱呼"></div><div class="field"><label>帳號類型</label><select id="newType"><option value="student">學生／小老師</option><option value="teacher">任課老師</option></select></div><div class="field"><label>初始密碼</label><input id="newPwd"><button id="genPwd" class="btn gray small" style="margin-top:6px">產生隨機密碼</button></div><button id="createUserBtn" class="btn primary">建立帳號</button><div id="createdInfo"></div></div><div class="card"><div class="section-title">帳號設計原則</div><p>學生登入帳號可以使用班級＋座號，例如 <b>80427</b>。Firebase 底層會自動轉成隱藏的登入 Email。</p><p>停用帳號不會刪除歷史紀錄。未來重新啟用後，仍可再指派新職務。</p><p class="sub">純 GitHub Pages 版本無法安全替別人直接重設 Firebase 密碼；忘記密碼時請先到 Firebase Authentication 主控台重設／處理。</p></div></div><div class="card" style="margin-top:12px"><div class="section-title">帳號與權限</div><div class="table-wrap"><table><thead><tr><th>帳號</th><th>姓名</th><th>類型</th><th>狀態</th><th>目前權限</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;$('#genPwd').onclick=()=>$('#newPwd').value=randomPwd();$('#createUserBtn').onclick=createAccount;$$('.toggle-user').forEach(b=>b.onclick=()=>toggleUser(b.dataset.id));$$('.edit-user').forEach(b=>b.onclick=()=>editUserPermissions(b.dataset.id))}
async function createAccount(){const username=$('#newUsername').value.trim(),displayName=$('#newName').value.trim(),type=$('#newType').value,pwd=$('#newPwd').value;if(!username||!displayName||pwd.length<6)return alert('請填完整資料，密碼至少 6 碼。');let secondary;try{secondary=initializeApp(firebaseConfig,`secondary-${Date.now()}`);const sa=getAuth(secondary),cred=await createUserWithEmailAndPassword(sa,emailFor(username),pwd);await setDoc(doc(db,'users',cred.user.uid),{username,displayName,type,active:true,assignments:[],viewKeys:[],collectionWriteKeys:[],scoreWriteKeys:[],classAccess:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await audit('create_user','user',cred.user.uid,`建立帳號：${username} ${displayName}`);$('#createdInfo').innerHTML=`<div class="notice success"><b>帳號建立成功</b><br>帳號：${esc(username)}<br>初始密碼：<b>${esc(pwd)}</b><br><small>請現在記錄或個別交給本人。</small></div>`;await refreshAll();renderAccounts()}catch(e){alert('建立失敗：'+e.message)}finally{if(secondary)try{await deleteApp(secondary)}catch{}}}
async function toggleUser(uid){const u=users.find(x=>x.uid===uid),active=!u.active;if(!confirm(`確定${active?'啟用':'停用'} ${u.displayName} 的帳號？`))return;await updateDoc(doc(db,'users',uid),{active,updatedAt:serverTimestamp()});await audit(active?'enable_user':'disable_user','user',uid,`${active?'啟用':'停用'}帳號：${u.username}`);await refreshAll();renderAccounts()}
function editUserPermissions(uid){const u=users.find(x=>x.uid===uid),assigns=u.assignments||[];const classOpts=classes.map(c=>`<option value="${c.id}">${c.id}</option>`).join('')||Object.keys(defaultRosters).map(c=>`<option>${c}</option>`).join('');const current=assigns.map((a,i)=>`<div class="assign">${esc(a.classId)}｜${esc(a.scopeName)}｜${a.kind==='teacher'?'任課老師':a.scopeType==='subject'?'小老師':'班級幹部'}｜${a.canCollection?'收繳可寫':'收繳唯讀'}｜${a.canScores?'成績可寫':'成績唯讀'} <button class="btn danger small remove-assignment" data-i="${i}">移除</button></div>`).join('')||'<div class="sub">目前尚未指派職務。</div>';showModal(`<div class="item-head"><div><div class="section-title">${esc(u.displayName)}｜${esc(u.username)}</div><div class="meta">帳號保留，這裡只調整職務與權限。</div></div><button class="btn gray close-modal">關閉</button></div><div id="currentAssignments">${current}</div><hr style="border:none;border-top:1px solid #e4e7ec;margin:15px 0"><b>新增一個權限</b><div class="two"><div class="field"><label>班級</label><select id="aClass">${classOpts}</select></div><div class="field"><label>身分類型</label><select id="aKind"><option value="assistant">學科小老師</option><option value="teacher">任課老師</option><option value="officer">班級幹部</option></select></div></div><div class="field"><label>科目／職務</label><select id="aName">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="toolbar"><label><input type="checkbox" id="aCollection" checked> 可登記收繳</label><label><input type="checkbox" id="aScores" checked> 可登記成績</label></div><button class="btn primary" id="addAssignment">加入權限</button>`);const draft=[...assigns];function rerender(){const box=$('#currentAssignments');box.innerHTML=draft.map((a,i)=>`<div class="assign">${esc(a.classId)}｜${esc(a.scopeName)}｜${a.kind==='teacher'?'任課老師':a.scopeType==='subject'?'小老師':'班級幹部'}｜${a.canCollection?'收繳可寫':'收繳唯讀'}｜${a.canScores?'成績可寫':'成績唯讀'} <button class="btn danger small remove-assignment" data-i="${i}">移除</button></div>`).join('')||'<div class="sub">目前尚未指派職務。</div>';$$('.remove-assignment').forEach(b=>b.onclick=async()=>{draft.splice(Number(b.dataset.i),1);await saveAssignments(u,draft);rerender()})}$('#aKind').onchange=()=>{const k=$('#aKind').value,$n=$('#aName');$n.innerHTML=(k==='officer'?officerRoles:subjects).map(s=>`<option>${s}</option>`).join('');$('#aScores').checked=k!=='officer';if(k==='teacher')$('#aScores').checked=false};$('#addAssignment').onclick=async()=>{const kind=$('#aKind').value,name=$('#aName').value,a={kind,classId:$('#aClass').value,scopeType:kind==='officer'?'officer':'subject',scopeName:name,canCollection:$('#aCollection').checked,canScores:kind==='officer'?false:$('#aScores').checked};draft.push(a);await saveAssignments(u,draft);rerender()};rerender()}
async function saveAssignments(u,assignments){const access=computeAccess(assignments);await updateDoc(doc(db,'users',u.uid),{assignments,...access,updatedAt:serverTimestamp()});await audit('permissions','user',u.uid,`更新權限：${u.username}`);u.assignments=assignments;Object.assign(u,access)}

function renderClasses(){const cards=classes.sort((a,b)=>a.id.localeCompare(b.id)).map(c=>`<div class="item"><div class="item-head"><div><b>${c.id} 班</b><div class="meta">${(c.students||[]).length} 人</div></div><div><button class="btn gray small edit-class" data-id="${c.id}">編輯</button></div></div></div>`).join('');$('#page-classes').innerHTML=`<div class="two"><div class="card"><div class="section-title">班級名單</div>${cards||'<div class="sub">尚未建立任何班級。</div>'}</div><div class="card"><div class="section-title">快速建立</div><div class="notice">第一次使用可直接匯入目前預設的 804、802、904、906 名單；之後都能在後台修改。</div><button id="seedClasses" class="btn primary">建立／更新預設班級名單</button><hr style="border:none;border-top:1px solid #e4e7ec;margin:15px 0"><b>新增自訂班級</b><div class="field"><label>班級</label><input id="classId" placeholder="例如 805"></div><div class="field"><label>名單（每行：座號,姓名）</label><textarea id="classRoster" rows="10" placeholder="1,王小明\n2,李小華"></textarea></div><button id="saveClass" class="btn primary">儲存班級</button></div></div>`;$('#seedClasses').onclick=seedClasses;$('#saveClass').onclick=()=>saveClass($('#classId').value,$('#classRoster').value);$$('.edit-class').forEach(b=>b.onclick=()=>editClass(b.dataset.id))}
async function seedClasses(){for(const [id,arr] of Object.entries(defaultRosters)){await setDoc(doc(db,'classes',id),{classId:id,students:arr.map(([seat,name])=>({id:String(seat),seat,name})),updatedAt:serverTimestamp()},{merge:true})}await audit('seed','classes','default','建立／更新預設班級名單');await refreshAll();renderClasses();alert('預設班級名單已建立。')}
function parseRoster(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const [seat,...rest]=line.split(/[,，\t]/);return{id:String(Number(seat)),seat:Number(seat),name:rest.join('').trim()}}).filter(x=>x.seat&&x.name).sort((a,b)=>a.seat-b.seat)}async function saveClass(id,text){id=id.trim();if(!id)return alert('請輸入班級');const students=parseRoster(text);if(!students.length)return alert('請輸入名單');await setDoc(doc(db,'classes',id),{classId:id,students,updatedAt:serverTimestamp()},{merge:true});await audit('save_class','class',id,`更新班級名單 ${id}`);await refreshAll();renderClasses();alert('已儲存')}
function editClass(id){const c=classes.find(x=>x.id===id),text=(c.students||[]).map(s=>`${s.seat},${s.name}`).join('\n');showModal(`<div class="item-head"><div class="section-title">編輯 ${id} 班名單</div><button class="btn gray close-modal">關閉</button></div><div class="field"><textarea id="editRoster" rows="18">${esc(text)}</textarea></div><button class="btn primary" id="saveEditRoster">儲存</button>`);$('#saveEditRoster').onclick=async()=>{await saveClass(id,$('#editRoster').value);hideModal()}}
async function renderAudit(){let logs=[];try{const s=await getDocs(query(collection(db,'auditLogs'),orderBy('createdAt','desc')));logs=s.docs.slice(0,200).map(d=>d.data())}catch(e){const s=await getDocs(collection(db,'auditLogs'));logs=s.docs.map(d=>d.data()).slice(-200).reverse()}$('#page-audit').innerHTML=`<div class="card"><div class="section-title">最近操作紀錄</div><div class="table-wrap"><table><thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>內容</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('zh-TW'):''}</td><td>${esc(l.actorName||'')}</td><td>${esc(l.action||'')}</td><td>${esc(l.detail||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
</script></body></html>
