<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>班級工作回報系統</title>

<link
  rel="icon"
  href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>"
>

<style>

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --brand:#2563eb;
  --brand2:#1d4ed8;
  --good:#067647;
  --warn:#b54708;
  --bad:#b42318;
  --soft:#eff6ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

button,
input,
select,
textarea{
  font:inherit;
}

.hidden{
  display:none!important;
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.brand{
  font-size:24px;
  font-weight:800;
}

.sub{
  color:var(--muted);
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(16,24,40,.05);
}

.login{
  max-width:420px;
  margin:8vh auto;
}

.field{
  display:grid;
  gap:6px;
  margin:12px 0;
}

.field label{
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #cfd4dc;
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}

.btn.primary{
  background:var(--brand);
  color:#fff;
}

.btn.primary:hover{
  background:var(--brand2);
}

.btn.gray{
  background:#eef2f6;
}

.btn.danger{
  background:#fee4e2;
  color:var(--bad);
}

.btn.good{
  background:#dcfae6;
  color:var(--good);
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.grid{
  display:grid;
  gap:14px;
}

.roles{
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}

.role-card{
  cursor:pointer;
  border:2px solid transparent;
}

.role-card:hover{
  border-color:#bfdbfe;
}

.role-card.active{
  border-color:var(--brand);
  background:var(--soft);
}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
  background:#f2f4f7;
  color:#344054;
}

.pill.good{
  background:#dcfae6;
  color:var(--good);
}

.pill.warn{
  background:#fff4e5;
  color:var(--warn);
}

.pill.bad{
  background:#fee4e2;
  color:var(--bad);
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:14px 0;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tab{
  background:#eef2f6;
}

.tab.active{
  background:#dbeafe;
  color:#1d4ed8;
}

.section-title{
  font-size:20px;
  font-weight:800;
  margin:2px 0 12px;
}

.item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.roster{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:8px;
  margin-top:12px;
}

.student{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fff;
}

.student .name{
  font-weight:700;
}

.status{
  width:100%;
  margin-top:7px;
  border-radius:9px;
  border:1px solid #d0d5dd;
  padding:7px;
}

.score-row{
  display:grid;
  grid-template-columns:72px 1fr 90px 110px;
  gap:8px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid #f0f2f5;
}

.score-row input,
.score-row select{
  width:100%;
  padding:8px;
  border:1px solid #d0d5dd;
  border-radius:8px;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
}

.notice{
  padding:11px 12px;
  border-radius:10px;
  background:#fffaeb;
  color:#93370d;
  margin:10px 0;
}

.error{
  background:#fef3f2;
  color:#b42318;
}

.success{
  background:#ecfdf3;
  color:#067647;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.semester-badge{
  display:inline-block;
  background:#dbeafe;
  color:#1d4ed8;
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
  font-weight:800;
  margin-top:5px;
}

.footer-note{
  font-size:12px;
  color:var(--muted);
  margin-top:16px;
}

@media(max-width:700px){

  .wrap{
    padding:12px;
  }

  .brand{
    font-size:20px;
  }

  .score-row{
    grid-template-columns:48px 1fr 80px;
  }

  .score-row .score-status{
    grid-column:2/4;
  }

  .card{
    padding:14px;
  }

  .topbar{
    align-items:flex-start;
  }

  .topbar .right{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

}

</style>
</head>

<body>

<div class="wrap">

<section
  id="loginView"
  class="card login"
>

  <div class="brand">
    📋 班級工作回報系統
  </div>

  <div class="sub">
    學生、幹部、小老師與任課老師登入
  </div>

  <div id="loginMsg"></div>

  <div class="field">

    <label>
      帳號
    </label>

    <input
      id="loginUser"
      autocomplete="username"
      placeholder="例如 80427 或老師帳號"
    >

  </div>

  <div class="field">

    <label>
      密碼
    </label>

    <input
      id="loginPass"
      type="password"
      autocomplete="current-password"
      placeholder="輸入密碼"
    >

  </div>

  <button
    id="loginBtn"
    class="btn primary"
    style="width:100%"
  >
    登入
  </button>

  <div class="footer-note">
    學生帳號長期保留；每學期由導師重新派發幹部／小老師權限。
  </div>

</section>


<main
  id="appView"
  class="hidden"
>

  <div class="topbar">

    <div>

      <div class="brand">
        📋 班級工作回報系統
      </div>

      <div
        id="who"
        class="sub"
      ></div>

      <div
        id="semesterLabel"
        class="semester-badge"
      ></div>

    </div>

    <div class="right">

      <button
        id="changePwdBtn"
        class="btn gray small"
      >
        修改自己的密碼
      </button>

      <button
        id="logoutBtn"
        class="btn gray small"
      >
        登出
      </button>

    </div>

  </div>

  <div id="appMsg"></div>

  <section class="card">

    <div class="section-title">
      本學期我的職務
    </div>

    <div
      id="roleGrid"
      class="grid roles"
    ></div>

  </section>


  <section
    id="workspace"
    class="card hidden"
    style="margin-top:14px"
  >

    <div class="item-head">

      <div>

        <div
          id="workspaceTitle"
          class="section-title"
        ></div>

        <div
          id="workspacePerm"
          class="sub"
        ></div>

      </div>

    </div>


    <div
      class="tabs"
      style="margin-top:12px"
    >

      <button
        class="btn tab active"
        data-tab="collection"
      >
        📥 收繳
      </button>

      <button
        id="scoresTab"
        class="btn tab"
        data-tab="scores"
      >
        📊 小考成績
      </button>

    </div>


    <div id="collectionPanel"></div>

    <div
      id="scoresPanel"
      class="hidden"
    ></div>

  </section>

</main>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB56F4wJ-IMUiBsqJ5P33HoDK642h7671U",

  authDomain:
    "class-datawork.firebaseapp.com",

  projectId:
    "class-datawork",

  storageBucket:
    "class-datawork.firebasestorage.app",

  messagingSenderId:
    "24186422479",

  appId:
    "1:24186422479:web:8dee260f34b2e506fd63ba"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const $ =
  s => document.querySelector(s);

const $$ =
  s => [
    ...document.querySelectorAll(s)
  ];


const SYNTH_DOMAIN =
  "class-datawork.local";


let profile = null;

let currentAssignment = null;

let roster = [];

let unsubItems = null;

let unsubAssess = null;

let currentSemester =
  "115-1";


const statusOptions = [

  ["submitted","已繳"],

  ["missing","未繳"],

  ["late","補交"],

  ["exempt","免繳"]

];


const scoreStatusOptions = [

  ["normal","正常"],

  ["absent","缺考"],

  ["makeup","補考"],

  ["exempt","免試"],

  ["not_entered","未登記"]

];


function emailFor(v){

  v =
    v.trim();

  return v.includes("@")
    ? v
    : `${v}@${SYNTH_DOMAIN}`;

}


function msg(
  el,
  text,
  type = "notice"
){

  el.innerHTML =
    text
      ? `<div class="notice ${type}">${text}</div>`
      : "";

}


function esc(v = ""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[m])
    );

}


function scopeKey(a){

  return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`;

}


function assignmentLabel(a){

  if(
    a.scopeType
    === "subject"
  ){

    return `${a.classId}班｜${a.scopeName}${
      a.kind === "teacher"
        ? "任課老師"
        : "小老師"
    }`;

  }

  return `${a.classId}班｜${a.scopeName}`;

}


function canCollection(a){

  return !!a.canCollection;

}


function canScores(a){

  return !!a.canScores;

}


function today(){

  return new Date()
    .toLocaleDateString(
      "sv-SE"
    );

}


async function loadSystem(){

  const s =
    await getDoc(
      doc(
        db,
        "settings",
        "system"
      )
    );


  if(
    s.exists()
    &&
    s.data().currentSemester
  ){

    currentSemester =
      s.data().currentSemester;

  }


  $("#semesterLabel")
    .textContent =
      `目前學期：${currentSemester}`;

}


async function loadRoster(
  classId
){

  const s =
    await getDoc(
      doc(
        db,
        "classes",
        classId
      )
    );


  roster =
    s.exists()
      ? (
          s.data().students
          ||
          []
        )
      : [];


  return roster;

}


async function audit(
  action,
  targetType,
  targetId,
  detail
){

  try{

    await addDoc(
      collection(
        db,
        "auditLogs"
      ),
      {

        actorUid:
          auth.currentUser.uid,

        actorName:
          profile.displayName
          ||
          profile.username,

        semester:
          currentSemester,

        action,

        targetType,

        targetId,

        detail,

        createdAt:
          serverTimestamp()

      }
    );

  }catch(e){

    console.warn(e);

  }

}


$("#loginBtn").onclick =
async()=>{

  msg(
    $("#loginMsg"),
    ""
  );


  try{

    await signInWithEmailAndPassword(
      auth,
      emailFor(
        $("#loginUser").value
      ),
      $("#loginPass").value
    );

  }catch(e){

    console.error(
      "登入失敗",
      e
    );


    msg(
      $("#loginMsg"),
      "登入失敗：請確認帳號與密碼。",
      "error"
    );

  }

};


$("#logoutBtn").onclick =
()=> signOut(auth);


async function changeOwnPassword(
  force = false
){

  const p =
    prompt(
      force
        ? "第一次登入，請設定新的個人密碼（至少 6 碼）："
        : "請輸入新的密碼（至少 6 碼）："
    );


  if(!p){

    if(force){

      await signOut(auth);

    }

    return false;

  }


  if(
    p.length < 6
  ){

    alert(
      "密碼至少 6 碼。"
    );


    return changeOwnPassword(
      force
    );

  }


  const p2 =
    prompt(
      "請再輸入一次新密碼："
    );


  if(
    p2 !== p
  ){

    alert(
      "兩次密碼不同，請重新設定。"
    );


    return changeOwnPassword(
      force
    );

  }


  try{

    await updatePassword(
      auth.currentUser,
      p
    );

  }catch(e){

    console.error(
      "Authentication 密碼修改失敗",
      e
    );


    const code =
      e?.code
      ||
      "unknown";


    let tip =
      "密碼修改失敗。";


    if(
      code
      === "auth/requires-recent-login"
    ){

      tip +=
        "\n\n請先登出，再重新登入後立即修改。";

    }
    else if(
      code
      === "auth/weak-password"
    ){

      tip +=
        "\n\n新密碼強度不足，請使用至少 6 碼。";

    }
    else{

      tip +=
        `\n\n錯誤代碼：${code}`;

    }


    alert(
      tip
    );


    if(force){

      await signOut(auth);

    }


    return false;

  }


  if(
    force
    ||
    profile?.mustChangePassword
    === true
  ){

    try{

      await updateDoc(
        doc(
          db,
          "users",
          auth.currentUser.uid
        ),
        {

          mustChangePassword:
            false,

          updatedAt:
            serverTimestamp()

        }
      );


      if(profile){

        profile.mustChangePassword =
          false;

      }

    }catch(e){

      console.error(
        "Firestore 首次改密碼狀態更新失敗",
        e
      );


      const code =
        e?.code
        ||
        "unknown";


      alert(
        "新密碼已經修改成功，但「第一次登入完成狀態」尚未寫入。"
        +
        "\n\n"
        +
        `錯誤代碼：${code}`
        +
        "\n\n"
        +
        "請記住剛設定的新密碼，重新登入後再試一次。"
      );


      return false;

    }

  }


  if(force){

    alert(
      "第一次登入密碼設定完成。之後請使用新密碼登入。"
    );

  }else{

    alert(
      "密碼已更新。之後請使用新密碼登入。"
    );

  }


  return true;

}


$("#changePwdBtn").onclick =
()=> changeOwnPassword(false);


onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      profile =
        null;


      $("#loginView")
        .classList
        .remove(
          "hidden"
        );


      $("#appView")
        .classList
        .add(
          "hidden"
        );


      return;

    }


    try{

      const snap =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(
        !snap.exists()
        ||
        snap.data().active
        !== true
      ){

        await signOut(auth);


        msg(
          $("#loginMsg"),
          "此帳號尚未啟用或已被停用，請聯絡導師。",
          "error"
        );


        return;

      }


      profile = {

        uid:
          user.uid,

        ...snap.data()

      };


      if(
        profile.type
        === "admin"
      ){

        location.href =
          "class-workadmin.html";


        return;

      }


      await loadSystem();


      if(
        profile.mustChangePassword
        === true
      ){

        const ok =
          await changeOwnPassword(
            true
          );


        if(!ok){

          return;

        }

      }


      $("#loginView")
        .classList
        .add(
          "hidden"
        );


      $("#appView")
        .classList
        .remove(
          "hidden"
        );


      $("#who")
        .textContent =
          `${
            profile.displayName
            ||
            profile.username
          }｜${profile.username}`;


      renderRoles();

    }catch(e){

      console.error(
        "登入後讀取帳號
