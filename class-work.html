<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>班級工作回報系統</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --brand:#2563eb;
  --good:#067647;
  --warn:#b54708;
  --bad:#b42318;
  --soft:#eff6ff
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink)
}

button,
input,
select,
textarea{
  font:inherit
}

.hidden{
  display:none!important
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:18px
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px
}

.brand{
  font-size:24px;
  font-weight:800
}

.sub,
.meta{
  color:var(--muted);
  font-size:13px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(16,24,40,.05)
}

.login{
  max-width:420px;
  margin:8vh auto
}

.field{
  display:grid;
  gap:6px;
  margin:12px 0
}

.field label{
  font-weight:700
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #cfd4dc;
  border-radius:10px;
  padding:11px 12px;
  background:#fff
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700
}

.primary{
  background:var(--brand);
  color:#fff
}

.gray{
  background:#eef2f6
}

.danger{
  background:#fee4e2;
  color:var(--bad)
}

.good{
  background:#dcfae6;
  color:var(--good)
}

.small{
  padding:7px 10px;
  font-size:13px
}

.grid{
  display:grid;
  gap:14px
}

.roles{
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))
}

.role-card{
  cursor:pointer;
  border:2px solid transparent
}

.role-card.active{
  border-color:var(--brand);
  background:var(--soft)
}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
  background:#f2f4f7
}

.pill.good{
  background:#dcfae6;
  color:var(--good)
}

.pill.warn{
  background:#fff4e5;
  color:var(--warn)
}

.pill.bad{
  background:#fee4e2;
  color:var(--bad)
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:14px 0
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.tab{
  background:#eef2f6
}

.tab.active{
  background:#dbeafe;
  color:#1d4ed8
}

.section-title{
  font-size:20px;
  font-weight:800;
  margin:2px 0 12px
}

.item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin:10px 0
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.roster{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
  margin-top:12px
}

.student{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fff
}

.student .name{
  font-weight:700
}

.status{
  width:100%;
  margin-top:7px;
  border-radius:9px;
  border:1px solid #d0d5dd;
  padding:7px
}

.late-note{
  color:#d92d20;
  font-weight:800;
  font-size:13px;
  margin-top:6px
}

.lock-note{
  font-size:12px;
  color:#667085;
  margin-top:5px
}

.score-row{
  display:grid;
  grid-template-columns:64px 1fr 90px 110px auto;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #f0f2f5
}

.score-row input,
.score-row select{
  width:100%;
  padding:8px;
  border:1px solid #d0d5dd;
  border-radius:8px
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:13px
}

.notice{
  padding:11px 12px;
  border-radius:10px;
  background:#fffaeb;
  color:#93370d;
  margin:10px 0
}

.error{
  background:#fef3f2;
  color:#b42318
}

.success{
  background:#ecfdf3;
  color:#067647
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px
}

.semester-badge{
  display:inline-block;
  background:#dbeafe;
  color:#1d4ed8;
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
  font-weight:800;
  margin-top:5px
}

.footer-note{
  font-size:12px;
  color:var(--muted);
  margin-top:16px
}

@media(max-width:700px){

  .wrap{
    padding:12px
  }

  .brand{
    font-size:20px
  }

  .card{
    padding:14px
  }

  .topbar{
    align-items:flex-start
  }

  .topbar .right{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end
  }

  .score-row{
    grid-template-columns:44px 1fr 82px
  }

  .score-row .score-status{
    grid-column:2/4
  }

  .score-row .unlock-cell{
    grid-column:2/4
  }

}
</style>
</head>

<body>

<div class="wrap">

<section
  id="loginView"
  class="card login"
>

  <div class="brand">
    📋 班級工作回報系統
  </div>

  <div class="sub">
    學生、小老師與任課老師登入
  </div>

  <div id="loginMsg"></div>

  <div class="field">
    <label>帳號</label>

    <input
      id="loginUser"
      autocomplete="username"
      placeholder="例如 80427 或老師帳號"
    >
  </div>

  <div class="field">
    <label>密碼</label>

    <input
      id="loginPass"
      type="password"
      autocomplete="current-password"
    >
  </div>

  <button
    id="loginBtn"
    class="btn primary"
    style="width:100%"
  >
    登入
  </button>

  <div class="footer-note">
    學生帳號長期保留；每學期由導師重新派發幹部／小老師權限。
  </div>

</section>


<main
  id="appView"
  class="hidden"
>

  <div class="topbar">

    <div>

      <div class="brand">
        📋 班級工作回報系統
      </div>

      <div
        id="who"
        class="sub"
      ></div>

      <div
        id="semesterLabel"
        class="semester-badge"
      ></div>

    </div>

    <div class="right">

      <button
        id="changePwdBtn"
        class="btn gray small"
      >
        修改自己的密碼
      </button>

      <button
        id="logoutBtn"
        class="btn gray small"
      >
        登出
      </button>

    </div>

  </div>


  <div id="appMsg"></div>


  <section class="card">

    <div class="section-title">
      本學期我的職務
    </div>

    <div
      id="roleGrid"
      class="grid roles"
    ></div>

  </section>


  <section
    id="workspace"
    class="card hidden"
    style="margin-top:14px"
  >

    <div class="item-head">

      <div>

        <div
          id="workspaceTitle"
          class="section-title"
        ></div>

        <div
          id="workspacePerm"
          class="sub"
        ></div>

      </div>

    </div>


    <div
      class="tabs"
      style="margin-top:12px"
    >

      <button
        class="btn tab active"
        data-tab="collection"
      >
        📥 收繳
      </button>

      <button
        id="scoresTab"
        class="btn tab"
        data-tab="scores"
      >
        📊 小考成績
      </button>

    </div>


    <div id="collectionPanel"></div>

    <div
      id="scoresPanel"
      class="hidden"
    ></div>

  </section>

</main>

</div>


<script type="module">

import{
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import{
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updatePassword
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


import{
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


const firebaseConfig={

  apiKey:
    "AIzaSyB56F4wJ-IMUiBsqJ5P33HoDK642h7671U",

  authDomain:
    "class-datawork.firebaseapp.com",

  projectId:
    "class-datawork",

  storageBucket:
    "class-datawork.firebasestorage.app",

  messagingSenderId:
    "24186422479",

  appId:
    "1:24186422479:web:8dee260f34b2e506fd63ba"

};


const app=
  initializeApp(
    firebaseConfig
  );


const auth=
  getAuth(app);


const db=
  getFirestore(app);


const $=
  s=>document.querySelector(s);


const $$=
  s=>[
    ...document.querySelectorAll(s)
  ];


const DOMAIN=
  "class-datawork.local";


let profile=
  null;


let currentAssignment=
  null;


let roster=[];


let unsubItems=
  null;


let unsubAssess=
  null;


let currentSemester=
  "115-1";


const statusOptions=[

  [
    "submitted",
    "已繳"
  ],

  [
    "missing",
    "未繳"
  ],

  [
    "late",
    "補交"
  ],

  [
    "exempt",
    "免繳"
  ]

];


const scoreStatusOptions=[

  [
    "normal",
    "正常"
  ],

  [
    "absent",
    "缺考"
  ],

  [
    "makeup",
    "補考"
  ],

  [
    "exempt",
    "免試"
  ],

  [
    "not_entered",
    "未登記"
  ]

];


function emailFor(v){

  v=
    v.trim();


  return v.includes("@")
    ?v
    :`${v}@${DOMAIN}`;

}


function esc(v=""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m=>({

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;"

      }[m])
    );

}


function msg(
  el,
  text,
  type="notice"
){

  el.innerHTML=
    text
      ?`<div class="notice ${type}">${text}</div>`
      :"";

}


function scopeKey(a){

  return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`;

}


function assignmentLabel(a){

  return a.scopeType==="subject"
    ?`${a.classId}班｜${a.scopeName}${a.kind==="teacher"?"任課老師":"小老師"}`
    :`${a.classId}班｜${a.scopeName}`;

}


function canCollection(a){

  return !!a.canCollection;

}


function canScores(a){

  return !!a.canScores;

}


function isTeacher(){

  return profile?.type==="teacher";

}


function today(){

  return new Date()
    .toLocaleDateString(
      "sv-SE"
    );

}


function studentId(s){

  return s.id
    ||
    String(
      s.seat
    );

}


function hasScore(r){

  return r
    &&
    r.score!==null
    &&
    r.score!==""
    &&
    Number.isFinite(
      Number(
        r.score
      )
    );

}


async function loadSystem(){

  const s=
    await getDoc(
      doc(
        db,
        "settings",
        "system"
      )
    );


  if(
    s.exists()
    &&
    s.data().currentSemester
  ){

    currentSemester=
      s.data().currentSemester;

  }


  $("#semesterLabel")
    .textContent=
      `目前學期：${currentSemester}`;

}


async function loadRoster(
  classId
){

  const s=
    await getDoc(
      doc(
        db,
        "classes",
        classId
      )
    );


  roster=
    s.exists()
      ?(
          s.data().students
          ||
          []
        )
      :[];


  return roster;

}


async function audit(
  action,
  targetType,
  targetId,
  detail
){

  try{

    await addDoc(
      collection(
        db,
        "auditLogs"
      ),
      {

        actorUid:
          auth.currentUser.uid,

        actorName:
          profile.displayName
          ||
          profile.username,

        semester:
          currentSemester,

        action,

        targetType,

        targetId,

        detail,

        createdAt:
          serverTimestamp()

      }
    );

  }catch(e){

    console.warn(e);

  }

}


$("#loginBtn").onclick=
async()=>{

  msg(
    $("#loginMsg"),
    ""
  );


  try{

    await signInWithEmailAndPassword(
      auth,
      emailFor(
        $("#loginUser").value
      ),
      $("#loginPass").value
    );

  }catch(e){

    console.error(e);


    msg(
      $("#loginMsg"),
      "登入失敗：請確認帳號與密碼。",
      "error"
    );

  }

};


$("#loginPass")
  .addEventListener(
    "keydown",
    e=>{

      if(
        e.key==="Enter"
      ){

        $("#loginBtn")
          .click();

      }

    }
  );


$("#logoutBtn").onclick=
()=>signOut(auth);


async function changeOwnPassword(
  force=false
){

  const p=
    prompt(
      force
        ?"第一次登入，請設定新的個人密碼（至少 6 碼）："
        :"請輸入新的密碼（至少 6 碼）："
    );


  if(!p){

    if(force){

      await signOut(auth);

    }

    return false;

  }


  if(
    p.length<6
  ){

    alert(
      "密碼至少 6 碼。"
    );


    return changeOwnPassword(
      force
    );

  }


  const p2=
    prompt(
      "請再輸入一次新密碼："
    );


  if(
    p2!==p
  ){

    alert(
      "兩次密碼不同，請重新設定。"
    );


    return changeOwnPassword(
      force
    );

  }


  try{

    await updatePassword(
      auth.currentUser,
      p
    );

  }catch(e){

    alert(
      `密碼修改失敗。\n錯誤代碼：${e.code||"unknown"}`
    );


    if(force){

      await signOut(auth);

    }


    return false;

  }


  if(
    force
    ||
    profile?.mustChangePassword===true
  ){

    try{

      await updateDoc(
        doc(
          db,
          "users",
          auth.currentUser.uid
        ),
        {

          mustChangePassword:
            false,

          updatedAt:
            serverTimestamp()

        }
      );


      if(profile){

        profile.mustChangePassword=
          false;

      }

    }catch(e){

      alert(
        `新密碼已修改成功，但首次登入狀態更新失敗。\n錯誤代碼：${e.code||"unknown"}`
      );


      return false;

    }

  }


  alert(
    "密碼已更新。"
  );


  return true;

}


$("#changePwdBtn").onclick=
()=>changeOwnPassword(false);


onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      profile=
        null;


      $("#loginView")
        .classList
        .remove(
          "hidden"
        );


      $("#appView")
        .classList
        .add(
          "hidden"
        );


      return;

    }


    try{

      const snap=
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(
        !snap.exists()
        ||
        snap.data().active!==true
      ){

        await signOut(auth);


        msg(
          $("#loginMsg"),
          "此帳號尚未啟用或已停用。",
          "error"
        );


        return;

      }


      profile={

        uid:
          user.uid,

        ...snap.data()

      };


      if(
        profile.type==="admin"
      ){

        location.href=
          "class-datawork-admin.html";


        return;

      }


      await loadSystem();


      if(
        profile.mustChangePassword===true
      ){

        const ok=
          await changeOwnPassword(
            true
          );


        if(!ok){

          return;

        }

      }


      $("#loginView")
        .classList
        .add(
          "hidden"
        );


      $("#appView")
        .classList
        .remove(
          "hidden"
        );


      $("#who")
        .textContent=
          `${
            profile.displayName
            ||
            profile.username
          }｜${
            profile.type==="teacher"
              ?"任課老師"
              :"學生"
          }`;


      renderRoles();

    }catch(e){

      console.error(e);


      await signOut(auth);


      msg(
        $("#loginMsg"),
        `帳號資料讀取失敗：${e.code||e.message}`,
        "error"
      );

    }

  }
);


function currentAssignments(){

  return (
    profile.assignments
    ||
    []
  )
  .filter(
    a=>
      (
        a.semester
        ||
        ""
      )
      ===currentSemester
  );

}


function renderRoles(){

  const list=
    currentAssignments();


  const box=
    $("#roleGrid");


  box.innerHTML=
    "";


  $("#workspace")
    .classList
    .add(
      "hidden"
    );


  currentAssignment=
    null;


  if(
    !list.length
  ){

    box.innerHTML=`

      <div class="empty">

        <b>
          ${esc(
            profile.displayName
            ||
            profile.username
          )}
        </b>

        <br><br>

        目前尚未被指派
        ${esc(currentSemester)}
        的任何職務權限。

        <br><br>

        如有疑問請聯絡導師。

      </div>
    `;


    return;

  }


  list.forEach(
    (
      a,
      i
    )=>{

      const d=
        document.createElement(
          "div"
        );


      d.className=
        "card role-card";


      d.innerHTML=`

        <div
          style="font-weight:800"
        >

          ${esc(
            assignmentLabel(a)
          )}

        </div>


        <div class="meta">

          ${
            canCollection(a)
              ?"📥 可登記收繳"
              :"📥 收繳唯讀"
          }

          ${
            a.scopeType==="subject"
              ?(
                  canScores(a)
                    ?"　📊 可登記成績"
                    :"　📊 成績唯讀"
                )
              :""
          }

        </div>
      `;


      d.onclick=
        ()=>selectAssignment(
          i,
          d
        );


      box.appendChild(d);

    }
  );

}


async function selectAssignment(
  i,
  el
){

  const list=
    currentAssignments();


  $$(".role-card")
    .forEach(
      x=>
        x.classList.remove(
          "active"
        )
    );


  el.classList.add(
    "active"
  );


  currentAssignment=
    list[i];


  $("#workspace")
    .classList
    .remove(
      "hidden"
    );


  $("#workspaceTitle")
    .textContent=
      assignmentLabel(
        currentAssignment
      );


  $("#workspacePerm")
    .textContent=
      `${currentSemester}｜${
        canCollection(
          currentAssignment
        )
          ?"收繳可寫"
          :"收繳唯讀"
      }${
        currentAssignment.scopeType==="subject"
          ?`；${
              canScores(
                currentAssignment
              )
                ?"成績可寫"
                :"成績唯讀"
            }`
          :""
      }`;


  $("#scoresTab")
    .classList
    .toggle(
      "hidden",
      currentAssignment.scopeType!=="subject"
    );


  await loadRoster(
    currentAssignment.classId
  );


  startCollection();


  if(
    currentAssignment.scopeType==="subject"
  ){

    startScores();

  }

}


$$(".tab")
  .forEach(
    b=>
      b.onclick=
      ()=>{

        if(
          b.classList
            .contains(
              "hidden"
            )
        ){

          return;

        }


        $$(".tab")
          .forEach(
            x=>
              x.classList.remove(
                "active"
              )
          );


        b.classList.add(
          "active"
        );


        const t=
          b.dataset.tab;


        $("#collectionPanel")
          .classList
          .toggle(
            "hidden",
            t!=="collection"
          );


        $("#scoresPanel")
          .classList
          .toggle(
            "hidden",
            t!=="scores"
          );

      }
  );


// ============================================================
// 收繳
// ============================================================

function startCollection(){

  if(
    unsubItems
  ){

function collectionCounts(
  it
){

  const c={

    submitted:0,

    missing:0,

    late:0,

    exempt:0,

    lateSubmitted:0

  };


  Object.entries(
    it.records
    ||
    {}
  )
  .forEach(
    (
      [
        sid,
        v
      ]
    )=>{

      c[v]=
        (
          c[v]
          ||
          0
        )
        +
        1;


      if(
        v==="submitted"
        &&
        (
          it.lateSubmitted
          ||
          {}
        )[sid]
      ){

        c.lateSubmitted++;

      }

    }
  );


  return c;

}

async function toggleCollectionConfirm(
  it
){

  const confirming=
    it.reviewStatus!=="confirmed";


  if(
    !confirm(
      confirming
        ?`確定確認「${it.itemName}」？

確認後，目前「已繳」與「免繳」會鎖定；未繳／補交仍可繼續修改。`
        :`確定取消確認「${it.itemName}」？

取消後會恢復全部可修改。`
    )
  ){

    return;

  }


  const lockedRecords={};


  if(confirming){

    for(
      const[
        sid,
        v
      ]
      of Object.entries(
        it.records
        ||
        {}
      )
    ){

      lockedRecords[sid]=
        (
          v==="submitted"
          ||
          v==="exempt"
        );

    }

  }


  await updateDoc(
    doc(
      db,
      "collectionItems",
      it.id
    ),
    {

      reviewStatus:
        confirming
          ?"confirmed"
          :"pending",

      locked:
        false,

      lockedRecords:
        confirming
          ?lockedRecords
          :{},

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedByName:
        confirming
          ?(
              profile.displayName
              ||
              profile.username
            )
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    "collection",
    it.id,
    `${confirming?"確認":"取消確認"}收繳：${it.itemName}`
  );

}


function toggleCollectionEditor(
  it
){

  const box=
    $(
      `#col-${it.id}`
    );


  if(
    !box.classList
      .contains(
        "hidden"
      )
  ){

    box.classList
      .add(
        "hidden"
      );


    box.innerHTML=
      "";


    return;

  }


  box.classList
    .remove(
      "hidden"
    );


  const writable=
    canCollection(
      currentAssignment
    );


  const confirmed=
    it.reviewStatus==="confirmed";


  const locks=
    it.lockedRecords
    ||
    {};


  const lateSubmitted=
    it.lateSubmitted
    ||
    {};


  box.innerHTML=`

    ${
      it.note
        ?`

          <div class="notice">
            備註：
            ${esc(it.note)}
          </div>
        `
        :""
    }


    <div class="roster">

      ${
        roster.map(
          s=>{

            const sid=
              studentId(s);


            const v=
              (
                it.records
                ||
                {}
              )[sid]
              ||
              "submitted";


            const locked=
              confirmed
              &&
              !!locks[sid];


            const late=
              !!lateSubmitted[sid];


            return`

              <div class="student">

                <div class="name">
                  ${s.seat}. ${esc(s.name)}
                </div>


                <select
                  class="status col-status"
                  data-student="${esc(sid)}"
                  data-old="${v}"
                  ${
                    writable
                    &&
                    !locked
                      ?""
                      :"disabled"
                  }
                >

                  ${
                    statusOptions.map(
                      (
                        [
                          x,
                          l
                        ]
                      )=>`

                        <option
                          value="${x}"
                          ${
                            x===v
                              ?"selected"
                              :""
                          }
                        >
                          ${l}
                        </option>
                      `
                    )
                    .join("")
                  }

                </select>


                ${
                  late
                  &&
                  v==="submitted"
                    ?`

                      <div class="late-note">
                        已繳交（遲交）
                      </div>
                    `
                    :""
                }


                ${
                  locked
                    ?`

                      <div class="lock-note">
                        🔒 已確認，不可修改
                      </div>
                    `
                    :""
                }

              </div>
            `;

          }
        )
        .join("")
      }

    </div>


    ${
      writable
        ?`

          <div class="toolbar">

            <button
              class="btn primary save-col"
            >
              儲存收繳狀態
            </button>

          </div>
        `
        :""
    }
  `;


  box.querySelector(
    ".save-col"
  )
  ?.addEventListener(
    "click",
    async()=>{

      const records={

        ...(
          it.records
          ||
          {}
        )

      };


      const newLocks={

        ...(
          it.lockedRecords
          ||
          {}
        )

      };


      const newLate={

        ...(
          it.lateSubmitted
          ||
          {}
        )

      };


      box.querySelectorAll(
        ".col-status"
      )
      .forEach(
        sel=>{

          if(
            sel.disabled
          ){

            return;

          }


          const sid=
            sel.dataset.student;


          const old=
            sel.dataset.old;


          const next=
            sel.value;


          records[sid]=
            next;


          if(
            confirmed
            &&
            (
              old==="missing"
              ||
              old==="late"
            )
            &&
            next==="submitted"
          ){

            newLate[sid]=
              true;


            newLocks[sid]=
              true;

          }
          else if(
            confirmed
            &&
            next==="exempt"
          ){

            newLocks[sid]=
              true;

          }

        }
      );


      await updateDoc(
        doc(
          db,
          "collectionItems",
          it.id
        ),
        {

          records,

          lockedRecords:
            newLocks,

          lateSubmitted:
            newLate,

          updatedAt:
            serverTimestamp()

        }
      );


      await audit(
        "update",
        "collection",
        it.id,
        `更新收繳：${it.itemName}`
      );


      alert(
        "已儲存"
      );

    }
  );

}

function calcStats(
  it
){

  const vals=[];


  let absent=
    0;


  let below=
    0;


  Object.values(
    it.scores
    ||
    {}
  )
  .forEach(
    r=>{

      if(
        r.status==="absent"
      ){

        absent++;

      }


      if(
        (
          r.status==="normal"
          ||
          r.status==="makeup"
        )
        &&
        hasScore(r)
      ){

        const n=
          Number(
            r.score
          );


        vals.push(n);


        if(
          n<
          Number(
            it.passScore
            ||
            0
          )
        ){

          below++;

        }

      }

    }
  );


  return{

    avg:
      vals.length
        ?(
            vals.reduce(
              (
                a,
                b
              )=>
                a+b,
              0
            )
            /
            vals.length
          )
          .toFixed(1)
        :"-",

    high:
      vals.length
        ?Math.max(
            ...vals
          )
        :"-",

    low:
      vals.length
        ?Math.min(
            ...vals
          )
        :"-",

    below,

    absent

  };

}

async function createAssessmentPrompt(){

  const name=
    prompt(
      "小考名稱："
    );


  if(!name){

    return;

  }


  const max=
    Number(
      prompt(
        "滿分：",
        "100"
      )
    );


  if(
    !Number.isFinite(max)
    ||
    max<=0
  ){

    return alert(
      "滿分格式不正確"
    );

  }


  const pass=
    Number(
      prompt(
        "及格分數：",
        String(
          Math.round(
            max*.6
          )
        )
      )
    );


  if(
    !Number.isFinite(pass)
  ){

    return alert(
      "及格分數格式不正確"
    );

  }


  const scores={};


  roster.forEach(
    s=>
      scores[
        studentId(s)
      ]
      ={

        status:
          "not_entered",

        score:
          null

      }
  );


  const ref=
    await addDoc(
      collection(
        db,
        "assessments"
      ),
      {

        semester:
          currentSemester,

        scopeKey:
          scopeKey(
            currentAssignment
          ),

        classId:
          currentAssignment.classId,

        scopeType:
          currentAssignment.scopeType,

        scopeName:
          currentAssignment.scopeName,

        name:
          name.trim(),

        date:
          today(),

        maxScore:
          max,

        passScore:
          pass,

        note:
          "",

        scores,

        scoreLocks:
          {},

        createdBy:
          auth.currentUser.uid,

        createdByName:
          profile.displayName
          ||
          profile.username,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp(),

        reviewStatus:
          "pending",

        locked:
          false

      }
    );


  await audit(
    "create",
    "assessment",
    ref.id,
    `新增小考：${name}`
  );

}

        ?`確定確認「${it.name}」？

確認後，已有成績會鎖定；尚未有成績的學生仍可補登。`
        :`確定取消確認「${it.name}」？

取消後全部成績恢復可修改。`
    )
  ){

    return;

  }


  const scoreLocks={};


  if(confirming){

    for(
      const[
        sid,
        r
      ]
      of Object.entries(
        it.scores
        ||
        {}
      )
    ){

      scoreLocks[sid]=
        hasScore(r);

    }

  }


  await updateDoc(
    doc(
      db,
      "assessments",
      it.id
    ),
    {

      reviewStatus:
        confirming
          ?"confirmed"
          :"pending",

      locked:
        false,

      scoreLocks:
        confirming
          ?scoreLocks
          :{},

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedByName:
        confirming
          ?(
              profile.displayName
              ||
              profile.username
            )
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    "assessment",
    it.id,
    `${confirming?"確認":"取消確認"}小考：${it.name}`
  );

}


function toggleScoreEditor(
  it
){

  const box=
    $(
      `#score-${it.id}`
    );


  if(
    !box.classList
      .contains(
        "hidden"
      )
  ){

    box.classList
      .add(
        "hidden"
      );


    box.innerHTML=
      "";


    return;

  }


  box.classList
    .remove(
      "hidden"
    );


  const writable=
    canScores(
      currentAssignment
    );


  const confirmed=
    it.reviewStatus==="confirmed";


  const locks=
    it.scoreLocks
    ||
    {};


  box.innerHTML=`

    <div>

      ${
        roster.map(
          s=>{

            const sid=
              studentId(s);


            const r=
              (
                it.scores
                ||
                {}
              )[sid]
              ||
              {

                status:
                  "not_entered",

                score:
                  null

              };


            const locked=
              confirmed
              &&
              !!locks[sid];


            return`

              <div class="score-row">

                <b>
                  ${s.seat}
                </b>

                <span>
                  ${esc(s.name)}
                </span>

                <input
                  class="score-input"
                  data-student="${esc(sid)}"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  max="${it.maxScore}"
                  value="${r.score??""}"
                  ${
                    writable
                    &&
                    !locked
                      ?""
                      :"disabled"
                  }
                >


                <select
                  class="score-status"
                  data-student="${esc(sid)}"
                  ${
                    writable
                    &&
                    !locked
                      ?""
                      :"disabled"
                  }
                >

                  ${
                    scoreStatusOptions.map(
                      (
                        [
                          x,
                          l
                        ]
                      )=>`

                        <option
                          value="${x}"
                          ${
                            x===(
                              r.status
                              ||
                              "not_entered"
                            )
                              ?"selected"
                              :""
                          }
                        >
                          ${l}
                        </option>
                      `
                    )
                    .join("")
                  }

                </select>


                <div class="unlock-cell">

                  ${
                    locked
                    &&
                    writable
                      ?`

                        <button
                          class="btn gray small unlock-score"
                          data-student="${esc(sid)}"
                        >
                          🔓 解鎖修改
                        </button>
                      `
                      :locked
                        ?`

                          <span class="pill bad">
                            已鎖定
                          </span>
                        `
                        :confirmed
                        &&
                        !hasScore(r)
                          ?`

                            <span class="pill warn">
                              可補登
                            </span>
                          `
                          :""
                  }

                </div>

              </div>
            `;

          }
        )
        .join("")
      }

    </div>


    ${
      writable
        ?`

          <div class="toolbar">

            <button
              class="btn primary save-score"
            >
              儲存成績
            </button>

          </div>
        `
        :""
    }
  `;


  box.querySelectorAll(
    ".unlock-score"
  )
  .forEach(
    btn=>
      btn.onclick=
      async()=>{

        const sid=
          btn.dataset.student;


        if(
          !confirm(
            "確定解鎖這位學生的成績進行修改？"
          )
        ){

          return;

        }


        const newLocks={

          ...(
            it.scoreLocks
            ||
            {}
          ),

          [sid]:
            false

        };


        await updateDoc(
          doc(
            db,
            "assessments",
            it.id
          ),
          {

            scoreLocks:
              newLocks,

            updatedAt:
              serverTimestamp()

          }
        );


        await audit(
          "unlock_score",
          "assessment",
          it.id,
          `解鎖 ${it.name}｜座號 ${sid}`
        );

      }
  );


  box.querySelector(
    ".save-score"
  )
  ?.addEventListener(
    "click",
    async()=>{

      try{

        const scores={

          ...(
            it.scores
            ||
            {}
          )

        };


        const newLocks={

          ...(
            it.scoreLocks
            ||
            {}
          )

        };


        roster.forEach(
          s=>{

            const sid=
              studentId(s);


            const inp=
              box.querySelector(
                `.score-input[data-student="${CSS.escape(sid)}"]`
              );


            const sel=
              box.querySelector(
                `.score-status[data-student="${CSS.escape(sid)}"]`
              );


            if(
              !inp
              ||
              inp.disabled
            ){

              return;

            }


            const score=
              inp.value===""
                ?null
                :Number(
                    inp.value
                  );


            if(
              score!==null
              &&
              (
                score<0
                ||
                score>
                Number(
                  it.maxScore
                )
              )
            ){

              throw new Error(
                `${s.name} 分數超出範圍`
              );

            }


            let status=
              sel.value;


            if(
              score!==null
              &&
              status==="not_entered"
            ){

              status=
                "normal";

            }


            scores[sid]={

              score,

              status

            };


            if(confirmed){

              newLocks[sid]=
                score!==null;

            }

          }
        );


        await updateDoc(
          doc(
            db,
            "assessments",
            it.id
          ),
          {

            scores,

            scoreLocks:
              newLocks,

            updatedAt:
              serverTimestamp()

          }
        );


        await audit(
          "update",
          "assessment",
          it.id,
          `更新小考：${it.name}`
        );


        alert(
          "已儲存；確認後新登記或解鎖修改的成績已重新鎖定。"
        );

      }catch(e){

        alert(
          `儲存失敗：${e.message}`
        );

      }

    }
  );

}


async function removeAssessment(

function dictLabel(
  list,
  v
){

  return(
    list.find(
      x=>
        x[0]===v
    )
    ||
    [
      v,
      v
    ]
  )[1];

}


async function ensureXLSX(){

  if(
    window.XLSX
  ){

    return;

  }


  await new Promise(
    (
      resolve,
      reject
    )=>{

      const s=
        document.createElement(
          "script"
        );


      s.src=
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";


      s.onload=
        resolve;


      s.onerror=
        ()=>reject(
          new Error(
            "Excel 元件載入失敗"
          )
        );


      document.head
        .appendChild(
          s
        );

    }
  );

}


async function downloadXlsx(
  filename,
  sheetName,
  rows
){

  try{

    await ensureXLSX();


    const ws=
      window.XLSX
        .utils
        .json_to_sheet(
          rows
        );


    const wb=
      window.XLSX
        .utils
        .book_new();


    window.XLSX
      .utils
      .book_append_sheet(
        wb,
        ws,
        sheetName
      );


    window.XLSX
      .writeFile(
        wb,
        filename
      );

  }catch(e){

    alert(
      e.message
    );

  }

}
