<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>804 偉大航道聯絡簿航海日誌</title>
    <!-- 設定瀏覽器分頁圖示為海賊旗 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏴‍☠️</text></svg>">
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Google 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0b1d3a; 
            background-image: linear-gradient(to bottom, #0b1d3a, #142850);
            font-family: 'Noto Sans TC', sans-serif;
            color: #f1f1f1;
            padding-top: 30px; 
            padding-bottom: 50px;
            min-height: 100vh;
        }
        h2, h4, .section-title {
            font-family: 'Cinzel', serif, 'Noto Sans TC', sans-serif;
            color: #f4d06f; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .card { 
            background-color: #1f3460;
            border: 2px solid #f4d06f;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
            color: #ffffff;
        }
        .form-control, .form-select {
            border-color: #f4d06f;
            background-color: #122244;
            color: #ffffff;
            cursor: pointer;
        }
        .form-control:focus, .form-select:focus {
            border-color: #ffd700;
            background-color: #122244;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(244, 208, 111, 0.25);
        }
        .form-select option {
            background-color: #122244;
            color: #ffffff;
        }
        .btn-gold {
            background-color: #f4d06f;
            border-color: #f4d06f;
            color: #112240;
            font-weight: bold;
        }
        .btn-gold:hover {
            background-color: #ffd700;
            border-color: #ffd700;
            color: #0b1d3a;
        }
        .section-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-left: 4px solid #f4d06f; 
            padding-left: 10px; 
            margin-bottom: 15px; 
        }
        .check-group {
            background: #162a53;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #2a437e;
            height: 100%;
        }
        .table {
            color: #ffffff;
        }
        .table-light {
            background-color: #122244 !important;
            color: #f4d06f !important;
        }
        .table-light th {
            background-color: #122244 !important;
            color: #f4d06f !important;
            border-color: #2a437e;
        }
        .table-hover tbody tr:hover {
            color: #ffffff;
            background-color: rgba(244, 208, 111, 0.1);
        }
        td, th {
            border-color: #2a437e !important;
        }
        .pirate-banner {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #f4d06f;
            text-transform: uppercase;
            border-bottom: 2px dashed #f4d06f;
            display: inline-block;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .quote-box {
            background: rgba(244, 208, 111, 0.1);
            border: 1px dashed #f4d06f;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #f4d06f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <div class="pirate-banner">🏴‍☠️ ONE PIECE • 804 偉大航道日誌 ⚓</div>
            <h2 class="fw-bold mt-2">✨ 804 班聯絡簿航海冒險系統</h2>
            <!-- 航海王經典金句提示區 -->
            <div class="quote-box mt-3 text-center" id="pirateQuote">
                🌊 「我是要成為航海王的男人！」—— 帶領 804 夥伴們突破每一天的挑戰！
            </div>
        </div>

        <!-- 輸入表單區塊 -->
        <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">📜 今日航行紀錄登記</h4>
                <!-- 一鍵全完成按鈕 -->
                <button type="button" class="btn btn-gold btn-sm" id="oneClickCompleteBtn">⚓ 夥伴全員順利（一鍵全勾）</button>
            </div>
            <form id="contactBookForm">
                <div class="row g-3">
                    <!-- 基本欄位：最上方的日期與夥伴選單 -->
                    <div class="col-md-6">
                        <label for="contactBookDate" class="form-label fw-bold text-warning">📅 航行日期選擇</label>
                        <input type="date" class="form-control" id="contactBookDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="contactBookStudentNo" class="form-label fw-bold text-warning">🏴‍☠️ 選擇夥伴（座號 / 姓名）</label>
                        <select class="form-select" id="contactBookStudentNo" required style="font-size: 1rem;">
                            <option value="">-- 請選擇夥伴座號與姓名 --</option>
                        </select>
                    </div>

                    <hr class="my-3" style="border-color: #2a437e;">

                    <!-- 各項勾選與檢核 -->
                    <div class="col-12">
                        <div class="section-title">各項冒險任務檢核 (1~7項)</div>
                        <div class="row g-3">
                            <!-- 1. 日期檢核 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">1. 日期</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookDateCheck" id="dateYes" value="完成" checked>
                                            <label class="form-check-label text-success" for="dateYes">完成</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookDateCheck" id="dateNo" value="未填/漏寫">
                                            <label class="form-check-label text-danger" for="dateNo">未完成</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. 考試、作業紀錄 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">2. 考試、作業紀錄</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookExamHw" id="examHwYes" value="完成/正常" checked>
                                            <label class="form-check-label text-success" for="examHwYes">完成</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookExamHw" id="examHwNo" value="未交/未完成">
                                            <label class="form-check-label text-danger" for="examHwNo">未交</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. 英文佳句抄寫 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">3. 英文佳句抄寫</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookEnglishCopy" id="engYes" value="已完成" checked>
                                            <label class="form-check-label text-success" for="engYes">完成</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookEnglishCopy" id="engNo" value="未完成">
                                            <label class="form-check-label text-danger" for="engNo">未完成</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 4. 文章重點摘要 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">4. 文章重點摘要</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookArticleSummary" id="sumYes" value="已完成" checked>
                                            <label class="form-check-label text-success" for="sumYes">完成</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookArticleSummary" id="sumNo" value="未完成">
                                            <label class="form-check-label text-danger" for="sumNo">未完成</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 5. 到校與返家時間 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">5. 到校與返家時間</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookTimeRecord" id="timeYes" value="正常" checked>
                                            <label class="form-check-label text-success" for="timeYes">正常</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookTimeRecord" id="timeNo" value="異常/遲到/請假">
                                            <label class="form-check-label text-danger" for="timeNo">異常</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 6. 生活札記 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">6. 生活札記</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookLifeNote" id="lifeYes" value="已寫" checked>
                                            <label class="form-check-label text-success" for="lifeYes">完成</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookLifeNote" id="lifeNo" value="未寫">
                                            <label class="form-check-label text-danger" for="lifeNo">未寫</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 7. 家長簽名 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">7. 家長簽名</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookParentSign" id="signYes" value="已簽名" checked>
                                            <label class="form-check-label text-success" for="signYes">已簽名</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookParentSign" id="signNo" value="未簽名">
                                            <label class="form-check-label text-danger" for="signNo">未簽名</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-gold px-5 py-2 fw-bold shadow-sm">紀錄此位夥伴狀況</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 紀錄檢視區塊 -->
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">🎯 需要關注的夥伴清單（已自動過濾全員完成者）</h4>
                <button class="btn btn-outline-light btn-sm" id="contactBookRefreshBtn">重新載入</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr style="font-size: 0.95rem;">
                            <th>日期</th>
                            <th>座號/姓名</th>
                            <th>1.日期</th>
                            <th>2.作業/考試</th>
                            <th>3.英文抄寫</th>
                            <th>4.文章摘要</th>
                            <th>5.時間狀況</th>
                            <th>6.生活札記</th>
                            <th>7.家長簽名</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="contactBookTableBody">
                        <tr><td colspan="10" class="text-center text-muted text-light">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 隨機航海王金句輪播
        const quotes = [
            "🌊 「我是要成為航海王的男人！」—— 帶領 804 夥伴們突破每一天的挑戰！",
            "⚔️ 「背後的傷疤是劍士的恥辱。」—— 培養 804 夥伴們的責任感與榮譽心！",
            "🍖 「我要吃肉！！」—— 記得督促夥伴們認真學習也要好好補充體力！",
            "🗺️ 「我的航海圖是完美的！」—— 804 班的每一天都在朝著夢想前進！"
        ];
        document.getElementById('pirateQuote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

        // 學生名條對照表 (804班)
        const contactBookStudents = {
            1: "王禹涵", 2: "江育緹", 3: "呂思儀", 4: "李詠祺", 
            5: "林子歆", 6: "林禹萱", 7: "張馨勻", 8: "陳昕樂", 
            9: "陳梓安", 10: "陳筠蓁", 11: "陳苙絜", 12: "楊錚諭", 
            13: "趙安諭", 14: "魏語潔", 15: "江靚恩", 16: "王洋振", 
            17: "吳昊丞", 18: "李祐誠", 19: "林宸陞", 20: "林維辰", 
            21: "林鈺棟", 22: "洪楷祥", 23: "陳兆楷", 24: "陳沂璟", 
            25: "黑肚・尤明", 26: "賴震宇", 27: "戴震龍", 28: "謝宇哲"
        };

        // 初始化下拉選單
        const contactBookStudentSelect = document.getElementById('contactBookStudentNo');
        for (let i = 1; i <= 28; i++) {
            let option = document.createElement('option');
            option.value = i;
            option.textContent = `${i} 號 - ${contactBookStudents[i]}`;
            contactBookStudentSelect.appendChild(option);
        }

        // ==========================================
        // 請在此處填入你從 Firebase 控制台取得的設定
        // ==========================================
        const contactBookFirebaseConfig = {
            apiKey: "AIzaSyBvzuDSKlNJUprlmnak5yV1hg1nlanP0yA",
            authDomain: "contactbook-543b0.firebaseapp.com",
            databaseURL: "https://contactbook-543b0-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "contactbook-543b0",
            storageBucket: "contactbook-543b0.appspot.com",
            messagingSenderId: "882240051516",
            appId: "1:882240051516:web:aefdaa20a8f4a3a8be6639"
        };

        firebase.initializeApp(contactBookFirebaseConfig);
        const contactBookDb = firebase.database();

        // 精準抓取裝置當地當天日期（避免時區誤差導致跳到前一天）
        const dateInput = document.getElementById('contactBookDate');
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${year}-${month}-${day}`;

        // 讓整個日期輸入框點擊任意位置都能直接叫出日曆選單
        dateInput.addEventListener('click', function() {
            if (typeof this.showPicker === 'function') {
                this.showPicker();
            }
        });

        // 一鍵全完成按鈕事件
        document.getElementById('oneClickCompleteBtn').addEventListener('click', function() {
            document.getElementById('dateYes').checked = true;
            document.getElementById('examHwYes').checked = true;
            document.getElementById('engYes').checked = true;
            document.getElementById('sumYes').checked = true;
            document.getElementById('timeYes').checked = true;
            document.getElementById('lifeYes').checked = true;
            document.getElementById('signYes').checked = true;
        });

        // 取得選取 Radio 按鈕值的輔助函式
        function getSelectedRadioValue(name) {
            const ele = document.querySelector(`input[name="${name}"]:checked`);
            return ele ? ele.value : '';
        }

        // 監聽表單送出
        document.getElementById('contactBookForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const studentNoVal = document.getElementById('contactBookStudentNo').value;
            if (!studentNoVal) {
                alert("請選擇夥伴座號與姓名！");
                return;
            }

            const currentDate = document.getElementById('contactBookDate').value;
            const parentSignVal = getSelectedRadioValue('contactBookParentSign');
            const studentNoNum = Number(studentNoVal);

            contactBookDb.ref('contact_book_records').orderByChild('timestamp').once('value', (snapshot) => {
                let existingRecords = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        existingRecords.push(childSnapshot.val());
                    });
                }

                let previousStreak = 0;
                let studentPastRecords = existingRecords
                    .filter(r => r.studentNo === studentNoNum)
                    .sort((a, b) => new Date(b.date) - new Date(a.date));

                if (parentSignVal === '未簽名') {
                    for (let r of studentPastRecords) {
                        if (r.parentSign === '未簽名') {
                            previousStreak = r.unsignedStreak || 1;
                            break;
                        } else if (r.parentSign === '已簽名') {
                            break;
                        }
                    }
                    previousStreak += 1;
                } else {
                    previousStreak = 0;
                }

                const contactBookRecordData = {
                    date: currentDate,
                    studentNo: studentNoNum,
                    studentName: contactBookStudents[studentNoVal],
                    dateCheck: getSelectedRadioValue('contactBookDateCheck'),
                    examHw: getSelectedRadioValue('contactBookExamHw'),
                    englishCopy: getSelectedRadioValue('contactBookEnglishCopy'),
                    articleSummary: getSelectedRadioValue('contactBookArticleSummary'),
                    timeRecord: getSelectedRadioValue('contactBookTimeRecord'),
                    lifeNote: getSelectedRadioValue('contactBookLifeNote'),
                    parentSign: parentSignVal,
                    unsignedStreak: previousStreak,
                    timestamp: Date.now()
                };

                contactBookDb.ref('contact_book_records').push(contactBookRecordData, function(error) {
                    if (error) {
                        alert("儲存失敗：" + error.message);
                    } else {
                        document.getElementById('contactBookStudentNo').value = '';
                        document.getElementById('oneClickCompleteBtn').click(); 
                        document.getElementById('contactBookStudentNo').focus();
                        loadContactBookRecords();
                    }
                });
            });
        });

        // 載入紀錄函數
        function loadContactBookRecords() {
            const tbody = document.getElementById('contactBookTableBody');
            contactBookDb.ref('contact_book_records').orderByChild('timestamp').limitToLast(150).once('value', (snapshot) => {
                tbody.innerHTML = '';
                if (!snapshot.exists()) {
                    tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted">目前沒有任何夥伴紀錄</td></tr>`;
                    return;
                }

                let records = [];
                snapshot.forEach((childSnapshot) => {
                    let item = childSnapshot.val();
                    item.id = childSnapshot.key;
                    records.push(item);
                });

                records.reverse();

                let filteredRecords = records.filter(item => {
                    let isAllComplete = 
                        (item.dateCheck === '完成' || !item.dateCheck) &&
                        (item.examHw === '完成/正常' || item.examHw === '已完成') &&
                        item.englishCopy === '已完成' &&
                        item.articleSummary === '已完成' &&
                        item.timeRecord === '正常' &&
                        (item.lifeNote === '已寫' || !item.lifeNote) &&
                        item.parentSign === '已簽名';
                    
                    return !isAllComplete; 
                });

                if (filteredRecords.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" class="text-center text-warning">🏴‍☠️ 航海大成功！目前所有已登記的 804 夥伴皆完美通關，無任何異常！</td></tr>`;
                    return;
                }

                filteredRecords.forEach((item) => {
                    let name = contactBookStudents[item.studentNo] || item.studentName || '';
                    
                    let signDisplay = item.parentSign;
                    let streak = item.unsignedStreak || 1;
                    
                    if (item.parentSign === '未簽名') {
                        if (streak > 1) {
                            signDisplay = `<span class="badge bg-danger">❌ 未簽名 (已連續 ${streak} 天)</span>`;
                        } else {
                            signDisplay = `<span class="badge bg-warning text-dark">❌ 未簽名 (連續 1 天)</span>`;
                        }
                    } else {
                        signDisplay = `<span class="badge bg-success">已簽名</span>`;
                    }

                    function renderStatus(val) {
                        if (!val || val.includes('未') || val.includes('異常') || val.includes('漏寫')) {
                            return `<span class="text-danger fw-bold">✕ ${val || '未完成'}</span>`;
                        }
                        return `<span class="text-success">✓ ${val}</span>`;
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.date}</td>
                        <td><strong>${item.studentNo} 號<br>${name}</strong></td>
                        <td>${renderStatus(item.dateCheck)}</td>
                        <td>${renderStatus(item.examHw)}</td>
                        <td>${renderStatus(item.englishCopy)}</td>
                        <td>${renderStatus(item.articleSummary)}</td>
                        <td>${renderStatus(item.timeRecord)}</td>
                        <td>${renderStatus(item.lifeNote)}</td>
                        <td>${signDisplay}</td>
                        <td><button class="btn btn-outline-danger btn-sm" onclick="deleteContactBookRecord('${item.id}')">刪除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        window.deleteContactBookRecord = function(id) {
            if (confirm("確定要刪除這筆航行紀錄嗎？")) {
                contactBookDb.ref('contact_book_records/' + id).remove().then(() => {
                    loadContactBookRecords();
                });
            }
        }

        document.getElementById('contactBookRefreshBtn').addEventListener('click', loadContactBookRecords);

        loadContactBookRecords();
    </script>
</body>
</html>
