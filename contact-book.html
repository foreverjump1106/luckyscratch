<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>804班春風化雨聯絡簿批閱系統</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Google 字型（更有溫潤感） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #fcfaf2; /* 溫馨米色調 */
            font-family: 'Noto Sans TC', sans-serif;
            color: #4a403a;
            padding-top: 30px; 
            padding-bottom: 50px;
        }
        h2, h4, .section-title {
            font-family: 'Noto Serif TC', serif;
            color: #5c4b37;
        }
        .card { 
            background-color: #ffffff;
            border: 1px solid #e6dec9;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(120, 100, 80, 0.06); 
        }
        .form-control, .form-select {
            border-color: #dcd0bc;
            background-color: #fdfbf7;
        }
        .form-control:focus, .form-select:focus {
            border-color: #8c7355;
            box-shadow: 0 0 0 0.25rem rgba(140, 115, 85, 0.15);
        }
        .btn-primary {
            background-color: #705b43;
            border-color: #705b43;
        }
        .btn-primary:hover {
            background-color: #584632;
            border-color: #584632;
        }
        .section-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-left: 4px solid #a38a6d; 
            padding-left: 10px; 
            margin-bottom: 15px; 
            color: #6b533d;
        }
        .check-group {
            background: #f7f4ed;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #ede7db;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="fw-bold">🌱 804 班春風化雨聯絡簿批閱系統</h2>
            <p class="text-muted" style="font-family: 'Noto Serif TC', serif;">細心呵護每一位孩子的成長點滴</p>
        </div>

        <!-- 輸入表單區塊 -->
        <div class="card p-4 mb-4">
            <h4 class="mb-3">每日批閱快速登記</h4>
            <form id="contactBookForm">
                <div class="row g-3">
                    <!-- 基本欄位：日期與座號 -->
                    <div class="col-md-6">
                        <label for="contactBookDate" class="form-label fw-bold">1. 日期</label>
                        <input type="date" class="form-control" id="contactBookDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="contactBookStudentNo" class="form-label fw-bold">選擇學生（座號 / 姓名）</label>
                        <select class="form-select form-select-lg" id="contactBookStudentNo" required style="font-size: 1rem;">
                            <option value="">-- 請點擊選擇學生 --</option>
                        </select>
                    </div>

                    <hr class="my-3" style="border-color: #ede7db;">

                    <!-- 各項勾選與檢核 -->
                    <div class="col-12">
                        <div class="section-title">各項學習與生活狀況勾選</div>
                        <div class="row g-3">
                            <!-- 2. 考試、作業紀錄 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">2. 考試、作業紀錄</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookExamHw" id="examHwYes" value="完成/正常" checked>
                                            <label class="form-check-label" for="examHwYes">有 (完成)</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookExamHw" id="examHwNo" value="未交/未完成">
                                            <label class="form-check-label text-danger" for="examHwNo">無 (未交)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. 英文佳句抄寫 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">3. 英文佳句抄寫</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookEnglishCopy" id="engYes" value="已完成" checked>
                                            <label class="form-check-label" for="engYes">有 (完成)</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookEnglishCopy" id="engNo" value="未完成">
                                            <label class="form-check-label text-danger" for="engNo">無 (未完成)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 4. 文章重點摘要 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">4. 文章重點摘要</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookArticleSummary" id="sumYes" value="已完成" checked>
                                            <label class="form-check-label" for="sumYes">有 (完成)</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookArticleSummary" id="sumNo" value="未完成">
                                            <label class="form-check-label text-danger" for="sumNo">無 (未完成)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 5. 到校與返家時間 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">5. 到校與返家時間</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookTimeRecord" id="timeYes" value="正常" checked>
                                            <label class="form-check-label" for="timeYes">正常</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookTimeRecord" id="timeNo" value="異常/遲到/請假">
                                            <label class="form-check-label text-danger" for="timeNo">異常 (遲到/早退)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 6. 生活札記 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">6. 生活札記</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookLifeNote" id="lifeYes" value="已寫" checked>
                                            <label class="form-check-label" for="lifeYes">有 (完成)</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookLifeNote" id="lifeNo" value="未寫">
                                            <label class="form-check-label text-danger" for="lifeNo">無 (未寫)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 7. 家長簽名 -->
                            <div class="col-md-4">
                                <div class="check-group">
                                    <label class="form-label fw-bold mb-2">7. 家長簽名</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookParentSign" id="signYes" value="已簽名" checked>
                                            <label class="form-check-label" for="signYes">有 (已簽)</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="contactBookParentSign" id="signNo" value="未簽名">
                                            <label class="form-check-label text-danger" for="signNo">無 (未簽)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">儲存此筆紀錄</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 紀錄檢視區塊 -->
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">批閱清單與未簽名追蹤</h4>
                <button class="btn btn-outline-secondary btn-sm" id="contactBookRefreshBtn">重新載入</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr style="font-size: 0.95rem;">
                            <th>日期</th>
                            <th>座號/姓名</th>
                            <th>作業/考試</th>
                            <th>英文抄寫</th>
                            <th>文章摘要</th>
                            <th>時間狀況</th>
                            <th>生活札記</th>
                            <th>家長簽名狀況</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="contactBookTableBody">
                        <tr><td colspan="9" class="text-center text-muted">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 學生名條對照表
        const contactBookStudents = {
            1: "王禹涵", 2: "江育緹", 3: "呂思儀", 4: "李詠祺", 
            5: "林子歆", 6: "林禹萱", 7: "張馨勻", 8: "陳昕樂", 
            9: "陳梓安", 10: "陳筠蓁", 11: "陳苙絜", 12: "楊錚諭", 
            13: "趙安諭", 14: "魏語潔", 15: "江靚恩", 16: "王洋振", 
            17: "吳昊丞", 18: "李祐誠", 19: "林宸陞", 20: "林維辰", 
            21: "林鈺棟", 22: "洪楷祥", 23: "陳兆楷", 24: "陳沂璟", 
            25: "黑肚・尤明", 26: "賴震宇", 27: "戴震龍", 28: "謝宇哲"
        };

        // 初始化下拉選單
        const contactBookStudentSelect = document.getElementById('contactBookStudentNo');
        for (let i = 1; i <= 28; i++) {
            let option = document.createElement('option');
            option.value = i;
            option.textContent = `${i} 號 - ${contactBookStudents[i]}`;
            contactBookStudentSelect.appendChild(option);
        }

        // ==========================================
        // 請在此處填入你從 Firebase 控制台取得的設定
        // ==========================================
        const contactBookFirebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(contactBookFirebaseConfig);
        const contactBookDb = firebase.database();

        // 自動填入今天日期
        document.getElementById('contactBookDate').valueAsDate = new Date();

        // 取得選取 Radio 按鈕值的輔助函式
        function getSelectedRadioValue(name) {
            const ele = document.querySelector(`input[name="${name}"]:checked`);
            return ele ? ele.value : '';
        }

        // 監聽表單送出
        document.getElementById('contactBookForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const studentNoVal = document.getElementById('contactBookStudentNo').value;
            if (!studentNoVal) {
                alert("請選擇學生座號與姓名！");
                return;
            }

            const contactBookRecordData = {
                date: document.getElementById('contactBookDate').value,
                studentNo: Number(studentNoVal),
                studentName: contactBookStudents[studentNoVal],
                examHw: getSelectedRadioValue('contactBookExamHw'),
                englishCopy: getSelectedRadioValue('contactBookEnglishCopy'),
                articleSummary: getSelectedRadioValue('contactBookArticleSummary'),
                timeRecord: getSelectedRadioValue('contactBookTimeRecord'),
                lifeNote: getSelectedRadioValue('contactBookLifeNote'),
                parentSign: getSelectedRadioValue('contactBookParentSign'),
                timestamp: Date.now()
            };

            contactBookDb.ref('contact_book_records').push(contactBookRecordData, function(error) {
                if (error) {
                    alert("儲存失敗：" + error.message);
                } else {
                    // 重設部分欄位保留日期，座號清空並聚焦方便連續輸入
                    document.getElementById('contactBookStudentNo').value = '';
                    document.getElementById('contactBookStudentNo').focus();
                    loadContactBookRecords();
                }
            });
        });

        // 計算連續未簽名天數的輔助函數
        function calculateContactBookUnsignedStreak(allRecords, currentStudentNo, currentDate) {
            let studentRecords = allRecords
                .filter(r => r.studentNo === currentStudentNo && r.date <= currentDate)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            let count = 0;
            for (let r of studentRecords) {
                if (r.parentSign === '未簽名') {
                    count++;
                } else {
                    break; 
                }
            }
            return count;
        }

        // 載入紀錄函數
        function loadContactBookRecords() {
            const tbody = document.getElementById('contactBookTableBody');
            contactBookDb.ref('contact_book_records').orderByChild('timestamp').limitToLast(100).once('value', (snapshot) => {
                tbody.innerHTML = '';
                if (!snapshot.exists()) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">目前沒有任何聯絡簿紀錄</td></tr>`;
                    return;
                }

                let records = [];
                snapshot.forEach((childSnapshot) => {
                    let item = childSnapshot.val();
                    item.id = childSnapshot.key;
                    records.push(item);
                });

                records.reverse();

                records.forEach((item) => {
                    let name = contactBookStudents[item.studentNo] || item.studentName || '';
                    
                    let unsignedStreak = 0;
                    if (item.parentSign === '未簽名') {
                        unsignedStreak = calculateContactBookUnsignedStreak(records, item.studentNo, item.date);
                    }

                    let signDisplay = item.parentSign;
                    if (unsignedStreak > 1) {
                        signDisplay = `<span class="badge bg-danger">❌ 未簽名 (已連續 ${unsignedStreak} 天)</span>`;
                    } else if (item.parentSign === '未簽名') {
                        signDisplay = `<span class="badge bg-warning text-dark">❌ 未簽名 (連續 1 天)</span>`;
                    } else {
                        signDisplay = `<span class="badge bg-success">已簽名</span>`;
                    }

                    // 簡易標籤呈現函式
                    function renderStatus(val) {
                        if (val.includes('未') || val.includes('異常')) {
                            return `<span class="text-danger fw-bold">✕ ${val}</span>`;
                        }
                        return `<span class="text-success">✓ ${val}</span>`;
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.date}</td>
                        <td><strong>${item.studentNo} 號<br>${name}</strong></td>
                        <td>${renderStatus(item.examHw)}</td>
                        <td>${renderStatus(item.englishCopy)}</td>
                        <td>${renderStatus(item.articleSummary)}</td>
                        <td>${renderStatus(item.timeRecord)}</td>
                        <td>${renderStatus(item.lifeNote)}</td>
                        <td>${signDisplay}</td>
                        <td><button class="btn btn-outline-danger btn-sm" onclick="deleteContactBookRecord('${item.id}')">刪除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        window.deleteContactBookRecord = function(id) {
            if (confirm("確定要刪除這筆聯絡簿紀錄嗎？")) {
                contactBookDb.ref('contact_book_records/' + id).remove().then(() => {
                    loadContactBookRecords();
                });
            }
        }

        document.getElementById('contactBookRefreshBtn').addEventListener('click', loadContactBookRecords);

        loadContactBookRecords();
    </script>
</body>
</html>
