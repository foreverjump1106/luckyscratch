<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>班級幸運刮刮樂</title>

  <style>
    :root {
      --navy: #23395d;
      --navy2: #35558a;
      --navy3: #4e6fae;

      --purple: #625ca8;
      --purple-dark: #48427f;

      --gold: #f2c75c;
      --gold2: #ffdf86;
      --gold-dark: #c99827;

      --cream: #fff9e9;
      --cream2: #f8edcf;

      --text: #3d3629;
      --brown: #72521e;

      --shadow:
        0 16px 38px
        rgba(43, 47, 75, 0.20);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 12% 18%,
          rgba(255,255,255,.85) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 84% 30%,
          rgba(255,255,255,.75) 0 2px,
          transparent 3px
        ),
        linear-gradient(
          145deg,
          #fffaf0,
          #efe4c6
        );

      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1280px, 100%);
      margin: auto;
      padding: 18px 14px 40px;
      text-align: center;
    }

    h1 {
      margin: 4px 0 6px;

      font-size:
        clamp(
          30px,
          6vw,
          56px
        );

      color: var(--navy);

      text-shadow:
        0 3px 0 white,
        0 6px 14px
        rgba(60, 55, 90, .14);
    }

    .subtitle {
      margin: 0 auto 14px;

      font-size:
        clamp(
          15px,
          2.4vw,
          20px
        );

      font-weight: 800;

      color: #72531c;
    }

    /* =========================
       資訊列
    ========================= */

    .info-bar {
      width: min(760px, 100%);
      margin: 0 auto 16px;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;
    }

    .info-chip {
      padding: 8px 16px;

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      border:
        2px solid
        rgba(
          218,
          177,
          74,
          .4
        );

      box-shadow:
        0 5px 14px
        rgba(
          80,
          60,
          20,
          .08
        );

      font-size: 14px;

      font-weight: 900;

      color: #644918;
    }

    .info-chip strong {
      color: var(--navy);
      font-size: 17px;
    }

    /* =========================
       主舞台
    ========================= */

    .stage {
      position: relative;

      min-height: 560px;

      padding: 24px;

      border-radius: 30px;

      border:
        3px solid
        rgba(
          175,
          137,
          51,
          .13
        );

      background:
        rgba(
          255,
          255,
          255,
          .5
        );

      box-shadow:
        inset
        0 0 50px
        rgba(
          255,
          255,
          255,
          .75
        ),
        var(--shadow);

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stage.dealing-stage {
      align-items: flex-start;
      overflow: visible;
    }

    .hint {
      min-height: 30px;

      margin: 16px 0 12px;

      font-size:
        clamp(
          16px,
          2.5vw,
          20px
        );

      font-weight: 900;

      color: #72521e;
    }

    /* =========================
       按鈕
    ========================= */

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 13px;

      margin-top: 8px;
    }

    .btn {
      border: 0;

      border-radius: 999px;

      padding: 14px 28px;

      font-size:
        clamp(
          16px,
          2.3vw,
          19px
        );

      font-weight: 1000;

      cursor: pointer;

      color: white;

      background:
        linear-gradient(
          #4f70ab,
          var(--navy)
        );

      box-shadow:
        0 7px 0 #172844,
        0 12px 20px
        rgba(
          41,
          45,
          76,
          .18
        );

      transition:
        .15s transform,
        .15s opacity,
        .15s box-shadow;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #172844,
        0 6px 12px
        rgba(
          41,
          45,
          76,
          .15
        );
    }

    .btn.gold {
      color: #62450f;

      background:
        linear-gradient(
          #ffe28b,
          #efb943
        );

      box-shadow:
        0 7px 0 #b9841d,
        0 12px 20px
        rgba(
          80,
          55,
          10,
          .16
        );
    }

    .btn.purple {
      background:
        linear-gradient(
          #8078ca,
          var(--purple)
        );

      box-shadow:
        0 7px 0
        var(--purple-dark),
        0 12px 20px
        rgba(
          60,
          50,
          100,
          .16
        );
    }

    .btn.small {
      padding: 10px 18px;
      font-size: 14px;
    }

    .btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       卡片共用樣式
    ========================= */

    .ticket-face {
      width: 100%;
      height: 100%;

      position: relative;

      overflow: hidden;

      border-radius: inherit;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #fff6cf;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 18% 84%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 82% 82%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        linear-gradient(
          155deg,
          #6079b8,
          #394f88 55%,
          #292d5f
        );

      border:
        3px solid
        var(--gold);
    }

    .ticket-face::before,
    .ticket-face::after {
      content: "✦";

      position: absolute;

      font-size: 60px;

      color:
        rgba(
          255,
          229,
          132,
          .22
        );

      pointer-events: none;
    }

    .ticket-face::before {
      left: 12px;
      top: 12px;
    }

    .ticket-face::after {
      right: 12px;
      bottom: 12px;
    }

    .ticket-icon {
      font-size:
        clamp(
          46px,
          7vw,
          72px
        );

      line-height: 1;

      margin-bottom: 9px;
    }

    .ticket-title {
      font-size:
        clamp(
          20px,
          3.6vw,
          34px
        );

      font-weight: 1000;

      line-height: 1.12;

      letter-spacing: 3px;

      text-shadow:
        0 3px 0
        rgba(
          30,
          35,
          70,
          .5
        );
    }

    .ticket-text {
      margin-top: 10px;

      font-size:
        clamp(
          10px,
          1.8vw,
          14px
        );

      font-weight: 900;

      letter-spacing: 2px;
    }

    /* =====================================================
       初始牌堆
    ===================================================== */

    .deck {
      position: relative;

      width:
        min(
          280px,
          68vw
        );

      aspect-ratio: 2 / 3;

      perspective: 1400px;
    }

    .deck-card {
      position: absolute;
      inset: 0;

      border-radius: 22px;

      background: white;

      border:
        5px solid white;

      box-shadow:
        0 11px 25px
        rgba(
          53,
          45,
          80,
          .23
        );

      transform-origin:
        center bottom;
    }

    .deck-card:nth-child(1) {
      transform:
        translate(-22px,12px)
        rotate(-7deg);
    }

    .deck-card:nth-child(2) {
      transform:
        translate(-15px,8px)
        rotate(-5deg);
    }

    .deck-card:nth-child(3) {
      transform:
        translate(-9px,5px)
        rotate(-3deg);
    }

    .deck-card:nth-child(4) {
      transform:
        translate(-3px,2px)
        rotate(-1deg);
    }

    .deck-card:nth-child(5) {
      transform:
        translate(3px,2px)
        rotate(1deg);
    }

    .deck-card:nth-child(6) {
      transform:
        translate(9px,5px)
        rotate(3deg);
    }

    .deck-card:nth-child(7) {
      transform:
        translate(15px,8px)
        rotate(5deg);
    }

    .deck-card:nth-child(8) {
      transform:
        translate(22px,12px)
        rotate(7deg);
    }

    /* =====================================================
       真人式上下洗牌動畫
    ===================================================== */

    .shuffle-table {
      position: relative;

      width: 520px;
      height: 480px;

      display: flex;
      align-items: center;
      justify-content: center;

      perspective: 1200px;
    }

    .hand {
      position: absolute;

      width: 110px;
      height: 145px;

      border-radius: 50% 50% 44% 44%;

      background:
        linear-gradient(
          160deg,
          #f4c7a6,
          #dca47e
        );

      opacity: .92;

      filter:
        drop-shadow(
          0 10px 15px
          rgba(
            65,
            40,
            20,
            .15
          )
        );

      z-index: 30;
    }

    .hand.left {
      left: 52px;
      top: 150px;

      transform:
        rotate(18deg);

      animation:
        leftHandMove
        1.8s
        ease-in-out
        infinite;
    }

    .hand.right {
      right: 52px;
      top: 118px;

      transform:
        rotate(-18deg);

      animation:
        rightHandMove
        1.8s
        ease-in-out
        infinite;
    }

    .hand::after {
      content: "";

      position: absolute;

      width: 45px;
      height: 120px;

      border-radius: 40px;

      background:
        inherit;

      top: -37px;
      left: 33px;
    }

    @keyframes leftHandMove {
      0%,
      100% {
        transform:
          translateY(12px)
          rotate(18deg);
      }

      50% {
        transform:
          translateY(-10px)
          rotate(15deg);
      }
    }

    @keyframes rightHandMove {
      0%,
      100% {
        transform:
          translateY(-8px)
          rotate(-18deg);
      }

      50% {
        transform:
          translateY(12px)
          rotate(-15deg);
      }
    }

    .shuffle-pile {
      position: absolute;

      width: 180px;
      height: 270px;

      border-radius: 18px;

      border:
        5px solid white;

      background: white;

      box-shadow:
        0 13px 28px
        rgba(
          43,
          42,
          72,
          .23
        );
    }

    .shuffle-pile.top-pile {
      top: 42px;
      left: 170px;

      transform:
        rotate(-6deg);

      animation:
        upperPileMove
        1.2s
        ease-in-out
        infinite;
    }

    .shuffle-pile.bottom-pile {
      top: 165px;
      left: 185px;

      transform:
        rotate(5deg);

      animation:
        lowerPileMove
        1.2s
        ease-in-out
        infinite;
    }

    @keyframes upperPileMove {
      0%,
      100% {
        transform:
          translateY(-8px)
          rotate(-6deg);
      }

      50% {
        transform:
          translateY(12px)
          rotate(-3deg);
      }
    }

    @keyframes lowerPileMove {
      0%,
      100% {
        transform:
          translateY(7px)
          rotate(5deg);
      }

      50% {
        transform:
          translateY(-8px)
          rotate(3deg);
      }
    }

    .shuffle-packet {
      position: absolute;

      width: 168px;
      height: 252px;

      border-radius: 17px;

      border:
        4px solid white;

      background: white;

      box-shadow:
        0 9px 18px
        rgba(
          40,
          35,
          70,
          .18
        );

      z-index: 15;

      opacity: 0;
    }

    .shuffle-packet.packet1 {
      animation:
        packetDrop1
        1.8s
        ease-in-out
        infinite;
    }

    .shuffle-packet.packet2 {
      animation:
        packetDrop2
        1.8s
        ease-in-out
        infinite;
    }

    .shuffle-packet.packet3 {
      animation:
        packetDrop3
        1.8s
        ease-in-out
        infinite;
    }

    .shuffle-packet.packet4 {
      animation:
        packetDrop4
        1.8s
        ease-in-out
        infinite;
    }

    .shuffle-packet.packet5 {
      animation:
        packetDrop5
        1.8s
        ease-in-out
        infinite;
    }

    @keyframes packetDrop1 {
      0% {
        opacity: 0;
        transform:
          translate(30px,-95px)
          rotate(-5deg)
          scale(.98);
      }

      10% {
        opacity: 1;
      }

      34% {
        opacity: 1;

        transform:
          translate(2px,35px)
          rotate(2deg)
          scale(.99);
      }

      40%,
      100% {
        opacity: 0;
      }
    }

    @keyframes packetDrop2 {
      0%,
      18% {
        opacity: 0;

        transform:
          translate(22px,-86px)
          rotate(-3deg);
      }

      26% {
        opacity: 1;
      }

      48% {
        opacity: 1;

        transform:
          translate(-2px,48px)
          rotate(1deg);
      }

      54%,
      100% {
        opacity: 0;
      }
    }

    @keyframes packetDrop3 {
      0%,
      33% {
        opacity: 0;

        transform:
          translate(18px,-80px)
          rotate(-3deg);
      }

      41% {
        opacity: 1;
      }

      63% {
        opacity: 1;

        transform:
          translate(0,56px)
          rotate(2deg);
      }

      69%,
      100% {
        opacity: 0;
      }
    }

    @keyframes packetDrop4 {
      0%,
      48% {
        opacity: 0;

        transform:
          translate(15px,-78px)
          rotate(-2deg);
      }

      56% {
        opacity: 1;
      }

      78% {
        opacity: 1;

        transform:
          translate(-3px,64px)
          rotate(1deg);
      }

      84%,
      100% {
        opacity: 0;
      }
    }

    @keyframes packetDrop5 {
      0%,
      63% {
        opacity: 0;

        transform:
          translate(12px,-74px)
          rotate(-1deg);
      }

      71% {
        opacity: 1;
      }

      93% {
        opacity: 1;

        transform:
          translate(0,70px)
          rotate(1deg);
      }

      100% {
        opacity: 0;
      }
    }

    .shuffle-label {
      position: absolute;

      bottom: 5px;

      width: 100%;

      font-size: 19px;

      font-weight: 1000;

      color: var(--navy);

      letter-spacing: 2px;

      animation:
        labelPulse
        .9s
        ease-in-out
        infinite
        alternate;
    }

    @keyframes labelPulse {
      to {
        transform: scale(1.05);
        opacity: .65;
      }
    }

    /* =====================================================
       全部牌攤開
    ===================================================== */

    .all-cards-area {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            115px,
            1fr
          )
        );

      gap:
        18px
        13px;

      padding:
        18px 8px 30px;
    }

    .all-card {
      position: relative;

      width: 100%;

      max-width: 145px;

      aspect-ratio:
        2 / 3;

      margin: auto;

      border-radius: 16px;

      border:
        4px solid white;

      background: white;

      box-shadow:
        0 9px 18px
        rgba(
          46,
          40,
          76,
          .18
        );

      cursor: pointer;

      overflow: hidden;

      transition:
        .22s transform,
        .22s box-shadow,
        .22s filter,
        .22s opacity;

      animation:
        dealAllCards
        .5s
        cubic-bezier(
          .2,
          .8,
          .2,
          1
        )
        both;
    }

    .all-card:hover,
    .all-card:active {
      z-index: 20;

      transform:
        translateY(-10px)
        scale(1.06);

      box-shadow:
        0 16px 30px
        rgba(
          46,
          40,
          76,
          .25
        );

      filter:
        brightness(1.08);
    }

    @keyframes dealAllCards {
      from {
        opacity: 0;

        transform:
          translateY(45px)
          scale(.8);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    .all-card-number {
      position: absolute;

      top: 6px;
      right: 7px;

      z-index: 5;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        rgba(
          255,
          255,
          255,
          .88
        );

      color: var(--navy);

      font-size: 12px;

      font-weight: 1000;

      box-shadow:
        0 3px 8px
        rgba(
          20,
          25,
          60,
          .15
        );
    }

    /* =========================
       刮刮樂本體
    ========================= */

    .scratch-wrap {
      width:
        min(
          450px,
          92vw
        );

      animation:
        popIn
        .45s
        ease
        both;
    }

    @keyframes popIn {
      from {
        opacity: 0;

        transform:
          translateY(45px)
          scale(.72);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .scratch-ticket {
      position: relative;

      width: 100%;

      aspect-ratio:
        3 / 4;

      padding: 15px;

      overflow: hidden;

      border-radius: 28px;

      border:
        7px solid
        var(--gold2);

      background:
        linear-gradient(
          145deg,
          #536fae,
          #344d86 55%,
          #3c376f
        );

      box-shadow:
        0 18px 38px
        rgba(
          45,
          42,
          75,
          .28
        );
    }

    .scratch-ticket::before {
      content: "";

      position: absolute;
      inset: 8px;

      border:
        2px dashed
        rgba(
          255,
          223,
          118,
          .75
        );

      border-radius: 18px;

      pointer-events: none;
    }

    .ticket-top {
      height: 31%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #fff7d5;

      position: relative;

      z-index: 2;
    }

    .ticket-top .icon {
      font-size: 58px;
      line-height: 1;
    }

    .ticket-top .title {
      margin-top: 4px;

      font-size:
        clamp(
          29px,
          7vw,
          41px
        );

      font-weight: 1000;

      letter-spacing: 4px;

      text-shadow:
        0 3px 0
        rgba(
          35,
          35,
          70,
          .5
        );
    }

    .ticket-top .eng {
      margin-top: 5px;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 2px;
    }

    .scratch-area {
      position: relative;

      width: 100%;

      height: 56%;

      margin: 0;

      overflow: hidden;

      border-radius: 18px;

      border:
        4px solid
        var(--gold);

      background: #fff8dc;

      touch-action: none;
    }

    .prize-under {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      padding: 15px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #fffef9,
          #f7e9bb
        );
    }

    .prize-under.silver-card {
      background:
        radial-gradient(
          circle at center,
          #ffffff,
          #dfe5ec
        );
    }

    .prize-under.try-again {
      background:
        radial-gradient(
          circle at center,
          #fffaf8,
          #e4dcff
        );
    }

    .prize-under.no-prize {
      background:
        radial-gradient(
          circle at center,
          #fffef7,
          #e9eadf
        );
    }

    .prize-icon {
      font-size:
        clamp(
          58px,
          13vw,
          78px
        );

      line-height: 1;

      margin-bottom: 7px;
    }

    .prize-name {
      color: var(--navy);

      font-size:
        clamp(
          24px,
          5.5vw,
          33px
        );

      font-weight: 1000;

      line-height: 1.2;
    }

    .prize-description {
      margin-top: 7px;

      max-width: 95%;

      color: #72521b;

      font-size:
        clamp(
          14px,
          3.5vw,
          17px
        );

      font-weight: 900;

      line-height: 1.45;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;

      width: 100% !important;
      height: 100% !important;

      display: block;

      cursor: crosshair;

      touch-action: none;
    }

    .bottom-note {
      height: 13%;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      z-index: 2;

      color: #fff7d3;

      font-size:
        clamp(
          13px,
          3vw,
          16px
        );

      font-weight: 900;

      text-align: center;
    }

    .result {
      min-height: 44px;

      margin-top: 15px;

      color: var(--navy);

      font-size:
        clamp(
          18px,
          4vw,
          24px
        );

      font-weight: 1000;
    }

    /* =========================
       獎項明細
    ========================= */

    .prize-list {
      width: min(720px, 100%);

      margin:
        24px auto 0;

      padding: 18px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      border:
        2px solid
        rgba(
          205,
          163,
          58,
          .2
        );

      box-shadow:
        0 10px 25px
        rgba(
          70,
          55,
          20,
          .08
        );
    }

    .prize-list h2 {
      margin:
        0 0 13px;

      color: var(--navy);

      font-size: 21px;
    }

    .prize-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 8px;
    }

    .prize-item {
      padding:
        9px 11px;

      border-radius: 13px;

      background: #fffaf0;

      border:
        1px solid
        rgba(
          192,
          145,
          34,
          .15
        );

      font-size: 14px;

      font-weight: 800;

      text-align: left;
    }

    .prize-item strong {
      color: var(--navy);
    }

    /* =========================
       慶祝動畫
    ========================= */

    .confetti {
      position: fixed;

      left: 50%;
      top: 45%;

      z-index: 999;

      font-size: 31px;

      pointer-events: none;

      animation:
        burst
        1.25s
        ease-out
        forwards;
    }

    @keyframes burst {
      to {
        transform:
          translate(
            var(--x),
            var(--y)
          )
          rotate(560deg);

        opacity: 0;
      }
    }

    /* =========================
       獎池清空
    ========================= */

    .empty-box {
      padding: 35px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      color: var(--navy);

      font-weight: 900;

      font-size: 22px;
    }

    .empty-icon {
      font-size: 70px;
      margin-bottom: 14px;
    }

    /* =========================
       手機平板
    ========================= */

    @media (max-width: 850px) {

      .stage {
        min-height: 520px;
        padding: 12px 8px;
      }

      .shuffle-table {
        transform: scale(.82);
      }

      .all-cards-area {
        grid-template-columns:
          repeat(
            auto-fit,
            minmax(
              92px,
              1fr
            )
          );

        gap:
          12px
          8px;
      }

      .all-card {
        max-width: 120px;
      }

    }

    @media (max-width: 620px) {

      .shuffle-table {
        transform: scale(.68);
      }

      .all-cards-area {
        grid-template-columns:
          repeat(
            4,
            1fr
          );

        gap: 8px;
      }

      .all-card {
        max-width: 100px;
      }

      .ticket-title {
        font-size: 14px;
        letter-spacing: 1px;
      }

      .ticket-icon {
        font-size: 30px;
      }

      .ticket-text {
        font-size: 8px;
      }

      .prize-grid {
        grid-template-columns:
          1fr;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <h1>

    </h1>

    <p class="subtitle">

    <div class="info-bar">

      <div class="info-chip">

        張

      <div class="info-chip">

        張
      </div>

      <div class="info-chip">

        張

    <div class="controls">

      <button

      <button

      >

      </button>

    </div>

    <div class="prize-list">

      <h2>
        🎁 本次刮刮樂獎項
      </h2>

      <div class="prize-grid">

        <div class="prize-item">
          💰
          <strong>30 元</strong>
          × 1
        </div>

        <div class="prize-item">
          📚✨
          <strong>3 張免寫卷</strong>
          × 2
        </div>

        <div class="prize-item">
          📝
          <strong>1 張免寫卷</strong>
          × 3
        </div>

        <div class="prize-item">
          🖊️📒
          <strong>文具 A</strong>
          × 4
          <br>
          藍黑筆、立可帶、筆記本
        </div>

        <div class="prize-item">
          ✏️📏
          <strong>文具 B</strong>
          × 4
          <br>
          自動筆、橡皮擦、直尺
        </div>

        <div class="prize-item">
          🍪
          <strong>小餅乾 1 份</strong>
          × 8
        </div>

        <div class="prize-item">

          <strong>再抽一次</strong>

        </div>

          <br>

          <strong>再接再厲</strong>

      </div>

    </div>

  </main>

  <script>

    const PRIZE_DEFINITIONS = [

      {
        id: "cash30",
        name: "30 元",
        icon: "💰",
        description: "恭喜獲得現金 30 元！",
        count: 1,
        type: "normal"
      },

      {
        id: "homework3",
        name: "3 張免寫卷",
        icon: "📚✨",
        description: "可獲得 3 張免寫卷！",
        count: 2,
        type: "normal"
      },

      {
        id: "homework1",
        name: "1 張免寫卷",
        icon: "📝",
        description: "可獲得 1 張免寫卷！",
        count: 3,
        type: "normal"
      },

      {
        id: "stationeryA",
        name: "文具 A",
        icon: "🖊️📒",
        description: "藍黑筆、立可帶、筆記本，三選一",
        count: 4,
        type: "normal"
      },

      {
        id: "stationeryB",
        name: "文具 B",
        icon: "✏️📏",
        description: "自動筆、橡皮擦、直尺，三選一",
        count: 4,
        type: "normal"
      },

      {
        id: "cookie",
        name: "小餅乾",
        icon: "🍪",
        description: "恭喜獲得小餅乾 1 份！",
        count: 8,
        type: "normal"
      },

      {
        id: "drawAgain",
        name: "再抽一次",
        icon: "🎟️🔄",
        description: "太幸運了！可以立刻再抽一張！",
        count: 1,
        type: "again"
      },

      {
        id: "silver",
        name: "銀卡",
        icon: "🥈🥤",
        description: "全班累積 10 張銀卡，可獲得飲料一杯！",
        count: 7,
        type: "silver"
      },

      {
        id: "tryAgain",
        name: "再接再厲",
        icon: "🍀",
        description: "這次差一點，好運下次再來！",
        count: 10,
        type: "none"
      }

    ];

    const STORAGE_KEY =
      "classLuckyScratchPool_v2";

    const stage =
      document.getElementById(
        "stage"
      );

    const hint =
      document.getElementById(
        "hint"
      );

    const shuffleBtn =
      document.getElementById(
        "shuffleBtn"
      );

    const nextBtn =
      document.getElementById(
        "nextBtn"
      );

    const drawAgainBtn =
      document.getElementById(
        "drawAgainBtn"
      );

    const resetPoolBtn =
      document.getElementById(
        "resetPoolBtn"
      );

    const remainingCount =
      document.getElementById(
        "remainingCount"
      );

    let prizePool = [];

    let currentPrize = null;

    let scratchingFinished = false;

    let cardSelected = false;

    /* =============================
       建立獎池
    ============================= */

    function createFreshPool() {

      const pool = [];

      PRIZE_DEFINITIONS.forEach(
        prize => {

          for (
            let i = 0;
            i < prize.count;
            i++
          ) {

            pool.push({

              id:
                prize.id,

              name:
                prize.name,

              icon:
                prize.icon,

              description:
                prize.description,

              type:
                prize.type,

              serial:
                `${prize.id}-${i + 1}`

            });

          }

        }
      );

      return shuffleArray(
        pool
      );

    }

    /* =============================
       洗牌陣列
    ============================= */

    function shuffleArray(
      array
    ) {

      const result =
        [...array];

      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random()
            *
            (i + 1)
          );

        [
          result[i],
          result[j]
        ] =
        [
          result[j],
          result[i]
        ];

      }

      return result;

    }

    /* =============================
       儲存
    ============================= */

    function savePool() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          prizePool
        )
      );

      updateRemainingCount();

    }

    /* =============================
       載入
    ============================= */

    function loadPool() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (saved) {

        try {

          const parsed =
            JSON.parse(
              saved
            );

          if (
            Array.isArray(
              parsed
            )
          ) {

            prizePool =
              parsed;

          }

          else {

            prizePool =
              createFreshPool();

            savePool();

          }

        }

        catch {

          prizePool =
            createFreshPool();

          savePool();

        }

      }

      else {

        prizePool =
          createFreshPool();

        savePool();

      }

      updateRemainingCount();

    }

    function updateRemainingCount() {

      remainingCount.textContent =
        prizePool.length;

    }

    /* =============================
       卡片圖案
    ============================= */

    function ticketFaceHTML() {

      return `

        <div class="ticket-face">

          <div class="ticket-icon">
            🎫✨
          </div>

          <div class="ticket-title">
            班級<br>
            幸運刮刮樂
          </div>

          <div class="ticket-text">
            LUCKY CARD
          </div>

        </div>

      `;

    }

    /* =============================
       初始牌堆
    ============================= */

    function showDeck() {

      currentPrize =
        null;

      scratchingFinished =
        false;

      cardSelected =
        false;

      stage.classList.remove(
        "dealing-stage"
      );

      nextBtn.style.display =
        "none";

      drawAgainBtn.style.display =
        "none";

      shuffleBtn.style.display =
        "";

      shuffleBtn.disabled =
        false;

      updateRemainingCount();

      if (
        prizePool.length === 0
      ) {

        showEmptyPool();

        return;

      }

      stage.innerHTML = `

        <div
          class="deck"
          id="deck"
        >

          ${Array
            .from(
              {
                length: 8
              },
              () => `

                <div class="deck-card">

                  ${ticketFaceHTML()}

                </div>

              `
            )
            .join("")}

        </div>

      `;

      hint.textContent =
        `目前還有 ${prizePool.length} 張，按下「開始洗牌」！`;

    }

    /* =============================
       真人上下洗牌
    ============================= */

    function startShuffle() {

      if (
        prizePool.length === 0
      ) {

        showEmptyPool();

        return;

      }

      shuffleBtn.disabled =
        true;

      hint.textContent =
        "正在上下洗牌中…… 🔀";

      prizePool =
        shuffleArray(
          prizePool
        );

      savePool();

      stage.innerHTML = `

        <div class="shuffle-table">

          <div class="hand left"></div>
          <div class="hand right"></div>

          <div class="shuffle-pile top-pile">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-pile bottom-pile">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-packet packet1">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-packet packet2">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-packet packet3">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-packet packet4">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-packet packet5">

            ${ticketFaceHTML()}

          </div>

          <div class="shuffle-label">
            上下洗牌中……
          </div>

        </div>

      `;

      setTimeout(
        () => {

          prizePool =
            shuffleArray(
              prizePool
            );

          savePool();

          dealAllCards();

        },
        3600
      );

    }

    /* =============================
       攤開全部剩餘卡片
    ============================= */

    function dealAllCards() {

      stage.classList.add(
        "dealing-stage"
      );

      const count =
        prizePool.length;

      stage.innerHTML = `

        <div class="all-cards-area">

          ${prizePool
            .map(
              (
                prize,
                index
              ) => `

                <div
                  class="all-card"
                  data-index="${index}"
                  style="
                    animation-delay:
                    ${
                      Math.min(
                        index * .025,
                        .8
                      )
                    }s;
                  "
                >

                  <div class="all-card-number">
                    ${index + 1}
                  </div>

                  ${ticketFaceHTML()}

                </div>

              `
            )
            .join("")}

        </div>

      `;

      hint.textContent =
        `全部 ${count} 張都已攤開，請挑一張！ 👆`;

      shuffleBtn.style.display =
        "none";

      document
        .querySelectorAll(
          ".all-card"
        )
        .forEach(
          card => {

            card.addEventListener(
              "click",
              () => {

                selectCard(
                  card
                );

              }
            );

          }
        );

    }

    /* =============================
       選卡
    ============================= */

    function selectCard(
      card
    ) {

      if (
        cardSelected
      ) {
        return;
      }

      cardSelected =
        true;

      const chosenIndex =
        Number(
          card.dataset.index
        );

      currentPrize =
        prizePool[
          chosenIndex
        ];

      prizePool.splice(
        chosenIndex,
        1
      );

      savePool();

      card.style.zIndex =
        "60";

      card.style.transform =
        "translateY(-18px) scale(1.12)";

      document
        .querySelectorAll(
          ".all-card"
        )
        .forEach(
          otherCard => {

            if (
              otherCard !== card
            ) {

              otherCard.style.opacity =
                ".15";

              otherCard.style.filter =
                "grayscale(.65)";

            }

          }
        );

      hint.textContent =
        "選好了！準備刮開獎項！ ✨";

      setTimeout(
        showScratchTicket,
        650
      );

    }

    /* =============================
       刮刮樂
    ============================= */

    function showScratchTicket() {

      stage.classList.remove(
        "dealing-stage"
      );

      let prizeClass =
        "";

      if (
        currentPrize.type ===
        "silver"
      ) {

        prizeClass =
          "silver-card";

      }

      else if (
        currentPrize.type ===
        "again"
      ) {

        prizeClass =
          "try-again";

      }

      else if (
        currentPrize.type ===
        "none"
      ) {

        prizeClass =
          "no-prize";

      }

      stage.innerHTML = `

        <div class="scratch-wrap">

          <div class="scratch-ticket">

            <div class="ticket-top">

              <div class="icon">
                🎫✨
              </div>

              <div class="title">
                班級幸運刮刮樂
              </div>

              <div class="eng">
                LUCKY SCRATCH CARD
              </div>

            </div>

            <div
              class="scratch-area"
              id="scratchArea"
            >

              <div
                class="
                  prize-under
                  ${prizeClass}
                "
              >

                <div class="prize-icon">

                  ${currentPrize.icon}

                </div>

                <div class="prize-name">

                  ${currentPrize.name}

                </div>

                <div class="prize-description">

                  ${currentPrize.description}

                </div>

              </div>

              <canvas
                id="scratchCanvas"
              ></canvas>

            </div>

            <div class="bottom-note">

              👆 用手指或滑鼠刮開整個銀色區域

            </div>

          </div>

          <div
            class="result"
            id="result"
          ></div>

        </div>

      `;

      hint.textContent =
        "開始刮吧！銀色區域下面就是你的獎項！";

      initScratch();

    }

    /* =============================
       刮除功能
    ============================= */

    function initScratch() {

      const canvas =
        document.getElementById(
          "scratchCanvas"
        );

      const area =
        document.getElementById(
          "scratchArea"
        );

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );

      const rect =
        area.getBoundingClientRect();

      const dpr =
        Math.max(
          1,
          window.devicePixelRatio
            || 1
        );

      canvas.width =
        Math.max(
          1,
          Math.round(
            rect.width * dpr
          )
        );

      canvas.height =
        Math.max(
          1,
          Math.round(
            rect.height * dpr
          )
        );

      canvas.style.width =
        "100%";

      canvas.style.height =
        "100%";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          rect.width,
          rect.height
        );

      gradient.addColorStop(
        0,
        "#9299a2"
      );

      gradient.addColorStop(
        .15,
        "#e9edf0"
      );

      gradient.addColorStop(
        .32,
        "#a5abb2"
      );

      gradient.addColorStop(
        .48,
        "#f7f8f8"
      );

      gradient.addColorStop(
        .65,
        "#a3a8af"
      );

      gradient.addColorStop(
        .82,
        "#e2e5e8"
      );

      gradient.addColorStop(
        1,
        "#8d949d"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );

      ctx.fillStyle =
        "rgba(255,255,255,.34)";

      for (
        let i = 0;
        i < 95;
        i++
      ) {

        ctx.beginPath();

        ctx.arc(
          Math.random()
            * rect.width,

          Math.random()
            * rect.height,

          Math.random()
            * 2.6 + .4,

          0,

          Math.PI * 2
        );

        ctx.fill();

      }

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillStyle =
        "rgba(255,255,255,.86)";

      ctx.font =
        "900 27px sans-serif";

      ctx.fillText(
        "✨ 刮 開 看 看 ✨",
        rect.width / 2,
        rect.height / 2 - 13
      );

      ctx.font =
        "900 15px sans-serif";

      ctx.fillText(
        "SCRATCH HERE",
        rect.width / 2,
        rect.height / 2 + 28
      );

      ctx.globalCompositeOperation =
        "destination-out";

      let drawing =
        false;

      let lastPoint =
        null;

      function getPoint(
        event
      ) {

        const canvasRect =
          canvas.getBoundingClientRect();

        let clientX;
        let clientY;

        if (
          event.touches &&
          event.touches.length
        ) {

          clientX =
            event.touches[0]
              .clientX;

          clientY =
            event.touches[0]
              .clientY;

        }

        else if (
          event.changedTouches &&
          event.changedTouches.length
        ) {

          clientX =
            event.changedTouches[0]
              .clientX;

          clientY =
            event.changedTouches[0]
              .clientY;

        }

        else {

          clientX =
            event.clientX;

          clientY =
            event.clientY;

        }

        return {

          x:
            clientX
            -
            canvasRect.left,

          y:
            clientY
            -
            canvasRect.top

        };

      }

      function eraseCircle(
        x,
        y
      ) {

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          28,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

      function scratch(
        event
      ) {

        if (!drawing) {
          return;
        }

        event.preventDefault();

        const point =
          getPoint(
            event
          );

        if (
          lastPoint
        ) {

          const dx =
            point.x
            -
            lastPoint.x;

          const dy =
            point.y
            -
            lastPoint.y;

          const distance =
            Math.sqrt(
              dx * dx
              +
              dy * dy
            );

          const steps =
            Math.max(
              1,
              Math.ceil(
                distance / 7
              )
            );

          for (
            let i = 0;
            i <= steps;
            i++
          ) {

            const t =
              i / steps;

            eraseCircle(

              lastPoint.x
              +
              dx * t,

              lastPoint.y
              +
              dy * t

            );

          }

        }

        else {

          eraseCircle(
            point.x,
            point.y
          );

        }

        lastPoint =
          point;

      }

      function startScratch(
        event
      ) {

        drawing =
          true;

        lastPoint =
          getPoint(
            event
          );

        eraseCircle(
          lastPoint.x,
          lastPoint.y
        );

        event.preventDefault();

      }

      function endScratch() {

        if (!drawing) {
          return;
        }

        drawing =
          false;

        lastPoint =
          null;

        checkScratch(
          ctx,
          canvas
        );

      }

      if (
        window.PointerEvent
      ) {

        canvas.addEventListener(
          "pointerdown",
          event => {

            try {

              canvas.setPointerCapture(
                event.pointerId
              );

            }
            catch {}

            startScratch(
              event
            );

          }
        );

        canvas.addEventListener(
          "pointermove",
          scratch
        );

        canvas.addEventListener(
          "pointerup",
          endScratch
        );

        canvas.addEventListener(
          "pointercancel",
          endScratch
        );

      }

      else {

        canvas.addEventListener(
          "mousedown",
          startScratch
        );

        canvas.addEventListener(
          "mousemove",
          scratch
        );

        window.addEventListener(
          "mouseup",
          endScratch
        );

        canvas.addEventListener(
          "touchstart",
          startScratch,
          {
            passive: false
          }
        );

        canvas.addEventListener(
          "touchmove",
          scratch,
          {
            passive: false
          }
        );

        canvas.addEventListener(
          "touchend",
          endScratch
        );

      }

    }

    /* =============================
       計算刮除比例
    ============================= */

    function checkScratch(
      ctx,
      canvas
    ) {

      if (
        scratchingFinished
      ) {
        return;
      }

      const data =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        ).data;

      let transparent =
        0;

      let checked =
        0;

      for (
        let i = 3;
        i < data.length;
        i += 16
      ) {

        checked++;

        if (
          data[i] < 20
        ) {

          transparent++;

        }

      }

      const ratio =
        transparent / checked;

      if (
        ratio >= .42
      ) {

        finishScratch(
          canvas
        );

      }

    }

    /* =============================
       刮完
    ============================= */

    function finishScratch(
      canvas
    ) {

      scratchingFinished =
        true;

      canvas.style.transition =
        "opacity .5s ease";

      canvas.style.opacity =
        "0";

      canvas.style.pointerEvents =
        "none";

      setTimeout(
        () => {

          canvas.style.display =
            "none";

        },
        520
      );

      const result =
        document.getElementById(
          "result"
        );

      if (
        currentPrize.type ===
        "again"
      ) {

        result.textContent =
          "🎟️ 太幸運了！這張可以再抽一次！";

        hint.textContent =
          `目前還剩 ${prizePool.length} 張，可以再抽一次！`;

        drawAgainBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

        nextBtn.style.display =
          "none";

      }

      else if (
        currentPrize.type ===
        "none"
      ) {

        result.textContent =
          "🍀 再接再厲！下一次一定更幸運！";

        hint.textContent =
          `本次抽獎完成，目前剩餘 ${prizePool.length} 張。`;

        nextBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

      }

      else {

        result.textContent =
          `🎉 恭喜獲得「${currentPrize.name}」！`;

        hint.textContent =
          `本次抽獎完成，目前剩餘 ${prizePool.length} 張。`;

        nextBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

      }

      updateRemainingCount();

      celebrate();

    }

    /* =============================
       慶祝動畫
    ============================= */

    function celebrate() {

      const symbols = [
        "🎉",
        "🎊",
        "✨",
        "⭐",
        "🎟️",
        "🎁",
        "🍀"
      ];

      for (
        let i = 0;
        i < 34;
        i++
      ) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "confetti";

        item.textContent =
          symbols[
            Math.floor(
              Math.random()
              *
              symbols.length
            )
          ];

        item.style.setProperty(
          "--x",

          `${
            (Math.random() - .5)
            * 820
          }px`
        );

        item.style.setProperty(
          "--y",

          `${
            (Math.random() - .5)
            * 680
          }px`
        );

        item.style.animationDelay =
          `${
            Math.random()
            * .15
          }s`;

        document.body.appendChild(
          item
        );

        setTimeout(
          () => {

            item.remove();

          },
          1500
        );

      }

    }

    /* =============================
       下一位
    ============================= */

    function nextPlayer() {

      showDeck();

    }

    /* =============================
       再抽一次
    ============================= */

    function drawAgain() {

      showDeck();

      hint.textContent =
        "🎟️ 你獲得再抽一次！請重新洗牌後再選一張！";

    }

    /* =============================
       重設 40 張
    ============================= */

    function resetPool() {

      const confirmed =
        window.confirm(
          "確定要重設刮刮樂嗎？\n\n所有已抽出的獎項都會恢復，重新變成完整 40 張。"
        );

      if (!confirmed) {
        return;
      }

      prizePool =
        createFreshPool();

      savePool();

      currentPrize =
        null;

      scratchingFinished =
        false;

      cardSelected =
        false;

      showDeck();

      hint.textContent =
        "✅ 已重新建立完整 40 張獎池！";

    }

    /* =============================
       獎池抽完
    ============================= */

    function showEmptyPool() {

      stage.classList.remove(
        "dealing-stage"
      );

      stage.innerHTML = `

        <div class="empty-box">

          <div class="empty-icon">
            🎉
          </div>

          40 張刮刮樂已經全部抽完！

          <br><br>

          老師若要重新開始，

          <br>

          請按下「重設 40 張獎池」。

        </div>

      `;

      hint.textContent =
        "本輪抽獎已全部完成！";

      shuffleBtn.style.display =
        "none";

      nextBtn.style.display =
        "none";

      drawAgainBtn.style.display =
        "none";

    }

    /* =============================
       按鈕
    ============================= */

    shuffleBtn.addEventListener(
      "click",
      startShuffle
    );

    nextBtn.addEventListener(
      "click",
      nextPlayer
    );

    drawAgainBtn.addEventListener(
      "click",
      drawAgain
    );

    resetPoolBtn.addEventListener(
      "click",
      resetPool
    );

    /* =============================
       啟動
    ============================= */

    loadPool();

    showDeck();

  </script>

</body>
