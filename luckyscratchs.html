<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>班級幸運刮刮樂</title>

  <style>
    :root {
      --navy: #23395d;
      --navy2: #35558a;
      --navy3: #4e6fae;

      --purple: #625ca8;
      --purple-dark: #48427f;

      --gold: #f2c75c;
      --gold2: #ffdf86;
      --gold-dark: #c99827;

      --cream: #fff9e9;
      --cream2: #f8edcf;

      --text: #3d3629;
      --brown: #72521e;

      --shadow:
        0 16px 38px
        rgba(43, 47, 75, 0.20);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 12% 18%,
          rgba(255,255,255,.85) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 84% 30%,
          rgba(255,255,255,.75) 0 2px,
          transparent 3px
        ),
        linear-gradient(
          145deg,
          #fffaf0,
          #efe4c6
        );

      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      margin: auto;
      padding: 18px 14px 40px;
      text-align: center;
    }

    /* =========================
       標題
    ========================= */

    h1 {
      margin: 4px 0 6px;

      font-size:
        clamp(
          30px,
          6vw,
          56px
        );

      color: var(--navy);

      text-shadow:
        0 3px 0 white,
        0 6px 14px
        rgba(60, 55, 90, .14);
    }

    .subtitle {
      margin: 0 auto 14px;

      font-size:
        clamp(
          15px,
          2.4vw,
          20px
        );

      font-weight: 800;

      color: #72531c;
    }

    /* =========================
       資訊列
    ========================= */

    .info-bar {
      width: min(760px, 100%);
      margin: 0 auto 16px;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;
    }

    .info-chip {
      padding: 8px 16px;

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      border:
        2px solid
        rgba(
          218,
          177,
          74,
          .4
        );

      box-shadow:
        0 5px 14px
        rgba(
          80,
          60,
          20,
          .08
        );

      font-size:
        14px;

      font-weight: 900;

      color: #644918;
    }

    .info-chip strong {
      color: var(--navy);
      font-size: 17px;
    }

    /* =========================
       主舞台
    ========================= */

    .stage {
      position: relative;

      min-height: 540px;

      padding: 24px;

      border-radius: 30px;

      border:
        3px solid
        rgba(
          175,
          137,
          51,
          .13
        );

      background:
        rgba(
          255,
          255,
          255,
          .5
        );

      box-shadow:
        inset
        0 0 50px
        rgba(
          255,
          255,
          255,
          .75
        ),
        var(--shadow);

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hint {
      min-height: 30px;

      margin: 16px 0 12px;

      font-size:
        clamp(
          16px,
          2.5vw,
          20px
        );

      font-weight: 900;

      color: #72521e;
    }

    /* =========================
       按鈕
    ========================= */

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 13px;

      margin-top: 8px;
    }

    .btn {
      border: 0;

      border-radius: 999px;

      padding: 14px 28px;

      font-size:
        clamp(
          16px,
          2.3vw,
          19px
        );

      font-weight: 1000;

      cursor: pointer;

      color: white;

      background:
        linear-gradient(
          #4f70ab,
          var(--navy)
        );

      box-shadow:
        0 7px 0 #172844,
        0 12px 20px
        rgba(
          41,
          45,
          76,
          .18
        );

      transition:
        .15s transform,
        .15s opacity,
        .15s box-shadow;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #172844,
        0 6px 12px
        rgba(
          41,
          45,
          76,
          .15
        );
    }

    .btn.gold {
      color: #62450f;

      background:
        linear-gradient(
          #ffe28b,
          #efb943
        );

      box-shadow:
        0 7px 0 #b9841d,
        0 12px 20px
        rgba(
          80,
          55,
          10,
          .16
        );
    }

    .btn.purple {
      background:
        linear-gradient(
          #8078ca,
          var(--purple)
        );

      box-shadow:
        0 7px 0
        var(--purple-dark),
        0 12px 20px
        rgba(
          60,
          50,
          100,
          .16
        );
    }

    .btn.small {
      padding: 10px 18px;
      font-size: 14px;
    }

    .btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       卡片背面
    ========================= */

    .ticket-face {
      width: 100%;
      height: 100%;

      position: relative;

      overflow: hidden;

      border-radius: inherit;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #fff6cf;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 18% 84%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 82% 82%,
          rgba(255,230,130,.95)
          0 3px,
          transparent 4px
        ),
        linear-gradient(
          155deg,
          #6079b8,
          #394f88 55%,
          #292d5f
        );

      border:
        3px solid
        var(--gold);
    }

    .ticket-face::before,
    .ticket-face::after {
      content: "✦";

      position: absolute;

      font-size: 60px;

      color:
        rgba(
          255,
          229,
          132,
          .22
        );

      pointer-events: none;
    }

    .ticket-face::before {
      left: 12px;
      top: 12px;
    }

    .ticket-face::after {
      right: 12px;
      bottom: 12px;
    }

    .ticket-icon {
      font-size:
        clamp(
          52px,
          8vw,
          78px
        );

      line-height: 1;

      margin-bottom: 9px;

      filter:
        drop-shadow(
          0 4px 0
          rgba(
            30,
            35,
            70,
            .35
          )
        );
    }

    .ticket-title {
      font-size:
        clamp(
          24px,
          4vw,
          38px
        );

      font-weight: 1000;

      line-height: 1.12;

      letter-spacing: 3px;

      text-shadow:
        0 3px 0
        rgba(
          30,
          35,
          70,
          .5
        );
    }

    .ticket-text {
      margin-top: 10px;

      font-size:
        clamp(
          12px,
          2vw,
          16px
        );

      font-weight: 900;

      letter-spacing: 3px;
    }

    /* =========================
       疊牌
    ========================= */

    .deck {
      position: relative;

      width:
        min(
          280px,
          68vw
        );

      aspect-ratio: 2 / 3;

      perspective: 1000px;
    }

    .deck-card {
      position: absolute;
      inset: 0;

      border-radius: 22px;

      background: white;

      border:
        5px solid white;

      box-shadow:
        0 11px 25px
        rgba(
          53,
          45,
          80,
          .23
        );

      transform-origin:
        center bottom;
    }

    .deck-card:nth-child(1) {
      transform:
        translate(-22px,12px)
        rotate(-7deg);
    }

    .deck-card:nth-child(2) {
      transform:
        translate(-15px,8px)
        rotate(-5deg);
    }

    .deck-card:nth-child(3) {
      transform:
        translate(-9px,5px)
        rotate(-3deg);
    }

    .deck-card:nth-child(4) {
      transform:
        translate(-3px,2px)
        rotate(-1deg);
    }

    .deck-card:nth-child(5) {
      transform:
        translate(3px,2px)
        rotate(1deg);
    }

    .deck-card:nth-child(6) {
      transform:
        translate(9px,5px)
        rotate(3deg);
    }

    .deck-card:nth-child(7) {
      transform:
        translate(15px,8px)
        rotate(5deg);
    }

    .deck-card:nth-child(8) {
      transform:
        translate(22px,12px)
        rotate(7deg);
    }

    /* =========================
       洗牌動畫
    ========================= */

    .deck.shuffling
    .deck-card:nth-child(1) {
      animation:
        shuffle1
        .18s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(2) {
      animation:
        shuffle2
        .21s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(3) {
      animation:
        shuffle3
        .17s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(4) {
      animation:
        shuffle4
        .20s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(5) {
      animation:
        shuffle5
        .16s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(6) {
      animation:
        shuffle6
        .19s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(7) {
      animation:
        shuffle7
        .22s
        ease-in-out
        infinite
        alternate;
    }

    .deck.shuffling
    .deck-card:nth-child(8) {
      animation:
        shuffle8
        .18s
        ease-in-out
        infinite
        alternate;
    }

    @keyframes shuffle1 {
      to {
        transform:
          translate(-90px,-22px)
          rotate(-16deg);
      }
    }

    @keyframes shuffle2 {
      to {
        transform:
          translate(78px,-28px)
          rotate(13deg);
      }
    }

    @keyframes shuffle3 {
      to {
        transform:
          translate(-58px,22px)
          rotate(10deg);
      }
    }

    @keyframes shuffle4 {
      to {
        transform:
          translate(62px,28px)
          rotate(-11deg);
      }
    }

    @keyframes shuffle5 {
      to {
        transform:
          translate(-76px,-10px)
          rotate(15deg);
      }
    }

    @keyframes shuffle6 {
      to {
        transform:
          translate(88px,10px)
          rotate(-15deg);
      }
    }

    @keyframes shuffle7 {
      to {
        transform:
          translate(-52px,32px)
          rotate(9deg);
      }
    }

    @keyframes shuffle8 {
      to {
        transform:
          translate(55px,-35px)
          rotate(-9deg);
      }
    }

    /* =========================
       攤牌
    ========================= */

    .fan {
      width: 100%;
      min-height: 445px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 0;
    }

    .pick-card {
      position: relative;

      width: 180px;
      height: 270px;

      margin:
        0 -42px;

      border-radius: 20px;

      border:
        5px solid white;

      background: white;

      box-shadow:
        0 12px 25px
        rgba(
          46,
          40,
          76,
          .25
        );

      cursor: pointer;

      overflow: hidden;

      transition:
        .25s transform,
        .25s opacity,
        .25s filter;

      animation:
        deal
        .6s
        cubic-bezier(
          .2,
          .8,
          .2,
          1
        )
        both;
    }

    .pick-card:nth-child(1) {
      transform:
        translateY(50px)
        rotate(-28deg);
    }

    .pick-card:nth-child(2) {
      transform:
        translateY(31px)
        rotate(-20deg);
    }

    .pick-card:nth-child(3) {
      transform:
        translateY(15px)
        rotate(-12deg);
    }

    .pick-card:nth-child(4) {
      transform:
        translateY(4px)
        rotate(-4deg);
    }

    .pick-card:nth-child(5) {
      transform:
        translateY(4px)
        rotate(4deg);
    }

    .pick-card:nth-child(6) {
      transform:
        translateY(15px)
        rotate(12deg);
    }

    .pick-card:nth-child(7) {
      transform:
        translateY(31px)
        rotate(20deg);
    }

    .pick-card:nth-child(8) {
      transform:
        translateY(50px)
        rotate(28deg);
    }

    .pick-card:hover,
    .pick-card:active {
      z-index: 30;

      transform:
        translateY(-25px)
        rotate(0deg)
        scale(1.09);

      filter: brightness(1.08);
    }

    @keyframes deal {
      from {
        opacity: 0;

        transform:
          translateY(170px)
          rotate(0deg)
          scale(.4);
      }
    }

    /* =========================
       刮刮樂本體
    ========================= */

    .scratch-wrap {
      width:
        min(
          450px,
          92vw
        );

      animation:
        popIn
        .45s
        ease
        both;
    }

    @keyframes popIn {
      from {
        opacity: 0;

        transform:
          translateY(45px)
          scale(.72);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .scratch-ticket {
      position: relative;

      width: 100%;

      aspect-ratio:
        3 / 4;

      padding: 15px;

      overflow: hidden;

      border-radius: 28px;

      border:
        7px solid
        var(--gold2);

      background:
        linear-gradient(
          145deg,
          #536fae,
          #344d86 55%,
          #3c376f
        );

      box-shadow:
        0 18px 38px
        rgba(
          45,
          42,
          75,
          .28
        );
    }

    .scratch-ticket::before {
      content: "";

      position: absolute;
      inset: 8px;

      border:
        2px dashed
        rgba(
          255,
          223,
          118,
          .75
        );

      border-radius: 18px;

      pointer-events: none;
    }

    .ticket-top {
      height: 31%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #fff7d5;

      position: relative;

      z-index: 2;
    }

    .ticket-top .icon {
      font-size: 58px;
      line-height: 1;
    }

    .ticket-top .title {
      margin-top: 4px;

      font-size:
        clamp(
          29px,
          7vw,
          41px
        );

      font-weight: 1000;

      letter-spacing: 4px;

      text-shadow:
        0 3px 0
        rgba(
          35,
          35,
          70,
          .5
        );
    }

    .ticket-top .eng {
      margin-top: 5px;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 2px;
    }

    /* =========================
       刮除區，全滿
    ========================= */

    .scratch-area {
      position: relative;

      width: 100%;

      height: 56%;

      margin: 0;

      overflow: hidden;

      border-radius: 18px;

      border:
        4px solid
        var(--gold);

      background: #fff8dc;

      touch-action: none;
    }

    .prize-under {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      padding: 15px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #fffef9,
          #f7e9bb
        );
    }

    .prize-under.silver-card {
      background:
        radial-gradient(
          circle at center,
          #ffffff,
          #dfe5ec
        );
    }

    .prize-under.try-again {
      background:
        radial-gradient(
          circle at center,
          #fffaf8,
          #e4dcff
        );
    }

    .prize-under.no-prize {
      background:
        radial-gradient(
          circle at center,
          #fffef7,
          #e9eadf
        );
    }

    .prize-icon {
      font-size:
        clamp(
          58px,
          13vw,
          78px
        );

      line-height: 1;

      margin-bottom: 7px;
    }

    .prize-name {
      color: var(--navy);

      font-size:
        clamp(
          24px,
          5.5vw,
          33px
        );

      font-weight: 1000;

      line-height: 1.2;
    }

    .prize-description {
      margin-top: 7px;

      max-width: 95%;

      color: #72521b;

      font-size:
        clamp(
          14px,
          3.5vw,
          17px
        );

      font-weight: 900;

      line-height: 1.45;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;

      width: 100% !important;
      height: 100% !important;

      display: block;

      cursor: crosshair;

      touch-action: none;
    }

    .bottom-note {
      height: 13%;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      z-index: 2;

      color: #fff7d3;

      font-size:
        clamp(
          13px,
          3vw,
          16px
        );

      font-weight: 900;

      text-align: center;
    }

    .result {
      min-height: 44px;

      margin-top: 15px;

      color: var(--navy);

      font-size:
        clamp(
          18px,
          4vw,
          24px
        );

      font-weight: 1000;
    }

    /* =========================
       獎項明細
    ========================= */

    .prize-list {
      width: min(720px, 100%);

      margin:
        24px auto 0;

      padding: 18px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      border:
        2px solid
        rgba(
          205,
          163,
          58,
          .2
        );

      box-shadow:
        0 10px 25px
        rgba(
          70,
          55,
          20,
          .08
        );
    }

    .prize-list h2 {
      margin:
        0 0 13px;

      color: var(--navy);

      font-size: 21px;
    }

    .prize-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 8px;
    }

    .prize-item {
      padding:
        9px 11px;

      border-radius: 13px;

      background: #fffaf0;

      border:
        1px solid
        rgba(
          192,
          145,
          34,
          .15
        );

      font-size: 14px;

      font-weight: 800;

      text-align: left;
    }

    .prize-item strong {
      color: var(--navy);
    }

    /* =========================
       爆炸動畫
    ========================= */

    .confetti {
      position: fixed;

      left: 50%;
      top: 45%;

      z-index: 999;

      font-size: 31px;

      pointer-events: none;

      animation:
        burst
        1.25s
        ease-out
        forwards;
    }

    @keyframes burst {
      to {
        transform:
          translate(
            var(--x),
            var(--y)
          )
          rotate(560deg);

        opacity: 0;
      }
    }

    /* =========================
       獎池清空
    ========================= */

    .empty-box {
      padding: 35px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          .72
        );

      color: var(--navy);

      font-weight: 900;

      font-size: 22px;
    }

    .empty-icon {
      font-size: 70px;
      margin-bottom: 14px;
    }

    /* =========================
       手機平板
    ========================= */

    @media
    (max-width: 850px) {

      .stage {
        min-height: 510px;

        padding:
          12px 4px;
      }

      .fan {
        width: 128%;

        transform:
          scale(.82);
      }

      .pick-card {
        margin:
          0 -52px;
      }

    }

    @media
    (max-width: 620px) {

      .fan {
        width: 150%;

        transform:
          scale(.7);
      }

      .pick-card {
        margin:
          0 -60px;
      }

      .prize-grid {
        grid-template-columns:
          1fr;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <h1>
      🎫 班級幸運刮刮樂 ✨
    </h1>

    <p class="subtitle">
      洗牌、抽一張，刮出你的幸運獎項！
    </p>

    <div class="info-bar">

      <div class="info-chip">
        🎟️ 原始獎池
        <strong>40</strong>
        張
      </div>

      <div class="info-chip">
        🏆 有獎
        <strong>30</strong>
        張
      </div>

      <div class="info-chip">
        📦 剩餘
        <strong id="remainingCount">
          40
        </strong>

    /* =====================================================
       儲存名稱

       localStorage 會讓同一台裝置重新整理後，
       獎池仍維持原本剩餘數量。
    ===================================================== */

    const STORAGE_KEY =
      "classLuckyScratchPool_v1";

    /* =====================================================

    const DISPLAY_CARD_COUNT = 8;

    /* =====================================================

    const stage =
      document.getElementById(

    const nextBtn =
      document.getElementById(

    const drawAgainBtn =
      document.getElementById(
        "drawAgainBtn"
      );

    const resetPoolBtn =
      document.getElementById(
        "resetPoolBtn"
      );

    const remainingCount =
      document.getElementById(
        "remainingCount"
      );

    /* =====================================================
       遊戲狀態
    ===================================================== */

    let prizePool = [];

    let currentPrize = null;

    let scratchingFinished =
      false;

    let cardSelected =
      false;

    /* =====================================================
       建立新的 40 張固定獎池
    ===================================================== */

    function createFreshPool() {

      const pool = [];

      PRIZE_DEFINITIONS
        .forEach(
          prize => {

            for (
              let i = 0;
              i < prize.count;
              i++
            ) {

              pool.push({
                id:
                  prize.id,

                name:
                  prize.name,

                icon:
                  prize.icon,

                description:
                  prize.description,

                type:
                  prize.type,

                serial:
                  `${prize.id}-${i + 1}`
              });

            }

          }
        );

      return shuffleArray(
        pool
      );

    }

    /* =====================================================
       Fisher-Yates 洗牌
    ===================================================== */

    function shuffleArray(
      array
    ) {

      const result =
        [...array];

      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random()
            *
            (i + 1)
          );

        [
          result[i],
          result[j]
        ] =
        [
          result[j],
          result[i]
        ];

      }

      return result;

    }

    /* =====================================================
       儲存獎池
    ===================================================== */

    function savePool() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          prizePool
        )
      );

      updateRemainingCount();

    }

    /* =====================================================
       載入獎池
    ===================================================== */

    function loadPool() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (saved) {

        try {

          const parsed =
            JSON.parse(
              saved
            );

          if (
            Array.isArray(
              parsed
            )
          ) {

            prizePool =
              parsed;

          }

          else {

            prizePool =
              createFreshPool();

            savePool();

          }

        }

        catch {

          prizePool =
            createFreshPool();

          savePool();

        }

      }

      else {

        prizePool =
          createFreshPool();

        savePool();

      }

      updateRemainingCount();

    }

    /* =====================================================
       剩餘張數
    ===================================================== */

    function updateRemainingCount() {

      remainingCount.textContent =
        prizePool.length;

    }

    /* =====================================================
       卡片背面
    ===================================================== */

    function ticketFaceHTML() {

      return `

        <div class="ticket-face">

          <div class="ticket-icon">

          </div>

          </div>

          <div class="ticket-text">
            LUCKY CARD
          </div>

        </div>

      `;

    }

    /* =====================================================
       初始畫面
    ===================================================== */

    function showDeck() {

      currentPrize =
        null;

      scratchingFinished =
        false;

      cardSelected =
        false;

      nextBtn.style.display =
        "none";

      drawAgainBtn.style.display =
        "none";

      shuffleBtn.style.display =
        "";

      shuffleBtn.disabled =
        false;

      updateRemainingCount();

      if (
        prizePool.length === 0
      ) {

        showEmptyPool();

        return;

      }

      const visibleDeckCount =
        Math.min(
          8,
          Math.max(
            1,
            prizePool.length
          )
        );

      stage.innerHTML = `

        <div
          class="deck"
          id="deck"
        >

          ${Array
            .from(
              {
                length:
                  visibleDeckCount
              },
              () => `

                <div class="deck-card">

                  ${ticketFaceHTML()}

                </div>

              `
            )
            .join("")}

        </div>

      `;

      hint.textContent =
        `目前還有 ${prizePool.length} 張，按下「開始洗牌」！`;

    }

    /* =====================================================
       獎池用完
    ===================================================== */

    function showEmptyPool() {

      stage.innerHTML = `

        <div class="empty-box">

          <div class="empty-icon">
            🎉
          </div>

          40 張刮刮樂已經全部抽完！

          <br><br>

          老師若要重新開始，

          <br>

          請按下「重設 40 張獎池」。

        </div>

      `;

      hint.textContent =
        "本輪抽獎已全部完成！";

      shuffleBtn.style.display =
        "none";

      nextBtn.style.display =
        "none";

      drawAgainBtn.style.display =
        "none";

    }

    /* =====================================================
       洗牌
    ===================================================== */

    function startShuffle() {

      if (
        prizePool.length === 0
      ) {

        showEmptyPool();

        return;

      }

      const deck =
        document.getElementById(
          "deck"
        );

      if (!deck) {
        return;
      }

      shuffleBtn.disabled =
        true;

      hint.textContent =
        "正在洗牌中…… 🔀";

      deck.classList.add(
        "shuffling"
      );

      /* 同時真正重新排列剩餘獎池 */

      prizePool =
        shuffleArray(
          prizePool
        );

      savePool();

      setTimeout(
        () => {

          deck.classList.remove(
            "shuffling"
          );

          dealCards();

        },
        1700
      );

    }

    /* =====================================================
       攤牌
    ===================================================== */

    function dealCards() {

      const cardCount =
        Math.min(
          DISPLAY_CARD_COUNT,
          prizePool.length
        );

      stage.innerHTML = `

        <div class="fan">

          ${Array
            .from(
              {
                length:
                  cardCount
              },
              (_, index) => `

                <div
                  class="pick-card"
                  data-index="${index}"
                  style="
                    animation-delay:
                    ${index * .07}s;
                  "
                >

                  ${ticketFaceHTML()}

                </div>

              `
            )
            .join("")}

        </div>

      `;

      hint.textContent =
        "從攤開的刮刮樂中，挑一張吧！ 👆";

      shuffleBtn.style.display =
        "none";

      document
        .querySelectorAll(
          ".pick-card"
        )
        .forEach(
          card => {

            card.addEventListener(
              "click",
              () => {

                selectCard(
                  card
                );

              }
            );

          }
        );

    }

    /* =====================================================
       玩家選一張

       重點：
       這裡不是重新亂數產生獎品，
       而是從固定獎池拿掉一張。
    ===================================================== */

    function selectCard(
      card
    ) {

      if (
        cardSelected
      ) {
        return;
      }

      cardSelected =
        true;

      const chosenIndex =
        Number(
          card.dataset.index
        );

      /*
        前面展示的 8 張，
        實際對應獎池中的前 8 張。
      */

      currentPrize =
        prizePool[
          chosenIndex
        ];

      /*
        從獎池移除，
        所以同一張絕對不會再出現。
      */

      prizePool.splice(
        chosenIndex,
        1
      );

      savePool();

      card.style.zIndex =
        "60";

      card.style.transform =
        "translateY(-35px) rotate(0deg) scale(1.13)";

      document
        .querySelectorAll(
          ".pick-card"
        )
        .forEach(
          otherCard => {

            if (
              otherCard !== card
            ) {

              otherCard.style.opacity =
                ".18";

              otherCard.style.filter =
                "grayscale(.55)";

            }

          }
        );

      hint.textContent =
        "選好了！準備刮開獎項！ ✨";

      setTimeout(
        showScratchTicket,
        650
      );

    }

    /* =====================================================
       顯示刮刮樂
    ===================================================== */

    function showScratchTicket() {

      let prizeClass =
        "";

      if (
        currentPrize.type ===
        "silver"
      ) {

        prizeClass =
          "silver-card";

      }

      else if (
        currentPrize.type ===
        "again"
      ) {

        prizeClass =
          "try-again";

      }

      else if (
        currentPrize.type ===
        "none"
      ) {

        prizeClass =
          "no-prize";

      }

      stage.innerHTML = `

        <div class="scratch-wrap">

          <div class="scratch-ticket">

            <div class="ticket-top">

              <div class="icon">
                🎫✨
              </div>

              <div class="title">
                班級幸運刮刮樂
              </div>

              <div class="eng">
                LUCKY SCRATCH CARD
              </div>

            </div>

            <div
              class="scratch-area"
              id="scratchArea"
            >

              <div
                class="
                  prize-under
                  ${prizeClass}
                "
              >

                <div class="prize-icon">

                  ${currentPrize.icon}

                </div>

                <div class="prize-name">

                  ${currentPrize.name}

                </div>

                <div class="prize-description">

                  ${currentPrize.description}

                </div>

              </div>

              <canvas
                id="scratchCanvas"
              ></canvas>

            </div>

            <div class="bottom-note">

              👆 用手指或滑鼠刮開整個銀色區域

            </div>

          </div>

          <div
            class="result"
            id="result"
          ></div>

        </div>

      `;

      hint.textContent =
        "開始刮吧！銀色區域下面就是你的獎項！";

      initScratch();

    }

    /* =====================================================
       刮除功能
    ===================================================== */

    function initScratch() {

      const canvas =
        document.getElementById(
          "scratchCanvas"
        );

      const area =
        document.getElementById(
          "scratchArea"
        );

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );

      const rect =
        area.getBoundingClientRect();

      const dpr =
        Math.max(
          1,
          window.devicePixelRatio
            || 1
        );

      canvas.width =
        Math.max(
          1,
          Math.round(
            rect.width * dpr
          )
        );

      canvas.height =
        Math.max(
          1,
          Math.round(
            rect.height * dpr
          )
        );

      canvas.style.width =
        "100%";

      canvas.style.height =
        "100%";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      /* =====================
         銀色金屬層
      ===================== */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          rect.width,
          rect.height
        );

      gradient.addColorStop(
        0,
        "#9299a2"
      );

      gradient.addColorStop(
        .15,
        "#e9edf0"
      );

      gradient.addColorStop(
        .32,
        "#a5abb2"
      );

      gradient.addColorStop(
        .48,
        "#f7f8f8"
      );

      gradient.addColorStop(
        .65,
        "#a3a8af"
      );

      gradient.addColorStop(
        .82,
        "#e2e5e8"
      );

      gradient.addColorStop(
        1,
        "#8d949d"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );

      /* =====================
         金屬亮點
      ===================== */

      ctx.fillStyle =
        "rgba(255,255,255,.34)";

      for (
        let i = 0;
        i < 95;
        i++
      ) {

        ctx.beginPath();

        ctx.arc(
          Math.random()
            * rect.width,

          Math.random()
            * rect.height,

          Math.random()
            * 2.6 + .4,

          0,

          Math.PI * 2
        );

        ctx.fill();

      }

      /* =====================
         銀色層文字
      ===================== */

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillStyle =
        "rgba(255,255,255,.86)";

      ctx.font =
        "900 27px sans-serif";

      ctx.fillText(
        "✨ 刮 開 看 看 ✨",
        rect.width / 2,
        rect.height / 2 - 13
      );

      ctx.font =
        "900 15px sans-serif";

      ctx.fillText(
        "SCRATCH HERE",
        rect.width / 2,
        rect.height / 2 + 28
      );

      /* =====================
         之後筆跡變透明
      ===================== */

      ctx.globalCompositeOperation =
        "destination-out";

      let drawing =
        false;

      let lastPoint =
        null;

      function getPoint(
        event
      ) {

        const canvasRect =
          canvas.getBoundingClientRect();

        let clientX;
        let clientY;

        if (
          event.touches &&
          event.touches.length
        ) {

          clientX =
            event.touches[0]
              .clientX;

          clientY =
            event.touches[0]
              .clientY;

        }

        else if (
          event.changedTouches &&
          event.changedTouches.length
        ) {

          clientX =
            event.changedTouches[0]
              .clientX;

          clientY =
            event.changedTouches[0]
              .clientY;

        }

        else {

          clientX =
            event.clientX;

          clientY =
            event.clientY;

        }

        return {

          x:
            clientX
            -
            canvasRect.left,

          y:
            clientY
            -
            canvasRect.top

        };

      }

      function eraseCircle(
        x,
        y
      ) {

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          28,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

      function scratch(
        event
      ) {

        if (!drawing) {
          return;
        }

        event.preventDefault();

        const point =
          getPoint(
            event
          );

        if (
          lastPoint
        ) {

          const dx =
            point.x
            -
            lastPoint.x;

          const dy =
            point.y
            -
            lastPoint.y;

          const distance =
            Math.sqrt(
              dx * dx
              +
              dy * dy
            );

          const steps =
            Math.max(
              1,
              Math.ceil(
                distance / 7
              )
            );

          for (
            let i = 0;
            i <= steps;
            i++
          ) {

            const t =
              i / steps;

            eraseCircle(

              lastPoint.x
              +
              dx * t,

              lastPoint.y
              +
              dy * t

            );

          }

        }

        else {

          eraseCircle(
            point.x,
            point.y
          );

        }

        lastPoint =
          point;

      }

      function startScratch(
        event
      ) {

        drawing =
          true;

        lastPoint =
          getPoint(
            event
          );

        eraseCircle(
          lastPoint.x,
          lastPoint.y
        );

        event.preventDefault();

      }

      function endScratch() {

        if (!drawing) {
          return;
        }

        drawing =
          false;

        lastPoint =
          null;

        checkScratch(
          ctx,
          canvas
        );

      }

      /* =====================
         Pointer Events
         iPad / iPhone / 電腦
      ===================== */

      if (
        window.PointerEvent
      ) {

        canvas.addEventListener(
          "pointerdown",
          event => {

            try {

              canvas.setPointerCapture(
                event.pointerId
              );

            }
            catch {}

            startScratch(
              event
            );

          }
        );

        canvas.addEventListener(
          "pointermove",
          scratch
        );

        canvas.addEventListener(
          "pointerup",
          endScratch
        );

        canvas.addEventListener(
          "pointercancel",
          endScratch
        );

      }

      else {

        canvas.addEventListener(
          "mousedown",
          startScratch
        );

        canvas.addEventListener(
          "mousemove",
          scratch
        );

        window.addEventListener(
          "mouseup",
          endScratch
        );

        canvas.addEventListener(
          "touchstart",
          startScratch,
          {
            passive:
              false
          }
        );

        canvas.addEventListener(
          "touchmove",
          scratch,
          {
            passive:
              false
          }
        );

        canvas.addEventListener(
          "touchend",
          endScratch
        );

      }

    }

    /* =====================================================
       檢查刮除比例
    ===================================================== */

    function checkScratch(
      ctx,
      canvas
    ) {

      if (
        scratchingFinished
      ) {

        return;

      }

      const data =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        ).data;

      let transparent =
        0;

      let checked =
        0;

      /*
        每 4 個像素抽樣一次，
        降低 iPad 運算負擔。
      */

      for (
        let i = 3;
        i < data.length;
        i += 16
      ) {

        checked++;

        if (
          data[i] <
          20
        ) {

          transparent++;

        }

      }

      const ratio =
        transparent / checked;

      /*
        刮掉約 42%
        自動完整揭曉。
      */

      if (
        ratio >= .42
      ) {

        finishScratch(
          canvas
        );

      }

    }

    /* =====================================================
       刮完後
    ===================================================== */

    function finishScratch(
      canvas
    ) {

      scratchingFinished =
        true;

      canvas.style.transition =
        "opacity .5s ease";

      canvas.style.opacity =
        "0";

      canvas.style.pointerEvents =
        "none";

      setTimeout(
        () => {

          canvas.style.display =
            "none";

        },
        520
      );

      const result =
        document.getElementById(
          "result"
        );

      /* =====================
         再抽一次
      ===================== */

      if (
        currentPrize.type ===
        "again"
      ) {

        result.textContent =
          "🎟️ 太幸運了！這張可以再抽一次！";

        hint.textContent =
          `目前還剩 ${prizePool.length} 張，請直接再抽一張！`;

        drawAgainBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

        nextBtn.style.display =
          "none";

      }

      /* =====================
         再接再厲
      ===================== */

      else if (
        currentPrize.type ===
        "none"
      ) {

        result.textContent =
          "🍀 再接再厲！下一次一定更幸運！";

        hint.textContent =
          `本次抽獎完成，目前剩餘 ${prizePool.length} 張。`;

        nextBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

      }

      /* =====================
         一般獎項
      ===================== */

      else {

        result.textContent =
          `🎉 恭喜獲得「${currentPrize.name}」！`;

        hint.textContent =
          `本次抽獎完成，目前剩餘 ${prizePool.length} 張。`;

        nextBtn.style.display =
          prizePool.length > 0
            ? ""
            : "none";

      }

      updateRemainingCount();

      celebrate();

    }

    /* =====================================================
       慶祝動畫
    ===================================================== */

    function celebrate() {

      const symbols = [
        "🎉",
        "🎊",
        "✨",
        "⭐",
        "🎟️",
        "🎁",
        "🍀"
      ];

      for (
        let i = 0;
        i < 34;
        i++
      ) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "confetti";

        item.textContent =
          symbols[
            Math.floor(
              Math.random()
              *
              symbols.length
            )
          ];

        item.style.setProperty(
          "--x",

          `${
            (Math.random() - .5)
            * 820
          }px`
        );

        item.style.setProperty(
          "--y",

          `${
            (Math.random() - .5)
            * 680
          }px`
        );

        item.style.animationDelay =
          `${
            Math.random()
            * .15
          }s`;

        document.body.appendChild(
          item
        );

        setTimeout(
          () => {

            item.remove();

          },
          1500
        );

      }

    }

    /* =====================================================
       下一位
    ===================================================== */

    function nextPlayer() {

      showDeck();

    }

    /* =====================================================
       再抽一次
    ===================================================== */

    function drawAgain() {

      /*
        獎池不重設，
        直接開始下一次抽獎。
      */

      showDeck();

      hint.textContent =
        "🎟️ 你獲得再抽一次！請重新洗牌再抽一張！";

    }

    /* =====================================================
       重設 40 張
    ===================================================== */

    function resetPool() {

      const confirmed =
        window.confirm(
          "確定要重設刮刮樂嗎？\n\n所有已抽出的獎項都會恢復，重新變成完整 40 張。"
        );

      if (!confirmed) {
        return;
      }

      prizePool =
        createFreshPool();

      savePool();

      currentPrize =
        null;

      scratchingFinished =
        false;

      cardSelected =
        false;

      showDeck();

      hint.textContent =
        "✅ 已重新建立完整 40 張獎池！";

    }

    /* =====================================================
       按鈕事件
    ===================================================== */

    shuffleBtn.addEventListener(
      "click",
      startShuffle
    );

    nextBtn.addEventListener(
      "click",
      nextPlayer
    );

    drawAgainBtn.addEventListener(
      "click",
      drawAgain
    );

    resetPoolBtn.addEventListener(
      "click",
      resetPool
    );

    /* =====================================================
       啟動遊戲
    ===================================================== */

    loadPool();

    showDeck();

  </script>

</body>
</html>
