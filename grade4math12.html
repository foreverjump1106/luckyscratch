<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>四年級數學無限挑戰｜第一、二單元</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --green:#35a84a;
  --green-dark:#208638;
  --blue:#3189e3;
  --purple:#8f57d9;
  --red:#e84c46;
  --text:#27333a;
  --muted:#7c8983;
  --bg:#f4f8f3;
  --border:#dfe7e2;
  --shadow:0 8px 28px rgba(35,70,45,.09);
}

html,
body{
  margin:0;
  min-height:100%;

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 0 0,
      #edf9ec 0,
      transparent 27%
    ),
    radial-gradient(
      circle at 100% 0,
      #eef7ff 0,
      transparent 30%
    ),
    var(--bg);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:default;
}


/* =========================================================
   頂端
   ========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  color:white;

  background:
    linear-gradient(
      135deg,
      #23913d,
      #138241
    );

  box-shadow:
    0 3px 16px
    rgba(20,80,35,.18);
}

.top-inner{
  max-width:1700px;
  margin:auto;

  min-height:66px;

  display:flex;
  align-items:center;

  padding:8px 20px;

  gap:14px;
}

.logo{
  font-size:27px;
  flex:none;
}

.title-area{
  flex:1;
  min-width:0;
}

.main-title{
  font-size:22px;
  font-weight:900;
  line-height:1.2;
}

.main-subtitle{
  margin-top:3px;

  font-size:12px;
  opacity:.85;
}

.header-stats{
  display:flex;
  gap:9px;
}

.header-stat{
  min-width:78px;

  padding:6px 10px;

  text-align:center;

  color:#26342c;
  background:white;

  border-radius:13px;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.10);
}

.header-stat-number{
  font-size:19px;
  line-height:1.05;
  font-weight:900;
}

.header-stat-label{
  margin-top:2px;

  font-size:11px;
  color:#69746e;
}


/* =========================================================
   主畫面
   ========================================================= */

.main{
  max-width:1700px;
  margin:auto;

  padding:16px;
}

.layout{
  display:grid;

  grid-template-columns:
    minmax(560px,.95fr)
    minmax(600px,1.05fr);

  gap:18px;

  align-items:start;
}

.left-panel{
  min-width:0;
}

.control-card,
.question-card,
.scratch-card{
  background:white;

  border-radius:20px;

  border:
    1px solid
    rgba(220,230,223,.7);

  box-shadow:
    var(--shadow);
}


/* =========================================================
   控制區
   ========================================================= */

.control-card{
  padding:16px 18px;

  margin-bottom:15px;
}

.control-line{
  display:flex;
  align-items:center;

  gap:13px;

  margin-bottom:12px;
}

.control-line:last-child{
  margin-bottom:0;
}

.control-label{
  width:95px;
  flex:none;

  color:#3e4d44;

  font-size:16px;
  font-weight:900;
}

.unit-buttons{
  flex:1;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

.unit-btn{
  min-height:58px;

  padding:6px 8px;

  border:
    2px solid
    #d9e2dc;

  border-radius:14px;

  background:white;
  color:#536159;

  font-size:15px;
  font-weight:900;

  transition:.16s;
}

.unit-btn:hover{
  transform:
    translateY(-1px);
}

.unit-btn.active[data-unit="1"]{
  color:white;

  background:
    linear-gradient(
      135deg,
      #45b758,
      #2e9a45
    );

  border-color:#36a54a;

  box-shadow:
    0 5px 13px
    rgba(49,159,68,.18);
}

.unit-btn.active[data-unit="2"]{
  color:#1971ce;

  background:#eef7ff;

  border-color:#6caef0;
}

.unit-btn.active[data-unit="mix"]{
  color:#7a42c2;

  background:#f7efff;

  border-color:#aa78e7;
}

#typeSelect{
  flex:1;

  min-height:42px;

  padding:
    8px 38px
    8px 13px;

  border:
    1.5px solid
    #ccd8d1;

  border-radius:11px;

  background:white;

  outline:none;
}

#typeSelect:focus{
  border-color:#5eb86c;

  box-shadow:
    0 0 0 3px
    rgba(70,177,85,.10);
}


/* =========================================================
   進度
   ========================================================= */

.progress-area{
  margin-top:10px;

  display:flex;
  align-items:center;

  gap:11px;
}

.streak-text{
  flex:none;

  color:#87652d;

  font-size:13px;
  font-weight:900;
}

.progress-wrap{
  flex:1;

  height:7px;

  overflow:hidden;

  border-radius:999px;

  background:#e7ede9;
}

.progress-bar{
  width:0;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #59b75e,
      #3a90df
    );

  transition:.3s;
}


/* =========================================================
   題目卡
   ========================================================= */

.question-card{
  min-height:680px;

  padding:18px;
}

.question-top{
  display:flex;
  align-items:center;

  flex-wrap:wrap;

  gap:10px;
}

.question-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:5px 12px;

  border-radius:9px;

  color:white;
  background:#43a854;

  font-size:14px;
  font-weight:900;
}

.type-name{
  color:#348a43;

  font-size:16px;
  font-weight:900;
}

.chapter-label{
  margin-left:auto;

  display:inline-flex;
  align-items:center;

  padding:5px 12px;

  border-radius:999px;

  font-size:13px;
  font-weight:900;
}

.chapter-label.u1{
  color:#25833a;
  background:#eaf8eb;
}

.chapter-label.u2{
  color:#317ac4;
  background:#eaf4ff;
}

.question-text{
  margin-top:18px;
  margin-bottom:20px;

  font-size:
    clamp(
      26px,
      2.7vw,
      38px
    );

  font-weight:900;

  line-height:1.55;

  word-break:break-word;
}

.question-text.small{
  font-size:
    clamp(
      21px,
      2.3vw,
      30px
    );
}

.number-highlight{
  color:#1e75c5;
}


/* =========================================================
   作答區
   ========================================================= */

.answer-area{
  margin-top:10px;
}

.answer-row{
  display:flex;

  gap:11px;
}

.answer-input{
  flex:1;
  min-width:0;

  min-height:60px;

  padding:12px 17px;

  border:
    2px solid
    #d8e1dc;

  border-radius:15px;

  outline:none;

  background:#fcfefd;

  font-size:24px;
  font-weight:800;
}

.answer-input:focus{
  border-color:#54ad61;

  box-shadow:
    0 0 0 4px
    rgba(69,170,84,.10);
}

.submit-btn{
  flex:none;

  min-width:145px;

  padding:10px 22px;

  border:none;
  border-radius:15px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #48b558,
      #2e9a43
    );

  box-shadow:
    0 5px 13px
    rgba(44,149,64,.20);

  font-size:18px;
  font-weight:900;
}

.answer-tip{
  margin-top:7px;

  color:#909b95;

  font-size:12px;
}

.choice-grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:10px;
}

.choice-btn{
  min-height:68px;

  padding:10px 13px;

  border:
    2px solid
    #dce5df;

  border-radius:14px;

  color:#33423a;
  background:#fcfefd;

  font-size:17px;
  font-weight:800;

  line-height:1.5;

  transition:.15s;
}

.choice-btn:hover{
  background:#f2faf3;

  border-color:#73bf7d;
}

.symbol-grid{
  display:flex;

  gap:14px;
}

.symbol-btn{
  flex:1;

  max-width:130px;

  min-height:72px;

  border:
    2px solid
    #d8e2dc;

  border-radius:16px;

  color:#33423a;
  background:white;

  font-size:36px;
  font-weight:900;
}

.symbol-btn:hover{
  background:#eef8ef;

  border-color:#6fba78;
}


/* =========================================================
   回饋
   ========================================================= */

.feedback{
  display:none;

  margin-top:20px;

  overflow:hidden;

  border:
    1px solid
    #e0e7e2;

  border-radius:17px;
}

.feedback.show{
  display:block;
}

.feedback-head{
  padding:13px 17px;

  font-size:20px;
  font-weight:900;
}

.feedback.correct{
  border-color:#c8e8cd;
}

.feedback.correct
.feedback-head{
  color:#268338;

  background:#e9f8eb;
}

.feedback.wrong{
  border-color:#f3c9c6;
}

.feedback.wrong
.feedback-head{
  color:#d53f39;

  background:#fff0ee;
}

.feedback-body{
  padding:17px;

  background:#fff;

  line-height:1.75;
}

.user-answer-line{
  margin-bottom:9px;

  font-size:17px;
}

.correct-answer-line{
  margin-bottom:14px;

  font-size:17px;
}

.correct-answer{
  color:#e44842;

  font-size:19px;
  font-weight:900;
}


/* =========================================================
   詳解
   ========================================================= */

.explanation-title{
  display:flex;
  align-items:center;

  gap:7px;

  margin:
    12px 0
    9px;

  font-size:19px;
  font-weight:900;
}

.explanation-intro{
  margin-bottom:10px;
}

.ex-step{
  margin:8px 0;
}

.explain-step-card{
  margin:8px 0;

  padding:10px 12px;

  border:
    1px solid
    #dce5df;

  border-radius:12px;

  background:#fbfdfc;
}

.explain-step-title{
  margin-bottom:4px;

  color:#325d8f;

  font-size:15px;
  font-weight:900;
}

.explain-step-text{
  font-size:16px;
}

.math-box{
  margin:8px 0;

  padding:11px 14px;

  overflow:auto;

  border-radius:12px;

  background:#f2f7f3;

  font-size:19px;
  font-weight:900;

  line-height:1.55;
}

.vertical{
  display:inline-block;

  min-width:180px;

  margin:8px 0;

  padding:13px 20px;

  border:
    1px solid
    #d9e1dc;

  border-radius:12px;

  background:#f8faf9;

  font-family:
    "Courier New",
    monospace;

  font-size:20px;
  line-height:1.32;

  text-align:right;

  white-space:pre;
}

.vertical-sum{
  display:inline-block;

  margin:8px 0;

  padding:12px 25px;

  border:
    1px solid
    #f1d98a;

  border-radius:12px;

  background:#fffaf0;

  font-family:
    "Courier New",
    monospace;

  font-size:20px;

  line-height:1.38;

  text-align:right;

  white-space:pre;
}

.answer-highlight{
  color:#d8423c;

  font-weight:900;
}

.key-point{
  margin-top:10px;

  padding:10px 13px;

  border-left:
    5px solid
    #57ad62;

  border-radius:8px;

  background:#f3faf4;

  color:#3e5944;
}


/* =========================================================
   下一題
   ========================================================= */

.next-row{
  display:flex;

  justify-content:flex-end;

  margin-top:17px;
}

.next-btn{
  display:none;

  min-width:135px;

  padding:11px 18px;

  border:none;
  border-radius:13px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #3695ed,
      #267dd2
    );

  box-shadow:
    0 5px 13px
    rgba(47,135,215,.20);

  font-size:17px;
  font-weight:900;
}

.next-btn.show{
  display:block;
}


/* =========================================================
   計算紙
   ========================================================= */

.scratch-card{
  position:sticky;

  top:82px;

  overflow:hidden;
}

.scratch-header{
  display:flex;
  align-items:center;

  padding:
    15px 17px
    10px;

  gap:10px;
}

.scratch-header-text{
  flex:1;
}

.scratch-title{
  font-size:20px;
  font-weight:900;
}

.scratch-subtitle{
  margin-top:2px;

  color:#89958f;

  font-size:12px;
}

.scratch-tools{
  display:flex;

  gap:7px;
}

.tool-btn{
  min-width:85px;

  padding:8px 12px;

  border:
    1px solid
    #d5ddd8;

  border-radius:10px;

  color:#536159;
  background:#fff;

  font-size:14px;
  font-weight:800;
}

.tool-btn.active{
  color:white;

  border-color:#36a94d;

  background:
    linear-gradient(
      135deg,
      #45b758,
      #2e9c46
    );
}

.tool-btn.clear{
  color:#d84944;
}


/* =========================================================
   計算紙外框
   禁止文字選取、長按、拖曳
   ========================================================= */

.canvas-wrap{
  margin:0 16px;

  overflow:hidden;

  border:
    1px solid
    #d9e2dc;

  border-radius:15px;

  background:white;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-user-drag:none;

  touch-action:none;

  overscroll-behavior:none;
}

.canvas-wrap *{
  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-user-drag:none;
}


/* =========================================================
   實際計算紙
   ========================================================= */

#scratchCanvas{
  display:block;

  width:100%;

  /*
    上下加長
  */
  height:720px;

  /*
    觸控只能用於書寫，
    不交給瀏覽器捲動或縮放
  */
  touch-action:none;

  overscroll-behavior:none;

  /*
    禁止選字
  */
  user-select:none;
  -webkit-user-select:none;

  /*
    iPad / iPhone 長按
    不叫出系統選單
  */
  -webkit-touch-callout:none;

  /*
    禁止拖曳
  */
  -webkit-user-drag:none;

  cursor:crosshair;

  background-color:#fffefb;

  background-image:

    linear-gradient(
      #dce9ef 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      #dce9ef 1px,
      transparent 1px
    );

  background-size:
    31px 31px;
}

.scratch-reminder{
  margin:14px 16px 16px;

  padding:10px 13px;

  border:
    1px solid
    #f0dc9d;

  border-radius:11px;

  color:#66582f;

  background:#fff9e7;

  font-size:13px;

  line-height:1.65;
}


/* =========================================================
   平板
   ========================================================= */

@media(max-width:1180px){

  .layout{
    grid-template-columns:1fr;
  }

  .scratch-card{
    position:static;
  }

  #scratchCanvas{
    height:650px;
  }

}


/* =========================================================
   手機
   ========================================================= */

@media(max-width:760px){

  .main{
    padding:9px;
  }

  .top-inner{
    padding:8px 10px;
  }

  .main-title{
    font-size:16px;
  }

  .main-subtitle{
    display:none;
  }

  .header-stats{
    gap:4px;
  }

  .header-stat{
    min-width:50px;

    padding:5px 6px;
  }

  .header-stat-number{
    font-size:14px;
  }

  .header-stat-label{
    font-size:8px;
  }

  .control-line{
    display:block;
  }

  .control-label{
    width:auto;

    margin-bottom:7px;
  }

  .unit-buttons{
    grid-template-columns:1fr;
  }

  .question-card{
    min-height:auto;

    padding:14px;
  }

  .question-text{
    font-size:24px;
  }

  .answer-row{
    display:block;
  }

  .submit-btn{
    width:100%;

    min-height:54px;

    margin-top:9px;
  }

  .choice-grid{
    grid-template-columns:1fr;
  }

  .scratch-header{
    display:block;
  }

  .scratch-tools{
    margin-top:10px;
  }

  .tool-btn{
    flex:1;
    min-width:0;
  }

  #scratchCanvas{
    height:540px;
  }

}
</style>
</head>

<body>


<header class="topbar">

<div class="top-inner">

  <div class="logo">
    📖
  </div>

  <div class="title-area">

    <div class="main-title">
      四年級數學無限挑戰
    </div>

    <div class="main-subtitle">
      第一單元：一億以內的數　｜　第二單元：乘法
    </div>

  </div>


  <div class="header-stats">

    <div class="header-stat">

      <div
        id="totalStat"
        class="header-stat-number">
        0
      </div>

      <div class="header-stat-label">
        作答
      </div>

    </div>


    <div class="header-stat">

      <div
        id="correctStat"
        class="header-stat-number">
        0
      </div>

      <div class="header-stat-label">
        答對
      </div>

    </div>


    <div class="header-stat">

      <div
        id="accuracyStat"
        class="header-stat-number">
        0%
      </div>

      <div class="header-stat-label">
        正確率
      </div>

    </div>


    <div class="header-stat">

      <div
        id="streakStat"
        class="header-stat-number">
        0
      </div>

      <div class="header-stat-label">
        🔥連續
      </div>

    </div>

  </div>

</div>

</header>


<main class="main">

<div class="layout">


<!-- =====================================================
     左側
     ===================================================== -->

<div class="left-panel">


<section class="control-card">

  <div class="control-line">

    <div class="control-label">
      選擇單元：
    </div>


    <div class="unit-buttons">

      <button
        class="unit-btn active"
        data-unit="1">

        第一單元
        <br>
        一億以內的數

      </button>


      <button
        class="unit-btn"
        data-unit="2">

        第二單元
        <br>
        乘法

      </button>


      <button
        class="unit-btn"
        data-unit="mix">

        綜合練習
        <br>
        第一＋二單元

      </button>

    </div>

  </div>


  <div class="control-line">

    <div class="control-label">
      練習模式：
    </div>

    <select id="typeSelect">
    </select>

  </div>


  <div class="progress-area">

    <div class="streak-text">

      🔥 連續答對

      <span id="streakText">
        0
      </span>

      題

    </div>


    <div class="progress-wrap">

      <div
        id="progressBar"
        class="progress-bar">
      </div>

    </div>

  </div>

</section>



<section class="question-card">

  <div class="question-top">

    <div
      id="questionNo"
      class="question-number">

      第 1 題

    </div>


    <div
      id="typeName"
      class="type-name">
    </div>


    <div
      id="chapterLabel"
      class="chapter-label u1">

      第一單元

    </div>

  </div>


  <div
    id="questionText"
    class="question-text">
  </div>


  <div
    id="answerArea"
    class="answer-area">
  </div>


  <div
    id="feedback"
    class="feedback">

    <div
      id="feedbackHead"
      class="feedback-head">
    </div>


    <div
      id="feedbackBody"
      class="feedback-body">
    </div>

  </div>


  <div class="next-row">

    <button
      id="nextBtn"
      class="next-btn">

      下一題 ➜

    </button>

  </div>

</section>

</div>


<!-- =====================================================
     右側計算紙
     ===================================================== -->

<aside class="scratch-card">

  <div class="scratch-header">

    <div class="scratch-header-text">

      <div class="scratch-title">
        ✏️ 我的計算紙
      </div>

      <div class="scratch-subtitle">
        計算紙內只用來書寫
      </div>

    </div>


    <div class="scratch-tools">

      <button
        id="penBtn"
        class="tool-btn active">

        ✏️ 筆

      </button>


      <button
        id="eraserBtn"
        class="tool-btn">

        🧽 橡皮擦

      </button>


      <button
        id="clearBtn"
        class="tool-btn clear">

        🗑 清空

      </button>

    </div>

/* =========================================================
   共用工具
   ========================================================= */

function randInt(min,max){

  return Math.floor(
    Math.random()*
    (max-min+1)
  )+min;

}


function pick(arr){

  return arr[
    randInt(
      0,
      arr.length-1
    )
  ];

}


function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }

  return a;

}


function formatNum(n){

  return Number(n)
    .toLocaleString(
      "en-US"
    );

}


function clamp(
  n,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      n
    )
  );

}


function uniqueArray(arr){

  return [
    ...new Set(arr)
  ];

}


function trailingZeros(n){

  const s=
    String(
      Math.abs(n)
    );

  const m=
    s.match(
      /0+$/
    );

  return m
    ? m[0].length
    : 0;

}


function escapeHTML(str){

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   中文數字
   ========================================================= */

const CN_DIGITS=[

  "零",
  "一",
  "二",
  "三",
  "四",

  "五",
  "六",
  "七",
  "八",
  "九"

];


function sectionToChinese(num){

  if(num===0){

    return "";

  }


  const units=[

    "",
    "十",
    "百",
    "千"

  ];


  let result="";

  let zeroPending=false;


  for(
    let pos=3;
    pos>=0;
    pos--
  ){

    const base=
      Math.pow(
        10,
        pos
      );


    const digit=
      Math.floor(
        num/base
      )%10;


    if(digit===0){

      if(
        result &&
        num%base!==0
      ){

        zeroPending=true;

      }

    }

    else{

      if(zeroPending){

        result+="零";

        zeroPending=false;

      }


      if(
        !(
          digit===1 &&
          pos===1 &&
          result===""
        )
      ){

        result+=
          CN_DIGITS[digit];

      }


      result+=
        units[pos];

    }

  }


  return result;

}


function numberToChinese(n){

  n=
    Math.floor(
      Number(n)
    );


  if(n===0){

    return "零";

  }


  if(n<0){

    return "負"+
      numberToChinese(
        -n
      );

  }


  if(
    n>=100000000
  ){

    return String(n);

  }


  const wan=
    Math.floor(
      n/10000
    );


  const low=
    n%10000;


  if(wan===0){

    return sectionToChinese(
      low
    );

  }


  let result=
    sectionToChinese(
      wan
    )+
    "萬";


  if(low===0){

    return result;

  }


  if(low<1000){

    result+="零";

  }


  result+=
    sectionToChinese(
      low
    );


  return result;

}

function genU1Sequence(){

  const step=

function makeReadDistractors(n){

  const correct=
    numberToChinese(n);


  const arr=[
    correct
  ];


  if(
    correct.includes(
      "零"
    )
  ){

    arr.push(
      correct.replace(
        /零/g,
        "零零"
      )
    );


    arr.push(
      correct.replace(
        /零/g,
        ""
      )
    );

  }


  const candidates=[

    n+10000,
    n-10000,
    n+1000,
    n-1000,
    n+100

  ];


  candidates.forEach(x=>{

    if(
      x>=10000 &&
      x<100000000
    ){

      arr.push(
        numberToChinese(x)
      );

    }

  });


  return uniqueArray(
    arr
  );

}


function genU1Read(){

  let n;


  if(
    Math.random()<.55
  ){

    const wan=
      randInt(
        10,
        9999
      );


    const low=
      pick([

        randInt(1,99),

        randInt(100,999),

        randInt(1000,9999),

        randInt(1,9)*1000,

        randInt(1,9)*100

      ]);


    n=
      wan*10000+
      low;

  }

  else{

    n=
      randInt(
        10000,
        99999999
      );

  }


  const correct=
    numberToChinese(n);


  let choices=
    makeReadDistractors(
      n
    );


  while(
    choices.length<4
  ){

    const fake=
      numberToChinese(

        clamp(

          n+
          pick([
            -100000,
            100000,
            -1000,
            1000
          ]),

          10000,
          99999999

        )

      );


    if(
      !choices.includes(
        fake
      )
    ){

      choices.push(
        fake
      );

    }

  }


  choices=
    shuffle(
      choices.slice(
        0,
        4
      )
    );


  const wan=
    Math.floor(
      n/10000
    );


  const one=
    n%10000;


  return{

    unit:1,

    type:
      "大數讀法",

    answerType:
      "choice",

    question:

      `「<span class="number-highlight">${formatNum(n)}</span>」`

   ========================================================= */

function compareReason(
  a,
  b
){

  if(a===b){

    return`

      左右兩個數完全相同，
      所以填「＝」。

    `;

  }


  const sa=
    String(a);

  const sb=
    String(b);


  if(
    sa.length!==
    sb.length
  ){

    return`

      先比較位數。

      ${formatNum(a)}
      有 ${sa.length} 位，

      ${formatNum(b)}
      有 ${sb.length} 位。

      位數較多的數比較大。

    `;

  }


  let index=0;


  while(
    index<sa.length &&
    sa[index]===
    sb[index]
  ){

    index++;

  }


  return`

    兩個數的位數相同，
    所以從最高位開始比較。

    前面的數字都相同，
    比到第一個不同的位值時，

    ${sa[index]}

    和

    ${sb[index]}

    就能決定大小。

  `;

}

/* =========================================================
   第二單元共用：
   乘數位值拆解
   ========================================================= */

function getMultiplicationParts(
  a,
  b
){

  const digits=
    String(b)
    .split("")
    .reverse()
    .map(Number);


  const placeNames=[

    "個位",
    "十位",
    "百位",
    "千位"

  ];


  return digits.map(
    (digit,index)=>{

      const place=
        Math.pow(
          10,
          index
        );


      return{

        index:index,

        digit:digit,

        place:place,

        placeName:
          placeNames[index]
          ||
          "高位",

        multiplier:
          digit*
          place,

        rawProduct:
          a*
          digit,

        result:
          a*
          digit*
          place

      };

    }
  );

}


/* =========================================================
   各部分合起來
   ========================================================= */

function buildPartialSumVertical(
  parts,
  answer
){

  const values=
    parts.map(
      p=>p.result
    );


  const texts=
    values.map(
      n=>formatNum(n)
    );


  const width=
    Math.max(

      8,

      ...texts.map(
        t=>t.length
      ),

      formatNum(answer).length

    );


  const lines=[];


  texts.forEach(
    (text,index)=>{

      if(
        index===
        texts.length-1
      ){

        lines.push(
          "+"+
          text.padStart(
            width-1,
            " "
          )
        );

      }

      else{

        lines.push(
          text.padStart(
            width,
            " "
          )
        );

      }

    }
  );


  lines.push(
    "─".repeat(
      width
    )
  );


  lines.push(

    formatNum(answer)
    .padStart(
      width,
      " "
    )

  );


  return`

<pre class="vertical-sum">${lines.join("\n")}</pre>

`;

}


/* =========================================================
   第二單元：
   教材概念式多位數乘法詳解
   ========================================================= */

function textbookMultiplicationExplanation(
  a,
  b,
  answer
){

  const parts=
    getMultiplicationParts(
      a,
      b
    );


  let steps="";


  parts.forEach(
    (p,index)=>{


      const stepNumber=
        index+1;


      let unitWord=
        "一";


      if(p.index===1){

        unitWord="十";

      }

      else if(
        p.index===2
      ){

        unitWord="百";

      }

      else if(
        p.index===3
      ){

        unitWord="千";

      }


      let detail;


      if(p.digit===0){

        detail=`

          ${p.placeName}
          的數字是
          <b>0</b>，

          表示有

          <b>0 個${unitWord}</b>。

          <br>

          所以這一部分的積是

          <b>0</b>。

          ${
            p.index>0
            ?
            `
            <br>
            直式計算時，
            這一層可以省略，
            但下一個高位的乘積，
            仍然要從正確的位值開始記。
            `
            :
            ""
          }

        `;

      }

      else if(
        p.index===0
      ){

        detail=`

          ${a}
          ×
          ${p.digit}

          ＝

          <b>
            ${formatNum(
              p.rawProduct
            )}
          </b>

          ，是

          ${formatNum(
            p.rawProduct
          )}

          個一。

        `;

      }

      else{

        detail=`

          ${p.digit}
          在
          ${p.placeName}，

          表示

          <b>
            ${p.digit}
            個${unitWord}
          </b>。

          <br>

          ${a}
          ×
          ${p.digit}

          ＝

          ${formatNum(
            p.rawProduct
          )}

          ，是

          ${formatNum(
            p.rawProduct
          )}

          個${unitWord}。

          <br>

          也就是

          <b>
            ${formatNum(
              p.result
            )}
          </b>。

        `;

      }


      steps+=`

        <div class="explain-step-card">

          <div class="explain-step-title">

            ${stepNumber}．
            ${p.placeName}
            ${p.digit}
            的部分

          </div>


          <div class="explain-step-text">

            ${detail}

          </div>

        </div>

      `;

    }
  );


  const activeParts=
    parts.filter(
      p=>
        p.result!==0
    );


  const decomposition=
    parts
    .map(
      p=>
        p.multiplier
    )
    .join(
      " ＋ "
    );


  return`

    <div class="explanation-title">
      📘 詳解
    </div>


    <div class="explanation-intro">

      依照乘數的
      個位、十位、百位
      分別計算。

      <br>

      ${b}
      可以看成

      <b>
        ${decomposition}
      </b>

      合起來。

    </div>


    ${steps}


    <div class="explain-step-card">

      <div class="explain-step-title">

        ${parts.length+1}．
        把各部分合起來

      </div>


      ${
        buildPartialSumVertical(
          activeParts,
          answer
        )
      }

    </div>


    <div class="key-point">

      所以

      ${formatNum(a)}

      ×

      ${formatNum(b)}

      ＝

      <span class="answer-highlight">

        ${formatNum(answer)}

      </span>。

    </div>

  `;

}

function genU2Zero(){

  let aBase=
    randInt(
      2,
      9
    );


  let bBase=
    randInt(
      2,
      9
    );


  if(
    Math.random()<.30
  ){

    [
      aBase,
      bBase
    ]=
      pick([

        [5,4],
        [5,6],
        [8,5],
        [4,5],
        [2,5]

      ]);

  }


  const za=
    randInt(
      1,
      3
    );


  const zb=
    randInt(
      1,
      3
    );


  const a=
    aBase*
    Math.pow(
      10,
      za
    );


  const b=
    bBase*
    Math.pow(
      10,
      zb
    );


  const answer=
    a*b;


  const baseProduct=
    aBase*

    Math.random()<.5

function genU2Method(){

  const a=
    randInt(
      101,
      499
    );


  const b=
    randInt(
      21,
      79
    );


  const tensDigit=
    Math.floor(
      b/10
    );


  const ones=
    b%10;


  const tensValue=
    tensDigit*
    10;


  const answer=
    a*b;


  const correct=

    `${a}×${ones}＝${formatNum(a*ones)}；`
    +
    `${a}×${tensValue}＝${formatNum(a*tensValue)}；`
    +
    `兩個積相加＝${formatNum(answer)}`;


  const wrong1=

    `${a}×${ones}＝${formatNum(a*ones)}；`
    +
    `${a}×${tensDigit}＝${formatNum(a*tensDigit)}；`
    +
    `再把兩個積相加`;


  const wrong2=

    `只算 ${a}×${ones}，因為個位在最右邊`;


  const wrong3=

    `把 ${b} 看成 ${tensValue*10}＋${ones}`;


  const choices=
    shuffle([

      correct,

      wrong1,

      wrong2,

      wrong3

    ]);


  return{

    unit:2,

    type:
      "判斷正確算法",

    answerType:
      "choice",

    question:

      `計算 ${a} × ${b}，下面哪一個想法正確？`,

    choices:
      choices,

    answer:
      correct,

    explanation:`

      <div class="explanation-title">
        📘 詳解
      </div>


      <div class="explanation-intro">

        ${b}
        是

        ${ones}
        個一

        和

        ${tensDigit}
        個十

        合起來的。

      </div>


      <div class="math-box">

        ${b}

        ＝

        ${tensValue}

        ＋

        ${ones}

      </div>


      <div class="explain-step-card">

        <div class="explain-step-title">
          ① 個位的部分
        </div>

        ${a}
        ×
        ${ones}

        ＝

        <b>
          ${formatNum(
            a*ones
          )}
        </b>

      </div>


      <div class="explain-step-card">

        <div class="explain-step-title">
          ② 十位的部分
        </div>

        ${tensDigit}
        在十位，

        表示

        <b>
          ${tensValue}
        </b>，

        不是只有

        ${tensDigit}。

        <br>

        ${a}
        ×
        ${tensValue}

        ＝

        <b>
          ${formatNum(
            a*tensValue
          )}
        </b>

      </div>


      <div class="math-box">

        ${formatNum(
          a*ones
        )}

        ＋

        ${formatNum(
          a*tensValue
        )}

        ＝

        ${formatNum(
          answer
        )}

      </div>


      <div class="key-point">

        正確想法是：

        <br>

        <span class="answer-highlight">

          ${correct}

        </span>

      </div>
    `

  };

}

const U1_KEYS=
  UNIT1_TYPES

  .filter(
    x=>
      x[0]!=="all"
  )

  .map(
    x=>
      x[0]
  );


const U2_KEYS=
  UNIT2_TYPES

  .filter(
    x=>
      x[0]!=="all"
  )

  .map(
    x=>
      x[0]
  );


/* =========================================================
   選題
   ========================================================= */

function chooseGenerator(){

  const selected=
    typeSelect.value;


  if(
    currentUnit==="1"
  ){

    if(
      selected==="all"
    ){

      return generators[
        pick(
          U1_KEYS
        )
      ];

    }


    return generators[
      selected
    ];

  }


  if(
    currentUnit==="2"
  ){

    if(
      selected==="all"
    ){

      return generators[
        pick(
          U2_KEYS
        )
      ];

    }


    return generators[
      selected
    ];

  }


  if(
    selected==="unit1"
  ){

    return generators[
      pick(
        U1_KEYS
      )
    ];

  }


  if(
    selected==="unit2"
  ){

    return generators[
      pick(
        U2_KEYS
      )
    ];

  }


  return generators[

    pick([
      ...U1_KEYS,
      ...U2_KEYS
    ])

  ];

}

/* =========================================================
   作答欄
   ========================================================= */

function renderAnswerArea(){

  answerArea.innerHTML="";


  if(
    currentQuestion
    .answerType===
    "number"
  ){

    answerArea.innerHTML=`

      <div class="answer-row">

        <input
          id="answerInput"
          class="answer-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="請輸入答案"
        >


        <button
          id="submitAnswerBtn"
          class="submit-btn">

          送出答案

        </button>

      </div>


      <div class="answer-tip">

        可按 Enter 送出答案，
        輸入逗號也可以。

      </div>

    `;


    const input=
      document.getElementById(
        "answerInput"
      );


    document
    .getElementById(
      "submitAnswerBtn"
    )
    .addEventListener(
      "click",
      submitNumberAnswer
    );


    input.addEventListener(
      "keydown",
      e=>{

        if(
          e.key==="Enter"
        ){

          submitNumberAnswer();

        }

      }
    );


    setTimeout(()=>{

      input.focus();

    },80);

  }


  else if(
    currentQuestion
    .answerType===
    "choice"
  ){

    const grid=
      document
      .createElement(
        "div"
      );


    grid.className=
      "choice-grid";


    currentQuestion
    .choices
    .forEach(choice=>{

      const button=
        document
        .createElement(
          "button"
        );


      button.className=
        "choice-btn";


      button.textContent=
        choice;


      button.addEventListener(
        "click",
        ()=>{

          if(answered){

            return;

          }


          checkAnswer(
            choice
          );

        }
      );


      grid.appendChild(
        button
      );

    });


    answerArea
    .appendChild(
      grid
    );

  }


  else if(
    currentQuestion
    .answerType===
    "symbol"
  ){

    const grid=
      document
      .createElement(
        "div"
      );


    grid.className=
      "symbol-grid";


    [
      "<",
      "=",
      ">"
    ]
    .forEach(symbol=>{

      const button=
        document
        .createElement(
          "button"
        );


      button.className=
        "symbol-btn";


      button.textContent=
        symbol;


      button.addEventListener(
        "click",
        ()=>{

          if(answered){

            return;

          }


          checkAnswer(
            symbol
          );

        }
      );


      grid.appendChild(
        button
      );

    });


    answerArea
    .appendChild(
      grid
    );

  }

}


/* =========================================================
   數字作答
   ========================================================= */

function submitNumberAnswer(){

  if(answered){

    return;

  }


  const input=
    document.getElementById(
      "answerInput"
    );


  if(!input){

    return;

  }


  let value=
    input.value
    .trim()

    .replace(
      /,/g,
      ""
    )

    .replace(
      /，/g,
      ""
    );


  if(value===""){

    input.focus();

    return;

  }


  const number=
    Number(value);


  if(
    Number.isNaN(number)
  ){

    input.value="";

    input.placeholder=
      "請輸入數字";


    input.focus();

    return;

  }


  checkAnswer(
    number
  );

}


/* =========================================================
   判定答案
   ========================================================= */

function checkAnswer(
  userAnswer
){

  if(answered){

    return;

  }


  answered=true;


  let correct=false;


  if(
    currentQuestion
    .answerType===
    "number"
  ){

    correct=

      Number(userAnswer)
      ===
      Number(
        currentQuestion.answer
      );

  }

  else{

    correct=

      String(userAnswer)
      ===
      String(
        currentQuestion.answer
      );

  }


  stats.total++;

    feedback.className=

            )

          ${
            displayAnswer(

            )
          }

        </span>

  disableAnswerControls();

  updateStats();


  nextBtn

  setTimeout(()=>{

    feedback
    .scrollIntoView({

      behavior:
        "smooth",

      block:
        "nearest"

    });

  },100);

}


/* =========================================================
   顯示答案
   ========================================================= */

function displayAnswer(q){

  if(
    q.answerType===
    "number"
  ){

    return formatNum(
      q.answer
    );

  }


  return escapeHTML(
    q.answer
  );

}

   作答後鎖定

function disableAnswerControls(){

  answerArea
  .querySelectorAll(
    "button,input"
  )
  .forEach(el=>{

    el.disabled=true;

  });

}

   下一題
   ========================================================= */

nextBtn
.addEventListener(
  "click",
  ()=>{

    newQuestion();

  }
);


/* =========================================================
   統計
   ========================================================= */

function updateStats(){

  totalStat.textContent=
    stats.total;


  correctStat.textContent=
    stats.correct;


  const accuracy=
    stats.total===0
    ?
    0
    :
    Math.round(
      stats.correct/
      stats.total*
      100
    );


  accuracyStat.textContent=
    accuracy+"%";


  streakText.textContent=
    stats.streak;


  streakStat.textContent=
    stats.streak;


  progressBar.style.width=
    accuracy+"%";


  try{

    localStorage
    .setItem(

      "grade4_math_u1u2_stats",

      JSON.stringify(
        stats
      )

    );

  }

  catch(e){}

}


function loadStats(){

  try{

    const saved=
      localStorage
      .getItem(
        "grade4_math_u1u2_stats"
      );


    if(saved){

      const obj=
        JSON.parse(
          saved
        );


      stats={

        total:
          Number(
            obj.total
          )||0,

        correct:
          Number(
            obj.correct
          )||0,

        streak:
          Number(
            obj.streak
          )||0

      };

    }

  }

  catch(e){}


  updateStats();

}


/* =========================================================
   計算紙
   ========================================================= */

const canvas=
  document.getElementById(
    "scratchCanvas"
  );


const canvasWrap=
  document.getElementById(
    "canvasWrap"
  );


const ctx=
  canvas.getContext(
    "2d"
  );


const penBtn=
  document.getElementById(
    "penBtn"
  );


const eraserBtn=
  document.getElementById(
    "eraserBtn"
  );


const clearBtn=
  document.getElementById(
    "clearBtn"
  );


let drawing=false;

let tool="pen";

let lastX=0;

let lastY=0;


/* =========================================================
   計算紙：
   禁止右鍵、長按、選取、拖曳等
   ========================================================= */

function blockDefaultAction(e){

  e.preventDefault();

  e.stopPropagation();

  return false;

}


/*
  滑鼠右鍵選單
*/
canvas.addEventListener(
  "contextmenu",
  blockDefaultAction
);

canvasWrap.addEventListener(
  "contextmenu",
  blockDefaultAction
);


/*
  禁止選取
*/
canvas.addEventListener(
  "selectstart",
  blockDefaultAction
);

canvasWrap.addEventListener(
  "selectstart",
  blockDefaultAction
);


/*
  禁止拖曳
*/
canvas.addEventListener(
  "dragstart",
  blockDefaultAction
);

canvasWrap.addEventListener(
  "dragstart",
  blockDefaultAction
);


/*
  禁止中鍵、右鍵的 auxclick
*/
canvas.addEventListener(
  "auxclick",
  blockDefaultAction
);


/*
  iOS Safari 有些長按會送出
  contextmenu 或 gesture 事件
*/
canvas.addEventListener(
  "gesturestart",
  blockDefaultAction,
  {
    passive:false
  }
);

canvas.addEventListener(
  "gesturechange",
  blockDefaultAction,
  {
    passive:false
  }
);

canvas.addEventListener(
  "gestureend",
  blockDefaultAction,
  {
    passive:false
  }
);


/*
  防止觸控在畫布內
  觸發頁面移動
*/
canvas.addEventListener(
  "touchmove",
  e=>{

    if(e.cancelable){

      e.preventDefault();

    }

  },
  {
    passive:false
  }
);


/* =========================================================
   計算紙尺寸
   ========================================================= */

function resizeCanvas(){

  const rect=
    canvas
    .getBoundingClientRect();


  if(
    rect.width<=0 ||
    rect.height<=0
  ){

    return;

  }


  /*
    保存現有筆跡
  */

  const oldCanvas=
    document
    .createElement(
      "canvas"
    );


  oldCanvas.width=
    canvas.width;


  oldCanvas.height=
    canvas.height;


  if(
    canvas.width>0 &&
    canvas.height>0
  ){

    oldCanvas
    .getContext(
      "2d"
    )
    .drawImage(
      canvas,
      0,
      0
    );

  }


  const ratio=
    window
    .devicePixelRatio
    ||
    1;


  canvas.width=
    Math.round(
      rect.width*
      ratio
    );


  canvas.height=
    Math.round(
      rect.height*
      ratio
    );


  ctx.setTransform(

    ratio,
    0,
    0,
    ratio,
    0,
    0

  );


  ctx.lineCap=
    "round";


  ctx.lineJoin=
    "round";


  if(
    oldCanvas.width>0 &&
    oldCanvas.height>0
  ){

    ctx.drawImage(

      oldCanvas,

      0,
      0,

      oldCanvas.width,
      oldCanvas.height,

      0,
      0,

      rect.width,
      rect.height

    );

  }

}


/* =========================================================
   清空計算紙
   ========================================================= */

function clearScratchPad(){

  if(
    !canvas ||
    !ctx
  ){

    return;

  }


  ctx.save();


  ctx.setTransform(

    1,
    0,
    0,
    1,
    0,
    0

  );


  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  ctx.restore();

}


/* =========================================================
   計算紙座標
   ========================================================= */

function getPoint(e){

  const rect=
    canvas
    .getBoundingClientRect();


  return{

    x:
      e.clientX-
      rect.left,

    y:
      e.clientY-
      rect.top

  };

}


/* =========================================================
   開始書寫
   ========================================================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    /*
      滑鼠只允許左鍵。

      右鍵、中鍵
      完全不觸發書寫。
    */

    if(
      e.pointerType==="mouse"
      &&
      e.button!==0
    ){

      e.preventDefault();

      e.stopPropagation();

      return;

    }


    /*
      禁止瀏覽器接手
      這一次操作
    */

    if(e.cancelable){

      e.preventDefault();

    }


    e.stopPropagation();


    drawing=true;


    try{

      canvas
      .setPointerCapture(
        e.pointerId
      );

    }

    catch(err){}


    const p=
      getPoint(e);


    lastX=p.x;

    lastY=p.y;


    /*
      點一下也留下筆跡
    */

    ctx.beginPath();


    ctx.arc(

      p.x,
      p.y,

      tool==="pen"
      ? 1.6
      : 14,

      0,

      Math.PI*2

    );


    if(
      tool==="pen"
    ){

      ctx.globalCompositeOperation=
        "source-over";


      ctx.fillStyle=
        "#27333a";

    }

    else{

      ctx.globalCompositeOperation=
        "destination-out";

    }


    ctx.fill();

  }
);


/* =========================================================
   書寫
   ========================================================= */

canvas.addEventListener(
  "pointermove",
  e=>{

    if(!drawing){

      return;

    }


    if(e.cancelable){

      e.preventDefault();

    }


    e.stopPropagation();


    const p=
      getPoint(e);


    ctx.beginPath();


    ctx.moveTo(
      lastX,
      lastY
    );


    ctx.lineTo(
      p.x,
      p.y
    );


    if(
      tool==="pen"
    ){

      ctx.globalCompositeOperation=
        "source-over";


      ctx.strokeStyle=
        "#27333a";


      /*
        Apple Pencil
        有壓力值時稍微反映筆壓
      */

      if(
        e.pointerType==="pen"
        &&
        e.pressure>0
      ){

        ctx.lineWidth=
          2+
          e.pressure*
          2.2;

      }

      else{

        ctx.lineWidth=3;

      }

    }

    else{

      ctx.globalCompositeOperation=
        "destination-out";


      ctx.lineWidth=30;

    }


    ctx.stroke();


    lastX=p.x;

    lastY=p.y;

  }
);


/* =========================================================
   停止書寫
   ========================================================= */

function stopDrawing(e){

  drawing=false;


  if(
    e &&
    e.pointerId!==undefined
  ){

    try{

      if(
        canvas.hasPointerCapture(
          e.pointerId
        )
      ){

        canvas
        .releasePointerCapture(
          e.pointerId
        );

      }

    }

    catch(err){}

  }

}


canvas.addEventListener(
  "pointerup",
  stopDrawing
);


canvas.addEventListener(
  "pointercancel",
  stopDrawing
);


canvas.addEventListener(
  "lostpointercapture",
  ()=>{

    drawing=false;

  }
);


/* =========================================================
   筆
   ========================================================= */

penBtn.addEventListener(
  "click",
  ()=>{

    tool="pen";


    penBtn
    .classList
    .add(
      "active"
    );


    eraserBtn
    .classList
    .remove(
      "active"
    );

  }
);


/* =========================================================
   橡皮擦
   ========================================================= */

eraserBtn.addEventListener(
  "click",
  ()=>{

    tool="eraser";


    eraserBtn
    .classList
    .add(
      "active"
    );


    penBtn
    .classList
    .remove(
      "active"
    );

  }
);


/* =========================================================
   清空
   ========================================================= */

clearBtn.addEventListener(
  "click",
  ()=>{

    clearScratchPad();

  }
);


/* =========================================================
   Resize
   ========================================================= */

let resizeTimer=null;


window.addEventListener(
  "resize",
  ()=>{

    clearTimeout(
      resizeTimer
    );


    resizeTimer=
      setTimeout(
        resizeCanvas,
        180
      );

  }
);


/* =========================================================
   初始化
   ========================================================= */

buildTypeSelect();

loadStats();


setTimeout(()=>{

  resizeCanvas();

  newQuestion();

},80);

</script>
