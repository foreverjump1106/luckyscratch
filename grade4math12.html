<script>
"use strict";

/* =========================================================
   四上數學無限練習
   第一單元：一億以內的數
   第二單元：乘法
   ========================================================= */


/* =========================================================
   基本工具
   ========================================================= */

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[randInt(0,arr.length-1)];
}

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function formatNum(n){
  return Number(n).toLocaleString("en-US");
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function uniqueArray(arr){
  return [...new Set(arr)];
}

function trailingZeros(n){
  const s=String(Math.abs(n));
  const m=s.match(/0+$/);
  return m ? m[0].length : 0;
}


/* =========================================================
   中文數字
   0 ～ 99,999,999
   ========================================================= */

const CN_DIGITS=[
  "零","一","二","三","四",
  "五","六","七","八","九"
];

function sectionToChinese(num){
  if(num===0) return "";

  const units=["","十","百","千"];
  let result="";
  let zeroPending=false;

  for(let pos=3;pos>=0;pos--){
    const base=Math.pow(10,pos);
    const digit=Math.floor(num/base)%10;

    if(digit===0){
      if(result && num%base!==0){
        zeroPending=true;
      }
    }else{
      if(zeroPending){
        result+="零";
        zeroPending=false;
      }

      if(!(digit===1 && pos===1 && result==="")){
        result+=CN_DIGITS[digit];
      }

      result+=units[pos];
    }
  }

  return result;
}

function numberToChinese(n){
  n=Math.floor(Number(n));

  if(n===0) return "零";
  if(n<0) return "負"+numberToChinese(-n);

  if(n>=100000000){
    return String(n);
  }

  const wan=Math.floor(n/10000);
  const low=n%10000;

  if(wan===0){
    return sectionToChinese(low);
  }

  let result=sectionToChinese(wan)+"萬";

  if(low===0){
    return result;
  }

  if(low<1000){
    result+="零";
  }

  result+=sectionToChinese(low);

  return result;
}


/* =========================================================
   狀態
   ========================================================= */

let currentUnit="1";
let currentQuestion=null;
let questionCount=0;
let answered=false;

let stats={
  total:0,
  correct:0,
  streak:0
};


/* =========================================================
   題型設定
   ========================================================= */

const UNIT1_TYPES=[
  ["all","全部題型"],
  ["u1_place","位值與數字代表多少"],
  ["u1_compose","大數化聚"],
  ["u1_sequence","數詞序列"],
  ["u1_read","大數讀法"],
  ["u1_write","中文數字寫成數字"],
  ["u1_family","萬的家族與一的家族"],
  ["u1_compare","大數大小比較"],
  ["u1_addsub","大數加減"],
  ["u1_wanAddSub","以萬為單位加減"],
  ["u1_app","生活應用題"]
];

const UNIT2_TYPES=[
  ["all","全部題型"],
  ["u2_4x1","四位數 × 一位數"],
  ["u2_x2","乘以二位數"],
  ["u2_x3","乘以三位數"],
  ["u2_tens","乘以整十／整百"],
  ["u2_zero","乘法中 0 的規律"],
  ["u2_relation","乘法關係推理"],
  ["u2_method","判斷正確算法"],
  ["u2_app","乘法生活應用題"]
];

const MIX_TYPES=[
  ["all","第一、二單元全部混合"],
  ["unit1","只抽第一單元"],
  ["unit2","只抽第二單元"]
];


/* =========================================================
   DOM
   ========================================================= */

const typeSelect=document.getElementById("typeSelect");
const questionText=document.getElementById("questionText");
const typeName=document.getElementById("typeName");
const answerArea=document.getElementById("answerArea");
const feedback=document.getElementById("feedback");
const feedbackHead=document.getElementById("feedbackHead");
const explanation=document.getElementById("explanation");
const nextBtn=document.getElementById("nextBtn");
const chapterLabel=document.getElementById("chapterLabel");
const questionNo=document.getElementById("questionNo");

const totalStat=document.getElementById("totalStat");
const correctStat=document.getElementById("correctStat");
const accuracyStat=document.getElementById("accuracyStat");
const streakText=document.getElementById("streakText");
const progressBar=document.getElementById("progressBar");


/* =========================================================
   模式切換
   ========================================================= */

document.querySelectorAll(".unit-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".unit-btn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    currentUnit=btn.dataset.unit;

    buildTypeSelect();
    newQuestion();
  });
});

typeSelect.addEventListener("change",()=>{
  newQuestion();
});

function buildTypeSelect(){
  let data;

  if(currentUnit==="1"){
    data=UNIT1_TYPES;
  }else if(currentUnit==="2"){
    data=UNIT2_TYPES;
  }else{
    data=MIX_TYPES;
  }

  typeSelect.innerHTML="";

  data.forEach(([value,label])=>{
    const opt=document.createElement("option");
    opt.value=value;
    opt.textContent=label;
    typeSelect.appendChild(opt);
  });
}


/* =========================================================
   第一單元題目
   ========================================================= */

/* ---------- 位值 ---------- */

function genU1Place(){
  let n=randInt(10000,99999999);

  const s=String(n);
  const positions=[
    "個位","十位","百位","千位",

/* ---------- 大數讀法 ---------- */

function makeReadDistractors(n){
  const correct=numberToChinese(n);

  const arr=[correct];

  const s=String(n);

  // 常見錯誤：多念零
  arr.push(
    correct.replace(/零/g,"零零")
  );

  // 常見錯誤：漏念零
  arr.push(
    correct.replace(/零/g,"")
  );

  // 改動一個數字形成錯誤讀法
  let n2=n+10000;

  if(n2>=100000000){
    n2=n-10000;
  }

  arr.push(numberToChinese(n2));

  let n3=n+1000;

  if(n3>=100000000){
    n3=n-1000;
  }

  arr.push(numberToChinese(n3));

  return uniqueArray(arr)
    .filter(x=>x && x!==undefined)
    .slice(0,4);
}

function genU1Read(){
  let n;

  const special=Math.random();

  if(special<.4){
    const wan=randInt(10,9999);
    const low=pick([
      randInt(1,99),
      randInt(100,999),
      randInt(1000,9999)
    ]);

    n=wan*10000+low;
  }else{
    n=randInt(10000,99999999);
  }

  const correct=numberToChinese(n);

  let choices=makeReadDistractors(n);

  while(choices.length<4){
    const fake=numberToChinese(
      clamp(
        n+pick([-100000,100000,-1000,1000]),
        10000,
        99999999
      )
    );

    if(!choices.includes(fake)){
      choices.push(fake);
    }
  }

  choices=shuffle(choices);

  return {
    unit:1,
    type:"大數讀法",
    answerType:"choice",
    question:
      `「<span class="number-highlight">${formatNum(n)}</span>」`+
      `正確的讀法是哪一個？`,
    choices,
    answer:correct,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        大數可以由右往左，每 <b>4 位</b> 分成一組。
      </div>

      <div class="math-box">
        ${Math.floor(n/10000)} ｜ ${String(n%10000).padStart(4,"0")}

        萬的家族　｜　一的家族

      <div class="ex-step">
        先讀「萬的家族」，再讀「一的家族」。

      </div>

function multiplicationVertical(a,b){
  const product=a*b;

  return `
<pre class="vertical">${String(a)}
× ${String(b)}
${"─".repeat(Math.max(String(a).length,String(b).length+2))}
${String(product)}</pre>
  `;
}

function partialExplanation(a,b){
  const digits=String(b)
    .split("")
    .reverse()
    .map(Number);

  const parts=[];

  digits.forEach((digit,index)=>{
    if(digit===0) return;

    const place=Math.pow(10,index);

    parts.push({
      digit,
      value:digit*place,
      result:a*digit*place
    });
  });

  return parts;
}

  });

  const sum=parts
    .map(p=>formatNum(p.result))
    .join(" ＋ ");

  return {
    unit:2,
    type:"乘以三位數",
    answerType:"number",
    question:
      `${a} × ${b} ＝ □`,
    answer,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        三位數乘數要分成
        <b>幾個一、幾個十、幾個百</b>來計算。
      </div>

      ${partHtml}

      <div class="math-box">
        ${sum}
        ＝
        ${formatNum(answer)}
      </div>

      ${
        String(b).charAt(String(b).length-2)==="0"
        ? `
        <div class="ex-step">
          這一題乘數的十位是 0，
          代表有 <b>0 個十</b>，
          這一層的積是 0，可以省略，
          但百位乘出的數仍要從百位位置開始記。
        </div>
        `
        : ""
      }

      <div class="ex-step">
        答案是
        <span class="answer-highlight">${formatNum(answer)}</span>。
      </div>
    `
  };
}


/* ---------- 整十、整百 ---------- */

function genU2Tens(){
  const a=randInt(2,99);

  const factor=pick([
    randInt(1,9)*10,
    randInt(1,9)*100
  ]);

  const answer=a*factor;

  const zeroCount=trailingZeros(factor);
  const base=factor/Math.pow(10,zeroCount);

  return {
    unit:2,
    type:"乘以整十／整百",
    answerType:"number",
    question:
      `${a} × ${factor} ＝ □`,
    answer,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        ${factor} 可以看成
        ${base} 個
        ${zeroCount===1 ? "十" : "百"}。
      </div>

      <div class="math-box">
        先算：
        ${a} × ${base}
        ＝ ${a*base}
      </div>

      <div class="math-box">
        再乘 ${Math.pow(10,zeroCount)}：
        ${a*base} × ${Math.pow(10,zeroCount)}
        ＝ ${formatNum(answer)}
      </div>

      <div class="ex-step">
        答案是
        <span class="answer-highlight">${formatNum(answer)}</span>。
      </div>
    `
  };
}


/* ---------- 0 的規律 ---------- */

function genU2Zero(){
  const type=pick(["product","zeroCount"]);

  let aBase=randInt(2,9);
  let bBase=randInt(2,9);

  // 刻意讓一些題目產生額外的 0
  if(Math.random()<.28){
    [aBase,bBase]=pick([
      [5,4],
      [5,6],
      [8,5],
      [4,5],
      [2,5]
    ]);
  }

  const za=randInt(1,3);
  const zb=randInt(1,3);

  const a=aBase*Math.pow(10,za);
  const b=bBase*Math.pow(10,zb);

  const answer=a*b;

  if(type==="zeroCount"){
    const zeros=trailingZeros(answer);

    return {
      unit:2,
      type:"乘法中 0 的規律",
      answerType:"number",
      question:
        `${a} × ${b} 的答案末尾共有幾個 0？`,
      answer:zeros,
      explanation:`
        <div class="explanation-title">📘 詳解</div>

        <div class="ex-step">
          先不要急著把 0 補上，先算不是 0 的部分。
        </div>

        <div class="math-box">
          ${aBase} × ${bBase}
          ＝
          ${aBase*bBase}
        </div>

        <div class="ex-step">
          原本兩個乘數末尾共有
          ${za+zb} 個 0。
        </div>

        <div class="math-box">
          ${a} × ${b}
          ＝
          ${formatNum(answer)}
        </div>

        <div class="ex-step">
          注意：如果前面的
          ${aBase} × ${bBase}
          本身也產生 0，
          那個 0 也要算進去。
        </div>

        <div class="ex-step">
          所以積的末尾共有
          <span class="answer-highlight">${zeros} 個 0</span>。
        </div>
      `
    };
  }

  return {
    unit:2,
    type:"乘法中 0 的規律",
    answerType:"number",
    question:
      `${a} × ${b} ＝ □`,
    answer,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        先算不是 0 的部分：
      </div>

      <div class="math-box">
        ${aBase} × ${bBase}
        ＝
        ${aBase*bBase}
      </div>

      <div class="ex-step">
        再依位值把原本的 0 補回去。
      </div>

      <div class="math-box">
        ${a} × ${b}
        ＝
        ${formatNum(answer)}
      </div>

      <div class="ex-step">
        所以答案是
        <span class="answer-highlight">${formatNum(answer)}</span>。
      </div>
    `
  };
}


/* ---------- 乘法關係 ---------- */

function genU2Relation(){
  const a=randInt(12,99);

  const center=pick([
    randInt(2,9)*10,
    100,
    200,
    300
  ]);

  const delta=pick([-1,1]);

  const target=center+delta;

  const known=a*center;
  const answer=a*target;

  return {
    unit:2,
    type:"乘法關係推理",
    answerType:"number",
    question:
      `已知 ${a} × ${center} ＝ ${formatNum(known)}，`+
      `<br>${a} × ${target} ＝ □`,
    answer,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        ${target}
        比 ${center}
        ${delta>0 ? "多 1" : "少 1"}。
      </div>

      <div class="ex-step">
        所以 ${a} × ${target}
        會比 ${a} × ${center}
        ${delta>0 ? "多一個" : "少一個"}
        ${a}。
      </div>

      <div class="math-box">
        ${formatNum(known)}
        ${delta>0 ? "＋" : "－"}
        ${a}
        ＝
        ${formatNum(answer)}
      </div>

      <div class="ex-step">
        因此答案是
        <span class="answer-highlight">${formatNum(answer)}</span>。
      </div>
    `
  };
}


/* ---------- 判斷算法 ---------- */

function genU2Method(){
  const a=randInt(101,499);
  const b=randInt(21,79);

  const tens=Math.floor(b/10)*10;
  const ones=b%10;
  const answer=a*b;

  const correct=
    `${a}×${ones}＝${a*ones}；`+
    `${a}×${tens}＝${a*tens}；`+
    `兩個積相加＝${answer}`;

  const wrong1=
    `${a}×${ones}＝${a*ones}；`+
    `${a}×${Math.floor(b/10)}＝${a*Math.floor(b/10)}；`+
    `兩個積直接相加`;

  const wrong2=
    `${a}×${tens+ones} 只計算個位的 ${ones} 倍`;

  const wrong3=
    `把 ${b} 看成 ${tens*10}＋${ones}`;

  const choices=shuffle([
    correct,
    wrong1,
    wrong2,
    wrong3
  ]);

  return {
    unit:2,
    type:"判斷正確算法",
    answerType:"choice",
    question:
      `計算 ${a} × ${b}，下面哪一個想法正確？`,
    choices,
    answer:correct,
    explanation:`
      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        ${b} 是由
        <b>${Math.floor(b/10)} 個十</b>
        和
        <b>${ones} 個一</b>
        合成的。
      </div>

      <div class="math-box">
        ${b} ＝ ${tens} ＋ ${ones}
      </div>

      <div class="math-box">
        ${a} × ${ones}
        ＝ ${formatNum(a*ones)}
      </div>

      <div class="math-box">
        ${a} × ${tens}
        ＝ ${formatNum(a*tens)}
      </div>

      <div class="math-box">
        ${formatNum(a*ones)}
        ＋
        ${formatNum(a*tens)}
        ＝
        ${formatNum(answer)}
      </div>

      <div class="ex-step">
        最容易出錯的地方是：
        十位的 ${Math.floor(b/10)}
        代表的是
        <b>${tens}</b>，
        不是只有 ${Math.floor(b/10)}。
      </div>
    `
  };
}


/* ---------- 第二單元應用 ---------- */

function genU2App(){
  const templates=[

    ()=>{
      const price=randInt(1000,9000);
      const count=randInt(2,9);

      return {
        text:
          `一箱水果售價 ${price} 元，`+
          `買 ${count} 箱共要付多少元？`,

        b:count,

      };
    },

    ()=>{

      const count=randInt(11,99);

      return {
        text:
          `一輛遊覽車可以坐 ${per} 人，`+
          `${count} 輛最多可以坐多少人？`,
        a:per,
        b:count,
        unitWord:"人"
      };
    },

    ()=>{
      const per=randInt(101,999);
      const count=randInt(11,99);

      return {
        text:
          `工廠每天製作 ${per} 個零件，`+
          `連續生產 ${count} 天，共製作多少個？`,

          `一盒有 ${per} 顆棋子，`+
          `${count} 盒共有多少顆棋子？`,
        a:per,
        b:count,
        unitWord:"顆"
      };
    },

      const per=randInt(100,999);
      const count=pick([100,200,300,400,500]);

        text:
          `每袋米重 ${per} 公克，`+
          `${count} 袋共重多少公克？`,

        b:count,
        unitWord:"公克"
      };
    }

  ];

  const q=pick(templates)();

  const parts=partialExplanation(q.a,q.b);

      <div class="explanation-title">📘 詳解</div>

      <div class="ex-step">
        求「每一份有多少 × 有幾份」，

      <div class="math-box">
        ${q.a} × ${q.b}
      </div>

      ${
        q.b>=10
        ? `
          <div class="ex-step">
            可以依照乘數的個位、十位、百位分開計算：

      <div class="math-box">

  };
}


/* =========================================================
   題型生成器
   ========================================================= */

const generators={
  u1_place:genU1Place,
  u1_compose:genU1Compose,
  u1_sequence:genU1Sequence,
  u1_read:genU1Read,
  u1_write:genU1Write,
  u1_family:genU1Family,
  u1_compare:genU1Compare,
  u1_addsub:genU1AddSub,
  u1_wanAddSub:genU1WanAddSub,
  u1_app:genU1App,

  u2_4x1:genU24x1,
  u2_x2:genU2x2,
  u2_x3:genU2x3,
  u2_tens:genU2Tens,
  u2_zero:genU2Zero,
  u2_relation:genU2Relation,
  u2_method:genU2Method,
  u2_app:genU2App
};

const U1_KEYS=UNIT1_TYPES
  .filter(x=>x[0]!=="all")
  .map(x=>x[0]);

const U2_KEYS=UNIT2_TYPES
  .filter(x=>x[0]!=="all")
  .map(x=>x[0]);


/* =========================================================
   新題目
   ========================================================= */

function chooseGenerator(){
  const selected=typeSelect.value;

  if(currentUnit==="1"){
    if(selected==="all"){
      return generators[pick(U1_KEYS)];
    }

    return generators[selected];
  }

  if(currentUnit==="2"){
    if(selected==="all"){
      return generators[pick(U2_KEYS)];
    }

    return generators[selected];
  }

  if(currentUnit==="mix"){
    if(selected==="unit1"){
      return generators[pick(U1_KEYS)];
    }

    if(selected==="unit2"){
      return generators[pick(U2_KEYS)];
    }

    const all=[...U1_KEYS,...U2_KEYS];
    return generators[pick(all)];
  }
}

function newQuestion(){
  answered=false;
  questionCount++;

  feedback.className="feedback";
  feedbackHead.innerHTML="";
  explanation.innerHTML="";
  nextBtn.classList.remove("show");

  const gen=chooseGenerator();
  currentQuestion=gen();

  questionNo.textContent=`第 ${questionCount} 題`;
  typeName.textContent=currentQuestion.type;

  questionText.innerHTML=currentQuestion.question;

  if(currentQuestion.question.length>90){
    questionText.classList.add("small");
  }else{
    questionText.classList.remove("small");
  }

  if(currentQuestion.unit===1){
    chapterLabel.className="chapter-label u1";
    chapterLabel.textContent="🌍 第一單元　一億以內的數";
  }else{
    chapterLabel.className="chapter-label u2";
    chapterLabel.textContent="✖️ 第二單元　乘法";
  }

  renderAnswerArea();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   答案輸入
   ========================================================= */

function renderAnswerArea(){
  answerArea.innerHTML="";

  if(currentQuestion.answerType==="number"){
    answerArea.innerHTML=`
      <div class="answer-input-row">
        <input
          id="answerInput"
          class="answer-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="請輸入答案"
        >

        <button class="submit-btn" id="submitAnswerBtn">
          送出答案
        </button>
      </div>

      <div class="keyboard-tip">
        電腦可按 Enter 送出答案；輸入逗號也沒關係。
      </div>
    `;

    const input=document.getElementById("answerInput");

    document
      .getElementById("submitAnswerBtn")
      .addEventListener("click",()=>{
        submitNumberAnswer();
      });

    input.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        submitNumberAnswer();
      }
    });

    setTimeout(()=>input.focus(),50);
  }

  else if(currentQuestion.answerType==="choice"){
    const grid=document.createElement("div");
    grid.className="choice-grid";

    currentQuestion.choices.forEach(choice=>{
      const btn=document.createElement("button");
      btn.className="choice-btn";
      btn.textContent=choice;

      btn.addEventListener("click",()=>{
        if(answered) return;
        checkAnswer(choice,btn);
      });

      grid.appendChild(btn);
    });

    answerArea.appendChild(grid);
  }

  else if(currentQuestion.answerType==="symbol"){
    const grid=document.createElement("div");
    grid.className="symbol-grid";

    ["<","=",">"].forEach(symbol=>{
      const btn=document.createElement("button");
      btn.className="symbol-btn";
      btn.textContent=symbol;

      btn.addEventListener("click",()=>{
        if(answered) return;
        checkAnswer(symbol,btn);
      });

      grid.appendChild(btn);
    });

    answerArea.appendChild(grid);
  }
}

function submitNumberAnswer(){
  if(answered) return;

  const input=document.getElementById("answerInput");

  if(!input) return;

  let raw=input.value
    .trim()
    .replace(/,/g,"")
    .replace(/，/g,"");

  if(raw===""){
    input.focus();
    return;
  }

  const value=Number(raw);

  if(Number.isNaN(value)){
    input.value="";
    input.placeholder="請輸入數字";
    input.focus();
    return;
  }

  checkAnswer(value,input);
}


/* =========================================================
   判定
   ========================================================= */

function checkAnswer(userAnswer,element){
  if(answered) return;

  answered=true;

  let correct=false;

  if(currentQuestion.answerType==="number"){
    correct=Number(userAnswer)===Number(currentQuestion.answer);
  }else{
    correct=String(userAnswer)===String(currentQuestion.answer);
  }

  stats.total++;

  if(correct){
    stats.correct++;
    stats.streak++;

    feedback.className="feedback correct show";

    feedbackHead.innerHTML=
      `✅ 答對了！太棒了！`;

    explanation.innerHTML=`
      <div class="explanation-title">
        🌟 你的答案正確
      </div>

      <div class="ex-step">
        正確答案：
        <span class="answer-highlight">
          ${displayAnswer(currentQuestion)}
        </span>
      </div>

      <div class="ex-step">
        可以按「下一題」繼續挑戰。
      </div>
    `;
  }else{
    stats.streak=0;

    feedback.className="feedback wrong show";

    feedbackHead.innerHTML=
      `❌ 這題不對，再看看是哪一步出了問題`;

    explanation.innerHTML=`
      <div class="ex-step">
        你剛才的答案：
        <b>${escapeHTML(String(userAnswer))}</b>
      </div>

      <div class="ex-step">
        正確答案：
        <span class="answer-highlight">
          ${displayAnswer(currentQuestion)}
        </span>
      </div>

      ${currentQuestion.explanation}
    `;
  }

  disableAnswerControls();
  updateStats();

  nextBtn.classList.add("show");

  setTimeout(()=>{
    feedback.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });
  },100);
}

function displayAnswer(q){
  if(q.answerType==="number"){
    return formatNum(q.answer);
  }

  return escapeHTML(String(q.answer));
}

function disableAnswerControls(){
  answerArea
    .querySelectorAll("button,input")
    .forEach(el=>{
      el.disabled=true;
      el.style.cursor="default";
    });
}

function escapeHTML(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   下一題
   ========================================================= */

nextBtn.addEventListener("click",()=>{
  newQuestion();
});


/* =========================================================
   統計
   ========================================================= */

function updateStats(){
  totalStat.textContent=stats.total;
  correctStat.textContent=stats.correct;

  const accuracy=
    stats.total===0
    ? 0
    : Math.round(stats.correct/stats.total*100);

  accuracyStat.textContent=accuracy+"%";
  streakText.textContent=stats.streak;

  progressBar.style.width=accuracy+"%";

  try{
    localStorage.setItem(
      "grade4_math_u1u2_stats",
      JSON.stringify(stats)
    );
  }catch(e){}
}

function loadStats(){
  try{
    const saved=
      localStorage.getItem("grade4_math_u1u2_stats");

    if(saved){
      const obj=JSON.parse(saved);

      stats={
        total:Number(obj.total)||0,
        correct:Number(obj.correct)||0,
        streak:Number(obj.streak)||0
      };
    }
  }catch(e){}

  updateStats();
}


/* =========================================================
   計算紙 Canvas
   ========================================================= */

const canvas=document.getElementById("scratchCanvas");
const ctx=canvas.getContext("2d");

const penBtn=document.getElementById("penBtn");
const eraserBtn=document.getElementById("eraserBtn");
const clearBtn=document.getElementById("clearBtn");

let drawing=false;
let tool="pen";
let lastX=0;
let lastY=0;

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();

  if(rect.width<=0 || rect.height<=0) return;

  const ratio=window.devicePixelRatio || 1;

  // 先保存舊畫面
  let temp=null;

  if(canvas.width>0 && canvas.height>0){
    temp=document.createElement("canvas");
    temp.width=canvas.width;
    temp.height=canvas.height;

    const tctx=temp.getContext("2d");
    tctx.drawImage(canvas,0,0);
  }

  canvas.width=Math.round(rect.width*ratio);
  canvas.height=Math.round(rect.height*ratio);

  ctx.setTransform(ratio,0,0,ratio,0,0);

  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(temp){
    ctx.drawImage(
      temp,
      0,
      0,
      temp.width,
      temp.height,
      0,
      0,
      rect.width,
      rect.height
    );
  }
}

function getPoint(e){
  const rect=canvas.getBoundingClientRect();

  return {
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  };
}

canvas.addEventListener("pointerdown",e=>{
  drawing=true;

  canvas.setPointerCapture(e.pointerId);

  const p=getPoint(e);

  lastX=p.x;
  lastY=p.y;
});

canvas.addEventListener("pointermove",e=>{
  if(!drawing) return;

  const p=getPoint(e);

  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);

  if(tool==="pen"){
    ctx.globalCompositeOperation="source-over";
    ctx.strokeStyle="#263238";
    ctx.lineWidth=3;
  }else{
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=24;
  }

  ctx.stroke();

  lastX=p.x;
  lastY=p.y;
});

function endDrawing(){
  drawing=false;
}

canvas.addEventListener("pointerup",endDrawing);
canvas.addEventListener("pointercancel",endDrawing);
canvas.addEventListener("pointerleave",e=>{
  if(e.buttons===0){
    endDrawing();
  }
});

penBtn.addEventListener("click",()=>{
  tool="pen";

  penBtn.classList.add("active");
  eraserBtn.classList.remove("active");
});

eraserBtn.addEventListener("click",()=>{
  tool="eraser";

  eraserBtn.classList.add("active");
  penBtn.classList.remove("active");
});

clearBtn.addEventListener("click",()=>{
  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
});

let resizeTimer;

window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);

  resizeTimer=setTimeout(()=>{
    resizeCanvas();
  },150);
});


/* =========================================================
   初始化
   ========================================================= */

buildTypeSelect();
loadStats();

setTimeout(()=>{
  resizeCanvas();
  newQuestion();
},50);

</script>
