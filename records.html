<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>已抽獎紀錄</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  color:#443920;

  background:
    linear-gradient(
      145deg,
      #fffaf0,
      #efe3c2
    );
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

.page{
  width:min(1200px,100%);
  margin:auto;
  padding:18px 12px 45px;
}

/* ===============================
   上方
================================ */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;
  flex-wrap:wrap;

  margin-bottom:10px;
}

.back-btn,
.refresh-btn{
  border:0;

  border-radius:999px;

  padding:11px 18px;

  cursor:pointer;

  font-weight:900;
}

.back-btn{
  display:inline-flex;

  background:
    linear-gradient(
      #fffdf8,
      #e7dcc4
    );

  color:#604f31;

  box-shadow:
    0 5px 0 #b6a789;
}

.refresh-btn{
  color:white;

  background:
    linear-gradient(
      #5c7cc0,
      #304b84
    );

  box-shadow:
    0 5px 0 #21345e;
}

/* ===============================
   標題
================================ */

.hero{
  text-align:center;

  margin-bottom:18px;
}

.hero h1{
  margin:4px 0 5px;

  color:#304b84;

  font-size:
    clamp(34px,6vw,54px);

  font-weight:1000;
}

.hero p{
  margin:0;

  color:#755d2e;

  font-size:13px;

  font-weight:900;
}

/* ===============================
   統計
================================ */

.stats{
  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:10px;

  margin-bottom:16px;
}

.stat{
  padding:15px 10px;

  border-radius:18px;

  background:
    rgba(255,255,255,.82);

  box-shadow:
    0 9px 20px
    rgba(50,40,20,.09);

  text-align:center;
}

.stat-icon{
  font-size:28px;
}

.stat-number{
  margin-top:5px;

  color:#304b84;

  font-size:28px;

  font-weight:1000;
}

.stat-name{
  margin-top:4px;

  color:#716143;

  font-size:12px;

  font-weight:900;
}

/* ===============================
   工具
================================ */

.tools{
  padding:14px;

  margin-bottom:14px;

  border-radius:20px;

  background:
    rgba(255,255,255,.76);

  box-shadow:
    0 9px 20px
    rgba(50,40,20,.08);
}

.filters{
  display:flex;
  justify-content:center;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:12px;
}

.filter-btn{
  border:0;

  border-radius:999px;

  padding:9px 17px;

  cursor:pointer;

  color:#655437;

  background:#eee5d0;

  font-weight:1000;
}

.filter-btn.active{
  color:white;

  background:
    linear-gradient(
      #5c7cc0,
      #304b84
    );
}

.search-input{
  display:block;

  width:min(650px,100%);

  margin:auto;

  padding:12px 17px;

  border:
    2px solid #ddd0b8;

  border-radius:999px;

  outline:none;

  background:white;
}

.search-input:focus{
  border-color:#718cc6;
}

/* ===============================
   紀錄
================================ */

.records{
  display:flex;
  flex-direction:column;

  gap:10px;
}

.record{
  display:grid;

  grid-template-columns:
    165px
    1fr
    190px
    1fr;

  align-items:center;

  gap:13px;

  padding:13px 15px;

  border-radius:18px;

  background:
    rgba(255,255,255,.86);

  box-shadow:
    0 6px 16px
    rgba(50,40,20,.07);
}

.record-time{
  color:#725d38;

  font-size:13px;
  font-weight:900;

  line-height:1.55;
}

.student-name{
  color:#304b84;

  font-size:17px;
  font-weight:1000;
}

.student-note{
  margin-top:3px;

  color:#887756;

  font-size:11px;
  font-weight:800;
}

.game{
  font-size:16px;
  font-weight:1000;
}

.game.silver{
  color:#405b95;
}

.game.gold{
  color:#936507;
}

.prize{
  font-size:18px;
  font-weight:1000;

  color:#4c4028;
}

.remaining{
  margin-top:4px;

  color:#88765a;

  font-size:11px;

  font-weight:800;
}

.message{
  padding:35px 15px;

  border-radius:20px;

  background:
    rgba(255,255,255,.74);

  text-align:center;

  color:#745f39;

  font-size:17px;
  font-weight:900;
}

.note{
  margin-top:18px;

  text-align:center;

  color:#806e4d;

  font-size:11px;

  font-weight:800;
}

/* ===============================
   手機
================================ */

@media(max-width:900px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .record{
    grid-template-columns:
      130px 1fr;
  }

}

@media(max-width:560px){

  .record{
    display:block;
  }

  .record > div{
    margin-bottom:10px;
  }

}

</style>
</head>

<body>

<main class="page">

  <div class="topbar">

    <!--
      ★ 重要：
      你的首頁叫 mixscratch.html
    -->
    <a
      href="./mixscratch.html"
      class="back-btn"
    >
      ← 回刮刮樂首頁
    </a>


    <button
      class="refresh-btn"
      id="refreshBtn"
    >
      🔄 重新整理
    </button>

  </div>


  <section class="hero">

    <h1>
      📋 已抽獎紀錄
    </h1>

    <p>
      顯示使用 Google 登入後完成的抽獎紀錄
    </p>

  </section>


  <section class="stats">

    <div class="stat">

      <div class="stat-icon">
        🧾
      </div>

      <div
        class="stat-number"
        id="totalRecords"
      >
        0
      </div>

      <div class="stat-name">
        總抽獎紀錄
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🥈
      </div>

      <div
        class="stat-number"
        id="silverRecords"
      >
        0
      </div>

      <div class="stat-name">
        銀卡刮刮樂
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🥇
      </div>

      <div
        class="stat-number"
        id="goldRecords"
      >
        0
      </div>

      <div class="stat-name">
        金卡刮刮樂
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🥈🥤
      </div>

      <div
        class="stat-number"
        id="silverCardCount"
      >
        0
      </div>

      <div class="stat-name">
        已抽出銀卡
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🥇🍗
      </div>

      <div
        class="stat-number"
        id="goldCardCount"
      >
        0
      </div>

      <div class="stat-name">
        已抽出金卡
      </div>

    </div>

  </section>


  <section class="tools">

    <div class="filters">

      <button
        class="filter-btn active"
        data-filter="all"
      >
        📋 全部
      </button>

      <button
        class="filter-btn"
        data-filter="silver"
      >
        🥈 銀卡
      </button>

      <button
        class="filter-btn"
        data-filter="gold"
      >
        🥇 金卡
      </button>

    </div>


    <input
      type="search"
      id="searchInput"
      class="search-input"
      placeholder="🔍 搜尋學生姓名"
    >

  </section>


  <section
    class="records"
    id="recordsList"
  >

    <div class="message">
      ☁️ 正在讀取紀錄……
    </div>

  </section>


  <div class="note">
    ※ 訪客模式不會寫入 Firebase，因此不會出現在本頁。
  </div>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDUboz4Rif7KFFtrqnkb6HrSPBTHsvqfr8",

  authDomain:
    "luckyscratch-13477.firebaseapp.com",

  projectId:
    "luckyscratch-13477",

  storageBucket:
    "luckyscratch-13477.firebasestorage.app",

  messagingSenderId:
    "731061378453",

  appId:
    "1:731061378453:web:889728f895388088626a9c"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


const recordsList =
  document.getElementById(
    "recordsList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );

const totalRecords =
  document.getElementById(
    "totalRecords"
  );

const silverRecords =
  document.getElementById(
    "silverRecords"
  );

const goldRecords =
  document.getElementById(
    "goldRecords"
  );

const silverCardCount =
  document.getElementById(
    "silverCardCount"
  );

const goldCardCount =
  document.getElementById(
    "goldCardCount"
  );


let allRecords =
  [];

let currentFilter =
  "all";


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function formatTime(timestamp){

  if(
    !timestamp
    ||
    typeof timestamp.toDate !==
    "function"
  ){

    return{
      date:"--",
      time:"--"
    };

  }


  const d =
    timestamp.toDate();


  return{

    date:
      new Intl.DateTimeFormat(
        "zh-TW",
        {
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).format(d),

    time:
      new Intl.DateTimeFormat(
        "zh-TW",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit",
          hour12:false
        }
      ).format(d)

  };

}


function updateStats(){

  totalRecords.textContent =
    allRecords.length;


  silverRecords.textContent =
    allRecords.filter(
      r => r.gameType === "silver"
    ).length;


  goldRecords.textContent =
    allRecords.filter(
      r => r.gameType === "gold"
    ).length;


  silverCardCount.textContent =
    allRecords.filter(
      r =>
        r.prizeId === "silverCard"
        ||
        (
          r.gameType === "silver"
          &&
          r.prizeName === "銀卡"
        )
    ).length;


  goldCardCount.textContent =
    allRecords.filter(
      r =>
        r.prizeId === "goldCard"
        ||
        (
          r.gameType === "gold"
          &&
          r.prizeName === "金卡"
        )
    ).length;

}


function renderRecords(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  let rows =
    allRecords.filter(
      record => {

        const gameOK =
          currentFilter === "all"
          ||
          record.gameType ===
          currentFilter;


        const name =
          String(
            record.displayName
            ||
            ""
          )
          .toLowerCase();


        const searchOK =
          !keyword
          ||
          name.includes(
            keyword
          );


        return(
          gameOK
          &&
          searchOK
        );

      }
    );


  if(
    rows.length === 0
  ){

    recordsList.innerHTML = `

      <div class="message">

        🔍 目前沒有符合條件的抽獎紀錄

      </div>

    `;

    return;

  }


  recordsList.innerHTML =
    rows.map(
      record => {

        const t =
          formatTime(
            record.drawnAt
          );


        const gameType =
          record.gameType ===
          "gold"
          ?
          "gold"
          :
          "silver";


        const gameName =
          gameType ===
          "gold"
          ?
          "🥇 金卡刮刮樂"
          :
          "🥈 銀卡刮刮樂";


        return `

          <article class="record">

            <div class="record-time">

              📅 ${escapeHTML(t.date)}

              <br>

              🕒 ${escapeHTML(t.time)}

            </div>


            <div>

              <div class="student-name">

                👤
                ${
                  escapeHTML(
                    record.displayName
                    ||
                    "未命名學生"
                  )
                }

              </div>

              <div class="student-note">

                抽獎學生

              </div>

            </div>


            <div
              class="
                game
                ${gameType}
              "
            >

              ${gameName}

            </div>


            <div>

              <div class="prize">

                ${
                  escapeHTML(
                    record.prizeIcon
                    ||
                    "🎁"
                  )
                }

                ${
                  escapeHTML(
                    record.prizeName
                    ||
                    "未知獎項"
                  )
                }

              </div>


              <div class="remaining">

                ${
                  typeof record.remainingAfter
                  ===
                  "number"

                  ?

                  `抽完剩餘 ${record.remainingAfter} 張`

                  :

                  ""
                }

              </div>

            </div>

          </article>

        `;

      }
    ).join("");

}


async function loadRecords(){

  recordsList.innerHTML = `

    <div class="message">

      ☁️ 正在讀取 Firebase 紀錄……

    </div>

  `;


  try{

    const q =
      query(

        collection(
          db,
          "drawRecords"
        ),

        orderBy(
          "drawnAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(
        q
      );


    allRecords =
      snapshot.docs.map(
        doc => ({

          id:
            doc.id,

          ...doc.data()

        })
      );


    updateStats();

    renderRecords();

  }


  catch(error){

    console.error(
      error
    );


    recordsList.innerHTML = `

      <div class="message">

        ⚠️ 無法讀取抽獎紀錄

      </div>

    `;

  }

}


document
  .querySelectorAll(
    ".filter-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentFilter =
            button.dataset.filter;


          document
            .querySelectorAll(
              ".filter-btn"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          renderRecords();

        }
      );

    }
  );


searchInput.addEventListener(
  "input",
  renderRecords
);


refreshBtn.addEventListener(
  "click",
  loadRecords
);


loadRecords();

</script>

</body>
</html>
