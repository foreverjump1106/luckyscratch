<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>刮刮樂抽獎紀錄</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234c467f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='sans-serif' font-size='62' font-weight='700' fill='white'%3E錄%3C/text%3E%3C/svg%3E">

<style>
:root{
  --blue:#304b84;
  --purple:#4c467f;
  --gold:#a6750b;
  --cream:#fffaf0;
  --text:#443920;
  --green:#28724c;
  --shadow:0 14px 32px rgba(45,42,75,.14);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:18px 14px 50px;

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(145deg,#fffaf0,#eee2c0);
}

.container{
  width:min(1100px,100%);
  margin:auto;
}

.header{
  text-align:center;
}

h1{
  margin:5px 0;
  color:var(--purple);
  font-size:clamp(32px,6vw,48px);
}

.subtitle{
  color:#755f38;
  font-weight:900;
}

.top-actions,
.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:16px 0;
}

.btn{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  cursor:pointer;

  color:white;
  background:linear-gradient(#6f66af,#4c467f);

  font-weight:1000;

  box-shadow:0 5px 0 #36315d;
}

.btn:active{transform:translateY(3px)}

.btn.light{
  color:#604e2c;
  background:linear-gradient(#fffdf7,#e6dbc1);
  box-shadow:0 5px 0 #b1a17f;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin:18px 0;
}

.stat{
  padding:14px 8px;
  border-radius:18px;
  text-align:center;
  background:rgba(255,255,255,.86);
  box-shadow:var(--shadow);
  font-weight:900;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:27px;
  color:var(--purple);
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin:17px 0;
}

.search{
  width:100%;
  padding:12px 14px;
  border:2px solid #d8c28a;
  border-radius:14px;
  background:white;
  font-size:16px;
  font-weight:800;
}

.record-list{
  display:grid;
  gap:12px;
}

.record-card{
  display:grid;
  grid-template-columns:155px 1.1fr 1fr 170px;
  gap:12px;
  align-items:center;

  padding:14px 16px;

  border-radius:20px;
  background:rgba(255,255,255,.91);
  box-shadow:var(--shadow);

  border:2px solid rgba(170,135,45,.11);
}

.record-time{
  color:#75664a;
  font-size:13px;
  font-weight:900;
  line-height:1.5;
}

.record-student{
  color:var(--blue);
  font-size:18px;
  font-weight:1000;
}

.record-prize{
  font-weight:1000;
}

.record-game{
  margin-top:4px;
  color:#796333;
  font-size:13px;
  font-weight:900;
}

.redeem-area{
  text-align:center;
}

.redeem-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:10px 8px;

  cursor:pointer;

  color:white;
  background:linear-gradient(#4c9a6d,#28724c);

  font-size:14px;
  font-weight:1000;

  box-shadow:0 4px 0 #1d5437;
}

.redeem-btn:disabled{
  cursor:default;
  opacity:.72;
  box-shadow:none;
}

.redeemed{
  padding:9px 7px;
  border-radius:12px;

  color:var(--green);
  background:#e8f7ee;

  font-size:14px;
  font-weight:1000;
}

.no-redeem{
  color:#8b806c;
  font-size:13px;
  font-weight:900;
}

.empty,
.loading{
  padding:35px;
  border-radius:20px;
  text-align:center;
  background:rgba(255,255,255,.82);
  font-size:18px;
  font-weight:900;
}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}

  .record-card{
    grid-template-columns:1fr 1fr;
  }

  .redeem-area{
    grid-column:1/-1;
  }
}

@media(max-width:600px){
  .toolbar{
    grid-template-columns:1fr;
  }

  .record-card{
    grid-template-columns:1fr;
    text-align:left;
  }

  .redeem-area{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<main class="container">

  <header class="header">
    <h1>📋 刮刮樂抽獎紀錄</h1>

    <p class="subtitle">
      查看學生抽獎結果，並登記獎勵是否已經兌換。
    </p>
  </header>


  <div class="top-actions">
    <a class="btn light" href="./mixscratch.html">
      ← 回刮刮樂首頁
    </a>

    <button class="btn" id="refreshBtn">
      🔄 重新整理
    </button>
  </div>


  <section class="stats">

    <div class="stat">
      全部紀錄
      <strong id="totalStat">0</strong>
    </div>

    <div class="stat">
      銀卡紀錄
      <strong id="silverStat">0</strong>
    </div>

    <div class="stat">
      金卡紀錄
      <strong id="goldStat">0</strong>
    </div>

    <div class="stat">
      待兌換
      <strong id="pendingStat">0</strong>
    </div>

    <div class="stat">
      已兌換
      <strong id="redeemedStat">0</strong>
    </div>

  </section>


  <div class="filters">

    <button class="btn filter-btn" data-filter="all">
      全部
    </button>

    <button class="btn light filter-btn" data-filter="silver">
      🥈 銀卡
    </button>

    <button class="btn light filter-btn" data-filter="gold">
      🥇 金卡
    </button>

  </div>


  <div class="toolbar">

    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="搜尋座號或姓名，例如：13、趙安褕"
    >

    <button
      class="btn light"
      id="clearSearchBtn"
    >
      清除搜尋
    </button>

  </div>


  <div
    class="loading"
    id="loadingBox"
  >
    正在讀取 Firebase 抽獎紀錄……
  </div>


  <section
    class="record-list"
    id="recordList"
  ></section>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDUboz4Rif7KFFtrqnkb6HrSPBTHsvqfr8",

  authDomain:
    "luckyscratch-13477.firebaseapp.com",

  projectId:
    "luckyscratch-13477",

  storageBucket:
    "luckyscratch-13477.firebasestorage.app",

  messagingSenderId:
    "731061378453",

  appId:
    "1:731061378453:web:889728f895388088626a9c"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(
    app
  );


const recordList =
  document.getElementById(
    "recordList"
  );

const loadingBox =
  document.getElementById(
    "loadingBox"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );

const clearSearchBtn =
  document.getElementById(
    "clearSearchBtn"
  );

const totalStat =
  document.getElementById(
    "totalStat"
  );

const silverStat =
  document.getElementById(
    "silverStat"
  );

const goldStat =
  document.getElementById(
    "goldStat"
  );

const pendingStat =
  document.getElementById(
    "pendingStat"
  );

const redeemedStat =
  document.getElementById(
    "redeemedStat"
  );


let records =
  [];

let currentFilter =
  "all";


function isRedeemable(
  item
){

  return ![
    "again",
    "none"
  ].includes(
    item.prizeType
  );

}


function formatDateTime(
  timestamp
){

  if(
    !timestamp
  ){

    return "時間讀取中";
  }


  const date =
    timestamp.toDate
    ?
    timestamp.toDate()
    :
    new Date(
      timestamp
    );


  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }
  );

}


function studentLabel(
  item
){

  if(
    item.seatNumber
    &&
    item.studentName
  ){

    return `${item.seatNumber}號 ${item.studentName}`;
  }


  /*
    相容舊版 Google 登入紀錄
  */
  return item.studentName
    ||
    item.displayName
    ||
    "未命名學生";

}


function updateStats(){

  totalStat.textContent =
    records.length;


  silverStat.textContent =
    records.filter(
      r =>
        r.gameType ===
        "silver"
    ).length;


  goldStat.textContent =
    records.filter(
      r =>
        r.gameType ===
        "gold"
    ).length;


  const redeemable =
    records.filter(
      isRedeemable
    );


  pendingStat.textContent =
    redeemable.filter(
      r =>
        r.redeemed !==
        true
    ).length;


  redeemedStat.textContent =
    redeemable.filter(
      r =>
        r.redeemed ===
        true
    ).length;

}


function render(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    records.filter(
      item => {

        if(
          currentFilter !==
          "all"
          &&
          item.gameType !==
          currentFilter
        ){

          return false;

        }


        if(
          keyword
        ){

          const haystack =
            [
              item.seatNumber,
              item.studentName,
              item.displayName,
              item.prizeName,
              item.gameName
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


          if(
            !haystack.includes(
              keyword
            )
          ){

            return false;

          }

        }


        return true;

      }
    );


  if(
    filtered.length ===
    0
  ){

    recordList.innerHTML = `

      <div class="empty">
        目前沒有符合條件的抽獎紀錄。
      </div>

    `;

    return;

  }


  recordList.innerHTML =
    filtered
      .map(
        item => {

          const rewardAction =
            isRedeemable(
              item
            )

            ?

            (
              item.redeemed ===
              true

              ?

              `

                <div class="redeemed">

                  ✅ 獎勵已兌換

                  ${
                    item.redeemedAt

                    ?

                    `<br><span style="font-size:11px;">
                      ${formatDateTime(item.redeemedAt)}
                    </span>`

                    :

                    ""
                  }

                </div>

              `

              :

              `

                <button
                  class="redeem-btn"
                  data-redeem-id="${item.id}"
                >
                  🎁 標記獎勵已兌換
                </button>

              `
            )

            :

            `

              <div class="no-redeem">

                ${
                  item.prizeType ===
                  "again"

                  ?

                  "🎟️ 再抽一次，不需兌換"

                  :

                  "🍀 再接再厲，不需兌換"
                }

              </div>

            `;


          return `

            <article class="record-card">

              <div class="record-time">
                📅 ${formatDateTime(item.drawnAt)}
              </div>


              <div class="record-student">
                👤 ${studentLabel(item)}
              </div>


              <div class="record-prize">

                ${item.prizeIcon || "🎁"}
                ${item.prizeName || "未記錄獎項"}

                <div class="record-game">
                  ${
                    item.gameType ===
                    "gold"

                    ?

                    "🥇"

                    :

                    "🥈"
                  }

                  ${item.gameName || ""}
                </div>

              </div>


              <div class="redeem-area">
                ${rewardAction}
              </div>

            </article>

          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      "[data-redeem-id]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const id =
              button.dataset.redeemId;


            const item =
              records.find(
                r =>
                  r.id ===
                  id
              );


            if(
              !item
            ){

              return;

            }


            const ok =
              window.confirm(
                `確定「${studentLabel(item)}」的「${item.prizeName}」已經交給學生了嗎？`
              );


            if(
              !ok
            ){

              return;

            }


            button.disabled =
              true;

            button.textContent =
              "儲存中……";


            try{

              await updateDoc(

                doc(
                  db,
                  "drawRecords",
                  id
                ),

                {
                  redeemed:
                    true,

                  redeemedAt:
                    serverTimestamp()
                }

              );


              await loadRecords();

            }


            catch(error){

              console.error(
                error
              );


              alert(
                "標記兌換失敗，請確認 Firestore Rules 是否允許 redeemed / redeemedAt 更新。"
              );


              button.disabled =
                false;

              button.textContent =
                "🎁 標記獎勵已兌換";

            }

          }
        );

      }
    );

}


async function loadRecords(){

  loadingBox.classList.remove(
    "hidden"
  );


  recordList.innerHTML =
    "";


  try{

    const snapshot =
      await getDocs(

        query(
          collection(
            db,
            "drawRecords"
          ),
          orderBy(
            "drawnAt",
            "desc"
          )
        )

      );


    records =
      snapshot.docs.map(
        snapshotDoc => ({
          id:
            snapshotDoc.id,

          ...snapshotDoc.data()
        })
      );


    updateStats();

    render();


    loadingBox.style.display =
      "none";

  }


  catch(error){

    console.error(
      error
    );


    loadingBox.style.display =
      "block";

    loadingBox.textContent =
      "⚠️ 抽獎紀錄讀取失敗，請確認 Firebase Firestore 規則與網路連線。";

  }

}


document
  .querySelectorAll(
    ".filter-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentFilter =
            button.dataset.filter;


          document
            .querySelectorAll(
              ".filter-btn"
            )
            .forEach(
              b =>
                b.classList.add(
                  "light"
                )
            );


          button.classList.remove(
            "light"
          );


          render();

        }
      );

    }
  );


searchInput.addEventListener(
  "input",
  render
);


clearSearchBtn.addEventListener(
  "click",
  () => {

    searchInput.value =
      "";

    render();

  }
);


refreshBtn.addEventListener(
  "click",
  loadRecords
);


loadRecords();

</script>

</body>
</html>
