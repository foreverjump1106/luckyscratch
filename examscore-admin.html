/* =========================

/* =========================

$("loginBtn").addEventListener(

/* =========================
   SHA-256 studentKey
========================= */

async function createStudentKey(
  birthMMDD,
  idLast5
) {

  const raw =
    `exam-score-v1|${birthMMDD}|${idLast5}`;

  const data =
    new TextEncoder()
      .encode(raw);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return Array.from(
    new Uint8Array(hash)
  )
    .map(
      byte =>
        byte
          .toString(16)
          .padStart(2, "0")
    )
    .join("");

}


/* =========================
   格式化
========================= */

function padMMDD(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "";
  }

  const text =
    String(value)
      .replace(/\D/g, "");

  return text.padStart(
    4,
    "0"
  ).slice(-4);

}


function padLast5(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "";
  }

  const text =
    String(value)
      .replace(/\D/g, "");

  return text.padStart(
    5,
    "0"
  ).slice(-5);

}


function numberValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : null;

}


function isValidMMDD(value) {

  if (!/^\d{4}$/.test(value)) {
    return false;
  }

  const month =
    Number(value.slice(0,2));

  const day =
    Number(value.slice(2,4));

  const days = [
    31,29,31,30,31,30,
    31,31,30,31,30,31
  ];

  return (
    month >= 1 &&
    month <= 12 &&
    day >= 1 &&
    day <= days[month - 1]
  );

}


function formatScore(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  if (
    Number.isInteger(
      Number(value)
    )
  ) {
    return String(value);
  }

  return Number(value)
    .toFixed(2)
    .replace(/\.?0+$/, "");

}


/* =========================
   工作表名稱 →
   考試資訊
========================= */

function chineseNumberToInt(value) {

  const map = {
    "一": 1,
    "二": 2,
    "三": 3
  };

  return map[value] ||
    Number(value) ||
    null;

}


function parseSheetName(
  sheetName
) {

  const match =
    sheetName.match(
      /^(\d{3})(上|下)第([一二三123])次段考$/
    );

  if (!match) {
    return null;
  }

  const schoolYear =
    Number(match[1]);

  const semester =
    match[2] === "上"
      ? 1
      : 2;

  const examNo =
    chineseNumberToInt(
      match[3]
    );

  if (!examNo) {
    return null;
  }

  const examCode =
    `${schoolYear}-${semester}-exam${examNo}`;

  const examName =
    `${schoolYear}學年度${semester === 1 ? "上" : "下"}學期第${["","一","二","三"][examNo]}次段考`;

  return {
    schoolYear,
    semester,
    examNo,
    examCode,
    examName
  };

}


/* =========================
   自動判斷班級
========================= */

function getClassCode(
  schoolYear
) {

  const baseYear =
    Number(
      $("baseYear").value
    );

  const baseGrade =
    Number(
      $("baseGrade").value
    );

  const suffix =
    $("classSuffix").value
      .trim()
      .padStart(2,"0");

  const grade =
    baseGrade +
    (
      schoolYear -
      baseYear
    );

  return `${grade}${suffix}`;

}


/* =========================
   Excel 解析
========================= */

$("parseBtn").addEventListener(
  "click",
  async () => {

    clearMessage(
      $("excelMessage")
    );

    $("sheetList").innerHTML = "";
    $("importBtn").disabled = true;

    const file =
      $("excelFile").files[0];

    if (!file) {

      showMessage(
        $("excelMessage"),
        "請先選擇 Excel 檔案。",
        "error"
      );

      return;
    }

    try {

      const buffer =
        await file.arrayBuffer();

      const workbook =
        XLSX.read(
          buffer,
          {
            type: "array",
            cellDates: false
          }
        );

      const exams = [];

      for (
        const sheetName
        of workbook.SheetNames
      ) {

        const examInfo =
          parseSheetName(sheetName);

        if (!examInfo) {

          exams.push({
            sheetName,
            valid: false,
            errors: [
              "工作表名稱無法辨識"
            ]
          });

          continue;
        }

        const worksheet =
          workbook.Sheets[
            sheetName
          ];

        const rows =
          XLSX.utils.sheet_to_json(
            worksheet,
            {
              header: 1,
              raw: true,
              defval: null
            }
          );

        if (rows.length < 2) {

          exams.push({
            sheetName,
            valid: false,
            errors: [
              "工作表沒有資料"
            ]
          });

          continue;
        }

        const classCode =
          getClassCode(
            examInfo.schoolYear
          );

        const studentRows = [];

        let averageRow = null;

        for (
          let rowIndex = 1;
          rowIndex < rows.length;
          rowIndex++
        ) {

          const row =
            rows[rowIndex];

          if (!row) {
            continue;
          }

          const firstCell =
            String(
              row[0] ?? ""
            ).trim();

          if (
            firstCell ===
            "各科平均"
          ) {

            averageRow = row;
            continue;

          }

          if (!firstCell) {
            continue;
          }

          const seat =
            Number(row[0]);

          if (
            !Number.isInteger(seat) ||
            seat <= 0
          ) {
            continue;
          }

          const birthMMDD =
            padMMDD(row[2]);

          const idLast5 =
            padLast5(row[3]);

          const studentKey =
            await createStudentKey(
              birthMMDD,
              idLast5
            );

          const errors = [];

          if (!row[1]) {
            errors.push("姓名空白");
          }

          if (
            !isValidMMDD(
              birthMMDD
            )
          ) {
            errors.push(
              "出生月日格式錯誤"
            );
          }

          if (
            !/^\d{5}$/.test(
              idLast5
            )
          ) {
            errors.push(
              "末五碼格式錯誤"
            );
          }

          const scores = [
            row[4],
            row[5],
            row[6],
            row[7],
            row[8]
          ].map(numberValue);

          if (
            scores.some(
              value =>
                value === null
            )
          ) {
            errors.push(
              "五科成績不完整"
            );
          }

          studentRows.push({

            studentKey,

            classCode,

            seat:
              String(seat)
                .padStart(2,"0"),

            name:
              String(row[1] ?? "")
                .trim(),

            birthMMDD,

            idLast5,

            chinese:
              numberValue(row[4]),

            english:
              numberValue(row[5]),

            math:
              numberValue(row[6]),

            science:
              numberValue(row[7]),

            social:
              numberValue(row[8]),

            total:
              numberValue(row[9]),

            average:
              numberValue(row[10]),

            rank:
              numberValue(row[11]),

            errors

          });

        }

        const errors = [];

        if (
          studentRows.length === 0
        ) {
          errors.push(
            "沒有找到學生資料"
          );
        }

        if (!averageRow) {
          errors.push(
            "找不到各科平均列"
          );
        }

        const exam = {

          ...examInfo,

          sheetName,

          classCode,

          students:
            studentRows,

          stats:
            averageRow
              ? {
                  chineseAvg:
                    numberValue(
                      averageRow[4]
                    ),

                  englishAvg:
                    numberValue(
                      averageRow[5]
                    ),

                  mathAvg:
                    numberValue(
                      averageRow[6]
                    ),

                  scienceAvg:
                    numberValue(
                      averageRow[7]
                    ),

                  socialAvg:
                    numberValue(
                      averageRow[8]
                    ),

                  totalAvg:
                    numberValue(
                      averageRow[9]
                    ),

                  averageAvg:
                    numberValue(
                      averageRow[10]
                    )
                }
              : null,

          errors,

          valid:
            errors.length === 0
            &&
            studentRows.every(
              student =>
                student.errors.length === 0
            )

        };

        exams.push(exam);

      }

      parsedExams = exams;

      renderParsedSheets();

      const validExams =
        parsedExams.filter(
          exam => exam.valid
        );

      const invalidExams =
        parsedExams.length -
        validExams.length;

      if (
        validExams.length === 0
      ) {

        showMessage(
          $("excelMessage"),
          "沒有可匯入的段考資料。",
          "error"
        );

        return;
      }

      if (invalidExams > 0) {

        showMessage(
          $("excelMessage"),
          `解析完成，但有 ${invalidExams} 個工作表需要檢查。`,
          "error"
        );

        $("importBtn").disabled =
          true;

      } else {

        showMessage(
          $("excelMessage"),
          `成功解析 ${validExams.length} 次段考，可以同步到 Firebase。`,
          "success"
        );

        $("importBtn").disabled =
          false;

      }

    } catch (error) {

      console.error(error);

      showMessage(
        $("excelMessage"),
        "Excel 解析失敗，請確認檔案格式。",
        "error"
      );

    }

  }
);


/* =========================
   顯示解析結果
========================= */

function renderParsedSheets() {

  const container =
    $("sheetList");

  container.innerHTML = "";

  parsedExams.forEach(
    exam => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "sheet-card";

      if (!exam.valid) {

        const allErrors = [
          ...(exam.errors || [])
        ];

        if (exam.students) {

          exam.students.forEach(
            student => {

              if (
                student.errors &&
                student.errors.length
              ) {

                allErrors.push(
                  `${student.seat || "?"}號 ${student.name || ""}：${student.errors.join("、")}`
                );

              }

            }
          );

        }

        div.innerHTML = `
          <div class="sheet-title">
            ${escapeHtml(exam.sheetName)}
          </div>

          <div class="sheet-info">
            <span class="sheet-error">
              ✕ 無法匯入
            </span>
            <br>
            ${escapeHtml(allErrors.join("；"))}
          </div>
        `;

      } else {

        div.innerHTML = `
          <div class="sheet-title">
            ${escapeHtml(exam.examName)}
          </div>

          <div class="sheet-info">

            <span class="sheet-ok">
              ✓ 資料正常
            </span>

            <br>

            工作表：
            ${escapeHtml(exam.sheetName)}

            <br>

            班級：
            ${escapeHtml(exam.classCode)}

            <br>

            有效學生：
            ${exam.students.length} 人

            <br>

            班平均：
            ${formatScore(exam.stats.averageAvg)}

          </div>
        `;

      }

      container.appendChild(div);

    }
  );

}


/* =========================
   匯入 Firebase
========================= */

$("importBtn").addEventListener(
  "click",
  async () => {

    clearMessage(
      $("excelMessage")
    );

    const user =
      auth.currentUser;

    if (
      !user ||
      user.uid !== ADMIN_UID
    ) {

      showMessage(
        $("excelMessage"),
        "教師登入狀態已失效。",
        "error"
      );

      return;
    }

    const exams =
      parsedExams.filter(
        exam => exam.valid
      );

    if (!exams.length) {

      showMessage(
        $("excelMessage"),
        "沒有可以同步的資料。",
        "error"
      );

      return;
    }

    const totalResults =
      exams.reduce(
        (sum, exam) =>
          sum +
          exam.students.length,
        0
      );

    if (
      !confirm(
        `即將同步 ${exams.length} 次段考，共 ${totalResults} 筆學生成績。\n\n已存在的相同考次會更新。\n\n確定繼續嗎？`
      )
    ) {
      return;
    }

    $("importBtn").disabled =
      true;

    showMessage(
      $("excelMessage"),
      "正在同步 Firebase，請稍候……",
      "info"
    );

    try {

      /*
        studentMap：
        同一位學生六次只寫一次 students 文件。

        取最新學年度的資料當 currentClass/currentSeat。
      */

      const studentMap =
        new Map();

      exams.forEach(
        exam => {

          exam.students.forEach(
            student => {

              const existing =
                studentMap.get(
                  student.studentKey
                );

              if (
                !existing ||
                exam.schoolYear >
                existing.schoolYear ||
                (
                  exam.schoolYear ===
                    existing.schoolYear
                  &&
                  exam.semester >
                    existing.semester
                ) ||
                (
                  exam.schoolYear ===
                    existing.schoolYear
                  &&
                  exam.semester ===
                    existing.semester
                  &&
                  exam.examNo >
                    existing.examNo
                )
              ) {

                studentMap.set(
                  student.studentKey,
                  {
                    student,
                    schoolYear:
                      exam.schoolYear,
                    semester:
                      exam.semester,
                    examNo:
                      exam.examNo
                  }
                );

              }

            }
          );

        }
      );


      const operations = [];


      /*
        學生基本資料
      */

      studentMap.forEach(
        item => {

          const student =
            item.student;

          operations.push({
            ref:
              doc(
                db,
                "students",
                student.studentKey
              ),

            data: {
              name:
                student.name,

              currentClass:
                student.classCode,

              currentSeat:
                student.seat,

              latestSchoolYear:
                item.schoolYear,

              updatedAt:
                serverTimestamp()
            }
          });

        }
      );


      /*
        各次段考
      */

      exams.forEach(
        exam => {

          /*
            班級統計
          */

          operations.push({

            ref:
              doc(
                db,
                "examStats",
                exam.examCode
              ),

            data: {

              examCode:
                exam.examCode,

              examName:
                exam.examName,

              sheetName:
                exam.sheetName,

              schoolYear:
                exam.schoolYear,

              semester:
                exam.semester,

              examNo:
                exam.examNo,

              classCode:
                exam.classCode,

              studentCount:
                exam.students.length,

              ...exam.stats,

              updatedAt:
                serverTimestamp()

            }

          });


          /*
            學生成績
          */

          exam.students.forEach(
            student => {

              operations.push({

                ref:
                  doc(
                    db,
                    "examResults",
                    exam.examCode,
                    "students",
                    student.studentKey
                  ),

                data: {

                  studentKey:
                    student.studentKey,

                  examCode:
                    exam.examCode,

                  examName:
                    exam.examName,

                  schoolYear:
                    exam.schoolYear,

                  semester:
                    exam.semester,

                  examNo:
                    exam.examNo,

                  classCode:
                    exam.classCode,

                  seat:
                    student.seat,

                  name:
                    student.name,

                  chinese:
                    student.chinese,

                  english:
                    student.english,

                  math:
                    student.math,

                  science:
                    student.science,

                  social:
                    student.social,

                  total:
                    student.total,

                  average:
                    student.average,

                  rank:
                    student.rank,

                  updatedAt:
                    serverTimestamp()

                }

              });

            }
          );

        }
      );


      /*
        Firestore batch 上限 500，
        我們分批 400 筆。
      */

      const chunkSize = 400;

      for (
        let index = 0;
        index < operations.length;
        index += chunkSize
      ) {

        const chunk =
          operations.slice(
            index,
            index + chunkSize
          );

        const batch =
          writeBatch(db);

        chunk.forEach(
          operation => {

            batch.set(
              operation.ref,
              operation.data,
              {
                merge: true
              }
            );

          }
        );

        await batch.commit();

      }


      showMessage(
        $("excelMessage"),
        `同步完成！共完成 ${exams.length} 次段考、${totalResults} 筆學生成績。`,
        "success"
      );

      await loadExamList();

    } catch (error) {

      console.error(
        "Firebase 匯入錯誤：",
        error
      );

      showMessage(
        $("excelMessage"),
        `Firebase 同步失敗：${error.code || ""} ${error.message || ""}`,
        "error"
      );

    } finally {

      $("importBtn").disabled =
        false;

    }

  }
);


/* =========================
   讀取考試清單
========================= */

async function loadExamList() {

  const select =
    $("examSelect");

  select.innerHTML = "";

  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "examStats"
        )
      );

    const exams =
      snapshot.docs.map(
        snap => ({
          id:
            snap.id,
          ...snap.data()
        })
      );

    exams.sort(
      (a,b) => {

        if (
          Number(a.schoolYear) !==
          Number(b.schoolYear)
        ) {
          return (
            Number(b.schoolYear) -
            Number(a.schoolYear)
          );
        }

        if (
          Number(a.semester) !==
          Number(b.semester)
        ) {
          return (
            Number(b.semester) -
            Number(a.semester)
          );
        }

        return (
          Number(b.examNo) -
          Number(a.examNo)
        );

      }
    );

    exams.forEach(
      exam => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          exam.id;

        option.textContent =
          exam.examName ||
          exam.id;

        select.appendChild(
          option
        );

      }
    );

  } catch (error) {

    console.error(error);

  }

}


/* =========================
   載入段考總表
========================= */

$("loadExamBtn").addEventListener(
  "click",
  loadExamTable
);


async function loadExamTable() {

  clearMessage(
    $("examMessage")
  );

  const examCode =
    $("examSelect").value;

  if (!examCode) {

    showMessage(
      $("examMessage"),
      "目前沒有段考資料。",
      "error"
    );

    return;
  }

  try {

    const resultSnapshot =
      await getDocs(
        collection(
          db,
          "examResults",
          examCode,
          "students"
        )
      );

    currentExamRows =
      resultSnapshot.docs.map(
        snap => snap.data()
      );

    currentSort = {
      key: "seat",
      asc: true
    };

    renderExamTable();

    const statsSnapshot =
      await getDocs(
        collection(
          db,
          "examStats"
        )
      );

    const statsDoc =
      statsSnapshot.docs.find(
        snap =>
          snap.id === examCode
      );

    const stats =
      statsDoc
        ? statsDoc.data()
        : null;

    renderSummary(
      stats,
      currentExamRows
    );

  } catch (error) {

    console.error(error);

    showMessage(
      $("examMessage"),
      "段考總表載入失敗。",
      "error"
    );

  }

}


/* =========================
   段考表格
========================= */

function renderExamTable() {

  const rows =
    [...currentExamRows];

  const key =
    currentSort.key;

  const asc =
    currentSort.asc;

  rows.sort(
    (a,b) => {

      let av = a[key];
      let bv = b[key];

      if (
        typeof av === "number" ||
        typeof bv === "number"
      ) {

        av =
          Number(av ?? 0);

        bv =
          Number(bv ?? 0);

        return asc
          ? av - bv
          : bv - av;

      }

      return asc
        ? String(av ?? "")
            .localeCompare(
              String(bv ?? ""),
              "zh-Hant",
              {
                numeric: true
              }
            )
        : String(bv ?? "")
            .localeCompare(
              String(av ?? ""),
              "zh-Hant",
              {
                numeric: true
              }
            );

    }
  );

  const body =
    $("examTableBody");

  body.innerHTML = "";

  rows.forEach(
    row => {

      const tr =
        document.createElement(
          "tr"
        );

      tr.innerHTML = `
        <td>${escapeHtml(row.seat)}</td>
        <td>${escapeHtml(row.name)}</td>
        <td>${formatScore(row.chinese)}</td>
        <td>${formatScore(row.english)}</td>
        <td>${formatScore(row.math)}</td>
        <td>${formatScore(row.science)}</td>
        <td>${formatScore(row.social)}</td>
        <td>${formatScore(row.total)}</td>
        <td>${formatScore(row.average)}</td>
        <td>${formatScore(row.rank)}</td>
      `;

      body.appendChild(tr);

    }
  );

}


/* 點表頭排序 */

document.querySelectorAll(
  "th[data-sort]"
).forEach(
  th => {

    th.addEventListener(
      "click",
      () => {

        const key =
          th.dataset.sort;

        if (
          currentSort.key === key
        ) {

          currentSort.asc =
            !currentSort.asc;

        } else {

          currentSort.key =
            key;

          currentSort.asc =
            key === "seat" ||
            key === "rank";

        }

        renderExamTable();

      }
    );

  }
);


/* =========================
   統計卡
========================= */

function renderSummary(
  stats,
  rows
) {

  const container =
    $("examSummary");

  if (!stats) {

    container.innerHTML = "";
    return;

  }

  container.innerHTML = `

    <div class="summary-card">
      <div class="summary-label">
        班級
      </div>
      <div class="summary-value">
        ${escapeHtml(stats.classCode || "")}
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">
        有效人數
      </div>
      <div class="summary-value">
        ${rows.length}
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">
        全班總分平均
      </div>
      <div class="summary-value">
        ${formatScore(stats.totalAvg)}
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">
        五科平均
      </div>
      <div class="summary-value">
        ${formatScore(stats.averageAvg)}
      </div>
    </div>

  `;

}


/* =========================
   防止 HTML 注入
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
