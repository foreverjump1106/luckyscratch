<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>804段考成績管理系統</title>

  <link
    rel="icon"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230f766e"/><text x="50" y="68" text-anchor="middle" font-size="60" fill="white">管</text></svg>'
  />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #0f172a;
      background: linear-gradient(135deg, #ecfeff, #f0fdfa, #f8fafc);
      min-height: 100vh;
    }

    button, input, textarea {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 30px 16px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      color: white;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, #0f766e, #115e59);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #64748b;
      margin-top: 8px;
      font-size: 15px;
    }

    .card {
      background: rgba(255,255,255,.96);
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 16px 40px rgba(15,23,42,.08);
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 520px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 13px;
      background: white;
      color: #0f172a;
      outline: none;
    }

    input {
      height: 50px;
      padding: 0 14px;
      font-size: 16px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre;
      overflow: auto;
    }

    input:focus, textarea:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 4px rgba(15,118,110,.10);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 16px;
    }

    .btn {
      min-height: 50px;
      border: 0;
      border-radius: 13px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #0f766e, #115e59);
    }

    .btn-secondary {
      background: #475569;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-full {
      width: 100%;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .actions .btn {
      flex: 1 1 180px;
    }

    .message {
      display: none;
      border-radius: 12px;
      padding: 13px 15px;
      margin-top: 15px;
      line-height: 1.6;
      font-size: 14px;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
    }

    .admin-area {
      display: none;
    }

    .admin-area.show {
      display: block;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding: 16px 18px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
    }

    .teacher-email {
      font-weight: 900;
    }

    .format-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      color: #475569;
      line-height: 1.8;
      font-size: 14px;
    }

    .preview-area {
      display: none;
    }

    .preview-area.show {
      display: block;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      font-weight: 900;
    }

    .invalid-row {
      background: #fff1f2;
    }

    .valid-text {
      color: #15803d;
      font-weight: 900;
    }

    .invalid-text {
      color: #b91c1c;
      font-weight: 900;
    }

    @media (max-width: 760px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="logo">管</div>
    <h1>段考成績管理系統</h1>
    <div class="subtitle">教師專用後台</div>
  </div>

  <div id="loginArea" class="card login-card">
    <div class="section-title">教師登入</div>

    <div class="field">
      <label for="email">教師帳號</label>
      <input id="email" type="email" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">密碼</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>

    <button id="loginBtn" class="btn btn-full">登入管理系統</button>
    <div id="loginMessage" class="message"></div>
  </div>

  <div id="adminArea" class="admin-area">

    <div class="topbar">
      <div>
        <div style="font-size:13px;color:#64748b;">已登入教師</div>
        <div id="teacherEmail" class="teacher-email"></div>
      </div>

      <button id="logoutBtn" class="btn btn-secondary">登出</button>
    </div>

    <div class="card">
      <div class="section-title">① 段考設定</div>

      <div class="grid-3">

        <div class="field">
          <label for="classCode">班級</label>
          <input id="classCode" value="804" maxlength="6">
        </div>

        <div class="field">
          <label for="examCode">考試代碼</label>
          <input id="examCode" value="114-2-exam3" placeholder="例如 114-2-exam3">
        </div>

        <div class="field">
          <label for="examName">考試名稱</label>
          <input
            id="examName"
            value="114學年度下學期第三次段考"
          >
        </div>

      </div>
    </div>

    <div class="card">

      <div class="section-title">② 貼上 Excel 資料</div>

      <div class="format-box">
        欄位順序：<br>
        座號　姓名　出生月日　身分證後五碼　國文　英文　數學　自然　社會
      </div>

      <textarea
        id="excelData"
        placeholder="例如：
1	王小明	0815	12345	86	92	95	88	90
2	李小美	1207	67890	91	84	88	93	87"
      ></textarea>

      <div class="actions">
        <button id="previewBtn" class="btn">解析並預覽</button>
        <button id="clearBtn" class="btn btn-secondary">清除</button>
      </div>

      <div id="parseMessage" class="message"></div>
    </div>

    <div id="previewArea" class="card preview-area">

      <div class="section-title">③ 匯入前預覽</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>學生代號</th>
              <th>座號</th>
              <th>姓名</th>
              <th>出生月日</th>
              <th>後五碼</th>
              <th>國文</th>
              <th>英文</th>
              <th>數學</th>
              <th>自然</th>
              <th>社會</th>
              <th>狀態</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <button id="importBtn" class="btn">確認匯入 Firebase</button>
      </div>

      <div id="importMessage" class="message"></div>
    </div>

  </div>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC7hXtxLARv3LsoPcaViptdoWMZMLibtiY",
  authDomain: "exam-score-system.firebaseapp.com",
  projectId: "exam-score-system",
  storageBucket: "exam-score-system.firebasestorage.app",
  messagingSenderId: "334811583790",
  appId: "1:334811583790:web:a6207215915c163c8656bf"
};

const ADMIN_UID = "2e5K4CSfV7h7qryYfrNDw6r0zY13";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginArea = document.getElementById("loginArea");
const adminArea = document.getElementById("adminArea");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginMessage = document.getElementById("loginMessage");

const teacherEmail = document.getElementById("teacherEmail");

const classCodeInput = document.getElementById("classCode");
const examCodeInput = document.getElementById("examCode");
const examNameInput = document.getElementById("examName");

const excelData = document.getElementById("excelData");
const previewBtn = document.getElementById("previewBtn");
const clearBtn = document.getElementById("clearBtn");
const previewArea = document.getElementById("previewArea");
const previewBody = document.getElementById("previewBody");

const parseMessage = document.getElementById("parseMessage");
const importMessage = document.getElementById("importMessage");
const importBtn = document.getElementById("importBtn");

let parsedStudents = [];


function showMessage(element, text, type) {
  element.textContent = text;
  element.className = "message " + type;
}

function clearMessage(element) {
  element.textContent = "";
  element.className = "message";
}


loginBtn.addEventListener("click", async () => {

  clearMessage(loginMessage);

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage(loginMessage, "請輸入帳號與密碼。", "error");
    return;
  }

  try {

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      showMessage(loginMessage, "此帳號沒有管理權限。", "error");
    }

  } catch (error) {

    console.error(error);

    showMessage(
      loginMessage,
      "登入失敗，請確認帳號密碼。",
      "error"
    );
  }
});


logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});


onAuthStateChanged(auth, user => {

  if (user && user.uid === ADMIN_UID) {

    loginArea.style.display = "none";
    adminArea.classList.add("show");
    teacherEmail.textContent = user.email || "教師";

  } else {

    loginArea.style.display = "block";
    adminArea.classList.remove("show");
  }

});


function isValidMMDD(value) {

  if (!/^\d{4}$/.test(value)) return false;

  const month = Number(value.slice(0, 2));
  const day = Number(value.slice(2, 4));

  const days = [
    31,29,31,30,31,30,
    31,31,30,31,30,31
  ];

  if (month < 1 || month > 12) return false;

  return day >= 1 && day <= days[month - 1];
}


function isValidScore(value) {

  const n = Number(value);

  return (
    value !== "" &&
    Number.isFinite(n) &&
    n >= 0 &&
    n <= 100
  );
}


function formatSeat(value) {
  return String(Number(value)).padStart(2, "0");
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


previewBtn.addEventListener("click", () => {

  clearMessage(parseMessage);
  clearMessage(importMessage);

  const classCode = classCodeInput.value.trim();
  const examCode = examCodeInput.value.trim();
  const examName = examNameInput.value.trim();

  if (!classCode) {
    showMessage(parseMessage, "請輸入班級。", "error");
    return;
  }

  if (!examCode) {
    showMessage(parseMessage, "請輸入考試代碼。", "error");
    return;
  }

  if (!/^[A-Za-z0-9_-]+$/.test(examCode)) {
    showMessage(
      parseMessage,
      "考試代碼只能使用英文、數字、- 或 _。",
      "error"
    );
    return;
  }

  if (!examName) {
    showMessage(parseMessage, "請輸入考試名稱。", "error");
    return;
  }

  const raw = excelData.value.trim();

  if (!raw) {
    showMessage(parseMessage, "請先貼上 Excel 資料。", "error");
    return;
  }

  const rows = raw
    .split(/\r?\n/)
    .map(v => v.trim())
    .filter(Boolean);

  const parsed = [];

  rows.forEach((line, index) => {

    let cols = line.split("\t");

    if (cols.length < 9) {
      cols = line.split(",");
    }

    cols = cols.map(v => v.trim());

    if (
      index === 0 &&
      (
        (cols[0] || "").includes("座號") ||
        (cols[0] || "").toLowerCase() === "seat"
      )
    ) {
      return;
    }

    const [
      seatRaw,
      name,
      birthMMDD,
      idLast5,
      chinese,
      english,
      math,
      science,
      social
    ] = cols;

    const errors = [];

    const seatNum = Number(seatRaw);

    if (!Number.isInteger(seatNum) || seatNum <= 0 || seatNum > 99) {
      errors.push("座號錯誤");
    }

    if (!name) {
      errors.push("姓名空白");
    }

    if (!isValidMMDD(birthMMDD || "")) {
      errors.push("生日錯誤");
    }

    if (!/^\d{5}$/.test(idLast5 || "")) {
      errors.push("後五碼錯誤");
    }

    const subjects = {
      chinese,
      english,
      math,
      science,
      social
    };

    for (const [key, value] of Object.entries(subjects)) {

      if (!isValidScore(value)) {

        const names = {
          chinese: "國文",
          english: "英文",
          math: "數學",
          science: "自然",
          social: "社會"
        };

        errors.push(names[key] + "成績錯誤");
      }
    }

    const seat = Number.isInteger(seatNum)
      ? formatSeat(seatNum)
      : String(seatRaw || "");

    parsed.push({
      studentKey: classCode + seat,
      classCode,
      seat,
      name,
      birthMMDD,
      idLast5,
      chinese: Number(chinese),
      english: Number(english),
      math: Number(math),
      science: Number(science),
      social: Number(social),
      examCode,
      examName,
      valid: errors.length === 0,
      errors
    });

  });

  parsedStudents = parsed;

  previewBody.innerHTML = "";

  parsedStudents.forEach(row => {

    const tr = document.createElement("tr");

    if (!row.valid) {
      tr.classList.add("invalid-row");
    }

    tr.innerHTML = `
      <td>${escapeHtml(row.studentKey)}</td>
      <td>${escapeHtml(row.seat)}</td>
      <td>${escapeHtml(row.name)}</td>
      <td>${escapeHtml(row.birthMMDD)}</td>
      <td>${escapeHtml(row.idLast5)}</td>
      <td>${row.chinese}</td>
      <td>${row.english}</td>
      <td>${row.math}</td>
      <td>${row.science}</td>
      <td>${row.social}</td>
      <td>
        ${
          row.valid
          ? '<span class="valid-text">正常</span>'
          : `<span class="invalid-text">${escapeHtml(row.errors.join("、"))}</span>`
        }
      </td>
    `;

    previewBody.appendChild(tr);
  });

  previewArea.classList.add("show");

  const invalid = parsedStudents.filter(v => !v.valid).length;

  if (invalid > 0) {

    importBtn.disabled = true;

    showMessage(
      parseMessage,
      `共有 ${invalid} 筆資料錯誤，請先修正。`,
      "error"
    );

  } else {

    importBtn.disabled = false;

    showMessage(
      parseMessage,
      `資料檢查完成，共 ${parsedStudents.length} 位學生。`,
      "success"
    );
  }

});


clearBtn.addEventListener("click", () => {

  excelData.value = "";
  parsedStudents = [];
  previewBody.innerHTML = "";
  previewArea.classList.remove("show");

  clearMessage(parseMessage);
  clearMessage(importMessage);
});


importBtn.addEventListener("click", async () => {

  clearMessage(importMessage);

  const user = auth.currentUser;

  if (!user || user.uid !== ADMIN_UID) {

    showMessage(
      importMessage,
      "教師登入已失效，請重新登入。",
      "error"
    );

    return;
  }

  const rows = parsedStudents.filter(v => v.valid);

  if (!rows.length) {
    showMessage(importMessage, "沒有可以匯入的資料。", "error");
    return;
  }

  if (!confirm(
    `確定匯入 ${rows.length} 位學生的「${rows[0].examName}」成績嗎？`
  )) {
    return;
  }

  importBtn.disabled = true;

  try {

    const batch = writeBatch(db);

    rows.forEach(row => {

      /*
        基本資料：
        students/80401
      */

      const studentRef = doc(
        db,
        "students",
        row.studentKey
      );

      batch.set(
        studentRef,
        {
          classCode: row.classCode,
          seat: row.seat,
          name: row.name,
          birthMMDD: row.birthMMDD,
          idLast5: row.idLast5,
          updatedAt: serverTimestamp()
        },
        {
          merge: true
        }
      );


      /*
        成績：
        scores/80401/exams/114-2-exam3
      */

      const examRef = doc(
        db,
        "scores",
        row.studentKey,
        "exams",
        row.examCode
      );

      batch.set(
        examRef,
        {
          examCode: row.examCode,
          examName: row.examName,
          chinese: row.chinese,
          english: row.english,
          math: row.math,
          science: row.science,
          social: row.social,
          updatedAt: serverTimestamp()
        },
        {
          merge: true
        }
      );

    });

    await batch.commit();

    showMessage(
      importMessage,
      `成功匯入 ${rows.length} 位學生的「${rows[0].examName}」成績。`,
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      importMessage,
      "匯入失敗，請檢查 Firestore Rules。",
      "error"
    );

  } finally {

    importBtn.disabled = false;
  }

});

</script>

</body>
</html>
