<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學生段考成績管理系統</title>

  <link
    rel="icon"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230f766e"/><text x="50" y="68" text-anchor="middle" font-size="58" fill="white">績</text></svg>'
  >

  <!-- Excel 讀取 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ecfeff,
          #f0fdfa,
          #f8fafc
        );

      color: #0f172a;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 1250px;

      margin: 0 auto;

      padding: 28px 16px 60px;
    }

    .header {
      text-align: center;

      margin-bottom: 24px;
    }

    .logo {
      width: 76px;
      height: 76px;

      margin: 0 auto 12px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #0f766e,
          #115e59
        );

      color: white;

      font-size: 40px;
      font-weight: 900;
    }

    h1 {
      margin: 0;

      font-size: 30px;
    }

    .subtitle {
      margin-top: 7px;

      color: #64748b;
    }

    .card {
      background:
        rgba(
          255,
          255,
          255,
          .97
        );

      border:
        1px solid #e2e8f0;

      border-radius: 20px;

      padding: 24px;

      margin-bottom: 20px;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .08
        );
    }

    .login-card {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;

      margin-bottom: 16px;
    }

    .field {
      min-width: 0;

      margin-bottom: 16px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;

      min-height: 48px;

      border:
        1px solid #cbd5e1;

      border-radius: 12px;

      padding: 0 13px;

      background: white;

      font-size: 16px;

      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #0f766e;

      box-shadow:
        0 0 0 4px
        rgba(
          15,
          118,
          110,
          .10
        );
    }

    .btn {
      min-height: 48px;

      border: 0;

      border-radius: 12px;

      padding: 0 18px;

      color: white;

      background: #0f766e;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
    }

    .btn:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: .5;

      cursor: not-allowed;
    }

    .btn-secondary {
      background: #475569;
    }

    .btn-blue {
      background: #2563eb;
    }

    .btn-full {
      width: 100%;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      margin-top: 16px;
    }

    .actions .btn {
      flex: 1 1 180px;
    }

    .message {
      display: none;

      margin-top: 14px;

      padding: 13px 15px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.6;
    }

    .message.success {
      display: block;

      background: #dcfce7;

      color: #166534;
    }

    .message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }

    .message.info {
      display: block;

      background: #dbeafe;

      color: #1e40af;
    }

    .admin-area {
      display: none;
    }

    .admin-area.show {
      display: block;
    }

    .topbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      background: white;

      padding: 15px 18px;

      border:
        1px solid #e2e8f0;

      border-radius: 15px;

      margin-bottom: 18px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 20px;
    }

    .tab {
      min-height: 45px;

      border:
        1px solid #cbd5e1;

      border-radius: 12px;

      padding: 0 18px;

      background: white;

      color: #334155;

      font-weight: 900;

      cursor: pointer;
    }

    .tab.active {
      color: white;

      background: #0f766e;

      border-color: #0f766e;
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
    }

    .settings-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;

      margin-bottom: 18px;
    }

    .help {
      padding: 14px 16px;

      border-radius: 13px;

      border:
        1px solid #e2e8f0;

      background: #f8fafc;

      color: #475569;

      font-size: 14px;
      line-height: 1.7;

      margin-bottom: 17px;
    }

    .file-box {
      border:
        2px dashed #94a3b8;

      border-radius: 16px;

      padding: 24px;

      text-align: center;

      background: #f8fafc;
    }

    .sheet-list {
      display: grid;

      gap: 12px;

      margin-top: 18px;
    }

    .sheet-card {
      border:
        1px solid #e2e8f0;

      border-radius: 14px;

      padding: 15px;

      background: white;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 900;
    }

    .sheet-info {
      margin-top: 7px;

      color: #64748b;

      font-size: 14px;
      line-height: 1.7;
    }

    .sheet-ok {
      color: #15803d;

      font-weight: 900;
    }

    .sheet-error {
      color: #b91c1c;

      font-weight: 900;
    }

    .exam-controls {
      display: grid;

      grid-template-columns:
        minmax(
          0,
          2fr
        )
        minmax(
          180px,
          1fr
        );

      gap: 12px;

      margin-bottom: 16px;
    }

    .summary {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin-bottom: 16px;
    }

    .summary-card {
      padding: 14px;

      background: #f8fafc;

      border:
        1px solid #e2e8f0;

      border-radius: 13px;

      text-align: center;
    }

    .summary-label {
      color: #64748b;

      font-size: 13px;
    }

    .summary-value {
      margin-top: 4px;

      font-size: 23px;
      font-weight: 900;
    }

    .table-tip {
      margin-bottom: 10px;

      padding: 10px 12px;

      border-radius: 10px;

      background: #f1f5f9;

      color: #475569;

      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================================================
       ★ 重點修正：
       表格本身上下左右都可以滑動
       ========================================================= */

    .table-wrap {
      position: relative;

      width: 100%;

      /*
        讓「上下捲動」發生在表格本身，
        sticky 表頭才能真正固定。
      */
      max-height: 560px;

      overflow: auto;

      overscroll-behavior: contain;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: auto;

      border:
        1px solid #cbd5e1;

      border-radius: 14px;

      background: white;
    }

    .table-wrap::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    .table-wrap::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: #94a3b8;

      border-radius: 999px;

      border:
        3px solid #f1f5f9;
    }

    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    table {
      width: 100%;

      min-width: 1000px;

      border-collapse: separate;

      border-spacing: 0;

      background: white;
    }

    th,
    td {
      height: 46px;

      padding: 10px 10px;

      border-right:
        1px solid #e2e8f0;

      border-bottom:
        1px solid #e2e8f0;

      text-align: center;

      white-space: nowrap;

      font-size: 14px;

      background: white;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    /* =========================================================
       ★ 固定整排表頭
       ========================================================= */

    thead th {
      position: sticky;

      top: 0;

      z-index: 30;

      background: #e2e8f0;

      color: #0f172a;

      font-weight: 900;

      cursor: pointer;

      user-select: none;

      border-bottom:
        2px solid #94a3b8;

      box-shadow:
        0 2px 5px
        rgba(
          15,
          23,
          42,
          .12
        );
    }

    thead th:hover {
      background: #cbd5e1;
    }

    /* 排序提示 */

    thead th[data-sort]::after {
      content: " ↕";

      color: #64748b;

      font-size: 11px;
    }

    thead th.sort-asc::after {
      content: " ▲";

      color: #0f766e;
    }

    thead th.sort-desc::after {
      content: " ▼";

      color: #0f766e;
    }

    /* =========================================================
       ★ 第一欄：座號固定
       ========================================================= */

    thead th:nth-child(1),
    tbody td:nth-child(1) {
      position: sticky;

      left: 0;

      min-width: 66px;
      width: 66px;

      background: #f8fafc;

      border-right:
        1px solid #cbd5e1;
    }

    tbody td:nth-child(1) {
      z-index: 10;
    }

    thead th:nth-child(1) {
      z-index: 50;

      background: #cbd5e1;
    }

    /* =========================================================
       ★ 第二欄：姓名固定
       ========================================================= */

    thead th:nth-child(2),
    tbody td:nth-child(2) {
      position: sticky;

      left: 66px;

      min-width: 115px;
      width: 115px;

      background: white;

      border-right:
        2px solid #94a3b8;

      box-shadow:
        4px 0 6px
        rgba(
          15,
          23,
          42,
          .07
        );
    }

    tbody td:nth-child(2) {
      z-index: 9;
    }

    thead th:nth-child(2) {
      z-index: 49;

      background: #cbd5e1;
    }

    /* =========================================================
       資料列滑鼠提示
       ========================================================= */

    tbody tr:hover td {
      background: #f8fafc;
    }

    tbody tr:hover td:nth-child(1),
    tbody tr:hover td:nth-child(2) {
      background: #e2e8f0;
    }

    /*
      偶數列淡底色，
      長表格比較容易追蹤。
    */

    tbody tr:nth-child(even) td {
      background: #fbfdff;
    }

    tbody tr:nth-child(even) td:nth-child(1),
    tbody tr:nth-child(even) td:nth-child(2) {
      background: #f1f5f9;
    }

    tbody tr:nth-child(even):hover td {
      background: #f8fafc;
    }

    tbody tr:nth-child(even):hover td:nth-child(1),
    tbody tr:nth-child(even):hover td:nth-child(2) {
      background: #e2e8f0;
    }

    /* 手機 */

    @media(max-width:760px) {

      .page {
        padding:
          20px 10px 40px;
      }

      .settings-grid,
      .exam-controls,
      .summary {
        grid-template-columns:
          1fr;
      }

      .topbar {
        flex-direction: column;

        align-items: stretch;
      }

      h1 {
        font-size: 25px;
      }

      .card {
        padding:
          19px 12px;
      }

      .tabs {
        display: grid;

        grid-template-columns:
          1fr 1fr;
      }

      .tab {
        width: 100%;

        padding:
          0 8px;
      }

      /*
        手機上總表高度縮小一點，
        讓上下滑動容易理解。
      */

      .table-wrap {
        max-height: 500px;
      }

      table {
        min-width: 940px;
      }

      th,
      td {
        height: 44px;

        padding:
          9px 8px;

        font-size: 13px;
      }

      thead th:nth-child(1),
      tbody td:nth-child(1) {
        min-width: 54px;
        width: 54px;
      }

      thead th:nth-child(2),
      tbody td:nth-child(2) {
        left: 54px;

        min-width: 92px;
        width: 92px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="header">

    <div class="logo">
      績
    </div>

    <h1>
      學生段考成績管理系統
    </h1>

    <div class="subtitle">
      教師專用後台
    </div>

  </div>


  <!-- =========================
       登入
  ========================== -->

  <div
    id="loginArea"
    class="card login-card"
  >

    <div class="section-title">
      教師登入
    </div>

    <div class="field">

      <label for="email">
        教師 Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
      >

    </div>


    <div class="field">

      <label for="password">
        密碼
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

    </div>


    <button
      id="loginBtn"
      class="btn btn-full"
    >
      登入管理系統
    </button>


    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- =========================
       後台
  ========================== -->

  <div
    id="adminArea"
    class="admin-area"
  >

    <div class="topbar">

      <div>

        <div
          style="
            font-size:13px;
            color:#64748b;
          "
        >
          已登入教師
        </div>

        <strong
          id="teacherEmail"
        ></strong>

      </div>


      <button
        id="logoutBtn"
        class="btn btn-secondary"
      >
        登出
      </button>

    </div>


    <div class="tabs">

      <button
        type="button"
        class="tab active"
        data-page="syncPage"
      >
        Excel 同步
      </button>

      <button
        type="button"
        class="tab"
        data-page="examPage"
      >
        段考總表
      </button>

    </div>


    <!-- =========================
         Excel 同步
    ========================== -->

    <section
      id="syncPage"
      class="tab-page active"
    >

      <div class="card">

        <div class="section-title">
          ① 基本設定
        </div>


        <div class="settings-grid">

          <div class="field">

            <label for="baseYear">
              七年級學年度
            </label>

            <input
              id="baseYear"
              type="number"
              value="114"
            >

          </div>


          <div class="field">

            <label for="baseGrade">
              七年級年級數字
            </label>

            <input
              id="baseGrade"
              type="number"
              value="7"
              min="1"
              max="9"
            >

          </div>


          <div class="field">

            <label for="classSuffix">
              班級尾碼
            </label>

            <input
              id="classSuffix"
              value="04"
              maxlength="2"
            >

          </div>

        </div>


        <div class="help">

          目前設定：

          <strong>
            114學年度 = 704
          </strong>

          。

          <br>

          系統會自動判斷：

          <strong>
            115學年度 = 804
          </strong>

          、

          <strong>
            116學年度 = 904
          </strong>

          。

          <br><br>

          以後只需要在 Excel 增加新的段考工作表，
          不需要重新建立資料庫。

        </div>

      </div>


      <div class="card">

        <div class="section-title">
          ② 選擇歷年段考 Excel
        </div>


        <div class="file-box">

          <input
            id="excelFile"
            type="file"
            accept=".xlsx,.xls"
          >

          <div
            style="
              margin-top:12px;
              color:#64748b;
            "
          >
            選擇「歷年段考成績.xlsx」
          </div>

        </div>


        <div class="actions">

          <button
            id="parseBtn"
            type="button"
            class="btn btn-blue"
          >
            解析 Excel
          </button>


          <button
            id="importBtn"
            type="button"
            class="btn"
            disabled
          >
            同步到 Firebase
          </button>

        </div>


        <div
          id="excelMessage"
          class="message"
        ></div>


        <div
          id="sheetList"
          class="sheet-list"
        ></div>

      </div>

    </section>


    <!-- =========================
         段考總表
    ========================== -->

    <section
      id="examPage"
      class="tab-page"
    >

      <div class="card">

        <div class="section-title">
          段考總表
        </div>


        <div class="exam-controls">

          <div class="field">

            <label for="examSelect">
              選擇段考
            </label>

            <select
              id="examSelect"
            ></select>

          </div>


          <div class="field">

            <label>
              操作
            </label>

            <button
              id="loadExamBtn"
              type="button"
              class="btn btn-blue btn-full"
            >
              載入總表
            </button>

          </div>

        </div>


        <div
          id="examSummary"
          class="summary"
        ></div>


        <div class="table-tip">
          💡 表頭會固定在上方；座號與姓名會固定在左側。可直接在表格內上下、左右滑動。點選「國文、英文、數學、自然、社會、總分、平均、班排」可排序，再點一次可反向排序。
        </div>


        <div
          id="examTableWrap"
          class="table-wrap"
        >

          <table>

            <thead>

              <tr>

                <th data-sort="seat">
                  座號
                </th>

                <th data-sort="name">
                  姓名
                </th>

                <th data-sort="chinese">
                  國文
                </th>

                <th data-sort="english">
                  英文
                </th>

                <th data-sort="math">
                  數學
                </th>

                <th data-sort="science">
                  自然
                </th>

                <th data-sort="social">
                  社會
                </th>

                <th data-sort="total">
                  總分
                </th>

                <th data-sort="average">
                  平均
                </th>

                <th data-sort="rank">
                  班排
                </th>

              </tr>

            </thead>


            <tbody
              id="examTableBody"
            ></tbody>

          </table>

        </div>


        <div
          id="examMessage"
          class="message"
        ></div>

      </div>

    </section>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  writeBatch,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC7hXtxLARv3LsoPcaViptdoWMZMLibtiY",

  authDomain:
    "exam-score-system.firebaseapp.com",

  projectId:
    "exam-score-system",

  storageBucket:
    "exam-score-system.firebasestorage.app",

  messagingSenderId:
    "334811583790",

  appId:
    "1:334811583790:web:a6207215915c163c8656bf"

};


const ADMIN_UID =
  "2e5K4CSfV7h7qryYfrNDw6r0zY13";


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const $ =
  id =>
    document.getElementById(
      id
    );


let parsedExams =
  [];


let currentExamRows =
  [];


let currentSort = {

  key: "seat",

  asc: true

};


/*
  防止 loadExamList()
  同時執行造成下拉選單重複。
*/
let examListRequestId =
  0;


/* =========================
   訊息
========================= */

function showMessage(
  element,
  text,
  type = "info"
) {

  element.textContent =
    text;


  element.className =
    "message " +
    type;

}


function clearMessage(
  element
) {

  element.textContent =
    "";


  element.className =
    "message";

}


/* =========================
   登入
========================= */

$("loginBtn")
  .addEventListener(
    "click",
    async () => {

      clearMessage(
        $("loginMessage")
      );


      const email =
        $("email")
          .value
          .trim();


      const password =
        $("password")
          .value;


      if (
        !email ||
        !password
      ) {

        showMessage(
          $("loginMessage"),
          "請輸入教師帳號與密碼。",

/* =========================
   SHA-256 studentKey
========================= */

async function createStudentKey(
  birthMMDD,
  idLast5
) {

  const raw =
    `exam-score-v1|${birthMMDD}|${idLast5}`;


  const data =
    new TextEncoder()
      .encode(
        raw
      );


  const hash =
    await crypto
      .subtle
      .digest(
        "SHA-256",
        data
      );


  return Array
    .from(
      new Uint8Array(
        hash
      )
    )
    .map(
      byte =>
        byte
          .toString(
            16
          )
          .padStart(
            2,
            "0"
          )
    )
    .join(
      ""
    );

}


/* =========================
   格式化
========================= */

function padMMDD(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }


  const text =
    String(
      value
    )
      .replace(
        /\D/g,
        ""
      );


  return text
    .padStart(
      4,
      "0"
    )
    .slice(
      -4
    );

}


function padLast5(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }


  const text =
    String(
      value
    )
      .replace(
        /\D/g,
        ""
      );


  return text
    .padStart(
      5,
      "0"
    )
    .slice(
      -5
    );

}


function numberValue(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return null;

  }


  const number =
    Number(
      value
    );


  return Number
    .isFinite(
      number
    )
      ? number
      : null;

}


function isValidMMDD(
  value
) {

  if (
    !/^\d{4}$/
      .test(
        value
      )
  ) {

    return false;

  }


  const month =
    Number(
      value
        .slice(
          0,
          2
        )
    );


  const day =
    Number(
      value
        .slice(
          2,
          4
        )
    );


  const days = [

    31,
    29,
    31,
    30,
    31,
    30,
    31,
    31,
    30,
    31,
    30,
    31

  ];


  return (

    month >= 1 &&

    month <= 12 &&

    day >= 1 &&

    day <=
      days[
        month - 1
      ]

  );

}


function formatScore(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const number =
    Number(
      value
    );


  if (
    !Number
      .isFinite(
        number
      )
  ) {

    return "";

  }


  if (
    Number
      .isInteger(
        number
      )
  ) {

    return String(
      number
    );

  }


  return number
    .toFixed(
      2
    )
    .replace(
      /\.?0+$/,
      ""
    );

}


/* =========================
   工作表名稱
========================= */

function chineseNumberToInt(
  value
) {

  const map = {

    "一": 1,

    "二": 2,

    "三": 3

  };


  return (
    map[
      value
    ]
    ||
    Number(
      value
    )
    ||
    null
  );

}


function parseSheetName(
  sheetName
) {

  const match =
    sheetName
      .match(
        /^(\d{3})(上|下)第([一二三123])次段考$/
      );


  if (!match) {

    return null;

  }


  const schoolYear =
    Number(
      match[
        1
      ]
    );


  const semester =
    match[
      2
    ] ===
    "上"
      ? 1
      : 2;


  const examNo =
    chineseNumberToInt(
      match[
        3
      ]
    );


  if (!examNo) {

    return null;

  }


  const examCode =
    `${schoolYear}-${semester}-exam${examNo}`;


  const chineseNo = {

    1: "一",

    2: "二",

    3: "三"

  };


  const examName =
    `${schoolYear}學年度${semester === 1 ? "上" : "下"}學期第${chineseNo[examNo]}次段考`;


  return {

    schoolYear,

    semester,

    examNo,

    examCode,

    examName

  };

}


/* =========================
   自動判斷班級
========================= */

function getClassCode(
  schoolYear
) {

  const baseYear =
    Number(
      $("baseYear")
        .value
    );


  const baseGrade =
    Number(
      $("baseGrade")
        .value
    );


  const suffix =
    $("classSuffix")
      .value
      .trim()
      .padStart(
        2,
        "0"
      );


  const grade =
    baseGrade
    +
    (
      schoolYear
      -
      baseYear
    );


  return `${grade}${suffix}`;

}


/* =========================
   Excel 解析
========================= */

$("parseBtn")
  .addEventListener(
    "click",
    async () => {

      clearMessage(
        $("excelMessage")
      );


      $("sheetList")
        .innerHTML =
        "";


      $("importBtn")
        .disabled =
        true;


      const file =
        $("excelFile")
          .files[
            0
          ];


      if (!file) {

        showMessage(
          $("excelMessage"),
          "請先選擇 Excel 檔案。",
          "error"
        );

        return;

      }


      try {

        const buffer =
          await file
            .arrayBuffer();


        const workbook =
          XLSX
            .read(
              buffer,
              {

                type:
                  "array",

                cellDates:
                  false

              }
            );


        const exams =
          [];


        for (
          const sheetName
          of workbook
            .SheetNames
        ) {

          const examInfo =
            parseSheetName(
              sheetName
            );


          if (
            !examInfo
          ) {

            exams
              .push({

                sheetName,

                valid:
                  false,

                errors:
                  [
                    "工作表名稱無法辨識"
                  ]

              });

            continue;

          }


          const worksheet =
            workbook
              .Sheets[
                sheetName
              ];


          const rows =
            XLSX
              .utils
              .sheet_to_json(
                worksheet,
                {

                  header:
                    1,

                  raw:
                    true,

                  defval:
                    null

                }
              );


          if (
            rows.length <
            2
          ) {

            exams
              .push({

                sheetName,

                valid:
                  false,

                errors:
                  [
                    "工作表沒有資料"
                  ]

              });

            continue;

          }


          const classCode =
            getClassCode(
              examInfo
                .schoolYear
            );


          const studentRows =
            [];


          let averageRow =
            null;


          for (
            let rowIndex = 1;
            rowIndex < rows.length;
            rowIndex++
          ) {

            const row =
              rows[
                rowIndex
              ];


            if (
              !row
            ) {

              continue;

            }


            const firstCell =
              String(
                row[
                  0
                ]
                ??
                ""
              )
                .trim();


            if (
              firstCell ===
              "各科平均"
            ) {

              averageRow =
                row;

              continue;

            }


            if (
              !firstCell
            ) {

              continue;

            }


            const seat =
              Number(
                row[
                  0
                ]
              );


            if (
              !Number
                .isInteger(
                  seat
                )
              ||
              seat <=
                0
            ) {

              continue;

            }


            const birthMMDD =
              padMMDD(
                row[
                  2
                ]
              );


            const idLast5 =
              padLast5(
                row[
                  3
                ]
              );


            const studentKey =
              await createStudentKey(
                birthMMDD,
                idLast5
              );


            const errors =
              [];


            if (
              !row[
                1
              ]
            ) {

              errors
                .push(
                  "姓名空白"
                );

            }


            if (
              !isValidMMDD(
                birthMMDD
              )
            ) {

              errors
                .push(
                  "出生月日格式錯誤"
                );

            }


            if (
              !/^\d{5}$/
                .test(
                  idLast5
                )
            ) {

              errors
                .push(
                  "末五碼格式錯誤"
                );

            }


            const scores = [

              row[
                4
              ],

              row[
                5
              ],

              row[
                6
              ],

              row[
                7
              ],

              row[
                8
              ]

            ]
              .map(
                numberValue
              );


            if (
              scores
                .some(
                  value =>
                    value ===
                    null
                )
            ) {

              errors
                .push(
                  "五科成績不完整"
                );

            }


            studentRows
              .push({

                studentKey,

                classCode,

                seat:
                  String(
                    seat
                  )
                    .padStart(
                      2,
                      "0"
                    ),

                name:
                  String(
                    row[
                      1
                    ]
                    ??
                    ""
                  )
                    .trim(),

                birthMMDD,

                idLast5,

                chinese:
                  numberValue(
                    row[
                      4
                    ]
                  ),

                english:
                  numberValue(
                    row[
                      5
                    ]
                  ),

                math:
                  numberValue(
                    row[
                      6
                    ]
                  ),

                science:
                  numberValue(
                    row[
                      7
                    ]
                  ),

                social:
                  numberValue(
                    row[
                      8
                    ]
                  ),

                total:
                  numberValue(
                    row[
                      9
                    ]
                  ),

                average:
                  numberValue(
                    row[
                      10
                    ]
                  ),

                rank:
                  numberValue(
                    row[
                      11
                    ]
                  ),

                errors

              });

          }


          const errors =
            [];


          if (
            studentRows
              .length ===
            0
          ) {

            errors
              .push(
                "沒有找到學生資料"
              );

          }


          if (
            !averageRow
          ) {

            errors
              .push(
                "找不到各科平均列"
              );

          }


          const exam = {

            ...examInfo,

            sheetName,

            classCode,

            students:
              studentRows,

            stats:
              averageRow
                ? {

                    chineseAvg:
                      numberValue(
                        averageRow[
                          4
                        ]
                      ),

                    englishAvg:
                      numberValue(
                        averageRow[
                          5
                        ]
                      ),

                    mathAvg:
                      numberValue(
                        averageRow[
                          6
                        ]
                      ),

                    scienceAvg:
                      numberValue(
                        averageRow[
                          7
                        ]
                      ),

                    socialAvg:
                      numberValue(
                        averageRow[
                          8
                        ]
                      ),

                    totalAvg:
                      numberValue(
                        averageRow[
                          9
                        ]
                      ),

                    averageAvg:
                      numberValue(
                        averageRow[
                          10
                        ]
                      )

                  }
                :
                  null,

            errors,

            valid:
              errors
                .length ===
                0
              &&
              studentRows
                .every(
                  student =>
                    student
                      .errors
                      .length ===
                    0
                )

          };


          exams
            .push(
              exam
            );

        }


        parsedExams =
          exams;


        renderParsedSheets();


        const validExams =
          parsedExams
            .filter(
              exam =>
                exam
                  .valid
            );


        const invalidExams =
          parsedExams
            .length
          -
          validExams
            .length;


        if (
          validExams
            .length ===
          0
        ) {

          showMessage(
            $("excelMessage"),
            "沒有可匯入的段考資料。",
            "error"
          );

          return;

        }


        if (
          invalidExams >
          0
        ) {

          showMessage(
            $("excelMessage"),
            `解析完成，但有 ${invalidExams} 個工作表需要檢查。`,
            "error"
          );


          $("importBtn")
            .disabled =
            true;


        } else {

          showMessage(
            $("excelMessage"),
            `成功解析 ${validExams.length} 次段考，可以同步到 Firebase。`,
            "success"
          );


          $("importBtn")
            .disabled =
            false;

        }


      } catch (
        error
      ) {

        console.error(
          error
        );


        showMessage(
          $("excelMessage"),
          "Excel 解析失敗，請確認檔案格式。",
          "error"
        );

      }

    }
  );


/* =========================
   顯示解析結果
========================= */

function renderParsedSheets() {

  const container =
    $("sheetList");


  container
    .innerHTML =
    "";


  parsedExams
    .forEach(
      exam => {

        const div =
          document
            .createElement(
              "div"
            );


        div
          .className =
          "sheet-card";


        if (
          !exam
            .valid
        ) {

          const allErrors =
            [
              ...(
                exam
                  .errors
                ||
                []
              )
            ];


          if (
            exam
              .students
          ) {

            exam
              .students
              .forEach(
                student => {

                  if (
                    student
                      .errors
                    &&
                    student
                      .errors
                      .length
                  ) {

                    allErrors
                      .push(
                        `${student.seat || "?"}號 ${student.name || ""}：${student.errors.join("、")}`
                      );

                  }

                }
              );

          }


          div
            .innerHTML = `

              <div class="sheet-title">
                ${escapeHtml(
                  exam
                    .sheetName
                )}
              </div>

              <div class="sheet-info">

                <span class="sheet-error">
                  ✕ 無法匯入
                </span>

                <br>

                ${escapeHtml(
                  allErrors
                    .join(
                      "；"
                    )
                )}

              </div>

            `;


        } else {

          div
            .innerHTML = `

              <div class="sheet-title">
                ${escapeHtml(
                  exam
                    .examName
                )}
              </div>

              <div class="sheet-info">

                <span class="sheet-ok">
                  ✓ 資料正常
                </span>

                <br>

                工作表：
                ${escapeHtml(
                  exam
                    .sheetName
                )}

                <br>

                班級：
                ${escapeHtml(
                  exam
                    .classCode
                )}

                <br>

                有效學生：
                ${exam.students.length}
                人

                <br>

                班平均：
                ${formatScore(
                  exam
                    .stats
                    .averageAvg
                )}

              </div>

            `;

        }


        container
          .appendChild(
            div
          );

      }
    );

}

$("importBtn")
  .addEventListener(
    "click",
    async () => {

      clearMessage(
        $("excelMessage")
      );


      const user =
        auth
          .currentUser;


      if (
        !user ||
        user.uid !==
        ADMIN_UID
      ) {

        showMessage(
          $("excelMessage"),
          "教師登入狀態已失效。",
          "error"
        );

        return;

      }


      const exams =
        parsedExams
          .filter(
            exam =>
              exam
                .valid
          );


      if (
        !exams
          .length
      ) {

        showMessage(
          $("excelMessage"),
          "沒有可以同步的資料。",
          "error"
        );

        return;

      }


      const totalResults =
        exams
          .reduce(
            (
              sum,
              exam
            ) =>
              sum
              +
              exam
                .students
                .length,
            0
          );


      if (
        !window
          .confirm(
            `即將同步 ${exams.length} 次段考，共 ${totalResults} 筆學生成績。\n\n已存在的相同考次會更新。\n\n確定繼續嗎？`
          )
      ) {

        return;

      }


      $("importBtn")
        .disabled =
        true;


      showMessage(
        $("excelMessage"),
        "正在同步 Firebase，請稍候……",
        "info"
      );


      try {

        const studentMap =
          new Map();


        exams
          .forEach(
            exam => {

              exam
                .students
                .forEach(
                  student => {

                    const existing =
                      studentMap
                        .get(
                          student
                            .studentKey
                        );


                    const isNewer =

                      !existing

                      ||

                      exam
                        .schoolYear >
                      existing
                        .schoolYear

                      ||

                      (
                        exam
                          .schoolYear ===
                        existing
                          .schoolYear

                        &&

                        exam
                          .semester >
                        existing
                          .semester
                      )

                      ||

                      (
                        exam
                          .schoolYear ===
                        existing
                          .schoolYear

                        &&

                        exam
                          .semester ===
                        existing
                          .semester

                        &&

                        exam
                          .examNo >
                        existing
                          .examNo
                      );


                    if (
                      isNewer
                    ) {

                      studentMap
                        .set(
                          student
                            .studentKey,
                          {

                            student,

                            schoolYear:
                              exam
                                .schoolYear,

                            semester:
                              exam
                                .semester,

                            examNo:
                              exam
                                .examNo

                          }
                        );

                    }

                  }
                );

            }
          );


        const operations =
          [];


        studentMap
          .forEach(
            item => {

              const student =
                item
                  .student;


              operations
                .push({

                  ref:
                    doc(
                      db,
                      "students",
                      student
                        .studentKey
                    ),

                  data: {

                    name:
                      student
                        .name,

                    currentClass:
                      student
                        .classCode,

                    currentSeat:
                      student
                        .seat,

                    latestSchoolYear:
                      item
                        .schoolYear,

                    updatedAt:
                      serverTimestamp()

                  }

                });

            }
          );


        exams
          .forEach(
            exam => {

              operations
                .push({

                  ref:
                    doc(
                      db,
                      "examStats",
                      exam
                        .examCode
                    ),

                  data: {

                    examCode:
                      exam
                        .examCode,

                    examName:
                      exam
                        .examName,

                    sheetName:
                      exam
                        .sheetName,

                    schoolYear:
                      exam
                        .schoolYear,

                    semester:
                      exam
                        .semester,

                    examNo:
                      exam
                        .examNo,

                    classCode:
                      exam
                        .classCode,

                    studentCount:
                      exam
                        .students
                        .length,

                    ...exam
                      .stats,

                    updatedAt:
                      serverTimestamp()

                  }

                });


              exam
                .students
                .forEach(
                  student => {

                    operations
                      .push({

                        ref:
                          doc(
                            db,
                            "examResults",
                            exam
                              .examCode,
                            "students",
                            student
                              .studentKey
                          ),

                        data: {

                          studentKey:
                            student
                              .studentKey,

                          examCode:
                            exam
                              .examCode,

                          examName:
                            exam
                              .examName,

                          schoolYear:
                            exam
                              .schoolYear,

                          semester:
                            exam
                              .semester,

                          examNo:
                            exam
                              .examNo,

                          classCode:
                            exam
                              .classCode,

                          seat:
                            student
                              .seat,

                          name:
                            student
                              .name,

                          chinese:
                            student
                              .chinese,

                          english:
                            student
                              .english,

                          math:
                            student
                              .math,

                          science:
                            student
                              .science,

                          social:
                            student
                              .social,

                          total:
                            student
                              .total,

                          average:
                            student
                              .average,

                          rank:
                            student
                              .rank,

                          updatedAt:
                            serverTimestamp()

                        }

                      });

                  }
                );

            }
          );


        /*
          Firestore batch
          每批最多保守抓 400 筆。
        */

        const chunkSize =
          400;


        for (
          let index = 0;
          index <
            operations
              .length;
          index +=
            chunkSize
        ) {

          const chunk =
            operations
              .slice(
                index,
                index
                +
                chunkSize
              );


          const batch =
            writeBatch(
              db
            );


          chunk
            .forEach(
              operation => {

                batch
                  .set(
                    operation
                      .ref,
                    operation
                      .data,
                    {
                      merge:
                        true
                    }
                  );

              }
            );


          await batch
            .commit();

        }


        showMessage(
          $("excelMessage"),
          `同步完成！共完成 ${exams.length} 次段考、${totalResults} 筆學生成績。`,
          "success"
        );


        await loadExamList();


      } catch (
        error
      ) {

        console.error(
          "Firebase 匯入錯誤：",
          error
        );


        showMessage(
          $("excelMessage"),
          `Firebase 同步失敗：${error.code || ""} ${error.message || ""}`,
          "error"
        );


      } finally {

        $("importBtn")
          .disabled =
          false;

      }

    }
  );


/* =========================================================
   ★ 修正版：讀取考試清單
   - 防止非同步重複
   - 同 examCode 去重
   - 每次真正 replaceChildren
   ========================================================= */

async function loadExamList() {

  const select =
    $("examSelect");


  /*
    每一次執行得到新的編號。
  */
  const requestId =
    ++examListRequestId;


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "examStats"
        )
      );


    /*
      如果這次查詢完成前，
      已經有更新的 loadExamList() 啟動，
      就丟棄這次舊結果。
    */
    if (
      requestId !==
      examListRequestId
    ) {

      return;

    }


    const rawExams =
      snapshot
        .docs
        .map(
          snap => ({

            id:
              snap.id,

            ...snap
              .data()

          })
        );


    /*
      用 examCode 去重。

      即使資料庫裡不慎存在
      兩筆相同考試名稱，
      下拉選單也只會保留一筆。
    */
    const examMap =
      new Map();


    rawExams
      .forEach(
        exam => {

          const uniqueKey =
            String(
              exam
                .examCode
              ||
              exam
                .id
            );


          /*
            正式 ID 等於 examCode 的資料優先。
          */
          const previous =
            examMap
              .get(
                uniqueKey
              );


          if (
            !previous
            ||
            exam.id ===
              uniqueKey
          ) {

            examMap
              .set(
                uniqueKey,
                exam
              );

          }

        }
      );


    const exams =
      Array
        .from(
          examMap
            .values()
        );


    exams
      .sort(
        (
          a,
          b
        ) => {

          const yearDiff =
            Number(
              b
                .schoolYear
              ||
              0
            )
            -
            Number(
              a
                .schoolYear
              ||
              0
            );


          if (
            yearDiff !==
            0
          ) {

            return yearDiff;

          }


          const semesterDiff =
            Number(
              b
                .semester
              ||
              0
            )
            -
            Number(
              a
                .semester
              ||
              0
            );


          if (
            semesterDiff !==
            0
          ) {

            return semesterDiff;

          }


          return (
            Number(
              b
                .examNo
              ||
              0
            )
            -
            Number(
              a
                .examNo
              ||
              0
            )
          );

        }
      );


    /*
      不用 innerHTML +=，
      直接一次清乾淨。
    */
    select
      .replaceChildren();


    exams
      .forEach(
        exam => {

          const option =
            document
              .createElement(
                "option"
              );


          option
            .value =
            exam
              .examCode
            ||
            exam
              .id;


          option
            .textContent =
            exam
              .examName
            ||
            exam
              .id;


          select
            .appendChild(
              option
            );

        }
      );


    /*
      如果只有六次資料，
      這裡就一定只有六個 option。
    */
    console.log(
      "段考清單數量：",
      exams
        .length,
      exams
        .map(
          exam =>
            exam
              .examCode
            ||
            exam
              .id
        )
    );


  } catch (
    error
  ) {

    console.error(
      "載入段考清單失敗：",
      error
    );

  }

}


/* =========================
   載入段考總表
========================= */

$("loadExamBtn")
  .addEventListener(
    "click",
    loadExamTable
  );


async function loadExamTable() {

  clearMessage(
    $("examMessage")
  );


  const examCode =
    $("examSelect")
      .value;


  if (
    !examCode
  ) {

    showMessage(
      $("examMessage"),
      "目前沒有段考資料。",
      "error"
    );

    return;

  }


  $("loadExamBtn")
    .disabled =
    true;


  $("loadExamBtn")
    .textContent =
    "載入中...";


  try {

    const resultSnapshot =
      await getDocs(
        collection(
          db,
          "examResults",
          examCode,
          "students"
        )
      );


    currentExamRows =
      resultSnapshot
        .docs
        .map(
          snap =>
            snap
              .data()
        );


    currentSort = {

      key:
        "seat",

      asc:
        true

    };


    renderExamTable();


    /*
      直接 get 單一 examStats，
      不需要把六筆全部抓回來再 find。
    */
    const statsSnapshot =
      await getDoc(
        doc(
          db,
          "examStats",
          examCode
        )
      );


    const stats =
      statsSnapshot
        .exists()
        ? statsSnapshot
            .data()
        : null;


    renderSummary(
      stats,
      currentExamRows
    );


    /*
      載入新總表後，
      回到表格最上方、最左方。
    */
    const tableWrap =
      $("examTableWrap");


    tableWrap
      .scrollTop =
      0;


    tableWrap
      .scrollLeft =
      0;


    updateSortIndicators();


  } catch (
    error
  ) {

    console.error(
      "段考總表載入錯誤：",
      error
    );


    showMessage(
      $("examMessage"),
      "段考總表載入失敗。",
      "error"
    );


  } finally {

    $("loadExamBtn")
      .disabled =
      false;


    $("loadExamBtn")
      .textContent =
      "載入總表";

  }

}


/* =========================
   段考表格
========================= */

function renderExamTable() {

  const rows =
    [
      ...currentExamRows
    ];


  const key =
    currentSort
      .key;


  const asc =
    currentSort
      .asc;


  rows
    .sort(
      (
        a,
        b
      ) => {

        let av =
          a[
            key
          ];


        let bv =
          b[
            key
          ];


        /*
          成績、總分、平均、排名
          使用數值排序。
        */
        if (
          [
            "seat",
            "chinese",
            "english",
            "math",
            "science",
            "social",
            "total",
            "average",
            "rank"
          ]
            .includes(
              key
            )
        ) {

          const aNumber =
            Number(
              av
            );


          const bNumber =
            Number(
              bv
            );


          const safeA =
            Number
              .isFinite(
                aNumber
              )
              ? aNumber
              : (
                  asc
                    ? Infinity
                    : -Infinity
                );


          const safeB =
            Number
              .isFinite(
                bNumber
              )
              ? bNumber
              : (
                  asc
                    ? Infinity
                    : -Infinity
                );


          return asc
            ? safeA
              -
              safeB
            : safeB
              -
              safeA;

        }


        /*
          姓名使用文字排序。
        */
        const textA =
          String(
            av
            ??
            ""
          );


        const textB =
          String(
            bv
            ??
            ""
          );


        return asc
          ? textA
              .localeCompare(
                textB,
                "zh-Hant",
                {
                  numeric:
                    true
                }
              )
          : textB
              .localeCompare(
                textA,
                "zh-Hant",
                {
                  numeric:
                    true
                }
              );

      }
    );


  const body =
    $("examTableBody");


  body
    .replaceChildren();


  const fragment =
    document
      .createDocumentFragment();


  rows
    .forEach(
      row => {

        const tr =
          document
            .createElement(
              "tr"
            );


        tr
          .innerHTML = `

            <td>
              ${escapeHtml(
                row
                  .seat
              )}
            </td>

            <td>
              ${escapeHtml(
                row
                  .name
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .chinese
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .english
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .math
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .science
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .social
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .total
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .average
              )}
            </td>

            <td>
              ${formatScore(
                row
                  .rank
              )}
            </td>

          `;


        fragment
          .appendChild(
            tr
          );

      }
    );


  body
    .appendChild(
      fragment
    );


  updateSortIndicators();

}


/* =========================
   點表頭排序
========================= */

document
  .querySelectorAll(
    "th[data-sort]"
  )
  .forEach(
    th => {

      th
        .addEventListener(
          "click",
          () => {

            const key =
              th
                .dataset
                .sort;


            if (
              currentSort
                .key ===
              key
            ) {

              currentSort
                .asc =
                !currentSort
                  .asc;


            } else {

              currentSort
                .key =
                key;


              /*
                座號、姓名、班排：
                預設小 → 大。

                成績、總分、平均：
                預設高 → 低。
              */
              currentSort
                .asc =
                (
                  key ===
                    "seat"
                  ||
                  key ===
                    "name"
                  ||
                  key ===
                    "rank"
                );

            }


            renderExamTable();

          }
        );

    }
  );


/* =========================
   排序箭頭
========================= */

function updateSortIndicators() {

  document
    .querySelectorAll(
      "th[data-sort]"
    )
    .forEach(
      th => {

        th
          .classList
          .remove(
            "sort-asc",
            "sort-desc"
          );


        if (
          th
            .dataset
            .sort ===
          currentSort
            .key
        ) {

          th
            .classList
            .add(
              currentSort
                .asc
                ? "sort-asc"
                : "sort-desc"
            );

        }

      }
    );

}


/* =========================
   統計卡
========================= */

function renderSummary(
  stats,
  rows
) {

  const container =
    $("examSummary");


  if (
    !stats
  ) {

    container
      .innerHTML =
      "";

    return;

  }


  container
    .innerHTML = `

      <div class="summary-card">

        <div class="summary-label">
          班級
        </div>

        <div class="summary-value">
          ${escapeHtml(
            stats
              .classCode
            ||
            ""
          )}
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          有效人數
        </div>

        <div class="summary-value">
          ${rows.length}
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          全班總分平均
        </div>

        <div class="summary-value">
          ${formatScore(
            stats
              .totalAvg
          )}
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          五科平均
        </div>

        <div class="summary-value">
          ${formatScore(
            stats
              .averageAvg
          )}
        </div>

      </div>

    `;

}


/* =========================
   防止 HTML 注入
========================= */

function escapeHtml(
  value
) {

  return String(
    value
    ??
    ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
