<script type="module">

import {

} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC7hXtxLARv3LsoPcaViptdoWMZMLibtiY",

    "exam-score-system.firebaseapp.com",

  projectId:
    "exam-score-system",

  storageBucket:
    "exam-score-system.firebasestorage.app",

  messagingSenderId:
    "334811583790",

  appId:
    "1:334811583790:web:a6207215915c163c8656bf"

};


const app =

  );


const db =
  getFirestore(
    app
  );


const $ =
  id =>
    document
      .getElementById(
        id
      );


let studentData =
  null;


let examRecords =
  [];


let averageChart =
  null;


/* =========================================================
   基本工具
   ========================================================= */

function showMessage(
  text,
  type = "error"
) {

  $("message")
    .textContent =
    text;


  $("message")
    .className =
    "message " +
    type;

}


function clearMessage() {

  $("message")
    .textContent =
    "";


  $("message")
    .className =
    "message";

}


function formatNumber(
  value,
  digits = 1
) {

  const number =
    Number(
      value
    );


  if (
    !Number
      .isFinite(
        number
      )
  ) {

    return "-";

  }


  if (
    Number
      .isInteger(
        number
      )
  ) {

    return String(
      number
    );

  }


  return number
    .toFixed(
      digits
    )
    .replace(
      /\.?0+$/,
      ""
    );

}


function signedNumber(
  value,
  digits = 1
) {

  const number =
    Number(
      value
    );


  if (
    !Number
      .isFinite(
        number
      )
  ) {

    return "-";

  }


  const formatted =
    Math
      .abs(
        number
      )
      .toFixed(
        digits
      )
      .replace(
        /\.?0+$/,
        ""
      );


  if (
    number >
    0
  ) {

    return `+${formatted}`;

  }


  if (
    number <
    0
  ) {

    return `-${formatted}`;

  }


  return "0";

}


function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   MMDD
   ========================================================= */

function isValidMMDD(
  value
) {

  if (
    !/^\d{4}$/
      .test(
        value
      )
  ) {

    return false;

  }


  const month =
    Number(
      value
        .slice(
          0,
          2
        )
    );


  const day =
    Number(
      value
        .slice(
          2,
          4
        )
    );


  const days = [

    31,
    29,
    31,
    30,
    31,
    30,
    31,
    31,
    30,
    31,
    30,
    31

  ];


  return (

    month >= 1 &&

    month <= 12 &&

    day >= 1 &&

    day <=
      days[
        month -
        1
      ]

  );

}


$("birthMMDD")
  .addEventListener(
    "input",
    () => {

      $("birthMMDD")
        .value =
        $("birthMMDD")
          .value
          .replace(
            /\D/g,
            ""
          )
          .slice(
            0,
            4
          );

    }
  );


$("idLast5")
  .addEventListener(
    "input",
    () => {

      $("idLast5")
        .value =
        $("idLast5")
          .value
          .replace(
            /\D/g,
            ""
          )
          .slice(
            0,
            5
          );

    }
  );


/* =========================================================
   studentKey
   必須和老師端完全相同
   ========================================================= */

async function createStudentKey(
  birthMMDD,
  idLast5
) {

  const raw =
    `exam-score-v1|${birthMMDD}|${idLast5}`;


  const data =
    new TextEncoder()
      .encode(
        raw
      );


  const hash =
    await crypto
      .subtle
      .digest(
        "SHA-256",
        data
      );


  return Array
    .from(
      new Uint8Array(
        hash
      )
    )
    .map(
      byte =>
        byte
          .toString(
            16
          )
          .padStart(
            2,
            "0"
          )
    )
    .join(
      ""
    );

}


/* =========================================================
   取得考試統計
   ========================================================= */

async function loadExamStats() {

  const snapshot =
    await getDocs(
      collection(
        db,
        "examStats"
      )
    );


  const exams =
    snapshot
      .docs
      .map(
        item => ({

          id:
            item.id,

          ...item
            .data()

        })
      );


  exams
    .sort(
      (
        a,
        b
      ) => {

        if (
          Number(
            a.schoolYear
          )
          !==
          Number(
            b.schoolYear
          )
        ) {

          return (
            Number(
              a.schoolYear
            )
            -
            Number(
              b.schoolYear
            )
          );

        }


        if (
          Number(
            a.semester
          )
          !==
          Number(
            b.semester
          )
        ) {

          return (
            Number(
              a.semester
            )
            -
            Number(
              b.semester
            )
          );

        }


        return (
          Number(
            a.examNo
          )
          -
          Number(
            b.examNo
          )
        );

      }
    );


  return exams;

}


/* =========================================================
   查詢
   ========================================================= */

$("searchBtn")
  .addEventListener(
    "click",
    searchStudent
  );


$("idLast5")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        searchStudent();

      }

    }

async function searchStudent() {

  clearMessage();


  const birthMMDD =
    $("birthMMDD")
      .value
      .trim();


  const idLast5 =
    $("idLast5")
      .value
      .trim();


  if (
    !isValidMMDD(
      birthMMDD
    )
  ) {

    showMessage(
      "出生月日格式錯誤，例如 8 月 15 日請輸入 0815。"
    );

    return;

  }


  if (
    !/^\d{5}$/
      .test(
        idLast5
      )
  ) {

    showMessage(
      "身分證號後五碼必須輸入 5 位數字。"
    );

    return;

  }


  $("searchBtn")
    .disabled =
    true;


  $("searchBtn")
    .textContent =
    "查詢中...";


  try {

    const studentKey =
      await createStudentKey(
        birthMMDD,
        idLast5
      );


    /*
      只 get 精確 studentKey
      不列出 students 集合。
    */

    const studentSnapshot =
      await getDoc(
        doc(
          db,
          "students",
          studentKey
        )
      );


    if (
      !studentSnapshot
        .exists()
    ) {

      showMessage(
        "查無符合的學生資料，請確認出生月日與身分證後五碼。"
      );

      return;

    }


    studentData =
      {

        studentKey,

        ...studentSnapshot
          .data()

      };


    const examStats =
      await loadExamStats();


    const records =
      [];


    /*
      每一次考試只 get
      這名學生自己的文件。
    */

    for (
      const exam
      of examStats
    ) {

      const resultSnapshot =
        await getDoc(
          doc(
            db,
            "examResults",
            exam.examCode ||
              exam.id,
            "students",
            studentKey
          )
        );


      if (
        resultSnapshot
          .exists()
      ) {

        records
          .push({

            examCode:
              exam.examCode ||
              exam.id,

            examName:
              exam.examName,

            schoolYear:
              exam.schoolYear,

            semester:
              exam.semester,

            examNo:
              exam.examNo,

            stats:
              exam,

            result:
              resultSnapshot
                .data()

          });

      }

    }


    if (
      records.length ===
      0
    ) {

      showMessage(
        "已找到學生，但目前沒有段考成績。"
      );

      return;

    }


    examRecords =
      records;


    renderAll();


    $("loginArea")
      .style
      .display =
      "none";


    $("resultArea")
      .classList
      .add(
        "show"
      );


  } catch (
    error
  ) {

    console.error(
      error
    );


    showMessage(
      "查詢失敗，請稍後再試。"
    );


  } finally {

    $("searchBtn")
      .disabled =
      false;


    $("searchBtn")
      .textContent =
      "查詢成績";

  }

}


/* =========================================================
   全畫面
   ========================================================= */

  const latest =

      examRecords.length -
      1
    ];


  $("studentName")

  $("studentMeta")

    latest.examCode;


  renderSelectedExam();


  renderAverageChart();


  renderHistoryTable();


  renderAnalysis();

}


/* =========================================================
   考試選單
   ========================================================= */

function renderExamOptions() {

  const select =
    $("examSelect");


  select
    .replaceChildren();


  examRecords
    .forEach(
      record => {

        const option =
          document
            .createElement(
              "option"
            );


        option.value =
          record
            .examCode;


        option.textContent =
          record
            .examName;


        select
          .appendChild(
            option
          );

      }
    );

}


$("examSelect")
  .addEventListener(
    "change",
    () => {

      renderSelectedExam();

    }
  );


/* =========================================================
   指定段考
   ========================================================= */

function renderSelectedExam() {

  const examCode =
    $("examSelect")
      .value;


  const index =
    examRecords
      .findIndex(
        record =>
          record
            .examCode ===
          examCode
      );


  if (
    index <
    0
  ) {

    return;

  }


  const record =
    examRecords[
      index
    ];


  const result =
    record
      .result;


  const stats =
    record
      .stats;


  $("latestExamName")
    .textContent =
    record
      .examName;


  $("totalValue")
    .textContent =
    formatNumber(
      result
        .total
    );


  $("averageValue")
    .textContent =
    formatNumber(
      result
        .average,
      2
    );


  $("rankValue")
    .textContent =
    result
      .rank
      ? `${formatNumber(result.rank)} / ${stats.studentCount || "-"}`
      : "-";


  /*
    與前次比較
  */

  if (
    index >
    0
  ) {

    const previous =
      examRecords[
        index -
        1
      ]
        .result;


    const change =
      Number(
        result.average
      )
      -
      Number(
        previous.average
      );


    $("averageChange")
      .textContent =
      signedNumber(
        change
      );


    $("averageChange")
      .className =
      "summary-value "
      +
      (
        change >
        0
          ? "positive"
          : change <
            0
              ? "negative"
              : "neutral"
      );


  } else {

    $("averageChange")
      .textContent =
      "—";


    $("averageChange")
      .className =
      "summary-value neutral";

  }


  renderSubjects(
    result,
    stats
  );

}


/* =========================================================
   五科
   ========================================================= */

function renderSubjects(
  result,
  stats
) {

  const subjects = [

    {
      key:
        "chinese",
      avg:
        "chineseAvg",
      name:
        "國文"
    },

    {
      key:
        "english",
      avg:
        "englishAvg",
      name:
        "英文"
    },

    {
      key:
        "math",
      avg:
        "mathAvg",
      name:
        "數學"
    },

    {
      key:
        "science",
      avg:
        "scienceAvg",
      name:
        "自然"
    },

    {
      key:
        "social",
      avg:
        "socialAvg",
      name:
        "社會"
    }

  ];


  $("subjectList")
    .innerHTML =
    subjects
      .map(
        subject => {

          const score =
            Number(
              result[
                subject.key
              ]
            );


          const classAvg =
            Number(
              stats[
                subject.avg
              ]
            );


          const difference =
            score -
            classAvg;


          const width =
            Math.max(
              0,
              Math.min(
                100,
                score
              )
            );


          return `

            <div class="subject-row">

              <div class="subject-name">
                ${subject.name}
              </div>

              <div class="subject-bar">

                <div
                  class="subject-fill"
                  style="width:${width}%"
                ></div>

              </div>

              <div class="subject-score">

                <strong>
                  ${formatNumber(score)}
                </strong>

                <br>

                班平均
                ${formatNumber(classAvg,2)}

                <span
                  class="compare ${
                    difference > 0
                      ? "positive"
                      : difference < 0
                        ? "negative"
                        : "neutral"
                  }"
                >

                  ${
                    difference === 0
                      ? "相同"
                      : `${signedNumber(difference)}`
                  }

                </span>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================

                examRecords

                      Number(

                          .result

                .28
            },

    );

}

/* =========================================================
   分析
   ========================================================= */

function renderAnalysis() {

  const subjectDefs = [

    {
      key:
        "chinese",
      avg:
        "chineseAvg",
      name:
        "國文"
    },

    {
      key:
        "english",
      avg:
        "englishAvg",
      name:
        "英文"
    },

    {
      key:
        "math",
      avg:
        "mathAvg",
      name:
        "數學"
    },

    {
      key:
        "science",
      avg:
        "scienceAvg",
      name:
        "自然"
    },

    {
      key:
        "social",
      avg:
        "socialAvg",
      name:
        "社會"
    }

  ];


  const subjectAnalysis =
    subjectDefs
      .map(
        subject => {

          const values =
            examRecords
              .map(
                record =>
                  Number(
                    record
                      .result[
                        subject.key
                      ]
                  )
              );


          const classDiffs =
            examRecords
              .map(
                record =>
                  Number(
                    record
                      .result[
                        subject.key
                      ]
                  )
                  -
                  Number(
                    record
                      .stats[
                        subject.avg
                      ]
                  )
              );


          const average =
            mean(
              values
            );


          const avgClassDiff =
            mean(
              classDiffs
            );


          const latest =
            values[
              values.length -
              1
            ];


          const previous =
            values.length >
            1
              ? values[
                  values.length -
                  2
                ]
              : latest;


          const latestChange =
            latest -
            previous;


          const recent =
            values
              .slice(
                -3
              );


          const recentTrend =
            recent.length >=
            2
              ? recent[
                  recent.length -
                  1
                ]
                -
                recent[
                  0
                ]
              : 0;


          const range =
            Math.max(
              ...values
            )
            -
            Math.min(
              ...values
            );


          return {

            ...subject,

            values,

            average,

            avgClassDiff,

            latest,

            latestChange,

            recentTrend,

            range

          };

        }
      );


  /*
    優勢科：
    優先考慮長期高於班平均。
  */

  const strongest =
    [
      ...subjectAnalysis
    ]
      .sort(
        (
          a,
          b
        ) =>
          b.avgClassDiff
          -
          a.avgClassDiff
      )[
        0
      ];


  /*
    近期進步：
    最近三次起點 → 最新。
  */

  const improving =
    [
      ...subjectAnalysis
    ]
      .sort(
        (
          a,
          b
        ) =>
          b.recentTrend
          -
          a.recentTrend
      )[
        0
      ];


  /*
    需要關注：
    最近趨勢下降優先，
    否則看相對班平均。
  */

  const attention =
    [
      ...subjectAnalysis
    ]
      .sort(
        (
          a,
          b
        ) => {

          const aScore =
            a.recentTrend
            +
            a.avgClassDiff *
            .35;


          const bScore =
            b.recentTrend
            +
            b.avgClassDiff *
            .35;


          return (
            aScore -
            bScore
          );

        }
      )[
        0
      ];


  $("analysisGrid")
    .innerHTML = `

      <div class="analysis-card">

        <div class="analysis-title">
          ⭐ 相對優勢
        </div>

        <div class="analysis-text">

          ${strongest.name}
          六次表現相較班平均最突出。

          ${
            strongest.avgClassDiff >= 0
              ? `平均高於班平均約 ${formatNumber(strongest.avgClassDiff,1)} 分。`
              : `目前仍可持續建立穩定表現。`
          }

        </div>

      </div>


      <div class="analysis-card">

        <div class="analysis-title">
          📈 近期進步
        </div>

        <div class="analysis-text">

          ${improving.name}
          最近幾次的變化較明顯。

          ${
            improving.recentTrend > 0
              ? `最近三次起點至目前提升約 ${formatNumber(improving.recentTrend,1)} 分。`
              : `近期尚未出現明顯上升，可先以穩定表現為目標。`
          }

        </div>

      </div>


      <div class="analysis-card">

        <div class="analysis-title">
          🔎 優先關注
        </div>

        <div class="analysis-text">

          ${attention.name}
          是目前較值得優先檢視的科目。

          ${
            attention.recentTrend < 0
              ? `近期約下降 ${formatNumber(Math.abs(attention.recentTrend),1)} 分。`
              : `可從錯題類型與基本概念掌握度進一步確認。`
          }

        </div>

      </div>

    `;


  renderAdvice(
    subjectAnalysis,
    strongest,
    improving,
    attention
  );

}


/* =========================================================
   學習建議
   ========================================================= */

function renderAdvice(
  subjectAnalysis,
  strongest,
  improving,
  attention
) {

  const latest =
    examRecords[
      examRecords.length -
      1
    ];


  const previous =
    examRecords.length >
    1
      ? examRecords[
          examRecords.length -
          2
        ]
      : null;


  const advice =
    [];


  /*
    整體
  */

  if (
    previous
  ) {

    const avgChange =
      Number(
        latest
          .result
          .average
      )
      -
      Number(
        previous
          .result
          .average
      );


    if (
      avgChange >=
      3
    ) {

      advice
        .push({

          title:
            "整體表現正在進步",

          text:
            `本次五科平均較前次提高 ${formatNumber(avgChange,1)} 分。建議先保留目前有效的讀書方式，再把額外時間集中在較弱科目，不需要全部重新調整。`

        });


    } else if (
      avgChange <=
      -3
    ) {

      advice
        .push({

          title:
            "先找出本次下降的來源",

          text:
            `本次五科平均較前次下降 ${formatNumber(Math.abs(avgChange),1)} 分。建議先比較五科中哪一科下降幅度最大，再檢查是觀念不熟、題意理解、計算失誤或複習時間不足，不必只以總平均判斷。`

        });

    }

  }


  /*
    優勢科
  */

  advice
    .push({

      title:
        `維持 ${strongest.name} 的有效方法`,

      text:
        `${strongest.name}是目前相對穩定的優勢。建議維持原有複習節奏，不需要為了再提高少量分數投入過多時間，可將部分時間轉移到較需要加強的科目。`

    });


  /*
    關注科
  */

  advice
    .push({

      title:
        `${attention.name}優先做錯題分類`,

      text:
        `建議把最近 2～3 次${attention.name}考卷的錯題分成「觀念不熟、計算或作答失誤、題意看錯、沒有複習到」四類。先處理重複出現的錯誤，比單純重新寫整本題目更有效率。`

    });


  /*
    進步科
  */

  if (
    improving.recentTrend >
    0
  ) {

    advice
      .push({

        title:
          `延續 ${improving.name} 的進步方式`,

        text:
          `${improving.name}近期呈現較明顯進步，表示目前的練習或複習方式可能有效。建議維持至少到下一次段考，再觀察是否能持續，而不是立即改變讀書方式。`

      });

  }


  /*
    波動最大科
  */

  const unstable =
    [
      ...subjectAnalysis
    ]
      .sort(
        (
          a,
          b
        ) =>
          b.range -
          a.range
      )[
        0
      ];


  if (
    unstable.range >=
    15
  ) {

    advice
      .push({

        title:
          `${unstable.name}注意成績波動`,

        text:
          `${unstable.name}歷次最高與最低成績差距約 ${formatNumber(unstable.range,1)} 分。這類情況通常比單純低分更值得注意，建議改成固定每週複習，而不要只在考前集中準備。`

      });

  }


  $("adviceList")
    .innerHTML =
    advice
      .slice(
        0,
        5
      )
      .map(
        item => `

          <div class="advice-item">

            <strong>
              ${escapeHtml(item.title)}
            </strong>

            ${escapeHtml(item.text)}

          </div>

        `
      )
      .join("");

}


/* =========================================================
   平均
   ========================================================= */

function mean(
  values
) {

  const valid =
    values
      .filter(
        value =>
          Number
            .isFinite(
              Number(
                value
              )
            )
      )
      .map(
        Number
      );


  if (
    valid.length ===
    0
  ) {

    return 0;

  }


  return valid
    .reduce(
      (
        sum,
        value
      ) =>
        sum +
        value,
      0
    )
    /
    valid.length;

}


/* =========================================================
   返回
   ========================================================= */

  .addEventListener(
    "click",
    () => {

      studentData =
        null;


      examRecords =
        [];


      if (
        averageChart
      ) {

        averageChart
          .destroy();


        averageChart =
          null;

      }


      $("resultArea")
        .classList
        .remove(
          "show"
        );


      $("loginArea")
        .style
        .display =
        "block";


      $("birthMMDD")
        .value =
        "";


      $("idLast5")
        .value =
        "";


      clearMessage();


      window
        .scrollTo(
          {
            top:
              0,

            behavior:
              "smooth"
          }
        );

    }
  );

</script>
