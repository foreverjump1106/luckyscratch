<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>804學生段考成績查詢</title>

  <link
    rel="icon"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%231d4ed8"/><text x="50" y="68" text-anchor="middle" font-size="60" fill="white">績</text></svg>'
  />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eff6ff, #f8fafc);
      color: #1e293b;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 42px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #64748b;
      font-size: 15px;
    }

    .card {
      background: rgba(255,255,255,.96);
      border-radius: 24px;
      padding: 28px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 50px rgba(15,23,42,.10);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      height: 52px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 0 15px;
      font-size: 17px;
      background: white;
    }

    .hint {
      margin-top: 7px;
      font-size: 13px;
      color: #64748b;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .result {
      display: none;
      margin-top: 24px;
    }

    .result.show {
      display: block;
    }

    .student-box {
      text-align: center;
      margin-bottom: 22px;
    }

    .student-name {
      font-size: 28px;
      font-weight: 900;
    }

    .student-sub {
      margin-top: 5px;
      color: #64748b;
    }

    .exam-selector {
      margin-bottom: 20px;
    }

    .score-list {
      display: grid;
      gap: 12px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 15px 17px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .subject {
      font-weight: 800;
    }

    .score {
      font-size: 22px;
      font-weight: 900;
      color: #1d4ed8;
    }

    .average-box {
      margin-top: 18px;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
    }

    .average-value {
      margin-top: 4px;
      font-size: 34px;
      font-weight: 900;
      color: #1d4ed8;
    }

    .logout {
      margin-top: 18px;
      background: #475569;
    }

    @media (max-width: 560px) {
      .page {
        padding: 20px 12px;
      }

      .card {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="container">

    <div class="header">
      <div class="logo">績</div>
      <h1>學生段考成績查詢</h1>
      <div class="subtitle">
        請輸入學生出生月日與身分證號後五碼
      </div>
    </div>

    <div class="card">

      <div id="loginArea">

        <div class="field">
          <label for="birthMMDD">出生月日</label>

          <input
            id="birthMMDD"
            maxlength="4"
            inputmode="numeric"
            placeholder="例如：0815"
          >

          <div class="hint">
            8 月 15 日請輸入 0815
          </div>
        </div>

        <div class="field">
          <label for="idLast5">身分證號後五碼</label>

          <input
            id="idLast5"
            type="password"
            maxlength="5"
            inputmode="numeric"
          >
        </div>

        <button id="searchBtn">查詢成績</button>

        <div id="message" class="message"></div>
      </div>


      <div id="result" class="result">

        <div class="student-box">
          <div id="studentName" class="student-name"></div>
          <div id="studentSub" class="student-sub"></div>
        </div>

        <div class="exam-selector">

          <label for="examSelect">
            選擇段考
          </label>

          <select id="examSelect"></select>

        </div>

        <div class="score-list">

          <div class="score-row">
            <div class="subject">國文</div>
            <div id="chinese" class="score"></div>
          </div>

          <div class="score-row">
            <div class="subject">英文</div>
            <div id="english" class="score"></div>
          </div>

          <div class="score-row">
            <div class="subject">數學</div>
            <div id="math" class="score"></div>
          </div>

          <div class="score-row">
            <div class="subject">自然</div>
            <div id="science" class="score"></div>
          </div>

          <div class="score-row">
            <div class="subject">社會</div>
            <div id="social" class="score"></div>
          </div>

        </div>

        <div class="average-box">
          <div>五科平均</div>
          <div id="average" class="average-value"></div>
        </div>

        <button id="logoutBtn" class="logout">
          返回查詢
        </button>

      </div>

    </div>

  </div>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC7hXtxLARv3LsoPcaViptdoWMZMLibtiY",
  authDomain: "exam-score-system.firebaseapp.com",
  projectId: "exam-score-system",
  storageBucket: "exam-score-system.firebasestorage.app",
  messagingSenderId: "334811583790",
  appId: "1:334811583790:web:a6207215915c163c8656bf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const birthInput = document.getElementById("birthMMDD");
const idInput = document.getElementById("idLast5");

const searchBtn = document.getElementById("searchBtn");
const logoutBtn = document.getElementById("logoutBtn");

const loginArea = document.getElementById("loginArea");
const result = document.getElementById("result");
const message = document.getElementById("message");

const examSelect = document.getElementById("examSelect");

let exams = [];


function showMessage(text) {
  message.textContent = text;
  message.className = "message error";
}

function clearMessage() {
  message.textContent = "";
  message.className = "message";
}


function isValidMMDD(value) {

  if (!/^\d{4}$/.test(value)) return false;

  const month = Number(value.slice(0,2));
  const day = Number(value.slice(2,4));

  const days = [
    31,29,31,30,31,30,
    31,31,30,31,30,31
  ];

  if (month < 1 || month > 12) return false;

  return day >= 1 && day <= days[month - 1];
}


birthInput.addEventListener("input", () => {
  birthInput.value = birthInput.value
    .replace(/\D/g, "")
    .slice(0,4);
});

idInput.addEventListener("input", () => {
  idInput.value = idInput.value
    .replace(/\D/g, "")
    .slice(0,5);
});


function displayExam(index) {

  const exam = exams[index];

  if (!exam) return;

  document.getElementById("chinese").textContent = exam.chinese;
  document.getElementById("english").textContent = exam.english;
  document.getElementById("math").textContent = exam.math;
  document.getElementById("science").textContent = exam.science;
  document.getElementById("social").textContent = exam.social;

  const values = [
    Number(exam.chinese),
    Number(exam.english),
    Number(exam.math),
    Number(exam.science),
    Number(exam.social)
  ];

  const avg =
    values.reduce((a,b) => a + b, 0)
    / values.length;

  document.getElementById("average").textContent =
    avg.toFixed(1);
}


examSelect.addEventListener("change", () => {
  displayExam(Number(examSelect.value));
});


searchBtn.addEventListener("click", async () => {

  clearMessage();

  const birthMMDD = birthInput.value.trim();
  const idLast5 = idInput.value.trim();

  if (!isValidMMDD(birthMMDD)) {
    showMessage(
      "出生月日格式錯誤，例如 8 月 15 日請輸入 0815。"
    );
    return;
  }

  if (!/^\d{5}$/.test(idLast5)) {
    showMessage("身分證後五碼必須為 5 位數。");
    return;
  }

  searchBtn.disabled = true;
  searchBtn.textContent = "查詢中...";

  try {

    /*
      先找學生
    */

    const studentQuery = query(
      collection(db, "students"),
      where("birthMMDD", "==", birthMMDD),
      where("idLast5", "==", idLast5)
    );

    const studentSnapshot = await getDocs(studentQuery);

    if (studentSnapshot.empty) {
      showMessage("查無符合的學生資料。");
      return;
    }

    const studentDoc = studentSnapshot.docs[0];

    const student = studentDoc.data();
    const studentKey = studentDoc.id;


    /*
      再讀這位學生所有考試
    */

    const examSnapshot = await getDocs(
      collection(
        db,
        "scores",
        studentKey,
        "exams"
      )
    );

    if (examSnapshot.empty) {
      showMessage("目前尚無段考成績。");
      return;
    }

    exams = examSnapshot.docs.map(docSnap => ({
      id: docSnap.id,
      ...docSnap.data()
    }));


    /*
      依考試代碼排序
      例如：
      114-2-exam3
      115-1-exam1
    */

    exams.sort((a,b) =>
      String(b.examCode || b.id)
        .localeCompare(
          String(a.examCode || a.id),
          "zh-Hant",
          {
            numeric: true
          }
        )
    );


    examSelect.innerHTML = "";

    exams.forEach((exam, index) => {

      const option = document.createElement("option");

      option.value = index;

      option.textContent =
        exam.examName ||
        exam.examCode ||
        exam.id;

      examSelect.appendChild(option);

    });


    document.getElementById("studentName").textContent =
      student.name || "學生";

    document.getElementById("studentSub").textContent =
      student.classCode
      ? `${student.classCode} 班　${student.seat || ""} 號`
      : "";


    loginArea.style.display = "none";
    result.classList.add("show");

    displayExam(0);

  } catch (error) {

    console.error(error);

    showMessage("查詢失敗，請稍後再試。");

  } finally {

    searchBtn.disabled = false;
    searchBtn.textContent = "查詢成績";
  }

});


logoutBtn.addEventListener("click", () => {

  result.classList.remove("show");
  loginArea.style.display = "block";

  birthInput.value = "";
  idInput.value = "";

  exams = [];
  examSelect.innerHTML = "";

  clearMessage();

});

</script>

</body>
</html>
