<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班級收繳航海日誌</title>
<style>
  :root{
    --ink:#2d241b;
    --paper:#f4dfad;
    --paper2:#fff2c9;
    --red:#c93b2f;
    --red2:#8f251f;
    --blue:#1d5875;
    --blue2:#10394d;
    --gold:#d9a62e;
    --green:#2c8a63;
    --orange:#d97924;
    --gray:#7b756c;
    --shadow:0 8px 20px rgba(35,28,18,.18);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 22%),
      linear-gradient(180deg,#88cce4 0,#56a7c8 33%,#26769d 100%);
    min-height:100vh;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.16;
    background-image:
      repeating-linear-gradient(0deg,transparent 0 28px,rgba(255,255,255,.18) 29px 30px),
      repeating-linear-gradient(90deg,transparent 0 52px,rgba(255,255,255,.08) 53px 54px);
  }

  .app{width:min(1180px,94vw); margin:24px auto 50px; position:relative; z-index:1}

  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#fff0bd,#e7bd68);
    border:5px solid #51371d;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:24px 24px 20px;
  }
  .hero::before,.hero::after{
    content:"☠";
    position:absolute;
    font-size:100px;
    opacity:.07;
    top:-18px;
  }
  .hero::before{left:18px; transform:rotate(-12deg)}
  .hero::after{right:18px; transform:rotate(12deg)}

  .hero-top{display:flex; gap:18px; align-items:center; justify-content:center; text-align:center}
  .emblem{
    width:72px;height:72px;display:grid;place-items:center;
    border-radius:50%; background:#1f2933; color:white; border:5px solid var(--gold);
    font-size:38px; box-shadow:0 4px 0 #6b491f;
  }
  h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:2px;color:#7d241f;text-shadow:2px 2px 0 #fff3c7}
  .subtitle{margin:6px 0 0;color:#5b4329;font-weight:800}

  .panel{
    margin-top:18px;
    background:linear-gradient(180deg,rgba(255,247,216,.98),rgba(243,219,166,.98));
    border:3px solid #63451f;
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:18px;
  }

  .section-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin:0 0 12px;color:#6e2b22}

  .form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
  label{font-weight:800;font-size:14px;color:#503a27;display:block;margin-bottom:6px}
  input,select,textarea,button{font:inherit}
  input[type="text"],input[type="date"],select{
    width:100%; border:2px solid #8b6a38; background:#fffaf0; color:#2d241b;
    border-radius:12px; padding:11px 12px; outline:none;
  }
  input:focus,select:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,88,117,.14)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  button{
    border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;
    transition:.15s transform,.15s filter; box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  button:hover{filter:brightness(1.05);transform:translateY(-1px)}
  button:active{transform:translateY(2px);box-shadow:none}
  .btn-primary{background:var(--red);color:#fff}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-gold{background:var(--gold);color:#2d241b}
  .btn-dark{background:#3f352a;color:#fff}
  .btn-light{background:#fff7df;color:#493721;border:1px solid #ac8952}

  .history-row{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:8px;margin-top:12px;align-items:end}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
  .stat{border:2px solid rgba(71,51,29,.35);border-radius:16px;padding:12px;text-align:center;background:#fff9e9}
  .stat b{display:block;font-size:28px;line-height:1.05}
  .stat span{font-size:13px;font-weight:800;color:#64543e}
  .stat.all b{color:var(--blue)}
  .stat.paid b{color:var(--green)}
  .stat.unpaid b{color:var(--red)}
  .stat.late b{color:var(--orange)}
  .stat.exempt b{color:var(--gray)}

  .progress-wrap{margin-top:12px;background:#d4c39d;border-radius:999px;overflow:hidden;border:2px solid #73542c;height:24px}
  .progress{height:100%;width:0;background:linear-gradient(90deg,#3ca678,#68c792);transition:.25s width}
  .progress-text{text-align:right;margin-top:5px;font-size:13px;font-weight:800}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .left-controls,.right-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{min-width:230px}
  .filter-btn.active{background:#1e536d;color:#fff;border-color:#1e536d}

  .table-wrap{overflow:auto;border-radius:16px;border:2px solid #70502e;background:#fff9e7}
  table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
  thead th{
    position:sticky;top:0;z-index:2;background:#4a3524;color:#fff7db;padding:12px 9px;
    border-right:1px solid #765b3e;font-size:14px;
  }
  tbody td{padding:9px;border-bottom:1px dashed #c7ae80;vertical-align:middle;background:rgba(255,250,236,.88)}
  tbody tr:hover td{background:#fff4cd}
  tbody tr.overdue td{background:#fff0e6}
  tbody tr.overdue td:first-child{box-shadow:inset 5px 0 0 #d95e3e}
  .seat{width:68px;text-align:center;font-weight:900;color:var(--blue)}
  .name{font-weight:900;font-size:16px;white-space:nowrap}
  .status-cell{min-width:330px}
  .status-actions{display:flex;gap:6px;flex-wrap:wrap}
  .status-btn{padding:7px 10px;border-radius:999px;box-shadow:none;border:2px solid transparent;font-size:13px}
  .status-btn.unpaid{background:#fde7e3;color:#922e24}
  .status-btn.paid{background:#dcf4e9;color:#166643}
  .status-btn.late{background:#fff0d8;color:#a95a13}
  .status-btn.exempt{background:#ece9e3;color:#5f5a53}
  .status-btn.selected{border-color:#27231e;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .status-badge{display:inline-block;border-radius:999px;padding:5px 9px;font-weight:900;font-size:12px;white-space:nowrap}
  .status-badge.overdue{background:#c53c2f;color:#fff}
  .status-badge.normal{background:#e8ddc5;color:#5f503d}
  .note-input{width:100%;min-width:160px;border:1.5px solid #ad9369;border-radius:10px;padding:8px;background:#fffdf6}

  .empty{padding:34px;text-align:center;font-weight:800;color:#735f46}
  .footer-note{text-align:center;color:#eef8fb;margin-top:14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.2)}

  .toast{position:fixed;right:20px;bottom:20px;background:#2f2923;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:20}
  .toast.show{opacity:1;transform:translateY(0)}

  @media (max-width:760px){
    .app{width:96vw;margin-top:10px}
    .hero{padding:18px 12px}.emblem{width:58px;height:58px;font-size:30px}h1{font-size:30px}
    .form-grid{grid-template-columns:1fr}
    .history-row{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stats .stat:first-child{grid-column:1/-1}
    .controls{align-items:stretch}.left-controls,.right-controls{width:100%}.search{min-width:100%}
    .left-controls button,.right-controls button{flex:1}
  }

  @media print{
    body{background:white}.app{width:100%;margin:0}.hero,.panel{box-shadow:none}
    .toolbar,.controls,.history-row,.footer-note,.toast{display:none!important}
    .hero{border:2px solid #333}.panel{border:1px solid #555}
    .status-actions{display:none}.note-input{border:0;background:transparent}
    table{min-width:0;font-size:11px}thead th{position:static;background:#ddd;color:#111}
  }
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="hero-top">
      <div class="emblem">☠</div>
      <div>
        <h1>班級收繳航海日誌</h1>
        <p class="subtitle">把每一份資料安全送上船，一個都不能少！</p>
      </div>
    </div>

    <div class="panel" style="margin-top:18px;box-shadow:none">
      <div class="section-title">🧭 收繳任務設定</div>
      <div class="form-grid">
        <div>
          <label for="itemName">收繳項目名稱</label>
          <input id="itemName" type="text" placeholder="例如：家長同意書、戶外教育費用、暑假作業…" />
        </div>
        <div>
          <label for="receiveDate">開始收繳日期</label>
          <input id="receiveDate" type="date" />
        </div>
        <div>
          <label for="dueDate">截止日期</label>
          <input id="dueDate" type="date" />
        </div>
      </div>
      <div class="toolbar">
        <button class="btn-primary" id="saveRecordBtn">💾 建立／儲存此項目</button>
        <button class="btn-gold" id="newRecordBtn">🗺️ 新增收繳項目</button>
        <button class="btn-blue" id="copyUnpaidBtn">📋 複製未繳名單</button>
        <button class="btn-light" id="exportBtn">📤 匯出 CSV</button>
        <button class="btn-light" id="printBtn">🖨️ 列印</button>
      </div>

      <div class="history-row">
        <div>
          <label for="historySelect">歷史收繳紀錄</label>
          <select id="historySelect"><option value="">— 尚未建立紀錄 —</option></select>
        </div>
        <button class="btn-dark" id="loadBtn">📖 載入紀錄</button>
        <button class="btn-light" id="deleteBtn">🗑️ 刪除目前紀錄</button>
      </div>

      <div class="stats">
        <div class="stat all"><b id="countAll">28</b><span>全班人數</span></div>
        <div class="stat paid"><b id="countPaid">0</b><span>已繳交</span></div>
        <div class="stat unpaid"><b id="countUnpaid">28</b><span>未繳交</span></div>
        <div class="stat late"><b id="countLate">0</b><span>補交</span></div>
        <div class="stat exempt"><b id="countExempt">0</b><span>免繳</span></div>
      </div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <div class="progress-text" id="progressText">完成率 0%</div>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">🏴‍☠️ 船員收繳名冊</div>
    <div class="controls" style="margin-bottom:12px">
      <div class="left-controls">
        <input id="searchInput" class="search" type="text" placeholder="🔎 搜尋座號或姓名" />
        <button class="btn-light filter-btn active" data-filter="all">全部</button>
        <button class="btn-light filter-btn" data-filter="unpaid">未繳</button>
        <button class="btn-light filter-btn" data-filter="paid">已繳</button>
        <button class="btn-light filter-btn" data-filter="late">補交</button>
        <button class="btn-light filter-btn" data-filter="exempt">免繳</button>
        <button class="btn-light filter-btn" data-filter="overdue">逾期</button>
      </div>
      <div class="right-controls">
        <button class="btn-blue" id="allPaidBtn">✅ 全部設已繳</button>
        <button class="btn-light" id="allUnpaidBtn">↩ 全部設未繳</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>座號</th>
            <th>姓名</th>
            <th>繳交狀態</th>
            <th>期限提醒</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="studentBody"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>沒有符合條件的學生。</div>
    </div>
  </section>

  <div class="footer-note">資料只儲存在這台裝置的瀏覽器中，不會自動上傳到網路。</div>
</div>
<div class="toast" id="toast"></div>

<script>
const STUDENTS = [
  {seat:1,name:"王禹涵"},{seat:2,name:"江育緹"},{seat:3,name:"呂思儀"},{seat:4,name:"李詠騏"},
  {seat:5,name:"林子歆"},{seat:6,name:"林禹萱"},{seat:7,name:"張馨勻"},{seat:8,name:"陳昕樂"},
  {seat:9,name:"陳梓安"},{seat:10,name:"陳筠蓁"},{seat:11,name:"陳苙絜"},{seat:12,name:"楊錚諭"},
  {seat:13,name:"趙安褕"},{seat:14,name:"魏語潔"},{seat:15,name:"江靚恩"},{seat:16,name:"王洋振"},
  {seat:17,name:"吳昊丞"},{seat:18,name:"李祐誠"},{seat:19,name:"林宸陞"},{seat:20,name:"林維辰"},
  {seat:21,name:"林鈺棟"},{seat:22,name:"洪楷祥"},{seat:23,name:"陳兆楷"},{seat:24,name:"陳沂璟"},
  {seat:25,name:"黑肚‧尤明"},{seat:26,name:"賴震宇"},{seat:27,name:"戴震龍"},{seat:28,name:"謝宇哲"}
];

const STORAGE_KEY = "class_submission_pirate_v1";
const STATUS_LABEL = { unpaid:"未繳交", paid:"已繳交", late:"補交", exempt:"免繳" };
let currentId = null;
let filter = "all";
let studentState = createBlankState();

const $ = id => document.getElementById(id);

function createBlankState(){
  return Object.fromEntries(STUDENTS.map(s => [s.seat,{status:"unpaid",note:""}]));
}
function loadStore(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {records:[]};}
  catch(e){return {records:[]};}
}
function saveStore(store){localStorage.setItem(STORAGE_KEY,JSON.stringify(store));}
function uid(){return "rec_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);}
function todayISO(){
  const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function isOverdue(status){
  const due=$("dueDate").value;
  return !!due && todayISO()>due && status==="unpaid";
}
function formatDate(s){
  if(!s)return "未設定";
  const [y,m,d]=s.split("-"); return `${y}/${m}/${d}`;
}
function escapeHTML(str=""){
  return String(str).replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
}
function showToast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>t.classList.remove("show"),1800);
}
function currentMeta(){
  return {itemName:$("itemName").value.trim(),receiveDate:$("receiveDate").value,dueDate:$("dueDate").value};
}
function autosaveCurrent(){
  if(!currentId) return;
  const store=loadStore();
  const idx=store.records.findIndex(r=>r.id===currentId);
  if(idx<0)return;
  store.records[idx]={...store.records[idx],...currentMeta(),students:studentState,updatedAt:new Date().toISOString()};
  saveStore(store); refreshHistory();
}

function render(){
  const q=$("searchInput").value.trim().toLowerCase();
  const tbody=$("studentBody"); tbody.innerHTML="";
  let shown=0;

  STUDENTS.forEach(s=>{
    const st=studentState[s.seat] || {status:"unpaid",note:""};
    const overdue=isOverdue(st.status);
    const matchesSearch=!q || String(s.seat).includes(q) || s.name.toLowerCase().includes(q);
    const matchesFilter= filter==="all" || (filter==="overdue" ? overdue : st.status===filter);
    if(!matchesSearch || !matchesFilter)return;
    shown++;

    const tr=document.createElement("tr");
    if(overdue)tr.classList.add("overdue");
    tr.innerHTML=`
      <td class="seat">${s.seat}</td>
      <td class="name">${escapeHTML(s.name)}</td>
      <td class="status-cell">
        <div class="status-actions">
          ${statusButton(s.seat,"unpaid",st.status)}
          ${statusButton(s.seat,"paid",st.status)}
          ${statusButton(s.seat,"late",st.status)}
          ${statusButton(s.seat,"exempt",st.status)}
        </div>
      </td>
      <td><span class="status-badge ${overdue?'overdue':'normal'}">${overdue?'⚠ 逾期未繳':'正常'}</span></td>
      <td><input class="note-input" data-note="${s.seat}" value="${escapeHTML(st.note)}" placeholder="可填原因或補充" /></td>
    `;
    tbody.appendChild(tr);
  });

  $("emptyState").hidden=shown!==0;
  bindRowEvents();
  updateStats();
}

function statusButton(seat,status,current){
  const icon={unpaid:"⏳",paid:"✅",late:"🧾",exempt:"➖"}[status];
  return `<button class="status-btn ${status} ${current===status?'selected':''}" data-seat="${seat}" data-status="${status}">${icon} ${STATUS_LABEL[status]}</button>`;
}

function bindRowEvents(){
  document.querySelectorAll(".status-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const seat=Number(btn.dataset.seat); const status=btn.dataset.status;
      studentState[seat].status=status;
      autosaveCurrent(); render();
    });
  });
  document.querySelectorAll(".note-input").forEach(input=>{
    input.addEventListener("input",()=>{studentState[Number(input.dataset.note)].note=input.value; autosaveCurrent();});
  });
}

function updateStats(){
  const values=Object.values(studentState);
  const paid=values.filter(x=>x.status==="paid").length;
  const unpaid=values.filter(x=>x.status==="unpaid").length;
  const late=values.filter(x=>x.status==="late").length;
  const exempt=values.filter(x=>x.status==="exempt").length;
  const completed=paid+late+exempt;
  const pct=Math.round(completed/STUDENTS.length*100);
  $("countAll").textContent=STUDENTS.length;
  $("countPaid").textContent=paid;
  $("countUnpaid").textContent=unpaid;
  $("countLate").textContent=late;
  $("countExempt").textContent=exempt;
  $("progress").style.width=pct+"%";
  $("progressText").textContent=`完成率 ${pct}%（${completed}/${STUDENTS.length}）`;
}

function saveRecord(){
  const meta=currentMeta();
  if(!meta.itemName){showToast("請先填寫收繳項目名稱"); $("itemName").focus(); return;}
  if(meta.receiveDate && meta.dueDate && meta.receiveDate>meta.dueDate){showToast("截止日期不能早於開始日期"); return;}

  const store=loadStore();
  if(!currentId){
    currentId=uid();
    store.records.unshift({id:currentId,...meta,students:studentState,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  }else{
    const idx=store.records.findIndex(r=>r.id===currentId);
    const rec={id:currentId,...meta,students:studentState,updatedAt:new Date().toISOString()};
    if(idx>=0)store.records[idx]={...store.records[idx],...rec}; else store.records.unshift({...rec,createdAt:new Date().toISOString()});
  }
  saveStore(store); refreshHistory(); $("historySelect").value=currentId; showToast("收繳紀錄已儲存");
}

function newRecord(){
  currentId=null; studentState=createBlankState();
  $("itemName").value=""; $("receiveDate").value=todayISO(); $("dueDate").value="";
  $("historySelect").value=""; filter="all"; setActiveFilter(); $("searchInput").value=""; render();
  showToast("已開啟新的收繳項目");
}

function refreshHistory(){
  const store=loadStore(); const sel=$("historySelect"); const old=sel.value;
  sel.innerHTML='<option value="">— 選擇歷史收繳紀錄 —</option>';
  store.records.forEach(r=>{
    const op=document.createElement("option"); op.value=r.id;
    op.textContent=`${r.itemName || '未命名'}｜截止 ${formatDate(r.dueDate)}`;
    sel.appendChild(op);
  });
  if([...sel.options].some(o=>o.value===old))sel.value=old;
}

function loadRecord(){
  const id=$("historySelect").value;
  if(!id){showToast("請先選擇一筆歷史紀錄");return;}
  const rec=loadStore().records.find(r=>r.id===id); if(!rec)return;
  currentId=rec.id; $("itemName").value=rec.itemName||""; $("receiveDate").value=rec.receiveDate||""; $("dueDate").value=rec.dueDate||"";
  studentState=createBlankState();
  STUDENTS.forEach(s=>{if(rec.students?.[s.seat])studentState[s.seat]={...studentState[s.seat],...rec.students[s.seat]};});
  filter="all";setActiveFilter();$("searchInput").value="";render();showToast("已載入收繳紀錄");
}

function deleteRecord(){
  if(!currentId){showToast("目前不是已儲存的紀錄");return;}
  if(!confirm("確定要刪除目前這筆收繳紀錄嗎？此動作無法復原。"))return;
  const store=loadStore(); store.records=store.records.filter(r=>r.id!==currentId); saveStore(store); refreshHistory(); newRecord(); showToast("紀錄已刪除");
}

function setAll(status){
  const label=STATUS_LABEL[status];
  if(!confirm(`確定要把全班 28 人都設為「${label}」嗎？`))return;
  STUDENTS.forEach(s=>studentState[s.seat].status=status); autosaveCurrent(); render(); showToast(`全班已設為${label}`);
}

function setActiveFilter(){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
}

function unpaidList(){
  return STUDENTS.filter(s=>studentState[s.seat].status==="unpaid");
}

async function copyUnpaid(){
  const list=unpaidList(); const item=$("itemName").value.trim()||"本次資料";
  const due=$("dueDate").value ? `（截止：${formatDate($("dueDate").value)}）` : "";
  const text=list.length ? `${item}${due}\n未繳交：\n${list.map(s=>`${s.seat}號 ${s.name}`).join("\n")}` : `${item}${due}\n全班皆已完成繳交。`;
  try{await navigator.clipboard.writeText(text);showToast("未繳名單已複製");}
  catch(e){prompt("請複製以下內容：",text);}
}

function csvEscape(v){return '"'+String(v??"").replaceAll('"','""')+'"';}
function exportCSV(){
  const item=$("itemName").value.trim()||"班級收繳紀錄";
  const rows=[["收繳項目",item],["開始收繳日期",$("receiveDate").value],["截止日期",$("dueDate").value],[],["座號","姓名","狀態","是否逾期","備註"]];
  STUDENTS.forEach(s=>{const st=studentState[s.seat];rows.push([s.seat,s.name,STATUS_LABEL[st.status],isOverdue(st.status)?"是":"否",st.note]);});
  const csv="\uFEFF"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`${item.replace(/[\\/:*?"<>|]/g,"_")}_收繳紀錄.csv`; a.click(); URL.revokeObjectURL(a.href);
}

$("saveRecordBtn").addEventListener("click",saveRecord);
$("newRecordBtn").addEventListener("click",newRecord);
$("loadBtn").addEventListener("click",loadRecord);
$("deleteBtn").addEventListener("click",deleteRecord);
$("copyUnpaidBtn").addEventListener("click",copyUnpaid);
$("exportBtn").addEventListener("click",exportCSV);
$("printBtn").addEventListener("click",()=>window.print());
$("allPaidBtn").addEventListener("click",()=>setAll("paid"));
$("allUnpaidBtn").addEventListener("click",()=>setAll("unpaid"));
$("searchInput").addEventListener("input",render);
$("dueDate").addEventListener("change",()=>{autosaveCurrent();render();});
$("itemName").addEventListener("change",autosaveCurrent);
$("receiveDate").addEventListener("change",autosaveCurrent);
$("historySelect").addEventListener("change",()=>{ if($("historySelect").value) loadRecord(); });
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{filter=btn.dataset.filter;setActiveFilter();render();}));

(function init(){
  $("receiveDate").value=todayISO();
  refreshHistory(); render();
})();
</script>
