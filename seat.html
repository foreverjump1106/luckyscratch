<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>偉大的航道 - 班級座位編排系統 (海賊王風)</title>
    <!-- 引入 html2canvas 以支援下載圖片功能 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --wood-dark: #2c1d11;
            --wood-light: #5c3a21;
            --gold: #d4af37;
            --parchment: #f4e8c1;
            --parchment-dark: #d8c48fc4;
            --sea-blue: #1b3b5f;
            --red-bounty: #8b0000;
        }

        body {
            background-color: var(--wood-dark);
            background-image: radial-gradient(circle, #3d2716 0%, #1a1008 100%);
            color: #fdf6e2;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--gold);
            text-shadow: 2px 2px 4px #000;
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #d1b693;
            font-style: italic;
            margin-bottom: 20px;
        }

        /* 主容器左右分欄 */
        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: flex-start;
        }

        /* 左側：未入座學生區 */
        .sidebar-left {
            width: 250px;
            background: rgba(44, 29, 17, 0.9);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            max-height: 80vh;
            overflow-y: auto;
        }

        .sidebar-left h3 {
            color: var(--gold);
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
        }

        /* 中間：教室座位區 */
        .classroom-area {
            flex-grow: 1;
            background: rgba(20, 12, 6, 0.85);
            border: 4px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 16px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .podium {
            background: linear-gradient(to bottom, #8b5a2b, #5c3a21);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 10px 50px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            letter-spacing: 5px;
        }

        /* 6x6 座位網格預設 (學生視角：講台在上) */
        .grid-6x6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 720px;
        }

        /* 老師視角：使用 CSS Grid 的 direction: rtl 讓排版由右至左，或透過順序反轉 */
        /* 老師視角容器設定 */
        .grid-6x6.teacher-view {
            direction: rtl; /* 由右到左，讓第一排從左下方開始（因為視覺上反轉） */
        }
        .grid-6x6.teacher-view .seat-cell {
            direction: ltr; /* 恢復文字正常顯示 */
        }

        .seat-cell {
            aspect-ratio: 1 / 1;
            background: var(--parchment);
            color: #333;
            border: 2px dashed #8b5a2b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .seat-cell.drag-over {
            background: #ffeaa7;
            border-color: #d63031;
            transform: scale(1.05);
        }

        /* 右側：幹部與小老師區 */
        .sidebar-right {
            width: 320px;
            background: rgba(44, 29, 17, 0.9);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            max-height: 80vh;
            overflow-y: auto;
        }

        .sidebar-right h3 {
            color: var(--gold);
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
        }

        .staff-group {
            margin-bottom: 15px;
        }

        .staff-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--gold);
            margin-bottom: 3px;
            font-weight: bold;
        }

        .staff-group select {
            width: 100%;
            padding: 6px;
            background: var(--parchment);
            border: 1px solid var(--gold);
            border-radius: 4px;
            font-family: inherit;
            color: #2c1d11;
            font-weight: bold;
        }

        /* 學生卡片樣式 (懸賞單風格) */
        .student-card {
            background: linear-gradient(135deg, #fdf6e2 0%, #e6d5b8 100%);
            color: #2c1d11;
            border: 2px solid #5c3a21;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            user-select: none;
            width: 90%;
            box-sizing: border-box;
            margin: 5px auto;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .student-card:active {
            cursor: grabbing;
        }

        .student-card .s-id {
            font-size: 0.75rem;
            color: #8b5a2b;
        }

        .student-card .s-name {
            font-size: 0.95rem;
        }

        /* 側邊欄內的卡片清單容器 */
        #unassigned-list {
            min-height: 100px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* 控制按鈕列 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pirate-btn {
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #1a1008;
            border: 2px solid #fff;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .pirate-btn:hover {
            background: linear-gradient(to bottom, #f3cf54, #d4af37);
            transform: translateY(-2px);
        }

        .pirate-btn.active-mode {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: #fff;
            border-color: var(--gold);
        }

        /* 翻牌模式：背面卡片 */
        .seat-cell.flipped .student-card {
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            color: var(--gold);
            border: 2px solid var(--gold);
        }
        .seat-cell.flipped .student-card .s-id,
        .seat-cell.flipped .student-card .s-name {
            display: none;
        }
        .seat-cell.flipped .student-card::after {
            content: "⚓ 懸賞中";
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>🏴‍☠️ 偉大的航道：704班級座位編排 ⚓</h1>
    <div class="subtitle">「目標是成為海賊王！找到屬於你的黃金座位！」</div>

    <div class="main-container">
        <!-- 左側：待命船員（未排入座位的學生） -->
        <div class="sidebar-left">
            <h3>📜 候補船員名單</h3>
            <div id="unassigned-list" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToUnassigned(event)">
                <!-- 動態生成 -->
            </div>
        </div>

        <!-- 中間：教室座位區 -->
        <div class="classroom-area" id="capture-area">
            <!-- 講台位置會隨模式動態調整上下 -->
            <div id="podium-top" class="podium" style="margin-bottom: 20px;">🌟 偉大的航道 (講台 / 黑板) 🌟</div>
            
            <div class="grid-6x6" id="seat-grid">
                <!-- 動態生成 36 格 -->
            </div>

            <div id="podium-bottom" class="podium" style="margin-top: 20px; display: none;">🌟 偉大的航道 (講台 / 黑板) 🌟</div>

            <div class="control-bar">
                <button class="pirate-btn" id="btn-student-view" onclick="setMode('student')">👨‍🎓 學生觀看版本</button>
                <button class="pirate-btn" id="btn-teacher-view" onclick="setMode('teacher')">👩‍🏫 老師觀看版</button>
                <button class="pirate-btn" id="btn-flip-view" onclick="setMode('flip')">🃏 翻牌神祕模式</button>
                <button class="pirate-btn" onclick="randomAssign()">🎲 惡魔果實隨機排位</button>
                <button class="pirate-btn" onclick="saveData()">💾 儲存座位與幹部</button>
                <button class="pirate-btn" onclick="downloadImage()">📷 下載座位表圖片</button>
            </div>
        </div>

        <!-- 右側：幹部與小老師下拉選單 -->
        <div class="sidebar-right">
            <h3>👑 核心幹部與小老師</h3>
            <div id="staff-container">
                <!-- 動態生成選單 -->
            </div>
        </div>
    </div>

<script>
    // 28位學生資料
    const students = [
        { id: 1, name: "王禹涵" }, { id: 2, name: "江育緹" }, { id: 3, name: "呂思儀" }, { id: 4, name: "李詠騏" },
        { id: 5, name: "林子歆" }, { id: 6, name: "林禹萱" }, { id: 7, name: "張馨勻" }, { id: 8, name: "陳昕樂" },
        { id: 9, name: "陳梓安" }, { id: 10, name: "陳筠臻" }, { id: 11, name: "陳苙絜" }, { id: 12, name: "楊箏諭" },
        { id: 13, name: "趙安渝" }, { id: 14, name: "魏語潔" }, { id: 15, name: "江靚恩" }, { id: 16, name: "王洋振" },
        { id: 17, name: "吳昊丞" }, { id: 18, name: "李祐誠" }, { id: 19, name: "林宸陞" }, { id: 20, name: "林維辰" },
        { id: 21, name: "林鈺棟" }, { id: 22, name: "洪楷祥" }, { id: 23, name: "陳兆楷" }, { id: 24, name: "陳沂璟" },
        { id: 25, name: "黑肚·尤明" }, { id: 26, name: "賴震宇" }, { id: 27, name: "戴震龍" }, { id: 28, name: "謝宇哲" }
    ];

    // 幹部與小老師職稱清單
    const staffList = [
        "班長", "副班長", "風紀股長", "學藝股長", "衛生股長", "副衛生股長", 
        "康樂股長", "保健股長", "食勤股長", "事務股長", "輔導股長",
        "國文小老師", "英文小老師", "數學小老師", "歷史小老師", "地理小老師", 
        "公民小老師", "自然小老師", "表藝小老師", "視藝小老師", "聽藝小老師", 
        "童軍小老師", "家政小老師", "輔導小老師", "本土語小老師", "資訊小老師", 
        "情繫小老師", "圖書志工(一)", "圖書志工(二)"
    ];

    let seatMap = {}; // 記錄每個格子放了誰 { "cell-0": studentObj, ... }
    let unassignedStudents = [...students];
    let staffAssignments = {}; // 記錄職務指派
    
    // 模式狀態: 'student' (學生觀看), 'teacher' (老師觀看), 'flip' (翻牌模式)
    let currentMode = 'student'; 
    let flippedStatus = {}; // 記錄翻牌狀態

    // 初始化頁面
    function init() {
        renderUnassigned();
        renderStaff();
        loadData(); // 嘗試讀取本地儲存
        updateViewModeUI();
    }

    // 切換模式主邏輯
    function setMode(mode) {
        currentMode = mode;
        if (currentMode === 'flip') {
            // 進入翻牌模式時，預設全部翻背面
            for (let i = 0; i < 36; i++) {
                if (seatMap[`cell-${i}`]) {
                    flippedStatus[`cell-${i}`] = false;
                }
            }
        }
        updateViewModeUI();
        renderGrid();
    }

    // 更新介面與按鈕樣式
    function updateViewModeUI() {
        document.getElementById("btn-student-view").className = "pirate-btn" + (currentMode === 'student' ? " active-mode" : "");
        document.getElementById("btn-teacher-view").className = "pirate-btn" + (currentMode === 'teacher' ? " active-mode" : "");
        document.getElementById("btn-flip-view").className = "pirate-btn" + (currentMode === 'flip' ? " active-mode" : "");

        const podiumTop = document.getElementById("podium-top");
        const podiumBottom = document.getElementById("podium-bottom");
        const grid = document.getElementById("seat-grid");

        // 根據模式調整講台位置與排版方向
        if (currentMode === 'teacher') {
            podiumTop.style.display = "none";
            podiumBottom.style.display = "block";
            grid.className = "grid-6x6 teacher-view";
        } else {
            podiumTop.style.display = "block";
            podiumBottom.style.display = "none";
            grid.className = "grid-6x6";
        }
    }

    // 渲染未入座區
    function renderUnassigned() {
        const container = document.getElementById("unassigned-list");
        container.innerHTML = "";
        unassignedStudents.forEach(student => {
            container.appendChild(createCardElement(student));
        });
    }

    // 渲染 6x6 座位格子 (共36格)
    function renderGrid() {
        const grid = document.getElementById("seat-grid");
        grid.innerHTML = "";

        // 依照您要求的視覺順序：
        // 學生觀看：第一排在右上方 (傳統由左到右編號 0~35 或由右到左)
        // 老師觀看版：第一排在左下方開始
        for (let i = 0; i < 36; i++) {
            let cellIndex = i;
            
            // 如果是老師視角，我們將格子陣列順序反轉，讓第一排（原本的最後一排 30~35）跑到最下方，且由左開始
            if (currentMode === 'teacher') {
                // 數學轉換：讓 35~30 變成第一行，以此類推
                let row = Math.floor(i / 6);
                let col = i % 6;
                let newRow = 5 - row;
                let newCol = 5 - col; // 因為 teacher-view 加了 rtl，所以 col 要對應
                cellIndex = newRow * 6 + newCol;
            }

            const cellId = `cell-${cellIndex}`;
            const cell = document.createElement("div");
            cell.className = "seat-cell";
            cell.id = cellId;
            cell.dataset.index = cellIndex;

            // 拖曳事件綁定
            cell.ondragover = allowDrop;
            cell.ondragleave = removeDropStyle;
            cell.ondrop = dropToCell;

            // 如果該格原本就有學生
            if (seatMap[cellId]) {
                const card = createCardElement(seatMap[seatMap[cellId] ? cellId : cellIndex]); // 確保正確抓取
                // 修正卡片物件抓取
                cell.innerHTML = "";
                cell.appendChild(createCardElement(seatMap[cellId]));
                
                if (currentMode === 'flip' && flippedStatus[cellId] === false) {
                    cell.classList.add("flipped");
                }
            } else {
                cell.innerText = cellIndex + 1; // 顯示座位編號
                cell.style.color = "#8b5a2b";
                cell.style.fontSize = "0.8rem";
            }

            // 點擊事件：若在翻牌模式下，點擊可翻面
            cell.onclick = (e) => {
                if (currentMode === 'flip' && seatMap[cellId]) {
                    flippedStatus[cellId] = !flippedStatus[cellId];
                    if (flippedStatus[cellId]) {
                        cell.classList.remove("flipped");
                    } else {
                        cell.classList.add("flipped");
                    }
                }
            };

            grid.appendChild(cell);
        }
    }

    // 建立學生卡片 DOM
    function createCardElement(student) {
        const card = document.createElement("div");
        card.className = "student-card";
        card.draggable = true;
        card.dataset.id = student.id;
        card.innerHTML = `
            <div class="s-id">No. ${student.id}</div>
            <div class="s-name">${student.name}</div>
        `;
        card.ondragstart = drag;
        return card;
    }

    // 渲染右側幹部選單
    function renderStaff() {
        const container = document.getElementById("staff-container");
        container.innerHTML = "";
        staffList.forEach(title => {
            const group = document.createElement("div");
            group.className = "staff-group";
            
            const label = document.createElement("label");
            label.innerText = title;

            const select = document.createElement("select");
            select.onchange = (e) => {
                staffAssignments[title] = e.target.value;
            };

            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.innerText = "-- 請選擇 --";
            select.appendChild(defaultOpt);

            students.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.name;
                opt.innerText = `${s.id} 號 - ${s.name}`;
                if (staffAssignments[title] === s.name) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            group.appendChild(label);
            group.appendChild(select);
            container.appendChild(group);
        });
    }

    // 拖曳相關邏輯
    let draggedStudentId = null;
    let sourceLocation = null;

    function drag(event) {
        draggedStudentId = parseInt(event.target.dataset.id);
        const parentCell = event.target.closest(".seat-cell");
        if (parentCell) {
            sourceLocation = parentCell.id;
        } else {
            sourceLocation = "unassigned";
        }
    }

    function allowDrop(event) {
        event.preventDefault();
        event.currentTarget.classList.add("drag-over");
    }

    function removeDropStyle(event) {
        event.currentTarget.classList.remove("drag-over");
    }

    function dropToCell(event) {
        event.preventDefault();
        const cell = event.currentTarget;
        cell.classList.remove("drag-over");
        const targetCellId = cell.id;

        let studentObj = null;
        if (sourceLocation === "unassigned") {
            const idx = unassignedStudents.findIndex(s => s.id === draggedStudentId);
            if (idx !== -1) studentObj = unassignedStudents.splice(idx, 1)[0];
        } else {
            studentObj = seatMap[sourceLocation];
            delete seatMap[sourceLocation];
            if (flippedStatus[sourceLocation]) delete flippedStatus[sourceLocation];
        }

        if (seatMap[targetCellId]) {
            unassignedStudents.push(seatMap[targetCellId]);
            delete flippedStatus[targetCellId];
        }

        if (studentObj) {
            seatMap[targetCellId] = studentObj;
            if (currentMode === 'flip') {
                flippedStatus[targetCellId] = false;
            }
        }

        renderUnassigned();
        renderGrid();
    }

    function dropToUnassigned(event) {
        event.preventDefault();
        event.currentTarget.classList.remove("drag-over");

        if (sourceLocation !== "unassigned") {
            const studentObj = seatMap[sourceLocation];
            delete seatMap[sourceLocation];
            if (flippedStatus[sourceLocation]) delete flippedStatus[sourceLocation];
            if (studentObj) {
                unassignedStudents.push(studentObj);
                unassignedStudents.sort((a,b) => a.id - b.id);
            }
            renderUnassigned();
            renderGrid();
        }
    }

    // 隨機排位 (惡魔果實亂數)
    function randomAssign() {
        let allPool = [...students];
        allPool.sort(() => Math.random() - 0.5);
        
        seatMap = {};
        unassignedStudents = [];
        flippedStatus = {};

        for (let i = 0; i < 28 && i < allPool.length; i++) {
            seatMap[`cell-${i}`] = allPool[i];
            if (currentMode === 'flip') flippedStatus[`cell-${i}`] = false;
        }
        for (let i = 28; i < allPool.length; i++) {
            unassignedStudents.push(allPool[i]);
        }

        renderUnassigned();
        renderGrid();
    }

    // 本地儲存
    function saveData() {
        const data = {
            seatMap,
            unassignedStudents,
            staffAssignments
        };
        localStorage.setItem("one_piece_seat_data", JSON.stringify(data));
        alert("🏴‍☠️ 航海日誌紀錄成功！座位與幹部資料已順利儲存！");
    }

    // 讀取儲存
    function loadData() {
        const saved = localStorage.getItem("one_piece_seat_data");
        if (saved) {
            try {
                const data = JSON.parse(saved);
                seatMap = data.seatMap || {};
                unassignedStudents = data.unassignedStudents || [...students];
                staffAssignments = data.staffAssignments || {};
                renderUnassigned();
                renderGrid();
                renderStaff();
            } catch (e) {
                console.error("讀取存檔失敗", e);
            }
        }
    }

    // 下載圖片功能
    function downloadImage() {
        // 截圖前先暫時轉為學生觀看正常模式，確保列印畫面直觀
        const prevMode = currentMode;
        if (currentMode === 'flip') {
            currentMode = 'student';
            updateViewModeUI();
            renderGrid();
        }

        const captureElement = document.getElementById("capture-area");
        html2canvas(captureElement, { backgroundColor: "#140c06" }).then(canvas => {
            const link = document.createElement("a");
            link.download = "704班級座位表_海賊王風.png";
            link.href = canvas.toDataURL("image/png");
            link.click();

            if (prevMode === 'flip') {
                currentMode = 'flip';
                updateViewModeUI();
                renderGrid();
            }
        });
    }

    window.onload = init;
</script>

</body>
</html>
