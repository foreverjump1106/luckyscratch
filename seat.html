    <style>
        :root {
            --wood-dark: #2c1d11;
            --wood-light: #5c3a21;
            --gold: #d4af37;
            --parchment: #f4e8c1;
            --parchment-dark: #d8c48fc4;
            --sea-blue: #1b3b5f;
            --red-bounty: #8b0000;
        }

        body {
            background-color: var(--wood-dark);
            background-image: radial-gradient(circle, #3d2716 0%, #1a1008 100%);
            color: #fdf6e2;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 5px;
        }

        h1 {
            text-align: center;
            color: var(--gold);
            text-shadow: 2px 2px 4px #000;
            font-size: 1.5rem;
            margin-bottom: 2px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #d1b693;
            font-style: italic;
            margin-bottom: 4px;
            font-size: 0.8rem;
            display: block;
        }

        /* 登入遮罩畫面 */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 16, 8, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background: rgba(44, 29, 17, 0.95);
            border: 4px solid var(--gold);
            border-radius: 12px;
            padding: 25px;
            width: 300px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        .auth-box h2 {
            color: var(--gold);
            margin-top: 0;
            font-size: 1.3rem;
        }

        .auth-box input {
            width: 100%;
            padding: 7px;
            margin: 8px 0;
            background: var(--parchment);
            border: 1px solid var(--gold);
            border-radius: 4px;
            color: #2c1d11;
            font-size: 0.85rem;
            box-sizing: border-box;
            font-weight: bold;
        }

        /* 主容器：強力鎖定左右橫幅不換行 */
        .main-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1220px;
            margin: 0 auto;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: nowrap;
        }

        /* 左側：未入座學生區與歷史紀錄區 (適度保留精煉寬度) */
        .sidebar-left {
            width: 150px;
            min-width: 140px;
            background: rgba(44, 29, 17, 0.95);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            height: 86vh;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar-left h3 {
            color: var(--gold);
            text-align: center;
            margin: 0 0 3px 0;
            font-size: 0.75rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 2px;
        }

        #unassigned-list {
            flex-grow: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            padding: 4px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 120px;
        }

        /* 歷史紀錄面板 */
        .history-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 4px;
            height: 120px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--parchment);
            color: #2c1d11;
            padding: 3px 4px;
            margin-bottom: 3px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-align: center;
        }

        .history-item div {
            display: flex;
            justify-content: center;
            gap: 3px;
        }

        .history-item button {
            background: #c0392b;
            color: #fff;
            border: none;
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.55rem;
        }

        /* 截圖專用大容器 */
        .capture-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(20, 12, 6, 0.9);
            padding: 12px 10px;
            border-radius: 12px;
            border: 4px solid var(--gold);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 16px rgba(0,0,0,0.6);
            align-items: flex-start;
            flex-shrink: 0;
        }

        /* 中間：教室座位區 */
        .classroom-area {
            width: 480px;
            min-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .podium {
            background: linear-gradient(to bottom, #8b5a2b, #5c3a21);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 4px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            letter-spacing: 2px;
        }

        /* 6x5 座位網格 (6欄, 5行 = 共30格) */
        .grid-6x5 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            margin: 8px 0;
        }

        .grid-6x5.student-view { direction: rtl; }
        .grid-6x5.student-view .seat-cell { direction: ltr; }
        .grid-6x5.teacher-view { transform: scaleY(-1); }
        .grid-6x5.teacher-view .seat-cell { transform: scaleY(-1); }

        .seat-cell {
            aspect-ratio: 4 / 3;
            background: var(--parchment);
            color: #333;
            border: 2px dashed #8b5a2b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }

        .seat-cell.drag-over {
            background: #ffeaa7;
            border-color: #d63031;
            transform: scale(1.03);
        }

        /* 右側幹部面板 (適度加寬至 290px，確保文字與下拉選單絕對不跑版或重疊) */
        .export-staff-panel {
            width: 290px;
            min-width: 280px;
            background: rgba(44, 29, 17, 0.95);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .export-staff-panel h3 {
            color: var(--gold);
            text-align: center;
            margin: 0 0 3px 0;
            font-size: 0.85rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 2px;
        }

        .staff-table-container {
            display: flex;
            gap: 6px;
            flex-grow: 1;
        }

        .staff-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .staff-column h4 {
            color: var(--gold);
            font-size: 0.65rem;
            text-align: center;
            margin: 0 0 2px 0;
            border-bottom: 1px dashed var(--gold);
            padding-bottom: 1px;
        }

        .staff-row-item {
            background: var(--parchment);
            color: #2c1d11;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.65rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            height: 22px;
            box-sizing: border-box;
        }

        .staff-row-item .title { color: #8b5a2b; font-size: 0.6rem; width: 44%; flex-shrink: 0; }
        .staff-row-item select { width: 56%; background: #fff; color: #2c1d11; border: 1px solid var(--gold); border-radius: 2px; font-size: 0.63rem; padding: 1px; font-weight: bold; box-sizing: border-box; }

        .staff-row-text {
            background: var(--parchment);
            color: #2c1d11;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.65rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            height: 22px;
            box-sizing: border-box;
        }
        .staff-row-text .title { color: #8b5a2b; font-size: 0.6rem; width: 44%; flex-shrink: 0; }
        .staff-row-text .name { color: #2c1d11; font-size: 0.63rem; width: 56%; text-align: right; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 左側候選學生卡片 */
        .student-card {
            background: linear-gradient(135deg, #fdf6e2 0%, #e6d5b8 100%);
            color: #2c1d11;
            border: 2px solid #5c3a21;
            border-radius: 4px;
            padding: 2px 4px;
            text-align: center;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            user-select: none;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }
        .student-card:active { cursor: grabbing; }
        .student-card .s-id { font-size: 0.6rem; color: #8b5a2b; flex-shrink: 0; }
        .student-card .s-name { font-size: 0.7rem; flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 座位上的學生卡片維持置中 */
        .seat-cell .student-card {
            width: 92%;
            height: 88%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0px;
        }
        .seat-cell .student-card .s-id { font-size: 0.55rem; width: 100%; text-align: center; }
        .seat-cell .student-card .s-name { font-size: 0.7rem; width: 100%; text-align: center; margin-top: 1px; }

        .control-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
            width: 100%;
        }

        .pirate-btn {
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #1a1008;
            border: 2px solid #fff;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .pirate-btn:hover { background: linear-gradient(to bottom, #f3cf54, #d4af37); transform: translateY(-2px); }
        .pirate-btn.active-mode { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: #fff; border-color: var(--gold); }

        .seat-cell.flipped .student-card { background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%); color: var(--gold); border: 2px solid var(--gold); }
        .seat-cell.flipped .student-card .s-id, .seat-cell.flipped .student-card .s-name { display: none; }
        .seat-cell.flipped .student-card::after { content: "⚓ 懸賞"; font-size: 0.7rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- 登入驗證遮罩畫面 -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>⚓ 船長登入驗證</h2>
            <p style="font-size: 0.75rem; color: #d1b693; margin-bottom: 8px;">請輸入管理員 ID (或信箱) 與密碼</p>
            <input type="text" id="auth-email" placeholder="管理員 ID 或 Email">
            <input type="password" id="auth-password" placeholder="密碼 (Password)">
            <button class="pirate-btn" onclick="handleLogin()" style="width: 100%; margin-top: 5px;">登入系統</button>
            <div id="auth-error" style="color: #ff6b6b; font-size: 0.7rem; margin-top: 6px;"></div>
        </div>
    </div>

    <h1>🏴‍☠️ 偉大的航道：804班級座位編排 ⚓</h1>

    <div style="text-align: center; margin-bottom: 6px;">

    </div>

    <div class="main-container">
        <!-- 左側：候補船員名單與歷史紀錄 -->

                <button class="pirate-btn" onclick="downloadImage()">📷 下載圖片</button>
            </div>

<!-- Firebase 雲端驗證與資料庫模組化腳本 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2qXsbab4fh15C9YbCDWK208eJLLHgsKk",
      authDomain: "seatweb-ccd44.firebaseapp.com",
      databaseURL: "https://seatweb-ccd44-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "seatweb-ccd44",
      storageBucket: "seatweb-ccd44.firebasestorage.app",
      messagingSenderId: "607947077023",
      appId: "1:607947077023:web:1a0ec5832414cf376fb9aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        const overlay = document.getElementById("auth-overlay");
        const userDisplay = document.getElementById("user-display");
        if (user) {
            overlay.style.display = "none";
            userDisplay.innerText = `👤 ${user.email} (點擊登出)`;
            loadDataFromFirebase();
        } else {
            overlay.style.display = "flex";
            userDisplay.innerText = "";
        }
    });

    window.handleLogin = function() {
        let inputId = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value;
        const errBox = document.getElementById("auth-error");

        let loginEmail = inputId.includes("@") ? inputId : `${inputId}@seat804.com`;

        signInWithEmailAndPassword(auth, loginEmail, password)
            .then(() => {
                errBox.innerText = "";
            })
            .catch((error) => {
                errBox.innerText = "❌ 登入失敗：帳號或密碼錯誤";
            });
    };

    window.handleLogout = function() {
        if (confirm("確定要登出系統嗎？")) {
            signOut(auth).then(() => {
                location.reload();
            });
        }
    };

    window.saveDataToFirebase = function() {
        const data = { seatMap, unassignedStudents, staffAssignments, examHistory };
        set(ref(db, 'class_804/seat_data'), data)
            .then(() => {
                alert("🏴‍☠️ 雲端航海日誌同步成功！");
            })
            .catch((error) => {
                alert("❌ 儲存失敗：" + error.message);
            });
    };

    window.saveDataToFirebaseSilent = function() {
        const data = { seatMap, unassignedStudents, staffAssignments, examHistory };
        set(ref(db, 'class_804/seat_data'), data).catch((error) => {
            console.error("自動同步失敗", error);
        });
    };

    window.loadDataFromFirebase = function() {
        const dbRef = ref(db);
        get(child(dbRef, 'class_804/seat_data')).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                seatMap = data.seatMap || {};
                unassignedStudents = data.unassignedStudents || [...students];
                staffAssignments = data.staffAssignments || {};
                examHistory = data.examHistory || [];
                
                renderUnassigned();
                renderGrid();
                renderExportStaffTable();
                renderHistory();
            } else {
                renderUnassigned();
                renderExportStaffTable();
            }
        }).catch((error) => {
            console.error("讀取雲端資料失敗", error);
        });
    };
</script>

        "童軍小老師", "家政小老師", "輔導小老師", "生科小老師", "資訊小老師", 
        "健教小老師", "圖書志工(一)", "圖書志工(二)"
    ];

    const staffList = [...leaderList, ...subjectTeacherList];

    let seatMap = {}; 
    let unassignedStudents = [...students];
    let staffAssignments = {}; 
    let currentMode = 'student'; 
    let flippedStatus = {}; 
    let examHistory = []; 

    function init() {
        renderUnassigned();
        renderExportStaffTable();
    }

    function setMode(mode) {
        currentMode = mode;
        if (currentMode === 'flip') {
            for (let i = 0; i < 30; i++) {
                if (seatMap[`cell-${i}`]) flippedStatus[`cell-${i}`] = false;
            }
        }
        updateViewModeUI();
        renderGrid();
    }

    function updateViewModeUI() {
        document.getElementById("btn-student-view").className = "pirate-btn" + (currentMode === 'student' ? " active-mode" : "");
        document.getElementById("btn-teacher-view").className = "pirate-btn" + (currentMode === 'teacher' ? " active-mode" : "");
        document.getElementById("btn-flip-view").className = "pirate-btn" + (currentMode === 'flip' ? " active-mode" : "");

        const podiumTop = document.getElementById("podium-top");
        const podiumBottom = document.getElementById("podium-bottom");
        const grid = document.getElementById("seat-grid");

        if (currentMode === 'teacher') {
            podiumTop.style.display = "none";
            podiumBottom.style.display = "block";
            grid.className = "grid-6x5 teacher-view";
        } else {
            podiumTop.style.display = "block";
            podiumBottom.style.display = "none";
            grid.className = "grid-6x5 student-view";
        }
    }

    function renderUnassigned() {
        const container = document.getElementById("unassigned-list");
        container.innerHTML = "";
        unassignedStudents.forEach(student => {
            container.appendChild(createCardElement(student));
        });
    }

    function renderGrid() {
        const grid = document.getElementById("seat-grid");
        grid.innerHTML = "";

        for (let i = 0; i < 30; i++) {
            const cellId = `cell-${i}`;
            const cell = document.createElement("div");
            cell.className = "seat-cell";
            cell.id = cellId;
            cell.dataset.index = i;

            cell.ondragover = allowDrop;
            cell.ondragleave = removeDropStyle;
            cell.ondrop = dropToCell;

            if (seatMap[cellId]) {
                cell.appendChild(createCardElement(seatMap[cellId]));
                if (currentMode === 'flip' && flippedStatus[cellId] === false) {
                    cell.classList.add("flipped");
                }
            } else {
                cell.innerText = i + 1; 
                cell.style.color = "#8b5a2b";
                cell.style.fontSize = "0.75rem";
            }

            cell.onclick = () => {
                if (currentMode === 'flip' && seatMap[cellId]) {
                    flippedStatus[cellId] = !flippedStatus[cellId];
                    if (flippedStatus[cellId]) cell.classList.remove("flipped");
                    else cell.classList.add("flipped");
                }
            };

            grid.appendChild(cell);
        }
    }

    function createCardElement(student) {
        const card = document.createElement("div");
        card.className = "student-card";
        card.draggable = true;
        card.dataset.id = student.id;
        let formattedId = student.id < 10 ? `0${student.id}` : student.id;
        card.innerHTML = `
            <div class="s-id">No.${formattedId}</div>
            <div class="s-name">${student.name}</div>
        `;
        card.ondragstart = drag;
        return card;
    }

    function renderExportStaffTable() {
        const leadersContainer = document.getElementById("export-leaders-list");
        const teachersContainer = document.getElementById("export-teachers-list");
        
        if (!leadersContainer || !teachersContainer) return;

        leadersContainer.innerHTML = "";
        teachersContainer.innerHTML = "";

        leaderList.forEach(title => {
            leadersContainer.appendChild(createStaffRow(title));
        });

        subjectTeacherList.forEach(title => {
            teachersContainer.appendChild(createStaffRow(title));
        });
    }

    function createStaffRow(title) {
        const container = document.createElement("div");

        const item = document.createElement("div");
        item.className = "staff-row-item";
        item.id = `staff-select-row-${title}`;

        const titleSpan = document.createElement("span");
        titleSpan.className = "title";
        titleSpan.innerText = title;

        const select = document.createElement("select");
        select.onchange = (e) => {
            if (e.target.value === "") {
                delete staffAssignments[title];
            } else {
                staffAssignments[title] = e.target.value;
            }
            window.saveDataToFirebaseSilent();
        };

        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.innerText = "未指派";
        select.appendChild(defaultOpt);

        students.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.name;
            let formattedId = s.id < 10 ? `0${s.id}` : s.id;
            opt.innerText = `${formattedId}.${s.name}`;
            if (staffAssignments[title] === s.name) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });

        item.appendChild(titleSpan);
        item.appendChild(select);

        const textItem = document.createElement("div");
        textItem.className = "staff-row-text";
        textItem.id = `staff-text-row-${title}`;

        const textTitleSpan = document.createElement("span");
        textTitleSpan.className = "title";
        textTitleSpan.innerText = title;

        const textNameSpan = document.createElement("span");
        textNameSpan.className = "name";
        textNameSpan.innerText = staffAssignments[title] || "未指派";

        textItem.appendChild(textTitleSpan);
        textItem.appendChild(textNameSpan);

        container.appendChild(item);
        container.appendChild(textItem);
        return container;
    }

    let draggedStudentId = null;
    let sourceLocation = null;

    function drag(event) {
        draggedStudentId = parseInt(event.target.dataset.id);
        const parentCell = event.target.closest(".seat-cell");
        sourceLocation = parentCell ? parentCell.id : "unassigned";
        event.dataTransfer.setData("text/plain", draggedStudentId);
    }

    function allowDrop(event) {
        event.preventDefault();
        event.currentTarget.classList.add("drag-over");
    }

    function removeDropStyle(event) {
        event.currentTarget.classList.remove("drag-over");
    }

    function dropToCell(event) {
        event.preventDefault();
        const cell = event.currentTarget;
        cell.classList.remove("drag-over");
        const targetCellId = cell.id;

        let studentObj = null;
        if (sourceLocation === "unassigned") {
            const idx = unassignedStudents.findIndex(s => s.id === draggedStudentId);
            if (idx !== -1) studentObj = unassignedStudents.splice(idx, 1)[0];
        } else {
            studentObj = seatMap[sourceLocation];
            delete seatMap[sourceLocation];
            if (flippedStatus[sourceLocation]) delete flippedStatus[sourceLocation];
        }

        if (seatMap[targetCellId]) {
            unassignedStudents.push(seatMap[targetCellId]);
            delete flippedStatus[targetCellId];
        }

        if (studentObj) {
            seatMap[targetCellId] = studentObj;
            if (currentMode === 'flip') flippedStatus[targetCellId] = false;
        }

        renderUnassigned();
        renderGrid();
        window.saveDataToFirebaseSilent();
    }

    function dropToUnassigned(event) {
        event.preventDefault();
        event.currentTarget.classList.remove("drag-over");

        if (sourceLocation && sourceLocation !== "unassigned") {
            const studentObj = seatMap[sourceLocation];
            delete seatMap[sourceLocation];
            if (flippedStatus[sourceLocation]) delete flippedStatus[sourceLocation];
            if (studentObj) {
                unassignedStudents.push(studentObj);
                unassignedStudents.sort((a,b) => a.id - b.id);
            }
            renderUnassigned();
            renderGrid();
            window.saveDataToFirebaseSilent();
        }
    }

    function randomAssign() {
        let assignedStudentIds = [];
        for (let i = 0; i < 30; i++) {
            let cellId = `cell-${i}`;
            if (seatMap[cellId]) {
                assignedStudentIds.push(seatMap[cellId].id);
            }
        }

        let availablePool = students.filter(s => !assignedStudentIds.includes(s.id));
        availablePool.sort(() => Math.random() - 0.5);

        let poolIndex = 0;
        for (let i = 0; i < 30; i++) {
            let cellId = `cell-${i}`;
            if (!seatMap[cellId]) {
                if (poolIndex < availablePool.length) {
                    seatMap[cellId] = availablePool[poolIndex];
                    if (currentMode === 'flip') flippedStatus[cellId] = false;
                    poolIndex++;
                }
            }
        }

        let allAssignedIds = [];
        for (let i = 0; i < 30; i++) {
            let cellId = `cell-${i}`;
            if (seatMap[cellId]) {
                allAssignedIds.push(seatMap[cellId].id);
            }
        }
        unassignedStudents = students.filter(s => !allAssignedIds.includes(s.id));

        renderUnassigned();
        renderGrid();
        window.saveDataToFirebaseSilent();
    }

    function resetSeats() {
        if (confirm("確定要將所有座位清空，重新開始排位嗎？")) {
            seatMap = {};
            unassignedStudents = [...students];
            unassignedStudents.sort((a, b) => a.id - b.id);
            flippedStatus = {};
            renderUnassigned();
            renderGrid();
            window.saveDataToFirebaseSilent();
        }
    }

    function saveHistory() {
        const nameInput = document.getElementById("history-name");
        const title = nameInput.value.trim();
        if (!title) {
            alert("請輸入紀錄名稱！");
            return;
        }

        const newRecord = {
            id: Date.now(),
            title: title,
            seatMap: {...seatMap},
            staffAssignments: {...staffAssignments}
        };

        examHistory.push(newRecord);
        nameInput.value = "";
        renderHistory();
        window.saveDataToFirebaseSilent();
        alert(`已成功將「${title}」加入歷史紀錄並同步至雲端！`);
    }

    function renderHistory() {
        const container = document.getElementById("history-list");
        container.innerHTML = "";
        if (examHistory.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #d1b693; font-size: 0.65rem; padding: 4px;">尚無歷史紀錄</div>`;
            return;
        }

        examHistory.forEach(record => {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `
                <span>${record.title}</span>
                <div>
                    <button onclick="loadHistory(${record.id})" style="background:#27ae60;">載入</button>
                    <button onclick="deleteHistory(${record.id})">刪除</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    window.loadHistory = function(id) {
        const record = examHistory.find(h => h.id === id);
        if (record) {
            if (confirm(`確定要載入「${record.title}」的座位嗎？這會覆蓋目前的排位。`)) {
                seatMap = {...record.seatMap};
                staffAssignments = {...record.staffAssignments};
                
                let assignedIds = Object.values(seatMap).map(s => s.id);
                unassignedStudents = students.filter(s => !assignedIds.includes(s.id));
                
                renderUnassigned();
                renderGrid();
                renderExportStaffTable();
                window.saveDataToFirebaseSilent();
                alert(`已成功切換至「${record.title}」！`);
            }
        }
    }

    window.deleteHistory = function(id) {
        if (confirm("確定要刪除這筆歷史紀錄嗎？")) {
            examHistory = examHistory.filter(h => h.id !== id);
            renderHistory();
            window.saveDataToFirebaseSilent();
        }
    }

    function downloadImage() {
        const prevMode = currentMode;
        if (currentMode === 'flip') {
            currentMode = 'student';
            updateViewModeUI();
            renderGrid();
        }

        staffList.forEach(title => {
            const selectRow = document.getElementById(`staff-select-row-${title}`);
            const textRow = document.getElementById(`staff-text-row-${title}`);
            if (selectRow) selectRow.style.display = "none";
            if (textRow) {
                const nameSpan = textRow.querySelector(".name");
                if (nameSpan) nameSpan.innerText = staffAssignments[title] || "未指派";
                textRow.style.display = "flex";
            }
        });

        const captureElement = document.getElementById("capture-area");
        html2canvas(captureElement, { backgroundColor: "#140c06", scale: 2 }).then(canvas => {
            staffList.forEach(title => {
                const selectRow = document.getElementById(`staff-select-row-${title}`);
                const textRow = document.getElementById(`staff-text-row-${title}`);
                if (selectRow) selectRow.style.display = "flex";
                if (textRow) textRow.style.display = "none";
            });

            const link = document.createElement("a");
            link.download = "804班級座位表_海賊王風.png";
            link.href = canvas.toDataURL("image/png");
            link.click();

            if (prevMode === 'flip') {
                currentMode = 'flip';
                updateViewModeUI();
                renderGrid();
            }
        });
    }
</script>

</body>
</html>
